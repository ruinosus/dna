# mcp-ws, for local development.
#
# Reachable by the template, and consumed WITHOUT anyone editing a shared file:
# the root compose file carries one `include:` entry per app, and Compose
# resolves fragments by path. This is the wiring place that costs nothing to
# add — which is exactly why it is the one to imitate wherever a format allows.
#
#   # docker-compose.dev.yml
#   include:
#     - path: ./apps/mcp-ws/wiring/compose.fragment.yml
#
# ⭐ The build context is `apps/mcp`, NOT this directory:
# mcp-ws is another deployment of an image that already exists, so
# nothing under `apps/mcp/` was generated, and nothing there was
# touched. What this service brings of its own is exactly what is below — its
# name, its port and its knobs.

services:
  mcp-ws:
    build:
      context: ./apps/mcp
      dockerfile: Dockerfile
    environment:
      DNA_MCP_HOST: "0.0.0.0"
      DNA_MCP_PORT: "8001"
      DNA_MCP_AUTH: "config"
    ports:
      - "8001:8001"
