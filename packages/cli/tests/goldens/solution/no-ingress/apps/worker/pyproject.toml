[project]
name = "worker"
version = "0.1.0"
description = "the queue worker — it answers nobody"
requires-python = ">=3.12,<3.14"

# Every runtime dependency is DECLARED HERE — nothing is pip-installed ad-hoc
# in the Dockerfile. The floor/ceiling pair is the contract with the SDK; a
# stale CEILING makes the resolver ignore a new release in silence, which is
# why both are answers and not template text.
dependencies = [
    "dna-cli[api]>=0.74,<0.75",
    "dna-sdk[postgres]>=0.74,<0.75",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
worker = "worker.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
