# This file records the ANSWERS that produced ./apps/worker.
# It is written by Copier and read by `dna solution update` — never edit it by
# hand, and never delete it: without it the app can be regenerated but never
# UPDATED, which is the whole point of generating it this way.
_src_path: <TEMPLATE>
can_sleep: true
description: the queue worker — it answers nobody
dna_ceiling: '0.75'
dna_floor: '0.74'
env_prefix: DNA_API
identity: none
image_name: worker
ingress: none
max_replicas: 4
owns_code: true
python_module: worker
service_name: worker
