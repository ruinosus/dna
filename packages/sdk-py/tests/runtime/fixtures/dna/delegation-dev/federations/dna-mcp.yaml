apiVersion: github.com/ruinosus/dna/federation/v1
kind: MCPFederation
metadata:
  name: dna-mcp
  description: Declares a real allowed_tools surface so the delegation
    fixture's targets (conv/wide-conv) can prove the tool-projection
    properties — a RESTRICTED target's effective allowlist is the
    intersection with its own declaration; an UNRESTRICTED one inherits this
    full federation list.
spec:
  transport: streamable_http
  url: https://mcp.dna-cloud.example/mcp
  auth:
    kind: bearer_env
    env: DNA_MCP_TOKEN
  allowed_tools:
  - list_kinds
  - list_my_kinds
  - author_kind
  - update_instance_draft
  propagate_tenant: false
