apiVersion: github.com/ruinosus/dna/federation/v1
kind: MCPFederation
metadata:
  name: dna-mcp
  description: Minimal federation — only present so LangChainRuntime.build's
    mcp_servers requirement is satisfied. Not exercised by the delegation
    wiring tests themselves.
spec:
  transport: streamable_http
  url: https://mcp.dna-cloud.example/mcp
  auth:
    kind: bearer_env
    env: DNA_MCP_TOKEN
  allowed_tools: []
  propagate_tenant: false
