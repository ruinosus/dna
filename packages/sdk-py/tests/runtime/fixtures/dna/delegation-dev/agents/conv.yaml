apiVersion: github.com/ruinosus/dna/v1
kind: Agent
metadata:
  name: conv
  description: The delegation TARGET `super-agent` reaches — never mounted by
    any Copilot itself; it only needs to exist as a document in scope for
    `targets_for` to find it.
spec:
  instruction: You convert documents on request.
  model: gpt-5-mini
  delegation_target_for:
    agents:
    - super-agent
    format: text
    use_when: quando precisar converter um documento
