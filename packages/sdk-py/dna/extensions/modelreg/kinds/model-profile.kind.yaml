# ModelProfile — per-LLM-model capability/limit registry (record plane).
# One doc per model: hard limits (instruction_token_cap, context_window,
# tools_cap, max_output_tokens) + modalities + cost, as first-class GLOBAL
# data so limits are project data, not implicit knowledge. Ported from the
# internal SDK's model registry, motivated by a real outage: a 17269-token
# voice persona silently exceeded the realtime model's 16384-token
# session-instructions cap because the cap lived in nobody's code.
#
# CONTRACT — never hardcode token caps: the prompt-budget write guard
# (dna/extensions/helix/write_guards.py :: prompt_budget_guard and its TS
# twin) reads instruction_token_cap from THIS registry via
# kernel.model_profile(id_or_alias); a cap literal in code is a bug.
#
# The SAME contract now covers PRICE (s-preco-vem-do-modelprofile):
# dna.runtime.roi resolves ModelPrice from cost_per_1m_input_usd /
# cost_per_1m_output_usd (price_book / gather_prices), so a price literal in
# code is a bug for exactly the reason a cap literal is — a price in code is a
# price in nobody's code. Null means NOT QUOTED, never zero, and a model with
# no quote makes the WHOLE money answer not-calculable rather than a partial
# sum that is smaller than the truth.
#
# Profiles live in the `_lib` scope (`model-profiles/<model_id>.yaml`) —
# ModelProfile is GLOBAL (base only, no per-tenant override) and NOT
# inheritable; kernel.model_profile() queries `_lib` directly regardless
# of the caller's scope.
#
# SINGLE-SOURCE package data: this descriptor is the only
# definition of the Kind — the packages/sdk-ts mirror and the test that
# enforced byte-identity (tests/test_descriptor_hash_parity.py) were BOTH
# removed when the TypeScript SDK was frozen (commit 341e517). Nothing
# mirrors this file and no test enforces byte-identity.
apiVersion: github.com/ruinosus/dna/core/v1
kind: KindDefinition
metadata:
  name: model-profile
spec:
  target_api_version: github.com/ruinosus/dna/modelreg/v1
  target_kind: ModelProfile
  alias: modelreg-model-profile
  origin: github.com/ruinosus/dna/modelreg
  tenant_scope: global
  plane: record
  prompt_target: false
  flatten_in_context: false
  prompt_target_priority: 0
  storage:
    type: yaml
    container: model-profiles
  # This instance's own key — `kernel.model_profile()` matches on this field
  # first, and the doc name should equal it.
  #
  # i-119 group C asked to CONFIRM this Kind as group A (legitimate island).
  # Confirmed, 06/08/2026, field by field: `model_id` is `self` (declared
  # right here); `provider` / `family` are vocabulary — `openai`, `azure`,
  # `gpt-realtime` name no instance and never will; `aliases[]` are alternate
  # keys for THIS profile, so pointing them anywhere would be a self-loop;
  # `modalities` is an open token list. What POINTS at a ModelProfile is
  # `Genome.default_llm`, declared over there as `to: ModelProfile, by:
  # model_id` in this same slice — so this Kind left the island count without
  # a single declaration landing ON it, which is what a legitimate island
  # looks like once the other side is honest.
  identifiers:
    model_id:
      role: self
  schema:
    type: object
    # ⚠️ Why the price fields are NOT required, i-101 (08/08/2026). With ZERO
    # live instances, adding a required field costs nothing TODAY — that window
    # is real and it is why the two new fields land now. It is not why they are
    # optional. They are optional because `required` in JSON Schema is
    # unconditional, and this Kind serves TWO audiences from one object: whoever
    # registers a token cap (the outage that created the Kind) and whoever
    # registers a price. Requiring cost_quoted_at would demand a quote date from
    # someone declaring only instruction_token_cap — and a person forced to fill
    # a field they have no answer for invents one, which is worse than absent
    # because an invented date READS as knowledge.
    #
    # So the requirement is CONDITIONAL and lives where conditions can be
    # expressed — the reading: declaring a price without a date still produces
    # money, marked SUSPECT, with the reading saying to add the date. Same shape
    # as App.can_sleep, which the schema does not force and the reading refuses
    # to presume.
    required:
    - model_id
    - provider
    properties:
      model_id:
        type: string
        description: Canonical model identifier, e.g. 'gpt-realtime-2'. The doc
          name SHOULD equal the model_id; kernel.model_profile() matches on this
          field first.
      provider:
        type: string
        description: Who serves the model — 'openai', 'anthropic', 'azure', a
          proxy alias, etc.
      family:
        type:
        - string
        - 'null'
        description: Model family/lineage for grouping, e.g. 'gpt-realtime'.
      realtime:
        type: boolean
        default: false
        description: 'True for realtime voice models. STRICT marker: the
          prompt-budget guard VETOES an over-cap write against a realtime
          profile (voice sessions silently degrade past the cap); chat profiles
          only warn.'
      context_window:
        type: integer
        description: Total context window in tokens.
      instruction_token_cap:
        type:
        - integer
        - 'null'
        description: Hard cap for the system-instruction/persona in tokens.
          Null = no cap known (the guard fails open). THE value the
          prompt-budget guard enforces — never hardcode it in code.
      max_output_tokens:
        type:
        - integer
        - 'null'
        description: Max completion/output tokens per response.
      tools_cap:
        type:
        - integer
        - 'null'
        description: Max number of tools the model accepts per session.
      modalities:
        type: array
        items:
          type: string
        description: Supported modalities, e.g. [text], [text, audio],
          [text, image].
      cost_per_1m_input_usd:
        type:
        - number
        - 'null'
        description: USD per 1M input tokens. NOT informational any more —
          dna.runtime.roi reads it (price_book / gather_prices) and it feeds the
          money the product shows. Null means NOT QUOTED, never zero; a null read
          as 0.0 would report the most expensive model as free. Half a quote
          (this field without cost_per_1m_output_usd) is not half a price — the
          whole cost comes back NOT CALCULABLE, never a partial sum.
      cost_per_1m_output_usd:
        type:
        - number
        - 'null'
        description: USD per 1M output tokens. Same contract as
          cost_per_1m_input_usd — read by dna.runtime.roi, null means NOT QUOTED,
          and the currency is in the field name (_usd), never presumed.
      cost_quoted_at:
        type:
        - string
        - 'null'
        description: ISO-8601 date/datetime this price was QUOTED. i-101,
          decided 08/08/2026. While the cost fields were informational a stale
          price hurt nobody; now that dna.runtime.roi turns them into the money
          the product shows, a stale accountable number produces a wrong account
          wearing the face of a measurement. Past dna.runtime.roi's age ceiling
          the reading marks the money SUSPECT (the is_suspect qualifier, printed
          on the same line as the number, in the mould of the FLOOR marker).
          NULL or absent is NOT read as recent — it is UNKNOWN AGE, and unknown
          age is suspect too, because presuming the good side is exactly how the
          old cap lived in nobody's code. OPTIONAL on purpose — see the note on
          `required` above the schema.
      cost_source:
        type:
        - string
        - 'null'
        description: WHERE the quote came from — the provider's pricing page, a
          negotiated contract, an estimate. i-101. It changes what the number
          means (a contract price is stable for a year; a pricing page is not)
          and it travels into the cost's `source` line so whoever reads the money
          reads its provenance. OPTIONAL, like cost_quoted_at.
      aliases:
        type: array
        items:
          type: string
        description: Alternate ids that resolve to this profile (deployment
          names, dated snapshots). kernel.model_profile() matches these on
          pass 2.
      deprecated:
        type: boolean
        default: false
        description: True when the model is scheduled for removal.
      deprecated_message:
        type:
        - string
        - 'null'
        description: Human guidance shown when a deprecated model is used.
      notes:
        type:
        - string
        - 'null'
        description: Free-form operator notes.
  describe: '{provider}/{model_id}'
  summary:
    model_id: ''
    provider: ''
    family: null
    realtime: false
    context_window: null
    instruction_token_cap: null
    deprecated: false
  ui:
    mode: govern
    label:
      en: Model Profiles
      pt-BR: Perfis de Modelo
    icon: 🧬
    description:
      en: Per-LLM-model limits/capabilities.
      pt-BR: Limites/capacidades por modelo LLM.
    routes:
      list: docs/ModelProfile
      detail: docs/ModelProfile/:name
    permissions:
      list: any
      detail: any
    in_sidebar: true
    display_order: 52
  ascii_icon: 🧬
  display_label: Model Profiles
  docs: A ModelProfile records one LLM model's hard limits and capabilities
    (instruction_token_cap, context_window, tools_cap, modalities, cost). It is
    the single source of truth the prompt-budget write guard reads — never
    hardcode token caps in code; read them from the ModelProfile registry via
    kernel.model_profile().
