# Engram — affective recall artifact (record plane; memory triad).
#
# s-engram-rename (2026-07-19): renamed from LessonLearned
# (github.com/ruinosus/dna/sdlc/v1) — a CLEAN rename, not a compat/alias
# shim (founder decision: zero users at rename time; kind_registry.py's own
# EXPLICIT_ALIAS_ALLOWLIST doc says an alias "CANNOT be renamed without a doc
# migration" — the architecture already expects a one-time rewrite here, not
# a permanent dual-read mechanism). The identity moves from the sdlc
# namespace into `/dna/v1` (this extension, helix) alongside Tool/Copilot —
# memory is a platform primitive, not an sdlc-owned artifact. Stored docs are
# migrated by ``scripts/migrate_lesson_learned_to_engram.py`` (idempotent,
# rewrites ``apiVersion`` + ``kind`` in place). Schema below is byte-for-byte
# the old LessonLearned schema — only identity (target_api_version,
# target_kind, alias, origin, display_label) changed; storage container/
# marker are UNCHANGED (``lessons-learned`` / ``LESSON_LEARNED.md`` — no
# on-disk directory move, only the two envelope fields rewrite).
#
# Surfaces unbidden when the current cycle resembles a past one in the same
# area. Authored by the Sage oracle during the deep-sleep ritual (mostly) or
# manually. Body prose lives in the bundle marker (LESSON_LEARNED.md);
# structured fields in the YAML frontmatter. Studio surface label is
# enterprise pt-BR ("Lições Aprendidas" — s-sdlcv2-memorias-market-viz).
#
# F3 lote-1 (spec 2026-06-10-kinds-descriptor-f3): synthesized from this
# descriptor; the twin LessonLearnedKind classes (Py+TS) were deleted.
# SINGLE-SOURCE package data: this descriptor is the only
# definition of the Kind — the packages/sdk-ts mirror and the test that
# enforced byte-identity (tests/test_descriptor_hash_parity.py) were BOTH
# removed when the TypeScript SDK was frozen (commit 341e517). Nothing
# mirrors this file and no test enforces byte-identity.
# What DOES still guard it: equivalence vs the extinct class, frozen in
# tests/test_lote1_descriptor_equivalence.py (golden:
# tests/goldens/lote1/Engram.golden.json).
# O descriptor curou um drift real Py↔TS enquanto o TS existia: a classe TS
# era strict e NÃO tinha
# affect_reason/affect_evidence_refs/encoding extras — o canônico é a
# superfície Py (o que kinds-api serve em produção). A classe Py tinha um
# to_card morto (zero consumidores) — não migrado de propósito.
# `embed:` substitui o branch hardcoded de source_text_for + a entrada no
# frozenset legado EMBEDDABLE_KINDS (F3 D4) — mesmos campos, mesmo join.
apiVersion: github.com/ruinosus/dna/core/v1
kind: KindDefinition
metadata:
  name: engram
spec:
  target_api_version: github.com/ruinosus/dna/v1
  target_kind: Engram
  alias: helix-engram
  origin: github.com/ruinosus/dna/engram
  traits: [memory.recallable]
  plane: record
  prompt_target: false
  flatten_in_context: false
  prompt_target_priority: 0
  scope_inheritable: false
  storage:
    type: bundle
    container: lessons-learned
    marker: LESSON_LEARNED.md
    body_field: body
  schema:
    type: object
    required:
    - area
    - surface_when
    - source_refs
    - affect
    - summary
    properties:
      area:
        type: string
        description: 'Scoped target: Feature/X, Epic/Y, or Roadmap/Z. The LessonLearned
          surfaces when this area is touched.'
      surface_when:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
        description: >-
          Triggers that surface this memory unbidden. The four the SDLC engines
          know are `feature_touched`, `cycle_open`, `session_start` and
          `oracle_consult`.

          ⭐ OPEN ON PURPOSE (2026-08-03), and this one was BLOCKING a feature,
          not merely constraining it. The four names are all SDLC events —
          nothing in that list honestly describes a memory learned from a
          CONVERSATION, and a memory extracted from chat was refused at write
          time with a schema error. The vocabulary of triggers belongs to
          whoever runs the agent, not to the extension that first needed four
          of them.

          ⚠️ The consequence to accept: a trigger no engine knows never fires
          on its own. It is recorded and honoured as data — and proactive recall
          finds the memory by RELEVANCE regardless — but nothing will surface it
          because of that name until something is taught to look for it.
      source_refs:
        type: array
        items:
          type: string
        minItems: 1
        # Each item names its OWN target Kind (`Narrative/X`), so `x-dna-ref`
        # cannot name one for the field — see dna.kernel.query.references.
        # Without this the schema graph read the field NAME, matched no Kind
        # called `source`, and filed a real reference as an unresolved gap.
        x-dna-ref-composite: 'Kind/name'
        description: Pointers to source artifacts (Narrative/X, WorkflowEvent/Y,
          etc.) that this memory derives from.
      affect:
        type: string
        minLength: 1
        description: >-
          Emotional tone. The five the runtime weights out of the box are
          `triumph`, `regret`, `surprise`, `wistful` and `ominous` — an
          affect-tagged memory RESISTS forgetting, and each of those has a
          measured multiplier in `dna.memory.decay`.

          ⭐ OPEN ON PURPOSE, in lockstep with `memory_type` (2026-08-03). A
          closed palette makes the emotional vocabulary of the DOMAIN a constant
          of the CODE: a workspace whose work has `urgent`, `contested` or
          `relief` should be able to say so on the day it decides that, and to
          give that tone a weight through `CognitivePolicy.affect`.

          ⚠️ The consequence to accept: an unrecognised tone gets the NEUTRAL
          multiplier (1.0) until a policy assigns one. It is honoured — never
          dropped — but it does not resist forgetting more than an untagged
          memory would. Inventing a weight for a name nobody defined would be
          the system deciding how much a feeling matters.
      affect_reason:
        type: string
        minLength: 20
        description: Story s-remembrance-affect-reason-required. Concrete justification
          for the chosen affect — names specific slugs/SHAs/AC counts/state. NOT
          generic ('Story closed', 'shipped successfully'). Validator rejects writes
          that lack reason OR have boilerplate. Required for high-stakes affects
          (regret/ominous/surprise); optional for triumph/wistful but encouraged.
      affect_evidence_refs:
        type: array
        items:
          type: string
        description: Concrete refs (rem-X, verdict-Y, Story/s-Z) that back the affect
          choice. Required for high-stakes affects so the LLM's claim is auditable
          against actual artifacts in the manifest.
      summary:
        type: string
        maxLength: 280
        description: 1-2 sentence 'Lembre-se de...' — the recalled essence.
      relevance_decay_seed:
        type: number
        default: 0.95
        description: Multiplicative decay factor applied per 24h. Default 0.95 (~30%
          relevance after 14 days).
      last_surfaced:
        type: string
        format: date-time
        description: Auto-stamped on each surfacing; null until first surface.
      surface_count:
        type: integer
        default: 0
        description: Increments on each surface. Damps re-surfacing via the recall
          scoring formula (dna/memory/decay.py).
      confidence_score:
        type: number
        default: 1.0
        description: Semon engram intensity. Multiplies the recall score. Bumps
          when homophonic LessonsLearned (same area) are filed — engrams reinforce
          each other. Decays with surface_count for hygiene.
      cues_history:
        type: array
        items:
          type: object
          properties:
            at:
              type: string
              format: date-time
            cue:
              type: string
            actor:
              type: string
        default: []
        description: Semon ecforia trace. Each time the LessonLearned is surfaced
          via remember(), the cue (query + actor + timestamp) is appended. History
          of WHY this memory kept getting recalled.
      revisions:
        type: array
        items:
          type: object
          properties:
            at:
              type: string
              format: date-time
            by:
              type: string
            delta:
              type: string
        default: []
        description: Reconsolidation log (Nader 2000 / neo-Semon). Append-only when
          a recall reawakens the engram and the consumer updates the summary.
      tags:
        type: array
        items:
          type: string
        default: []
      owner:
        type: string
        description: 'ATTRIBUTION: which agent authored this memory (e.g. claude-code,
          jarvis). Orthogonal to scope + to tenant (tenant separates USERS, owner
          separates AGENTS). Recall AUDIENCE is governed by `visibility`, NOT by
          owner (s-agent-memory-phase-0-bridge, 2026-06-02 — supersedes the 2026-05-17
          owner-implies-private semantics). When absent: an unowned/project lesson
          (shared).'
      visibility:
        type: string
        enum:
        - shared
        - private
        - pinned
        - archived
        default: shared
        description: 'Recall audience (the customization axis): shared = all agents
          in scope recall it (cross-agent knowledge, default); private = only `owner`
          recalls it (an agent''s raw working memory); pinned = always injected
          into working memory at bootstrap, bypassing recall scoring (the Letta
          ''memory block''); archived = retained + auditable but excluded from default
          recall (soft-forget). Humans audit ALL regardless of visibility (audit
          != recall). Phase 0 (2026-06-02).'
      memory_type:
        type: string
        minLength: 1
        description: >-
          What KIND of memory this is. The three CoALA names are the ones the
          runtime treats specially — `episodic` (what happened), `semantic` (a
          generalized fact), `procedural` (how to act; the runtime presents it
          to the model as a RULE to follow, not as an anecdote to consider).

          ⭐ OPEN ON PURPOSE, and this was a deliberate reversal. It was a closed
          enum of exactly those three, and a closed enum makes the vocabulary of
          the DOMAIN a constant of the CODE — which is the one thing this whole
          system exists to avoid. A workspace whose work has `preference`,
          `constraint` or `commitment` should be able to say so on the day it
          decides that, not on the day someone remembers to edit a schema.

          The runtime honours the distinction WITHOUT knowing the name: an
          unrecognised type is presented to the model under its own name, because
          the name IS the information — `[preference]` tells a model more than
          `[fact]`, and far more than being dropped.

          ⚠️ The consequence to accept: an unrecognised type gets no special
          treatment. Only `procedural` is imperative. A workspace that invents
          `regra_dura` gets `[regra_dura]`, not the RULE framing — because
          promoting an unknown name to an obligation would put words in the
          agent's mouth that nobody wrote.

          Absent = untyped (legacy).
      valid_from:
        type: string
        format: date-time
        description: 'World-time validity start (Zep bi-temporal). Default: created_at.'
      valid_to:
        type: string
        format: date-time
        description: World-time validity end. Set when superseded/contradicted —
          the memory is INVALIDATED, never hard-deleted. Default recall excludes
          valid_to<now.
      superseded_by_memory:
        type: string
        description: Name of the memory that invalidated this one (not `superseded_by`
          — that's an ADR dep_filter token). Pairs with valid_to for point-in-time
          audit.
      claims:
        type: array
        default: []
        description: >-
          Structured assertions this memory makes, so two memories can be
          compared for CONTRADICTION deterministically (s-grafo-2-contradicao).
          Prose cannot be compared: "the Kind still needs approval" and "the
          Kind was approved" share almost no vocabulary, which is why lexical
          overlap (`dna.memory.merge`) finds repetition and never disagreement.

          Each claim is `(subject, predicate, object)` over the memory's
          bi-temporal window. Two claims CONTRADICT when they agree on subject
          and predicate, disagree on object, and their `[valid_from, valid_to)`
          windows share an instant — TOKI (arXiv:2606.06240 §2.1), nine of
          Allen's thirteen base relations. `polarity: denies` states an explicit
          negation, so "not approved" is comparable instead of being prose.

          `subject` is optional and defaults to the memory's own `Kind/name`
          referent (`area`, else the first such `source_refs` entry) — a memory
          already scoped to `KindDefinition/livro` need only declare
          `{predicate: approval, object: pending}`.

          ⚠️ A predicate is treated as SINGLE-VALUED at an instant (the
          functional-dependency rule). That is what makes detection decidable
          without an ontology — cardinality declarations are degrau 3 of
          `f-poder-de-grafo`, a founder gate. Use distinct predicates for
          genuinely multi-valued attributes, or the pass will present them as a
          conflict for a human to dismiss. It only ever PRESENTS: nothing here
          overwrites, expires or merges a memory.
        items:
          type: object
          required:
          - predicate
          additionalProperties: false
          properties:
            subject:
              type: string
              minLength: 1
              description: What the claim is about — normally `Kind/name`. Defaults
                to the memory's own referent.
            predicate:
              type: string
              minLength: 1
              description: The attribute being asserted (`approval`, `status`, `owner`).
            object:
              type:
              - string
              - number
              - boolean
              - "null"
              description: The asserted value. Absent/null = an EXISTENCE claim, which
                compares only against another existence claim of opposite polarity.
            polarity:
              type: string
              enum:
              - asserts
              - denies
              default: asserts
              description: '`denies` negates: `asserts X` beside `denies X` is a
                contradiction; beside `denies Y` it is not.'
            valid_from:
              type: string
              format: date-time
              description: Narrows the claim's world-time window; defaults to the memory's
                `valid_from`.
            valid_to:
              type: string
              format: date-time
              description: Narrows the claim's world-time window; defaults to the memory's
                `valid_to`.
      encoding_context:
        type: object
        description: Snapshot of the conditions at engraphy. semon-recaller scores
          ecphory candidates by partial-match against this dict.
        properties:
          area:
            type: string
          affect:
            type: string
          co_topics:
            type: array
            items:
              type: string
            description: Last 3-5 topic tags active at engraphy.
          source_refs:
            type: array
            items:
              type: string
          time_of_day:
            type: string
            description: morning|afternoon|evening|night — coarse temporal cue.
          day_of_week:
            type: string
          engraphed_by:
            type: string
            description: Agent slug that decided to engraph (semon-scribe by default).
        additionalProperties: true
      homophonic_links:
        type: array
        description: Semon homophony — engrams sharing substrate features. Each
          link records target + resonance score + basis. semon-recaller propagates
          a small strength boost (+0.02) to neighbors on ecphory (resonance).
        items:
          type: object
          properties:
            target_name:
              type: string
            resonance_score:
              type: number
              minimum: 0
              maximum: 1
            basis:
              type: string
              description: co-area | co-affect | co-temporal | semantic | manual
          required:
          - target_name
        default: []
  # Curated list/tree projection. DELTA INTENCIONAL vs a classe extinta: o
  # KindBase default ecoava o spec INTEIRO no navigator — gordo demais. Os
  # campos abaixo são a essência que a classe TS (summary) e o to_card morto
  # já elegiam. List endpoints (/docs/{kind}) não usam summary() — payloads
  # de produção inalterados (pinado no teste de equivalência).
  summary:
    area: ''
    affect: ''
    summary: ''
    surface_count: 0
    owner: null
  # The INDEX-side embedding fields. They must equal the CUE-side
  # `dna.memory.semantic.ENGRAM_TEXT_FIELDS`: recall embeds the query from
  # those four planes and compares it against the vector built from these.
  # They disagreed (4 vs 2) — `area` and `title` carried meaning into the
  # cue that the index had never seen, so every cosine was computed between
  # two different notions of what the memory says. Guarded by
  # test_embeddable_is_not_recallable.py::test_engram_cue_and_index_agree.
  embed:
  - area
  - title
  - summary
  - body
  graph_style:
    fill: '#FBBF24'
    stroke: '#D97706'
    text_color: '#fff'
  ascii_icon: 💭
  display_label: Engrama
  docs: An Engram is an affective recall artifact (record plane) — the memory
    co-pillar's rich, bi-temporal engram. It surfaces unbidden when the
    current cycle resembles a past one in the same ``area``, carries an
    evocative ``affect`` (triumph/regret/surprise/wistful/ominous), and is
    scored by Ebbinghaus-style decay (``relevance_decay_seed``,
    ``surface_count``, ``confidence_score``) plus Semon-inspired ecphory
    (``cues_history``, ``homophonic_links``). Bi-temporal — a superseded
    Engram is invalidated via ``valid_to``/``superseded_by_memory``, never
    hard-deleted. Renamed from LessonLearned (s-engram-rename, 2026-07-19) —
    memory is a platform primitive (``github.com/ruinosus/dna/v1``), not
    sdlc-owned. Authored by the Sage oracle during the deep-sleep ritual
    (mostly) or manually; written/recalled via ``dna.memory.remember`` /
    ``recall``. Stored as ``lessons-learned/<name>.yaml`` with body prose in
    the ``LESSON_LEARNED.md`` bundle marker — storage container/marker names
    are unchanged by the rename.
