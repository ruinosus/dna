# Copilot — a declarative, servable AG-UI copilot backend (record plane).
#
# A Copilot is a BINDER: it composes one-or-more mounted Agents (each already a
# declarative Agent + its Tools + optional MCPFederation) into a single
# servable copilot backend. From one Copilot instance the emitter produces a
# servable ``/agui`` app (Agno target today; MS Agent Framework later) — the
# single evolution point DNA Cloud's Memory copilot consumes.
#
# It carries ONLY the copilot-level concerns that don't belong on any single
# Agent: WHERE agents mount (``mounts``), HOW the backend is served
# (``serving``), whether inbound tenant is propagated (``tenant``), the
# human-in-the-loop approval surface (``hitl``), the RAG collections + vector
# store the copilot may read (``knowledge``), the storage/state backends it
# binds (``persistence`` — checkpoint/memory/cache/conversation), the
# deployment model (``hosting`` — self-hosted vs a managed runtime), and the
# frontend console hints (``frontend``). Instructions/persona/guardrails still
# live on the mounted Agent — a Copilot never re-declares them (the
# byte-equal instruction contract stays intact: instructions come from the
# Agent, unchanged).
#
# The optional ``workflow`` field carries a multi-step step chain consumed ONLY
# by the agent-framework (MS Agent Framework) target: when present the emitter
# emits a ``WorkflowBuilder`` chain of the named steps plus a workflow-level
# human-approval escalation node. A copilot with no ``workflow`` emits the plain
# single-agent app (Agno or agent-framework). It is a per-target advanced option
# (YAGNI for the core) and never re-declares persona/instructions.
#
# Like ``Tool`` (f-dna-tools-as-data), this is a record-plane descriptor — data,
# not a class. It is NOT a prompt target and never composes into an agent
# prompt, so it carries no composition signal (writing a Copilot does not
# invalidate the composition schema cache). Agents are referenced by name via
# ``mounts[].agent`` and knowledge collections by name via
# ``knowledge.collections[]`` (refs, resolved by the emitter). Stored as
# ``copilots/<name>.yaml`` — marketplace-shareable as a standalone bundle.
#
# tenant_scope intentionally NOT declared — permissive (base Copilot + optional
# per-tenant overlay), mirroring Tool.
#
# SINGLE-SOURCE package data: this descriptor is the only
# definition of the Kind — the packages/sdk-ts mirror and the test that
# enforced byte-identity (tests/test_descriptor_hash_parity.py) were BOTH
# removed when the TypeScript SDK was frozen (commit 341e517). Nothing
# mirrors this file and no test enforces byte-identity.
#
# ── 07/08/2026: a cadeia deixa de terminar no vazio — `runs_in` e o rendimento
#
# `Spec/spec-app-e-o-servico` mediu que este Kind não tinha relação de SAÍDA
# nenhuma: `Solution → App → Copilot` era declarada e parava aqui, e um
# copiloto não dizia em que processo roda. `runs_in → App` é essa ponta, e
# `value_per_outcome` é o par de `App.can_sleep`: o App declara o CUSTO, o
# Copilot declara o RENDIMENTO. Sem os dois lados há contagem de turnos, não
# ROI.
#
# ⚠️ `runs_in` nasce OPCIONAL, e a decisão é da spec, com o número na tela: há
# 7 `Copilot` vivos e 2 `App`; cinco copilotos não estão em App nenhum e
# funcionam. Obrigatório invalidaria os cinco no dia da migração. Vira
# obrigatório no dia em que a contagem de órfãos chegar a zero — e uma guarda
# derivada é o que torna esse dia visível em vez de esquecido.
#
# ── ⭐ Por que `runs_in` NÃO declara `inverse_of: copilots` ────────────────────
#
# A pergunta foi feita com `dna/kernel/kinds/relations.py` aberto, porque a
# resposta não é de gosto: `inverse_of` são DUAS promessas, e as duas foram
# medidas contra este par antes de recusá-lo.
#
#   1. A DECLARAÇÃO é IMPOSTA (`inverse_gaps`, carregamento do registro):
#      declarar `runs_in.inverse_of: copilots` OBRIGA `App.copilots` a declarar
#      `inverse_of: runs_in` de volta. Não é uma anotação local — é uma edição
#      no outro Kind.
#   2. O DADO é apenas REPORTADO (`WritePipeline`, em TODO modo, inclusive
#      `enforce`): quando o alvo não nomeia de volta, isso é logado e nunca
#      veta.
#
# A promessa 2 é o que `inverse_of` COMPRA aqui — traversal reverso já é de
# graça no `dna_edges` (o próprio módulo diz que o argumento de travessia é
# "genuinely worthless here"). Ela só vale quando os dois campos são DUAS
# METADES ARMAZENADAS DE UM MESMO FATO, que podem discordar. E não são:
#
#   • `App.copilots` é COMPOSIÇÃO — quais copilotos são vendidos e navegados
#     sob uma identidade, o que a rota `/app/<name>` renderiza. É `required`,
#     `minItems: 1`.
#   • `runs_in` é EXECUÇÃO — qual PROCESSO serve este copiloto.
#
# No dna-cloud, medido em 07/08/2026: UM deployment (`copilot`, um dos três que
# saem de `apps/copilot/`) serve os sete copilotos, enquanto o console os
# agrupa em duas identidades de App. Declarar as duas relações como inversas
# afirmaria composição == deployment, e nenhum dos dois lados da topologia real
# satisfaria a afirmação — nem "sete copilotos num App só" (que quebra o
# agrupamento do console), nem "dois Apps com um processo cada" (que não
# existe). O mesmo 1:N que separa `App.service_name` de `metadata.name` separa
# estas duas relações.
#
# E há o custo de curto prazo, que sozinho já bastava: com `runs_in` opcional e
# ainda não preenchido, o relatório de reciprocidade dispararia em 100% das
# gravações de App a partir do primeiro dia. `inverse_of` não sabe distinguir
# "as duas metades discordam" de "a segunda metade ainda não foi escrita" — e
# um relatório que fala sempre é um relatório que se aprende a ignorar, o que
# custaria justamente a promessa 2 no dia em que ela tivesse algo a dizer.
#
# A contagem de órfãos é o que a spec quer, e ela é OUTRO mecanismo: uma guarda
# derivada que CONTA copilotos sem `runs_in`. Ela responde "quantos faltam",
# que é a pergunta; `inverse_of` responderia "estes dois se contradizem", que
# não é.
apiVersion: github.com/ruinosus/dna/core/v1
kind: KindDefinition
metadata:
  name: copilot
spec:
  target_api_version: github.com/ruinosus/dna/v1
  target_kind: Copilot
  alias: helix-copilot
  origin: github.com/ruinosus/dna/copilot
  plane: record
  prompt_target: false
  flatten_in_context: false
  prompt_target_priority: 0
  storage:
    type: yaml
    container: copilots
  relations:
    runs_in:
      to: App
      cardinality: one
  schema:
    type: object
    additionalProperties: false
    required:
    - mounts
    - serving
    properties:
      mounts:
        type: array
        minItems: 1
        description: The Agents this copilot serves, each at a mount path. At
          least one is required.
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - agent
          - path
          properties:
            id:
              type: string
              description: Stable identifier for this mount within the copilot.
            agent:
              type: string
              description: Name of the mounted Agent (ref — resolved by the
                emitter to its base EmitContext).
            path:
              type: string
              description: The route the mounted agent is served at (e.g.
                /agui).
      serving:
        type: object
        additionalProperties: false
        required:
        - transport
        description: How the copilot backend is served.
        properties:
          transport:
            type: string
            enum:
            - ag-ui
            description: Wire protocol the copilot backend speaks. Only ag-ui
              (AG-UI protocol) today.
          framework:
            type: string
            enum:
            - langchain
            - maf
            - agno
            - deepagents
            default: langchain
            description: The self-hosted serving framework the dna.runtime
              port builds on; distinct from hosting.target which selects a
              MANAGED host (foundry/langgraph-platform/agentos).
      tenant:
        type: object
        additionalProperties: false
        description: Inbound-tenant handling. When propagate is true, the
          emitted serving layer derives tenant/oid from request headers into
          run-state for the mounted tools to read.
        properties:
          propagate:
            type: boolean
            description: Derive tenant from inbound request headers into
              run-state (default false).
      hitl:
        type: object
        additionalProperties: false
        description: Human-in-the-loop approval surface for write tools the
          mounted agents gate.
        properties:
          approval_card:
            type: object
            additionalProperties: false
            description: The card shown to the user when a gated tool pauses
              for approval.
            properties:
              title:
                type: string
                description: Heading of the approval card.
              details_from:
                type: string
                description: Path into the pending tool's args used to render
                  the card body (e.g. args.text).
              reason_from:
                type: string
                description: Path into the pending tool's args used to render
                  the reason line (e.g. args.reason).
      knowledge:
        type: object
        additionalProperties: false
        description: RAG the copilot may read. Optional — a pure-action copilot
          declares none.
        properties:
          collections:
            type: array
            items:
              type: string
            description: Names of the knowledge collections the copilot may
              query (refs — resolved by the emitter).
          store:
            type: object
            additionalProperties: false
            required:
            - backend
            description: WHERE the corpus is embedded + searched — the vector
              store. Lives inside knowledge so the corpus and its store stay
              cohesive. Optional; flows to the Terraform migration modules
              (f-copilot-infra-binding).
            properties:
              backend:
                type:
                - string
                - "null"
                description: Vector backend — an OPEN set (known values
                  pgvector | mongo-atlas | azure-ai-search | qdrant | pinecone
                  | null); emit when built. null = no store (framework default).
              ref:
                type: string
                description: Points at the vector-store infra resource (a
                  Terraform module output — connection string/endpoint). May
                  share the persistence ref (one physical Postgres).
              embed:
                type: object
                additionalProperties: false
                description: The embedding model and its output dimensionality.
                properties:
                  model:
                    type: string
                    description: Embedding model id (e.g.
                      text-embedding-3-small).
                  dims:
                    type: integer
                    description: Vector dimensionality (e.g. 1536).
      persistence:
        type: object
        additionalProperties: false
        description: Storage/state backends the emitted agent binds —
          checkpoint (thread/run state), long-term memory, and a LangGraph-only
          cache. Each slot is {backend, ref}; multiple slots may share one ref
          (one physical store — distinct tables/objects per framework).
          Optional — an in-memory copilot declares none. Flows to the Terraform
          migration modules (f-copilot-infra-binding), killing the hardcoded
          in-memory default.
        properties:
          checkpoint:
            type: object
            additionalProperties: false
            required:
            - backend
            description: Thread/run state — survives restart/resume (LangGraph
              PostgresSaver · Agno PostgresDb · MS-AF serialize-to-column).
            properties:
              backend:
                type:
                - string
                - "null"
                description: Storage backend — an OPEN set (known values
                  postgres | sqlite | mongo | redis | inmemory | cosmos |
                  serialize | null); emit when built. null = no backend
                  (framework default / in-memory).
              ref:
                type: string
                description: Points at an infra resource (a Terraform module
                  output — connection string/endpoint). Multiple slots may
                  share one ref (one physical store).
          memory:
            type: object
            additionalProperties: false
            required:
            - backend
            description: Cross-session long-term memory (LangGraph PostgresStore
              · Agno enable_user_memories · MS-AF mem0 / VectorStore).
            properties:
              backend:
                type:
                - string
                - "null"
                description: Storage backend — an OPEN set (known values
                  postgres | sqlite | mongo | redis | inmemory | cosmos |
                  serialize | null); emit when built. null = no backend
                  (framework default / in-memory).
              ref:
                type: string
                description: Points at an infra resource (a Terraform module
                  output — connection string/endpoint). Multiple slots may
                  share one ref (one physical store).
          cache:
            type: object
            additionalProperties: false
            required:
            - backend
            description: LangGraph-only node cache — null on the other targets
              (Agno / MS-AF have no first-class cache slot).
            properties:
              backend:
                type:
                - string
                - "null"
                description: Storage backend — an OPEN set (known values
                  postgres | sqlite | mongo | redis | inmemory | cosmos |
                  serialize | null); emit when built. null = no backend
                  (framework default / in-memory).
              ref:
                type: string
                description: Points at an infra resource (a Terraform module
                  output — connection string/endpoint). Multiple slots may
                  share one ref (one physical store).
          conversation:
            type: object
            additionalProperties: false
            required:
            - backend
            description: >-
              The CONVERSATION contract (spec-conversa-como-dado-do-dna) — WHO
              a thread belongs to, how its transcript is read back (AG-UI
              messages) and for how long it is kept. Read by
              ``dna.runtime.thread_store.resolve_conversation``; the port's
              transcript half is a READ PROJECTION over whatever the framework
              already checkpoints, so declaring this slot never makes a turn
              write twice.
              It does NOT duplicate ``checkpoint``: the checkpoint stays the
              framework's engine (replay + pending interrupts) and is keyed by
              thread id alone, so it can neither answer "list MY conversations"
              nor refuse a forged thread id. Absent slot = exactly today's
              behaviour (framework checkpoint only, no ownership, no
              retention).
            properties:
              backend:
                type:
                - string
                - "null"
                description: Storage backend for the thread INDEX (owner,
                  title, counts, where the thread was born) — an OPEN set
                  (known values postgres | sqlite | mongo | redis | inmemory |
                  cosmos | serialize | null). The transcript itself is NOT
                  stored here; it is projected from the framework's own
                  checkpoint. null = no backend (in-memory index).
              ref:
                type: string
                description: Points at an infra resource (a Terraform module
                  output — connection string/endpoint). Usually the SAME ref as
                  checkpoint — one physical store, distinct tables.
              retention:
                type: object
                additionalProperties: false
                description: >-
                  How long a conversation is KEPT. It rides on this slot
                  because a transcript is user data (volume, PII, a short
                  natural life) while the sibling slots hold the framework's
                  engine and the workspace's curated memory — one retention
                  rule over both would either keep too much or delete the wrong
                  thing. DNA carries the number to whoever holds the
                  connection; it does not run the purge for you (no scheduler
                  ships with the port). Absent = keep indefinitely.
                properties:
                  max_age_days:
                    type: integer
                    minimum: 1
                    description: Conversations untouched for longer than this
                      are expired. ``dna.runtime.thread_store.retention_cutoff``
                      is the shared computation, so two hosts cannot read
                      "30 days" two different ways.
      policies:
        type: object
        additionalProperties: false
        description: >-
          GOVERNANCE the copilot's OWNER declares (spec-quota-como-politica,
          dna-cloud 05/08/2026) — distinct from the house's billing: quotas
          here cap USE of this copilot, whoever pays. Enforcement lives in
          the serving runtime (the kernel validates shape only): a run that
          would exceed a declared quota is refused BEFORE the model runs,
          with the refusal naming the cap. Absent block = no caps.
        properties:
          quotas:
            type: object
            additionalProperties: false
            properties:
              turns_per_month:
                type: integer
                minimum: 1
                description: >-
                  Max turns (user messages answered) per calendar month,
                  across every user of this copilot.
              tokens_per_day:
                type: integer
                minimum: 1
                description: >-
                  Max model tokens (input+output) per UTC day, across every
                  user of this copilot.
              per_user:
                type: boolean
                description: >-
                  When true, each quota applies PER USER (per verified oid)
                  instead of per copilot — "cada usuário tem N turnos",
                  not "o copiloto todo tem N".
      interaction:
        type: object
        additionalProperties: false
        description: >-
          The INTERACTION MENU (F6.c of spec-copilot-f6-capacidades):
          presence-flips-capability blocks — declaring a block IS enabling
          it, every field has a safe default (the pattern measured in the
          voice_persona precedent: "{}" works). Only blocks a shipped
          renderer READS live here (the F4 data-honesty rule); voice landed
          WITH its renderer (dna-cloud#302 — the Realtime mint + WebRTC
          button read exactly these fields) and sandbox landed WITH its
          runtime (dna-cloud#319 — the skills executor merges exactly these
          numbers); cards still wait for theirs. HITL confirmation is NOT here — it
          already lives where it always did (the def's
          tools_requiring_confirmation).
        properties:
          attachments:
            type: object
            additionalProperties: false
            description: What the chat input ACCEPTS. Presence of each
              sub-block enables that attachment family.
            properties:
              image:
                type: object
                additionalProperties: false
                properties:
                  max_per_turn:
                    type: integer
                    minimum: 1
                    maximum: 10
                    default: 4
              text:
                type: object
                additionalProperties: false
                properties:
                  extensions:
                    type: array
                    default: [".txt", ".md", ".csv", ".json", ".yaml"]
                    items:
                      type: string
                  max_chars:
                    type: integer
                    minimum: 100
                    default: 20000
              spreadsheet:
                type: object
                additionalProperties: false
          suggestions:
            type: object
            additionalProperties: false
            description: Chips above the chat input.
            properties:
              static:
                type: array
                default: []
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - title
                  - message
                  properties:
                    title:
                      type: string
                      minLength: 1
                    message:
                      type: string
                      minLength: 1
              from_steps:
                type: boolean
                default: false
                description: Derive one chip per wizard step ("fill step
                  X for me") from the surface's declared steps.
          voice:
            type: object
            additionalProperties: false
            description: >-
              The VOICE face (spec-interaction-voice; renderer-first rule
              satisfied by dna-cloud#302): presence of this block is what
              makes the copilot's voice button exist — no block, no mint,
              no cost. Only fields the shipped runtime READS (the reference
              persona shape carried fields nothing consumed — archetype,
              interruption_tolerance, wake_word — and they stay OUT by the
              F4 rule).
              The provider key never lives in the doc; the hosting layer
              wires it (a secret param, default empty = the face is
              invisible).
            properties:
              voice:
                type: string
                default: ""
                description: Provider voice id (e.g. marin, cedar). Empty
                  = provider default.
              style:
                type: string
                default: ""
                description: Prosody/tone hint APPENDED to the composed
                  instructions — refinement, never a replacement.
              identity_lock:
                type: string
                default: ""
                description: Authored identity assertion spoken-as-context
                  (measured root cause in the reference implementation — a
                  persona without an assertion leaks the vendor's own
                  name).
              budget:
                type: object
                additionalProperties: false
                description: The per-session cost ceiling — the founder's
                  control. Seconds because that is what the runtime can
                  ENFORCE today (a USD cap that only notifies is a
                  measured gap in the reference, not a control).
                properties:
                  max_session_seconds:
                    type: integer
                    minimum: 10
                    maximum: 7200
                    default: 300
          sandbox:
            type: object
            additionalProperties: false
            description: >-
              The SCRIPT-EXECUTION face — the limits the copilot's OWNER
              declares over the isolated machine that runs a skill's
              scripts (renderer-first rule satisfied by dna-cloud#319,
              which ships the executor that reads exactly these fields).
              Presence of this block does NOT turn execution on: the
              hosting layer does, by holding a sandbox provider's
              credential — no credential, no execution, and this block has
              nothing to limit. What the block DOES is lower the ceiling.
              Every number here is merged DOWNWARD against the host's own
              operational limits and never upward, which is the property
              that makes reading an instance safe at all: an instance may be
              authored by a tenant, and a tenant must not be able to buy
              more compute by writing YAML.
              Only what the shipped runtime READS lives here (the F4 rule)
              — the upload budget is a host constant with no instance
              reader, so it stays OUT, and declaring it is a validation
              error rather than a silent no-op.
              The provider credential never lives in the doc.
            properties:
              budget:
                type: object
                additionalProperties: false
                description: The cost ceiling in the unit the runtime can
                  actually ENFORCE — seconds, by the same reasoning the
                  sibling voice budget used; a currency cap that only
                  notifies is a notification, not a control.
                properties:
                  max_execute_seconds:
                    type: integer
                    minimum: 1
                    maximum: 600
                    default: 60
                    description: Wall-clock ceiling for ONE command. The
                      maximum is where "run a skill's script" stops and
                      "run a job" starts; a request above it is refused
                      here instead of being silently clamped later.
                  max_session_seconds:
                    type: integer
                    minimum: 10
                    maximum: 3600
                    default: 300
                    description: How long the sandbox itself lives. The
                      provider kills it on expiry, which is why this — and
                      not a close() somewhere — is the cost ceiling that
                      holds even when our code forgets.
              allow_internet:
                type: boolean
                default: false
                description: >-
                  Egress from the sandbox, and it travels downward like the
                  numbers: false switches egress OFF for this copilot even
                  where the host allows it, while true grants nothing the
                  host has not already granted. An instance is never how the
                  internet gets switched on — with egress off the sandbox
                  cannot reach a public database endpoint either, which is
                  half of why running someone's script is affordable.
      mcp_servers:
        type: array
        default: []
        description: >-
          EXTRA MCP servers this copilot federates, with per-copilot tool
          TRANSFORMS (F6.a of spec-copilot-f6-capacidades). The transform
          vocabulary is fastmcp's own (ToolTransformConfig /
          ArgTransformConfig) adopted VERBATIM — rename a tool, rewrite its
          description, rename/hide arguments — because accuracy comes from
          the name/description the model READS, and the official shape is
          validated by fastmcp's Pydantic models at runtime (the schema here
          stays permissive on the transform block by design: the authority
          is the official vocabulary, not a hand-copied mirror of it).
          Credentials never live in the doc: `headers_env` names ENV VARS,
          the runtime resolves them at build.
        items:
          type: object
          additionalProperties: false
          required:
          - name
          - url
          properties:
            name:
              type: string
              minLength: 1
              description: The server key (also the default tool prefix
                namespace if the runtime applies one).
            url:
              type: string
              minLength: 1
              description: The MCP endpoint URL.
            transport:
              type: string
              enum:
              - streamable_http
              - sse
              default: streamable_http
            headers_env:
              type: object
              additionalProperties:
                type: string
              description: 'Outbound header name → ENV VAR NAME holding the
                value (never the value itself): {"X-Api-Key": "CRM_KEY"}.'
            include_tags:
              type: array
              default: []
              items:
                type: string
              description: Allowlist by tag (fastmcp enable(only=True)).
            exclude_tags:
              type: array
              default: []
              items:
                type: string
            tools:
              type: object
              description: 'The DE-PARA — original tool name → fastmcp
                ToolTransformConfig shape ({name, description, enabled,
                arguments: {old: {name, description, default, hide,
                required, examples}}}). Permissive here; validated by
                fastmcp Pydantic at runtime.'
              additionalProperties:
                type: object
      surfaces:
        type: array
        default: []
        description: >-
          The co-edited CANVAS SURFACES this copilot serves (F2 of
          adr-copiloto-como-dado, dna-cloud) — the archetype measured three
          times (spikes spike-arquetipo-*) and written once as a runtime
          (dna-cloud `flow/` + `lib/flow/`): a screen whose form the copilot
          manipulates through ONE validate-and-echo tool, a projection
          middleware, a per-thread scope gate and a shared state canvas.
          Each entry is that machine's configuration as data; the runtime
          resolves these over its built-in registry, so a workspace can TUNE
          a surface (its guidance template, its blocked persist tools)
          without a deploy.

          DATA-HONESTY BOUNDARY (the nine-sections lesson): entries declare
          ONLY what the runtime consumes today. Wizard steps, gates,
          invalidation rules and knowledge slots — the concepts the three
          measured worlds contributed — enter WHEN the generic renderer that
          reads them ships (recorded in the ADR as roadmap). A field nobody
          reads is a form without wires.
        items:
          type: object
          additionalProperties: false
          required:
          - name
          - state_key
          - tool_name
          - canvas_keys
          properties:
            name:
              type: string
              minLength: 1
              description: The surface's identity (matches the runtime's
                built-in registry key when overriding one).
            state_key:
              type: string
              minLength: 1
              description: The graph-state key that MARKS a thread of this
                surface (the gate decides by STATE, never by route) and
                anchors canvas rehydration. Must appear in `canvas_keys`.
            tool_name:
              type: string
              minLength: 1
              description: The surface's single validate-and-echo tool — the
                model's ONLY door into the shared canvas. The tool itself is
                code (its argument schema is the surface's contract); this
                names it.
            canvas_keys:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
              description: EVERY state key this surface projects/rehydrates.
                The console's rehydration allowlist derives from this — a key
                absent here does not survive a conversation reload.
            blocked_persist_tools:
              type: array
              default: []
              items:
                type: string
                minLength: 1
              description: Durable-write tools REMOVED from the model's list
                in a thread of this surface (i-061 — "save" must not bypass
                the draft door). Tenant-tunable via overlay.
            guidance_template:
              type:
              - string
              - 'null'
              description: The PromptTemplate name whose body steers the
                model toward this surface's tool (directed guidance). The
                template is the voice-as-data catalog; this names the entry.
            description:
              type:
              - string
              - 'null'
              description: What this surface is for — shown wherever
                surfaces are listed.
            steps:
              type: array
              default: []
              description: >-
                The surface's WIZARD, declared (F4 of adr-copiloto-como-dado
                — the visible half). Each step names which of the target
                Kind's fields it collects; the portal's generic renderer
                turns this into a stepped screen (stepper + typed inputs
                derived from the Kind schema + per-field AI affordances +
                the copilot dock). The concepts came measured from the
                archetype spikes: linear steps (all three worlds), and a
                human gate per step (the approved-by-user flag pattern).
                Conditional steps and invalidation rules remain roadmap —
                declared here only when the renderer reads them.
              items:
                type: object
                additionalProperties: false
                required:
                - id
                - title
                properties:
                  id:
                    type: string
                    minLength: 1
                    description: Stable step identity (snake-case).
                  title:
                    type: string
                    minLength: 1
                    description: The step's human title, as rendered.
                  description:
                    type:
                    - string
                    - 'null'
                    description: One sentence under the title.
                  fields:
                    type: array
                    default: []
                    items:
                      type: string
                      minLength: 1
                    description: Which of the target Kind's schema
                      properties this step collects, in render order. A
                      name the Kind does not declare is IGNORED by the
                      renderer (fail-soft) — the Kind is the authority.
                  gate:
                    type: boolean
                    default: false
                    description: A HUMAN checkpoint — the wizard only
                      advances past this step by explicit user action
                      (the measured approved-by-user flag, as a flag).
            kind:
              type:
              - string
              - 'null'
              description: The target Kind whose instances this surface
                composes (the wizard derives its fields from this Kind's
                schema; the review step writes an instance of it). Null for
                surfaces not bound to one Kind (the memory composer).
      frontend:
        type: object
        additionalProperties: false
        description: Frontend console hints for the emitted copilot UI.
        properties:
          console:
            type: string
            description: Which console renders the copilot (e.g. copilotkit).
          panels:
            type: array
            items:
              type: string
            description: Named side panels the console mounts alongside the
              chat.
          suggested_prompts:
            type: array
            items:
              type: string
            description: Starter prompts surfaced to the user in an empty
              console.
      workflow:
        type: object
        additionalProperties: false
        description: Optional multi-step workflow — agent-framework (MS Agent
          Framework) target only. When present the emitter emits a
          WorkflowBuilder chain of the named steps plus a workflow-level
          human-approval escalation node; absent, a plain single-agent app is
          emitted. A per-target advanced option (YAGNI for the core).
        properties:
          chain:
            type: array
            items:
              type: string
            description: Ordered workflow step ids. Each becomes a chained
              agent-executor; the AG-UI adapter surfaces the id as the UI step
              name.
      hosting:
        type: object
        additionalProperties: false
        description: Deployment/hosting model — beyond the self-hosted AG-UI app
          we already emit, the hosted (managed-service) variant. mode is a
          variant selector over ONE agent def (the same agent emits BOTH the
          per-user AG-UI app AND the single-identity hosted agent, which
          degrades — strips per-user OBO / per-user memory / HITL). Optional.
          Flows to the Terraform migration modules (f-copilot-infra-binding).
        properties:
          mode:
            type: string
            enum:
            - self-hosted
            - hosted
            description: Variant selector — self-hosted (the per-user AG-UI app)
              or hosted (a container image + manifest on a managed service).
          target:
            type: string
            enum:
            - foundry
            - langgraph-platform
            - agentos
            description: The hosted runtime — foundry (MS-AF, true managed,
              first-class), langgraph-platform (SaaS / self-host), agentos
              (self-host only).
          resources:
            type: object
            additionalProperties: false
            description: Compute request for the hosted variant (→ sandbox
              tier).
            properties:
              cpu:
                type: string
                description: CPU request (e.g. "0.5").
              memory:
                type: string
                description: Memory request (e.g. 1Gi).
          image:
            type: object
            additionalProperties: false
            description: Container-image build hints for the hosted variant.
            properties:
              registry_hint:
                type: string
                description: Target registry — an OPEN set (known values
                  acr | ghcr | ecr | dockerhub).
              remote_build:
                type: boolean
                description: Build remotely (Foundry ACR remoteBuild) vs
                  locally.
              base_image:
                type:
                - string
                - "null"
                description: Base image; null → framework default.
              port:
                type:
                - integer
                - "null"
                description: Serve port; null → framework default (8088 /
                  8123 / 7777).
          env:
            type: object
            additionalProperties: true
            description: Non-secret config injected into the hosted container
              (arbitrary keys; secrets ride on refs, never here).
          stores:
            type: object
            additionalProperties: false
            description: Managed stores the hosted target requires
              (langgraph-platform / agentos only — Foundry provisions its own).
            properties:
              postgres:
                type: string
                description: Postgres requirement (e.g. required).
              redis:
                type: string
                description: Redis requirement (e.g. required).
      runs_in:
        type: string
        description: >-
          The App whose SERVICE PROCESS serves this copilot, by
          instance name — the outgoing end of `Solution → App → Copilot`,
          which until now terminated here. The reference is validated on
          write (`spec.relations`), so a picker comes for free. OPTIONAL, and
          measured so: 7 live Copilots against 2 Apps, five of them in no App
          at all and serving. Absent is therefore not an error, it is an
          ORPHAN — a copilot whose running process is undeclared — and the
          count of orphans is what a derived guard reports. This field
          declares EXECUTION, never composition: `App.copilots` says which
          copilots are sold and navigated under one identity, and one process
          legitimately serves copilots belonging to several such identities.
          That is why it declares no `inverse_of` — see the header.
      value_per_outcome:
        type: object
        additionalProperties: false
        description: >-
          What ONE successful outcome of this copilot is worth — the reference
          value used to turn turns into ROI. ⭐ This is the only number in the
          whole chain that CANNOT be measured: the cost side is exact (tokens
          are metered, `App.can_sleep` prices the replica) and the turn count
          is exact, but what a human WOULD have spent doing this by hand exists
          nowhere in any telemetry. It has to be DECLARED, by someone who knows
          the business — and without it there is counting, never ROI. Optional
          for that reason, and absent means exactly "nobody has stated what an
          outcome is worth", which is a finding rather than a zero: presuming
          zero would render every copilot in the fleet as pure cost.
        properties:
          human_minutes:
            type: number
            minimum: 0
            description: How long the same outcome takes a human, in minutes.
              The DECLARED estimate of whoever knows the work, never a
              measurement — no clock in this system times the manual path,
              which is the whole reason this object exists.
          hourly_cost:
            type: number
            minimum: 0
            description: The fully loaded hourly cost of that human, in
              `currency`. Kept apart from `human_minutes` on purpose - the
              duration is a fact about the WORK and the rate is a fact about
              the ORGANISATION, they change for unrelated reasons, and a
              single pre-multiplied "value" field would make it impossible to
              say which of the two moved.
          currency:
            type: string
            description: The ISO-4217 code `hourly_cost` is stated in (e.g.
              USD, BRL). Declared and never defaulted - a rate whose currency
              is assumed is a rate that is wrong by a factor of five in the
              first fleet that mixes two.
