  graph_style:
    fill: '#8B5CF6'
    stroke: '#7C3AED'
    text_color: '#fff'
  ascii_icon: 🤖
  display_label: Copilots
  docs: A Copilot is a declarative, servable AG-UI copilot backend — a binder
    that composes one-or-more mounted Agents (each with its own Tools and
    optional MCPFederation) into a single servable ``/agui`` app. It carries
    only the copilot-level concerns that don't belong on any single Agent
    ``mounts`` (where agents serve), ``serving`` (the transport), ``tenant``
    (inbound-tenant propagation), ``hitl`` (the approval card for gated write
    tools), ``knowledge`` (RAG collections + the vector store it may read),
    ``persistence`` (checkpoint/memory/cache/conversation storage backends),
    ``hosting`` (self-hosted vs a managed runtime), and ``frontend`` (console
    hints).
    Instructions and persona stay on the mounted Agent — a
    Copilot never re-declares them. One instance emits a servable backend
    (Agno today), the single evolution point DNA Cloud's copilots consume.
    Stored as ``copilots/<name>.yaml`` — marketplace-shareable as a bundle.
    Since ``spec-app-e-o-servico`` (2026-08-07) it also declares where it RUNS
    and what it is WORTH — ``runs_in`` is an OPTIONAL relation to the ``App``
    whose service process serves it (execution, not composition — hence no
    ``inverse_of``; see the descriptor header), and ``value_per_outcome``
    ({human_minutes, hourly_cost, currency}) is the declared worth of one
    successful outcome. That last one is the single number in the chain that
    cannot be measured — the manual path is timed by no telemetry — so it must
    come from someone who knows the business. It is the counterpart of
    ``App.can_sleep`` — the App declares the cost, the Copilot the yield.
