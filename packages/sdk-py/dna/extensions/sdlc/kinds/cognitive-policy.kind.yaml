# CognitivePolicy — the UNIFIED declarative policy for the cognitive runtime
# (record plane; scope-overridable like the old RecallPolicy: resolution is
# scope doc → _lib default → code defaults, fail-soft).
#
# s-consolidate-cognitive-policies (f-kind-catalog-governance, 2026-07-07):
# the 9 single-instance policy Kinds — RecallPolicy, DecayPolicy, the old
# CognitivePolicy (now the `generation` section), MemoryPolicy,
# AllocationPolicy, PaginationPolicy, EngramStrengthPolicy, EmbeddingProfile,
# AffectPalette — were "fields that became Kinds". They shared plane (record),
# instance count (exactly one `default` doc each) and resolution shape, so
# they were consolidated into ONE Kind with one top-level section per former
# Kind. A partial doc tunes only the sections it names (per-scope overrides
# stay cheap: po-as-a-service carries only `recall.semantic`).
#
# Consumption invariants preserved at the CONSUMER, not the schema:
#   - `embedding` is only ever read from the _lib doc
#     (kernel.embedding_profile stays _lib-direct) — the embedding space is
#     intrinsically global, a scope must NOT be able to fork it.
#   - `pagination` keeps its own resolver entry point
#     (dna_shared.pagination_policy) — REST data-plane ownership.
#   - `memory` keeps the MemoryPolicy multi-matcher merge semantics via the
#     `memory.policies[]` array (applies_to / defaults / remember,
#     most-specific-wins — dna_shared.cognitive.memory_policy).
#
# Schema is CLOSED (additionalProperties: false) — this family left
# _GRANDFATHERED_OPEN_SCHEMAS. The 8 retired names are pinned in
# Kernel._REMOVED_KINDS (+ _REMOVED_KIND_NOTES).
# SINGLE-SOURCE package data: this descriptor is the only
# definition of the Kind — the packages/sdk-ts mirror and the test that
# enforced byte-identity (tests/test_descriptor_hash_parity.py) were BOTH
# removed when the TypeScript SDK was frozen (commit 341e517). Nothing
# mirrors this file and no test enforces byte-identity.
apiVersion: github.com/ruinosus/dna/core/v1
kind: KindDefinition
metadata:
  name: cognitive-policy
spec:
  target_api_version: github.com/ruinosus/dna/sdlc/v1
  target_kind: CognitivePolicy
  alias: sdlc-cognitive-policy
  origin: github.com/ruinosus/dna/sdlc
  plane: record
  prompt_target: false
  flatten_in_context: false
  prompt_target_priority: 0
  is_runtime_artifact: false
  dep_filters: {}
  storage:
    type: yaml
    container: cognitive-policies
  schema:
    type: object
    additionalProperties: false
    properties:
      recall:
        type: object
        additionalProperties: false
        description: Recall-tuning knobs for the ecphory engine (ex-RecallPolicy).
        properties:
          calibrated_for:
            type: object
            additionalProperties: false
            description: Validity envelope — the embedding model/dimension/language
              the semantic knobs were calibrated for. If the `embedding` section
              changes, these are stale and must be re-calibrated.
            properties:
              embedding_model:
                type: string
              dimensions:
                type: integer
              language:
                type: string
          semantic:
            type: object
            additionalProperties: false
            description: Embedding-coupled knobs (model+dimension+language). Cosine
              only means anything within one embedding space — re-calibrate on change.
            properties:
              theta_in:
                type: number
                default: 0.30
                description: Enter the working set when the fresh score >= this.
              theta_out:
                type: number
                default: 0.23
                description: Hold a prior member while its score >= this (hysteresis).
              direct_threshold:
                type: number
                default: 0.30
                description: Ecphory direct gate (mirrors theta_in).
              cosine_weight:
                type: number
                default: 0.61
                description: Weight on the raw embedding cosine in the content
                  dimension (calibrated 0.55->0.61, 2026-06-15).
          structural:
            type: object
            additionalProperties: false
            description: Theory-derived weights (Tulving/Nairne/Semon). Stable across
              model and language.
            properties:
              content_weight:
                type: number
                default: 0.55
              summary_partial_weight:
                type: number
                default: 0.28
              co_topics_weight:
                type: number
                default: 0.20
              source_refs_weight:
                type: number
                default: 0.15
              affect_weight:
                type: number
                default: 0.05
              time_weight:
                type: number
                default: 0.05
              novelty_boost:
                type: number
                default: 0.05
              recency_boost:
                type: number
                default: 0.10
              saturation_decay:
                type: number
                default: 0.6
              saturation_threshold:
                type: integer
                default: 3
                description: Recent-24h cue count that triggers saturation decay.
          retrieval:
            type: object
            additionalProperties: false
            description: Shape of retrieval — how many results, how to diversify and
              spread. Not coupled to the embedding model nor to memory theory.
            properties:
              k:
                type: integer
                default: 5
                description: Final working-set size injected per turn.
              mmr_lambda:
                type: number
                default: 0.3
                description: MMR redundancy penalty (diversity vs raw score).
              limit_direct:
                type: integer
                default: 8
                description: Max direct ecphory hits considered.
              limit_homophonic:
                type: integer
                default: 6
                description: Max homophony-expanded hits considered.
              spread_depth:
                type: integer
                default: 2
                description: Spreading-activation hops from the direct hits.
              spread_decay:
                type: number
                default: 0.7
                description: Activation decay per spreading hop.
              search_n:
                type: integer
                default: 50
                description: pgvector candidates pulled for the cosine overlay.
          injection:
            type: object
            additionalProperties: false
            description: How the recalled block ENTERS the prompt (the runtime
              middleware side). `retrieval` shapes the search; `injection`
              shapes the prompt. Defaults mirror the middleware constants they
              replace (varredura de valores, 03/08/2026).
            properties:
              max_block_chars:
                type: integer
                default: 2000
                description: Ceiling for the whole injected block — one long
                  Engram must not eat the window.
              min_signal_chars:
                type: integer
                default: 12
                description: Below this the user turn triggers no search
                  ("ok", "thanks").
              cue_window:
                type: integer
                default: 3
                description: How many recent user messages form the search cue.
              cue_max_chars:
                type: integer
                default: 600
                description: Ceiling of the cue text — a giant query does not
                  discriminate better, it only costs more.
              sticky_overlap:
                type: number
                default: 0.5
                description: Hysteresis — fraction of the previous working set
                  that must survive for the OLD block to be kept (prompt/cache
                  stability, from the JARVIS prior art).
      decay:
        type: object
        additionalProperties: false
        description: Memory retention/forgetting knobs (ex-DecayPolicy).
        properties:
          stability_tiers:
            type: object
            additionalProperties: false
            description: Ebbinghaus stability per confidence tier, in days.
            properties:
              faint:
                type: number
                default: 5.0
              firm:
                type: number
                default: 15.0
              burning:
                type: number
                default: 45.0
          default_stability_days:
            type: number
            default: 15.0
            description: Fallback stability when no tier/stability is on the doc.
          max_stability_days:
            type: number
            default: 60.0
            description: Per-recall bump ceiling (so frequent recalls don't compound forever).
          relevance_decay_seed:
            type: number
            default: 0.95
            description: Default multiplicative decay per 24h (spec override wins).
          ranking_formula:
            type: string
            enum:
            - simple
            - actr
            default: simple
            description: 'simple = exponential decay (Sprint 1); actr = log power-law (Sprint 2).'
      generation:
        type: object
        additionalProperties: false
        description: Operational params for the memory-gen engines (the ORIGINAL
          CognitivePolicy body, now one section among peers).
        properties:
          auto_shipped:
            type: object
            additionalProperties: false
            description: Deterministic ship → engram producer.
            properties:
              lookback_days:
                type: integer
                default: 7
                description: Window of recently-done Stories considered.
              max_emit:
                type: integer
                default: 5
                description: Max engrams emitted per run.
          consolidation:
            type: object
            additionalProperties: false
            description: Episodic → semantic consolidation.
            properties:
              min_cluster_size:
                type: integer
                default: 3
                description: Min episodic engrams in an area before consolidating.
          backfill:
            type: object
            additionalProperties: false
            description: Distil done Stories/Features into engrams.
            properties:
              budget:
                type: integer
                default: 50
                description: Max engrams written per backfill run (resumable).
      memory:
        type: object
        additionalProperties: false
        description: Agent-memory governance (ex-MemoryPolicy). Each entry in
          `policies` keeps the old multi-doc matcher semantics — merged
          most-specific-wins by dna_shared.cognitive.memory_policy.
        properties:
          policies:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                applies_to:
                  type: object
                  additionalProperties: false
                  description: 'Matcher: any of scope/owner/memory_type (absent =
                    wildcard). Most-specific wins.'
                  properties:
                    scope:
                      type: string
                    owner:
                      type: string
                    memory_type:
                      type: string
                      minLength: 1
                      description: >-
                        Any declared memory type. OPEN, in lockstep with the
                        `Engram` field it matches: a closed enum here would let a
                        workspace declare `preference` on the memory and then be
                        unable to write a policy for it.
                defaults:
                  type: object
                  additionalProperties: false
                  properties:
                    visibility:
                      type: string
                      enum:
                      - shared
                      - private
                      - pinned
                      - archived
                      default: shared
                    include_agents:
                      type: boolean
                      default: true
                    pinned_budget:
                      type: integer
                      default: 10
                remember:
                  type: object
                  additionalProperties: false
                  description: Topic steering (guidance; hard enforcement stays in
                    the write path / Presidio).
                  properties:
                    never:
                      type: array
                      items:
                        type: string
                    always:
                      type: array
                      items:
                        type: string
      ingestion:
        type: object
        additionalProperties: false
        description: >-
          WHEN memory is fed, and from WHAT. The workspace's own answer to "how
          and when are memories created" — the half `recall` (how they are USED)
          already had.

          ⭐ WHY THIS IS DATA AND NOT A FLAG. Feeding memory automatically is a
          judgement about the customer's own material: a legal team may want
          every decision captured; a support team may want nothing from chat at
          all. Hard-coding either answer picks a side for people whose work we
          do not know. Absent, the built-in defaults apply and nothing changes.
        properties:
          enabled:
            type: boolean
            default: true
            description: >-
              Master switch. `false` stops all automatic feeding — the agent
              still writes memory when explicitly asked, because that path is the
              user's own instruction, not a policy decision.
          sources:
            type: array
            default:
            - chat
            description: >-
              WHERE facts may be extracted from. `chat` = the conversation
              transcript; `sdlc` = board activity; `kind:<Name>` = documents of a
              given Kind as they are written.

              A source absent from this list is NEVER read — the list is an
              allowlist, not a preference. Widening it is the workspace's
              decision, and it is the decision that governs what the agent may
              learn about its people.
            items:
              type: string
              minLength: 1
          trigger:
            type: string
            enum:
            - per_turn
            - batch
            - off
            default: per_turn
            description: >-
              `per_turn` extracts as the conversation happens (memory is
              immediate; costs a model call per qualifying turn). `batch` defers
              to a scheduled pass (cheap; memory arrives late). `off` disables
              extraction while leaving the rest of the policy in force.
          min_signal_chars:
            type: integer
            default: 25
            minimum: 0
            description: >-
              Below this the turn is skipped without a model call. It exists
              because most turns of a real conversation are "ok" / "thanks" —
              extracting from them costs money and yields noise that later
              SURFACES on its own in the prompt.
          engine:
            type: string
            enum: [pipeline, pipeline-agent, agent]
            default: pipeline
            description: >-
              The reconciliation engine. `pipeline` = two fixed model calls
              (cheap, predictable). `pipeline-agent` = the hybrid: the fixed
              skeleton, but the reconciliation may ESCALATE an uncertain fact
              to the arbiter agent (one bounded round; the arbiter decides,
              the pipeline applies). `agent` = the named agent reconciles
              everything (reserved; not yet implemented).
          engine_agent:
            type: string
            default: ""
            description: >-
              The Agent document that arbitrates escalations (its instruction
              is the arbiter's role text). Empty + an escalation = the fact
              degrades to `none` — uncertainty without a judge never writes.
          neighbors:
            type: integer
            minimum: 1
            maximum: 50
            default: 8
            description: >-
              How many existing memories the reconciliation compares each new
              fact against (the recall k). More sees farther and costs more
              tokens per turn; fewer is cheaper and can miss a conflict.
          require_approval:
            type: boolean
            default: false
            description: >-
              Whether an automatically extracted memory goes through the human
              approval gate before being written.

              ⚠️ `false` is deliberate and is the founder's call (2026-08-03).
              With reconciliation (a later fact can UPDATE or invalidate an
              earlier one) a wrong memory costs "until contradicted" rather than
              "forever" — which is what made the automatic path defensible at
              all. Set `true` and every extracted fact becomes a card to click;
              the trail gains coverage and the feature gains friction.
          max_facts_per_turn:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
            description: >-
              Ceiling of facts extracted per turn. A real conversation does not
              produce ten durable facts; a model returning ten is inventing —
              the ceiling turns that into bounded noise.
          max_transcript_chars:
            type: integer
            minimum: 200
            default: 4000
            description: How much transcript feeds the extraction. More does
              not improve the fact and worsens the bill.
          transcript_messages:
            type: integer
            minimum: 1
            maximum: 50
            default: 6
            description: How many recent messages (user AND agent) form the
              extraction material — decisions often complete across the
              exchange ("pode ser 60 dias?" / "fechado, 60").
          max_arbitrations:
            type: integer
            minimum: 0
            maximum: 20
            default: 3
            description: Ceiling of arbiter escalations per turn
              (`pipeline-agent` engine). Beyond it, facts degrade to `none` —
              uncertainty without budget never writes.
          arbiter_neighbors_multiplier:
            type: integer
            minimum: 1
            maximum: 10
            default: 3
            description: The arbiter sees a WIDER neighborhood than the
              reconciliation — `neighbors × multiplier` (capped below). It is
              deciding a conflict, so it needs more context than the pass that
              raised it.
          arbiter_neighbors_cap:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
            description: Hard cap of the arbiter neighborhood.
          proposal_markers:
            type: array
            default: []
            description: >-
              Regexes that mark a turn as containing a DURABLE assertion — the
              trigger for the "propose to remember" nudge. EMPTY means the
              built-in markers apply — and the built-ins are Portuguese-biased
              (decidimos/prefiro/prazo...), which is exactly why this is data:
              an English or Spanish workspace declares its own.
            items:
              type: string
              minLength: 1
          sdlc:
            type: object
            additionalProperties: false
            description: The `sdlc` source cadence — how often the board is
              read for extraction, and how much of it.
            properties:
              interval_seconds:
                type: integer
                minimum: 300
                default: 21600
                description: Minimum interval between board reads per
                  workspace (default 6h).
              max_items:
                type: integer
                minimum: 1
                maximum: 100
                default: 12
                description: Stories per digest — a month of board does not
                  hold a hundred durable facts.

      allocation:
        type: object
        additionalProperties: false
        # ⚠️ DECLARADO, AINDA SEM EFEITO (medição de 03/08/2026): o processo de
        # merge-por-similaridade que estes parâmetros governariam não existe no
        # core determinístico — só o consolidate por retenção. Data-honesty na
        # fonte: quem declara isto hoje não muda comportamento nenhum. Vira
        # efetivo quando o processo de alocação shippar (feature, não fio).
        description: Engram allocation (dedup/archival) knobs (ex-AllocationPolicy).
        properties:
          threshold:
            type: number
            default: 0.85
            description: Overlap >= this proposes archiving the loser (clamped 0.5-1.0).
          loser_policy:
            type: string
            enum:
            - weaker
            - newer
            default: weaker
            description: Which of two overlapping engrams loses — the weaker
              (lower strength) or the newer one.
          overlap_weights:
            type: object
            additionalProperties: false
            description: How overlap [0,1] is scored (sum 1.0).
            properties:
              source_refs:
                type: number
                default: 0.5
                description: Jaccard of shared source_refs.
              area:
                type: number
                default: 0.3
                description: Same area bonus.
              affect:
                type: number
                default: 0.2
                description: Same affect bonus.
      pagination:
        type: object
        additionalProperties: false
        description: REST list pagination defaults/caps (ex-PaginationPolicy).
          Data-plane ownership — read by dna_shared.pagination_policy, not the
          cognitive engines.
        properties:
          default_limit:
            type: integer
            default: 50
            description: Page size when the request omits ?limit=.
          max_limit:
            type: integer
            default: 500
            description: Hard cap — a larger ?limit= is clamped to this.
      engram_strength:
        type: object
        additionalProperties: false
        # ⚠️ DECLARADO, AINDA SEM EFEITO (03/08/2026) — mesmo caso da allocation:
        # as regras de força inicial por gatilho não têm consumidor no core.
        description: Initial-strength rules per engraphy trigger
          (ex-EngramStrengthPolicy).
        required:
        - rules
        properties:
          rules:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required:
              - when
              - initial_strength
              properties:
                when:
                  type: string
                  description: Trigger predicate
                initial_strength:
                  type: number
                engraphy_intensity:
                  type: number
                  default: 1.0
          default_decay_rate_per_day:
            type: number
            default: 0.02
          default_decay_threshold_days:
            type: integer
            default: 30
      embedding:
        type: object
        additionalProperties: false
        description: Embedding model + dimension + search weights
          (ex-EmbeddingProfile). ONLY meaningful on the _lib doc — the embedding
          space is intrinsically global (stored vectors and every query must
          share one model+dimension); kernel.embedding_profile reads _lib
          directly and never a scope override. `recall.calibrated_for` points
          back here.
        required:
        - model
        - dimensions
        properties:
          model:
            type: string
            description: Embedding model id (must be served by the LiteLLM proxy).
          dimensions:
            type: integer
            description: Vector dimension. MUST match the pgvector column + every
              stored embedding — changing it requires a full re-embed.
          max_input_tokens:
            type: integer
            default: 8192
            description: Input ceiling for a single embed call (model-specific).
          language:
            type: string
            description: Primary language the recall knobs were calibrated against.
          search_weights:
            type: object
            additionalProperties: false
            description: RRF fusion weights for `cognitive search` (hybrid retrieval).
            properties:
              bm25:
                type: number
                default: 0.4
              vector:
                type: number
                default: 0.6
              graph:
                type: number
                default: 0.3
          notes:
            type: string
      affect:
        type: object
        additionalProperties: false
        description: Affect vocabulary for the memory/affect engine
          (ex-AffectPalette). The active palette steers engraphy affect tags.
        required:
        - palette
        properties:
          palette:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required:
              - id
              - semantics
              properties:
                id:
                  type: string
                semantics:
                  type: string
                affect_weight:
                  type: number
                  default: 1.0
                use_when:
                  type: array
                  items:
                    type: string
                  default: []
      intel:
        type: object
        additionalProperties: false
        description: Intel-engine tuning (#36 tail) — ranker weights, dedup
          threshold, feedback strengths and the portal action bar. Engine-wide
          per workspace; the per-SOURCE `threshold` stays on IntelSource.
        properties:
          action_bar:
            type: number
            default: 0.85
            description: Score at or above which an insight "requires action"
              in the screens (product judgement, now declarable).
          ranker:
            type: object
            additionalProperties: false
            properties:
              base:
                type: number
                default: 0.3
              has_action:
                type: number
                default: 0.3
              pir_match:
                type: number
                default: 0.15
              evidence_weights:
                type: object
                additionalProperties: false
                properties:
                  evidence-based:
                    type: number
                    default: 0.25
                  opinion-practice:
                    type: number
                    default: 0.12
                  anecdotal:
                    type: number
                    default: 0.0
          dedup:
            type: object
            additionalProperties: false
            properties:
              cosine_threshold:
                type: number
                default: 0.97
                description: Above this cosine two insights are "the same".
          feedback:
            type: object
            additionalProperties: false
            properties:
              sim_threshold:
                type: number
                default: 0.8
              dismiss_penalty:
                type: number
                default: 0.5
              action_bonus:
                type: number
                default: 0.1
      owner:
        type: string
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
  summary:
    owner: ''
  graph_style:
    fill: '#F472B6'
    stroke: '#DB2777'
    text_color: '#fff'
  ascii_icon: ⚙️
  display_label: Política Cognitiva
