# RemoteAgent — o Agent Card do A2A, como instância.
#
# O protocolo A2A não é um Kind: transporte não é instância. O Agent Card é —
# um descritor versionado de identidade e capacidade, publicado pelo servidor
# A2A em `/.well-known/agent-card.json`. Isto é ele, com os nomes em snake_case
# (a convenção do kernel) e o mapeamento para o JSON do A2A anotado campo a
# campo.
#
# ── Por que este Kind é SEPARADO de `Agent` ──────────────────────────────────
# Os campos são disjuntos. `Agent` declara COMPORTAMENTO (instruction, model,
# tools) e o DNA compõe e executa. `RemoteAgent` DESCREVE e APONTA
# (supported_interfaces, skills, security_schemes) e o DNA localiza e chama. Um
# Kind só com os dois modos validaria absurdo — um agente local com
# `security_schemes`, um remoto com `instruction` — e `additionalProperties:
# false` não sabe expressar "estes campos OU aqueles".
#
# O que UNE os dois é `delegation_target_for`, e é de propósito: o roster de
# alvos é DERIVADO ("toda instância que declara o bloco e cuja allowlist me
# inclui"), atravessando os dois Kinds. Um terceiro tipo de alvo, depois, entra
# sem tocar em quem delega.
#
# ── Ilha, e ela FICA ilha (i-119 grupo C, 06/08/2026) ────────────────────────
# A i-119 arquivou dois campos aqui: `skills` "nomeia Skills" e
# `delegation_target_for` "nomeia Agents". Medidos contra o schema abaixo, os
# dois são leitura errada, por dois motivos diferentes — e os dois motivos
# valem mais que a declaração que não vai acontecer:
#
# * `skills` é um array de OBJETOS `{id, name, description, tags, examples}` —
#   o `skills[]` do Agent Card do A2A, que o REMOTO escreve sobre si mesmo. Não
#   é uma lista de nomes de `Skill` do DNA (`agentskills.io/v1`, bundle com
#   SKILL.md, composto no prompt); é o remoto se descrevendo, no vocabulário
#   dele. `relation_values` lê strings e veria zero valor aqui, então a aresta
#   declarada seria uma aresta que nunca carrega nada.
#
# * `delegation_target_for` é um OBJETO. Quem nomeia Agents é
#   `delegation_target_for.agents`, um nível ABAIXO — e uma relação é nomeada
#   por um campo de PRIMEIRO nível do spec (`relations._NAME_RE` não aceita
#   ponto; `schema_contradictions` só enxerga `properties` do topo; e
#   `kind_graph` já publica isso como limite conhecido, `top_level_properties_
#   only`). O valor ainda carrega a sentinela `["*"]` = qualquer delegador, que
#   não é nome de instância nenhuma. Inexprimível hoje, e por uma lacuna que já
#   tem nome.
#
# E um terceiro que a i-119 não listou, embora seja gêmeo de um que ela listou:
# `data_scope.kinds` nomeia KINDS, não instâncias — o mesmo caso de
# `AgentGrant.scope_kinds`, que a issue pôs na primeira ponta de vocabulário.
# Aninhado, além de tudo. Some as duas lacunas e este Kind é ilha por
# construção, não por descuido: TUDO que ele aponta está ou dentro de um objeto
# ou apontando para o registro de Kinds.
#
# ── data_scope: o campo que é NOSSO e não do A2A ─────────────────────────────
# Um RemoteAgent é, por construção, um canal de exfiltração: o DNA manda dado do
# workspace para uma URL que o tenant escolheu. O A2A não tem opinião sobre
# isso — é protocolo de transporte. Então o escopo é nosso, é OBRIGATÓRIO, e é
# explícito: aprovar um remoto não é "essa URL é ok", é "este endpoint pode
# receber ESTES dados". Escopo implícito significa "tudo", e ninguém aprova isso
# sabendo.
apiVersion: github.com/ruinosus/dna/core/v1
kind: KindDefinition
metadata:
  name: remote-agent
spec:
  target_api_version: github.com/ruinosus/dna/a2a/v1
  target_kind: RemoteAgent
  alias: a2a-remote-agent
  origin: github.com/ruinosus/dna/a2a
  tenant_scope: tenanted
  plane: record
  prompt_target: false
  flatten_in_context: false
  storage:
    type: yaml
    container: remote-agents
  schema:
    type: object
    additionalProperties: false
    required: [name, description, supported_interfaces, data_scope]
    properties:
      # ── o Card do A2A ────────────────────────────────────────────────────
      name:
        type: string
        description: A2A `name`. O nome pelo qual o agente se anuncia.
        minLength: 1
        maxLength: 200
      description:
        type: string
        description: A2A `description`. Para que ele serve, nas palavras dele.
        minLength: 1
      version:
        type: string
        description: A2A `version` — a versão QUE O AGENTE declara de si.
      # O campo do binding chamou-se `transport` até 31/07/2026, numa leitura
      # nossa da especificação — e não existe. A 1.0 o chama `protocolBinding`,
      # com os valores em MAIÚSCULAS, e o cliente oficial FILTRA por ele.
      # Enquanto o nome divergia, nenhum Agent Card conforme podia ser ingerido
      # (schema fechado recusava `protocolBinding` e exigia `transport`) e
      # nenhum cliente conforme conseguia nos chamar — com todos os testes
      # verdes, porque as fixtures herdavam o mesmo erro de leitura.
      #
      # Fica em comentário, e não na `description`: esta última é RENDERIZADA na
      # referência gerada (`docs/reference/kinds/record.md`), onde a arqueologia
      # do campo é ruído para quem só quer saber o que escrever.
      supported_interfaces:
        type: array
        description: >
          A2A `supportedInterfaces` (1.0 — substituiu o `url` único das versões
          anteriores). Cada entrada nomeia um BINDING de protocolo e onde
          alcançá-lo.
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [protocol_binding, url]
          properties:
            protocol_binding:
              type: string
              # Os valores de `a2a.utils.constants.TransportProtocol`, verbatim.
              enum: [JSONRPC, GRPC, HTTP+JSON]
            protocol_version:
              type: string
              description: >
                A2A `protocolVersion` da interface (`"1.0"`). Opcional: a 1.0
                permite omiti-lo, e o cliente oficial trata a ausência como
                "sem preferência" em vez de erro.
            url:
              type: string
              pattern: '^https://'
              description: >
                HTTPS obrigatório. Delegar dado de workspace por texto claro
                seria exfiltração com um passo a menos.
      capabilities:
        type: object
        additionalProperties: false
        description: A2A `capabilities` — flags booleanas, não operações nomeadas.
        properties:
          streaming: {type: boolean}
          push_notifications: {type: boolean}
          extended_agent_card: {type: boolean}
      skills:
        type: array
        description: A2A `skills[]` — o que ele sabe fazer, item a item.
        items:
          type: object
          additionalProperties: false
          required: [id, name, description]
          properties:
            id: {type: string, minLength: 1}
            name: {type: string, minLength: 1}
            description: {type: string, minLength: 1}
            tags: {type: array, items: {type: string}}
            examples: {type: array, items: {type: string}}
      security_schemes:
        type: object
        description: >
          A2A `securitySchemes` (forma do OpenAPI 3). Diz COMO autenticar. A
          credencial em si NUNCA vive aqui — o schema é fechado justamente
          para que um bearer não possa ser anexado à instância. Quem guarda a
          credencial é o deployment, por remoto, e ela nunca é o token do
          usuário.
        additionalProperties: true
      default_input_modes:
        type: array
        items: {type: string}
      default_output_modes:
        type: array
        items: {type: string}
      documentation_url: {type: string}
      icon_url: {type: string}
      signatures:
        type: array
        description: >
          A2A `signatures`, preservadas como vieram. A VERIFICAÇÃO
          criptográfica está fora desta versão (exige decidir a cadeia de
          confiança, que é decisão de produto) — por isso `signature_state`
          existe e é tri-estado.
        items: {type: object, additionalProperties: true}
      signature_state:
        type: string
        enum: [unsigned, present_unverified, verified]
        description: >
          Tri-estado DE PROPÓSITO: uma instância que não foi verificado tem de
          ser legível como tal. `unsigned` = o Card não trouxe assinatura;
          `present_unverified` = trouxe e não checamos; `verified` = checamos
          (não alcançável nesta versão). Um booleano `signed` faria "não
          verificado" parecer "não assinado", que são coisas diferentes.

      # ── o que é nosso ────────────────────────────────────────────────────
      data_scope:
        type: object
        additionalProperties: false
        required: [kinds]
        description: >
          O que este endpoint PODE receber. Obrigatório — ver o cabeçalho.
        properties:
          kinds:
            type: array
            description: >
              Nomes de Kind cujas instâncias podem ser delegados a este
              remoto. Lista vazia = nada pode, o que é um estado honesto
              (registrado, sem permissão) e não um erro.
            items: {type: string}
      delegation_target_for:
        type: object
        additionalProperties: false
        description: >
          O bloco COMPARTILHADO com `Agent` (kernel `DelegationTargetFor`). É
          o que o roster derivado lê para achar este alvo sem enumerar Kinds.
        properties:
          agents:
            type: array
            items: {type: string}
            description: Allowlist de delegadores; `["*"]` = qualquer.
          format:
            type: string
            enum: [slug, json, text]
          typical_seconds: {type: integer, minimum: 0}
          use_when: {type: string}
          purpose: {type: string}
  presentation:
    fields: [name, description, supported_interfaces, skills, data_scope, signature_state]
