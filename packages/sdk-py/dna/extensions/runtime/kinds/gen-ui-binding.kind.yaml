apiVersion: github.com/ruinosus/dna/core/v1
kind: KindDefinition
metadata:
  name: gen-ui-binding
  description: Assign host-rendered generative UI components to a DNA Agent.
spec:
  target_api_version: github.com/ruinosus/dna/runtime/v1alpha1
  target_kind: GenUIBinding
  alias: runtime-gen-ui-binding
  origin: github.com/ruinosus/dna/runtime
  plane: record
  prompt_target: false
  flatten_in_context: false
  storage:
    type: yaml
    container: gen-ui-bindings
  relations:
    agent:
      to: Agent
      cardinality: one
    components:
      to: GenUIComponent
      cardinality: many
  schema:
    type: object
    additionalProperties: false
    required: [agent, components]
    properties:
      agent:
        type: string
        minLength: 1
        description: DNA Agent instance that receives these components.
      components:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
        description: GenUIComponent instance names available to the Agent.
  traits:
    - runtime.gen-ui-binding
  display_label: Generative UI bindings
  presentation:
    fields:
      - field: name
        label: Binding
        role: identifier
      - field: agent
        label: Agent
        role: title
      - field: components
        label: Components
        role: tag
