apiVersion: github.com/ruinosus/dna/core/v1
kind: KindDefinition
metadata:
  name: gen-ui-component
  description: Portable governance contracts for generative UI components.
spec:
  target_api_version: github.com/ruinosus/dna/runtime/v1alpha1
  target_kind: GenUIComponent
  alias: runtime-gen-ui-component
  origin: github.com/ruinosus/dna/runtime
  plane: record
  prompt_target: false
  flatten_in_context: false
  storage:
    type: yaml
    container: gen-ui-components
  identifiers:
    renderer_ref:
      role: external
      system: ui-host
  schema:
    type: object
    additionalProperties: false
    required:
      - description
      - protocols
      - required_capabilities
      - fallback
    anyOf:
      - required: [tool_name, input_schema, renderer_ref]
      - required: [mcp]
      - required: [a2ui]
    dependentRequired:
      tool_name: [input_schema, renderer_ref]
      input_schema: [tool_name, renderer_ref]
      renderer_ref: [tool_name, input_schema]
      grounding: [mcp]
    properties:
      tool_name:
        type: string
        minLength: 1
        pattern: '^[a-z][a-z0-9_]{0,63}$'
        description: Legacy host tool name; use mcp.tool_name for MCP-owned tools.
      description:
        type: string
        minLength: 1
        description: Selection guidance presented to the agent.
      input_schema:
        type: object
        additionalProperties: true
        required: [type, properties]
        properties:
          type:
            const: object
          properties:
            type: object
          required:
            type: array
            items:
              type: string
        description: Legacy host tool arguments; MCP owns its discovered input schema.
      renderer_ref:
        type: string
        minLength: 1
        pattern: '^[a-z][a-z0-9-]{0,63}$'
        description: Legacy symbolic key resolved only against renderers compiled into the host.
      mcp:
        type: object
        additionalProperties: false
        required: [tool_name]
        properties:
          tool_name:
            type: string
            minLength: 1
            pattern: '^[a-z][a-z0-9_]{0,63}$'
            description: MCP tool whose discovered schema and result own the data contract.
          resource_uri:
            type: string
            minLength: 1
            pattern: '^ui://[^[:space:]]+$'
            description: Optional MCP Apps resource rendered by compatible hosts.
        description: MCP-owned tool and optional portable MCP App resource.
      a2ui:
        type: object
        additionalProperties: false
        required: [catalog_id, component]
        properties:
          catalog_id:
            type: string
            minLength: 1
            description: Host-owned A2UI catalog identifier negotiated by the runtime.
          component:
            type: string
            minLength: 1
            description: Trusted component name in the declared A2UI catalog.
        description: Native A2UI rendering binding without executable renderer code.
      grounding:
        type: object
        additionalProperties: false
        required: [source]
        properties:
          source:
            type: string
            enum: [mcp-tool-result]
            description: Authoritative source for operational values rendered by the component.
          enforce:
            type: boolean
            default: true
            description: Fail closed when values cannot be traced to the authoritative source.
        description: Structured provenance policy enforced by the consuming runtime.
      protocols:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
        description: Agent-to-UI protocols capable of carrying this contract.
      required_capabilities:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
        description: Capabilities a host-agent path must advertise before registration.
      fallback:
        type: object
        additionalProperties: false
        required: [type]
        properties:
          type:
            type: string
            enum: [text, markdown]
          message:
            type: string
            minLength: 1
        description: Non-visual representation used when capabilities are unavailable.
      contract_version:
        type: integer
        minimum: 1
        default: 1
        description: Monotonic version of the tool argument contract.
  spec_defaults:
    contract_version: 1
  traits:
    - runtime.gen-ui-component
  display_label: Generative UI components
  presentation:
    fields:
      - field: name
        label: Component
        role: identifier
      - field: description
        label: Description
        role: title
      - field: protocols
        label: Protocols
        role: tag
      - field: renderer_ref
        label: Renderer
    hidden:
      - input_schema
      - required_capabilities
      - fallback
      - contract_version
  ui_schema:
    description:
      widget: textarea
    input_schema:
      widget: json
