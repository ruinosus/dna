apiVersion: github.com/ruinosus/dna/core/v1
kind: KindDefinition
metadata:
  name: gen-ui-component
  description: Portable contracts for host-rendered generative UI components.
spec:
  target_api_version: github.com/ruinosus/dna/runtime/v1alpha1
  target_kind: GenUIComponent
  alias: runtime-gen-ui-component
  origin: github.com/ruinosus/dna/runtime
  plane: record
  prompt_target: false
  flatten_in_context: false
  storage:
    type: yaml
    container: gen-ui-components
  identifiers:
    renderer_ref:
      role: external
      system: ui-host
  schema:
    type: object
    additionalProperties: false
    required:
      - tool_name
      - description
      - input_schema
      - renderer_ref
      - protocols
      - required_capabilities
      - fallback
    properties:
      tool_name:
        type: string
        minLength: 1
        pattern: '^[a-z][a-z0-9_]{0,63}$'
        description: Stable tool name exposed to the agent.
      description:
        type: string
        minLength: 1
        description: Selection guidance presented to the agent.
      input_schema:
        type: object
        additionalProperties: true
        required: [type, properties]
        properties:
          type:
            const: object
          properties:
            type: object
          required:
            type: array
            items:
              type: string
        description: JSON Schema for the component tool arguments.
      renderer_ref:
        type: string
        minLength: 1
        pattern: '^[a-z][a-z0-9-]{0,63}$'
        description: Symbolic key resolved only against renderers compiled into the host.
      protocols:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
        description: Agent-to-UI protocols capable of carrying this contract.
      required_capabilities:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
        description: Capabilities a host-agent path must advertise before registration.
      fallback:
        type: object
        additionalProperties: false
        required: [type]
        properties:
          type:
            type: string
            enum: [text, markdown]
          message:
            type: string
            minLength: 1
        description: Non-visual representation used when capabilities are unavailable.
      contract_version:
        type: integer
        minimum: 1
        default: 1
        description: Monotonic version of the tool argument contract.
  spec_defaults:
    contract_version: 1
  traits:
    - runtime.gen-ui-component
  display_label: Generative UI components
  presentation:
    fields:
      - field: name
        label: Component
        role: identifier
      - field: tool_name
        label: Tool
        role: title
      - field: description
        label: Description
        role: subtitle
      - field: protocols
        label: Protocols
        role: tag
      - field: renderer_ref
        label: Renderer
    hidden:
      - input_schema
      - required_capabilities
      - fallback
      - contract_version
  ui_schema:
    description:
      widget: textarea
    input_schema:
      widget: json
