# AuditLog — immutable record of a role-gated HTTP endpoint invocation
# (record plane, runtime artifact; written by emit_audit() from gated handlers).
#
# expr batch A (plan 2026-06-11-descriptor-expressiveness, Chunk 3): the
# twin AuditLogKind classes (Py+TS) were DELETED — this descriptor is the
# single source. First builtin Kind to carry the new D2 `ui:` descriptor
# field (StudioUIMetadata reconstructed by DeclarativeKindPort and served
# by kinds-api's /kinds/manifest verbatim — the class's `ui` block).
# SINGLE-SOURCE package data: this descriptor is the only
# definition of the Kind — the packages/sdk-ts mirror and the test that
# enforced byte-identity (tests/test_descriptor_hash_parity.py) were BOTH
# removed when the TypeScript SDK was frozen (commit 341e517). Nothing
# mirrors this file and no test enforces byte-identity.
# NOTE: this header used to cite tests/test_expr_batch_a_equivalence.py as
# freezing equivalence with the extinct class. That file has never existed
# anywhere in this repository's history — the citation was false from the
# start. No equivalence golden guards this descriptor today.
#
# tenant_scope: tenanted is DECLARED — the class set scope=TenantScope.TENANTED
# explicitly (each tenant sees only their own audit trail; platform admins
# query cross-tenant). This is NOT the permissive-undeclared case.
apiVersion: github.com/ruinosus/dna/core/v1
kind: KindDefinition
metadata:
  name: audit-log
spec:
  target_api_version: github.com/ruinosus/dna/audit/v1
  target_kind: AuditLog
  alias: audit-auditlog
  origin: github.com/ruinosus/dna/audit
  traits: [record.append-only]
  tenant_scope: tenanted
  plane: record
  prompt_target: false
  flatten_in_context: false
  prompt_target_priority: 0
  is_runtime_artifact: true
  storage:
    type: yaml
    container: audit-log
  # ⚠️ NO `relations` BLOCK, AND THE ABSENCE IS MEASURED — i-119, 06/08/2026.
  #
  # The founder's decision was to DECLARE the target with
  # `on_target_delete: allow`: a log line about a deleted instance MUST keep
  # pointing at it, and saying so turns a dangling reference from an unmodelled
  # exception into declared policy. The mechanism for that landed in eff4a9e3
  # and `relations.py` names this Kind as the case it exists to unblock.
  #
  # It still cannot be written here, and the blocker is the OTHER, independent
  # problem the decision deliberately did not solve: THE ADDRESS IS SPREAD OVER
  # THREE FIELDS (`target_kind` + `target_name` + `target_scope`), while a
  # relation is NAMED BY THE ONE FIELD THAT HOLDS ITS VALUE. Every shape the
  # vocabulary accepts was tried against `normalize_relations`:
  #
  #   target_name, to: "*", by: name            REFUSED — `to: *` requires a
  #                                             composite `by`
  #   target_name, to: "*", by: target_kind     REFUSED — same rule
  #   target_kind, to: "*", by: name            REFUSED — same rule
  #   target_name, to: "*", by: "Kind/name"     ACCEPTED — and it is a LIE
  #
  # The one accepted shape states that the value reads `Agent/Y`. Measured
  # against the stored shape (tests/test_audit_extension.py, the only writer
  # evidence in the repo): `target_kind: "Agent"`, `target_name: "Y"` — two
  # bare strings. Declaring `Kind/name` would put a parse instruction on the
  # wire that no consumer could follow, which is worse than an island: an
  # island says "nothing declared", a wrong `by` says "declared" and misleads.
  #
  # The two exits are both out of this slice's hands, and both are named in
  # i-119: (a) the AuditLog starts storing `Kind/name` in ONE field — real DATA
  # MIGRATION, a founder call, not an edit here; (b) reopen the closed set of
  # composite forms — REFUSED, because `relations.py` closes it on purpose:
  # `x-dna-ref-composite` took a free-form string and that WAS the defect being
  # corrected.
  #
  # A third gap sits underneath and belongs to neither: `target_kind` names a
  # KIND, not an instance, and "points at the Kind registry" has no vocabulary
  # at all (i-119, vocabulary gap 1 — shared with `Automation.result_kind`,
  # `Hook.target` and `AgentGrant.scope_kinds`). It is not declared as an
  # `identifier` either: a Kind name is minted by DNA, so `external` would name
  # an authority that does not exist, and `self` is plainly false.
  identifiers:
    # A correlation id (UUIDv4) minted by the request pipeline, shared by every
    # log line of one request — so it is neither this instance's key (many rows
    # carry the same value) nor a pointer at any instance. `external` because
    # the minting authority really is outside the instance store, and `system`
    # names where the value is useful: the request log.
    request_id:
      role: external
      system: http-request
  schema:
    type: object
    required:
    - actor
    - roles
    - operation
    - outcome
    - captured_at
    additionalProperties: true
    properties:
      actor:
        type: string
        description: Identity that made the request. From claims.email > claims.sub.
          'dev-user' in dev-bypass, 'test-user' in test-header mode.
      roles:
        type: array
        items:
          type: string
        description: Roles claimed at request time (from JWT or DNA_DEV_ROLES). Snapshot
          — does NOT reflect later role revocations.
      operation:
        type: string
        description: HTTP method + path template, e.g. 'PUT /scopes/{scope}/docs/Agent/{name}'
          or 'POST /assessments/{name}/run'.
      target_kind:
        type: string
        description: Kind of doc affected (when applicable). Null for non-doc ops like
          POST /sync/replicate.
      target_name:
        type: string
        description: Name of doc affected, when applicable.
      target_scope:
        type: string
        description: Scope of doc affected, when applicable.
      target_tenant:
        type:
        - string
        - 'null'
        description: Tenant the operation routed to (claims.tenant + overrides resolved).
          Null = base layer write.
      outcome:
        type: string
        enum:
        - success
        - denied
        - error
        description: 'success = decorator + handler ran clean. denied = 403 from require_role.
          error = handler raised (500/422/...).'
      captured_at:
        type: string
        format: date-time
        description: UTC ISO-8601 timestamp.
      request_id:
        type: string
        description: Correlation ID (UUIDv4) — joins logs.
      remote_ip:
        type: string
        description: Best-effort client IP (X-Forwarded-For aware).
      user_agent:
        type: string
        description: HTTP User-Agent header.
      detail:
        type: object
        description: 'Free-form context: which required roles failed, body size, durations,
          errors. Defensive about PII — don''t include request bodies verbatim.'
  # Curated list-endpoint projection. The extinct Py class declared NO
  # summary() (KindBase whole-spec echo); the TS class returned null. Both
  # are replaced by this curated projection (intentional delta — precedent
  # VoiceEpisode in F3 lote-3; SynthesizerState too, until censo-12-kinds
  # deleted it). The manifest does NOT carry
  # summary, so this choice is manifest-neutral.
  summary:
    actor: ''
    operation: ''
    outcome: ''
    target_kind: ''
    captured_at: ''
  # P2L2 — AuditLog is Govern-mode (compliance + tenant-admin only). Sidebar
  # entry visible to those roles. Read-only — no create/edit exposed in UI
  # (writes happen via emit_audit() from gated handlers).
  ui:
    mode: govern
    label:
      en: Audit Log
      pt-BR: Trilha de Auditoria
    icon: 🔒
    description:
      en: Forensic trail of every role-gated mutation.
      pt-BR: Trilha forense de toda mutação com role.
    breadcrumb:
    - Govern
    - Audit Log
    routes:
      list: docs/AuditLog
      detail: docs/AuditLog/:name
    permissions:
      list:
      - compliance
      - tenant-admin
      detail:
      - compliance
      - tenant-admin
    in_sidebar: true
    display_order: 40
  graph_style:
    fill: '#475569'
    stroke: '#334155'
    text_color: '#fff'
  ascii_icon: 🔍
  display_label: Audit Log
  docs: Immutable record of a role-gated HTTP endpoint invocation. Captures actor,
    roles claimed, operation, target Kind/name, scope/tenant, request_id, outcome,
    and timestamp. Used by compliance auditors + admins to answer 'who did what when'
    without parsing application logs.
