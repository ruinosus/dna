# O binder: monta o agente e declara a SURFACE do intake (F2:
# Copilot.spec.surfaces[] — o contrato de co-edição da tela como dado).
apiVersion: github.com/ruinosus/dna/v1
kind: Copilot
metadata:
  name: contrato-copiloto
spec:
  mounts:
  - id: principal
    agent: contrato-agent
    path: /agui
  serving:
    transport: ag-ui
  # F6.c — o CARDÁPIO de interação: declarar o bloco É ligar (presença-liga).
  # Anexos de imagem (foto do contrato) e texto; chips estáticos + um por
  # etapa do wizard (from_steps).
  interaction:
    attachments:
      image:
        max_per_turn: 2
      text:
        extensions: [".txt", ".md", ".pdf"]
    suggestions:
      from_steps: true
      static:
      - title: Extrair do anexo
        message: Extraia os campos do ContratoDeServico do documento anexado,
          propondo cada um no rascunho com o trecho que o sustenta — eu reviso
          antes de gravar.
  # F6.a — MCP EXTRA com DE-PARA: o vocabulário do bloco `tools` é o
  # ToolTransformConfig do fastmcp, verbatim. O rename/re-descrição é o que
  # o MODELO lê — é daí que vem a acertividade. Credencial nunca aqui:
  # `headers_env` nomearia ENV VARS (este server é público, sem auth).
  mcp_servers:
  - name: deepwiki
    url: https://mcp.deepwiki.com/mcp
    transport: streamable_http
    tools:
      ask_question:
        name: consultar_documentacao_de_github
        description: Pergunta sobre a documentação de um repositório PÚBLICO
          do GitHub (repoName no formato "dono/repo", ex. "jlowin/fastmcp").
          Use quando o usuário citar uma biblioteca/projeto e a resposta
          estiver na documentação dele.
  surfaces:
  - name: contrato-intake
    state_key: document_draft
    tool_name: update_document_draft
    canvas_keys:
    - document_draft
    - document_kind
    - document_schema
    - document_source
    blocked_persist_tools:
    - remember
    - forget
    - consolidate
    guidance_template: null
    kind: ContratoDeServico
    description: Intake de contrato — extração campo a campo para revisão
      humana, com o wizard nascendo desta declaração.
    steps:
    - id: identificacao
      title: Identificação
      description: Quem contrata, quem presta, e como o contrato se chama.
      fields: [titulo, contratante, contratada]
    - id: condicoes
      title: Condições
      description: Valor, prazo e renovação — o coração comercial.
      fields: [valor_mensal, prazo_meses, renovacao_automatica, multa_rescisao]
      gate: true
    - id: formalizacao
      title: Formalização
      description: A assinatura, e a revisão final antes de gravar.
      fields: [data_assinatura]
