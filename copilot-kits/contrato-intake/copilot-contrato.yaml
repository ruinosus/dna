# O binder: monta o agente e declara a SURFACE do intake (F2:
# Copilot.spec.surfaces[] — o contrato de co-edição da tela como dado).
apiVersion: github.com/ruinosus/dna/v1
kind: Copilot
metadata:
  name: contrato-copiloto
spec:
  mounts:
  - id: principal
    agent: contrato-agent
    path: /agui
  serving:
    transport: ag-ui
  surfaces:
  - name: contrato-intake
    state_key: document_draft
    tool_name: update_document_draft
    canvas_keys:
    - document_draft
    - document_kind
    - document_schema
    - document_source
    blocked_persist_tools:
    - remember
    - forget
    - consolidate
    guidance_template: null
    kind: ContratoDeServico
    description: Intake de contrato — extração campo a campo para revisão
      humana, com o wizard nascendo desta declaração.
    steps:
    - id: identificacao
      title: Identificação
      description: Quem contrata, quem presta, e como o contrato se chama.
      fields: [titulo, contratante, contratada]
    - id: condicoes
      title: Condições
      description: Valor, prazo e renovação — o coração comercial.
      fields: [valor_mensal, prazo_meses, renovacao_automatica, multa_rescisao]
      gate: true
    - id: formalizacao
      title: Formalização
      description: A assinatura, e a revisão final antes de gravar.
      fields: [data_assinatura]
