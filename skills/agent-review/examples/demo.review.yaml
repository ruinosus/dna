# What people said about the agents, and what was decided. build.mjs keeps it up to date; edit it, or fill the
# workbook's «Declared» sheet and the «Decision» column and read it back with --from.
apiVersion: github.com/ruinosus/dna/v1
kind: AgentReview
metadata:
  name: RH — autoatendimento do colaborador
declared:
  # the handoff document says folha escalates; the YAML says it does not
  - { agent: rh-folha, key: "trigger:OnEscalate", value: sim, source: "handoff da folha, seção 4" }
  - { agent: rh-ferias, key: kpi, value: "tempo até a resposta < 2 min", source: backlog }
decisions:
  - { key: "trigger:OnEscalate", status: accepted, scope: platform, why: "Ninguém fica sem saída para uma pessoa" }
