mcs.metadata:
  componentName: Enviar calendário da folha por e-mail
  description: "Envia ao colaborador um e-mail com o calendário de pagamento."
kind: TaskDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: To
    description: "Endereço de e-mail do colaborador que vai receber o calendário."
    entity: EmailPrebuiltEntity
    shouldPromptUser: true

  - kind: AutomaticTaskInput
    propertyName: Subject
    description: Assunto do e-mail, curto e em português.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: Body
    description: Corpo do e-mail em HTML simples, em português, com o resumo do que foi tratado na conversa.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

modelDisplayName: Enviar calendário da folha por e-mail
modelDescription: "Envia ao colaborador, pelo Outlook, um e-mail com as datas de pagamento consultadas na conversa. Use somente quando o colaborador pedir."
action:
  kind: InvokeConnectorTaskAction
  connectionReference: cr7b2_rhFolha.shared_office365.shared-office365-87a66c95-f84e-4a65-a761-64ce01dc8c2e
  connectionProperties:
    mode: Maker

  operationId: SendEmailV2

outputMode: All
