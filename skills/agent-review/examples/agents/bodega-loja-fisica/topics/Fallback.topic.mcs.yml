mcs.metadata:
  componentName: Fallback
  description: Acionado quando nenhum tópico ou ferramenta corresponde à mensagem do cliente.
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main
  priority: -1
  actions:
    - kind: ConditionGroup
      id: conditionGroup_RZknOG
      conditions:
        - id: conditionItem_ouQR9I
          condition: =System.FallbackCount < 3
          actions:
            - kind: SendActivity
              id: sendMessage_HJE10P
              activity:
                text:
                  - "Desculpe, não entendi. Pode reformular a sua pergunta?"
                  - "Não captei bem. Pode tentar explicar de outro jeito?"

      elseActions:
        - kind: SendActivity
          id: sendMessage_ofKN9l
          activity:
            text:
              - "Estou com dificuldade para entender o seu pedido. Vou te encaminhar para alguém da equipe Bodega Azul."

        - kind: BeginDialog
          id: beginDialog_9haQlu
          dialog: cr7b2_bodegaLojaFisica.topic.Escalate
