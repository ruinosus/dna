mcs.metadata:
  componentName: Fallback
  description: Acionado quando nenhum tópico ou ferramenta corresponde à mensagem do colaborador.
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main
  priority: -1
  actions:
    - kind: ConditionGroup
      id: conditionGroup_jc7tt5
      conditions:
        - id: conditionItem_8m5nw9
          condition: =System.FallbackCount < 3
          actions:
            - kind: SendActivity
              id: sendMessage_Bl0mZW
              activity:
                text:
                  - "Desculpe, não entendi. Pode reformular a sua pergunta?"
                  - "Não captei bem. Pode tentar explicar de outro jeito?"

      elseActions:
        - kind: SendActivity
          id: sendMessage_zfTVpF
          activity:
            text:
              - "Estou com dificuldade para entender a sua solicitação. Vou te encaminhar para alguém do RH."

        - kind: BeginDialog
          id: beginDialog_0NDaL6
          dialog: cr7b2_rhAdmissao.topic.Escalate
