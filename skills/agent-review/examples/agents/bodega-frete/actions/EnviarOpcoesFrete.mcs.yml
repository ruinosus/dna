mcs.metadata:
  componentName: Enviar opções de frete por e-mail
  description: "Envia ao cliente um e-mail com as opções de frete consultadas."
kind: TaskDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: To
    description: "Endereço de e-mail do cliente que vai receber as opções de frete."
    entity: EmailPrebuiltEntity
    shouldPromptUser: true

  - kind: AutomaticTaskInput
    propertyName: Subject
    description: Assunto do e-mail, curto e em português.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: Body
    description: Corpo do e-mail em HTML simples, em português, com o resumo do que foi tratado na conversa.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

modelDisplayName: Enviar opções de frete por e-mail
modelDescription: "Envia ao cliente, pelo Outlook, um e-mail com as modalidades e prazos de frete consultados na conversa. Use somente quando o cliente pedir."
action:
  kind: InvokeConnectorTaskAction
  connectionReference: cr7b2_bodegaFrete.shared_office365.shared-office365-87a66c95-f84e-4a65-a761-64ce01dc8c2e
  connectionProperties:
    mode: Maker

  operationId: SendEmailV2

outputMode: All
