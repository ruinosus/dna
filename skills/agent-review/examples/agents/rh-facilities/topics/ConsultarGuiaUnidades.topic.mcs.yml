mcs.metadata:
  componentName: Consultar Guia das Unidades
  description: "Responde dúvidas sobre as unidades com base no guia publicado no SharePoint."
kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: PerguntaColaborador
    description: "A pergunta do colaborador sobre uma unidade, sala, visitante ou manutenção."
    shouldPromptUser: true

modelDescription: "Responde perguntas sobre endereço, horário de funcionamento, reserva de sala, visitantes e manutenção nas unidades."
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: CreateSearchQuery
      id: createSearchQuery_8WzjG8
      userInput: =Topic.PerguntaColaborador
      result: Topic.SearchQuery

    - kind: SearchAndSummarizeContent
      id: searchContent_BEHQYE
      autoSend: false
      variable: Topic.SearchResult
      userInput: =Topic.SearchQuery.SearchQuery
      fileSearchDataSource:
        searchFilesMode:
          kind: DoNotSearchFiles

      knowledgeSources:
        kind: SearchSpecificKnowledgeSources
        knowledgeSources:
          - cr7b2_rhFacilities.knowledge.GuiaUnidades

      applyModelKnowledgeSetting: false
      responseCaptureType: FullResponse

    - kind: SetVariable
      id: setVariable_E3NIoo
      variable: Topic.Resposta
      value: =Topic.SearchResult.Text.Content

inputType:
  properties:
    PerguntaColaborador:
      displayName: PerguntaColaborador
      description: "A pergunta do colaborador sobre uma unidade, sala, visitante ou manutenção."
      type: String

outputType:
  properties:
    Resposta:
      displayName: Resposta
      description: Resposta fundamentada na base de conhecimento do agente.
      type: String
