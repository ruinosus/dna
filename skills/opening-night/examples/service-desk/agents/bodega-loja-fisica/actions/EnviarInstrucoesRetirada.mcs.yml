mcs.metadata:
  componentName: Enviar instruções de retirada por e-mail
  description: "Envia ao cliente um e-mail com as instruções de retirada na loja."
kind: TaskDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: To
    description: "Endereço de e-mail do cliente que vai receber as instruções de retirada."
    entity: EmailPrebuiltEntity
    shouldPromptUser: true

  - kind: AutomaticTaskInput
    propertyName: Subject
    description: Assunto do e-mail, curto e em português.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: Body
    description: Corpo do e-mail em HTML simples, em português, com o resumo do que foi tratado na conversa.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

modelDisplayName: Enviar instruções de retirada por e-mail
modelDescription: "Envia ao cliente, pelo Outlook, um e-mail com endereço, horário e documentos necessários para retirar o pedido na loja física. Use somente quando o cliente pedir."
action:
  kind: InvokeConnectorTaskAction
  connectionReference: cr7b2_bodegaLojaFisica.shared_office365.shared-office365-f0fdb545-532d-4d56-a81b-286eb298a1e7
  connectionProperties:
    mode: Maker

  operationId: SendEmailV2

outputMode: All
