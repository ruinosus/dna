mcs.metadata:
  componentName: Agente Devoluções
  description: Agente conectado Bodega Azul - Devoluções.
kind: TaskDialog
inputs:
  - kind: ManualTaskInput
    propertyName: CategoriaSolicitacao
    value: =Global.CategoriaSolicitacao

modelDisplayName: Bodega Azul - Devoluções
modelDescription: "Agente especialista em trocas e devoluções: prazo de arrependimento, etiqueta de devolução e reembolso. Use quando a categoria for Devolucoes."
action:
  kind: InvokeConnectedAgentTaskAction
  inputType:
    properties:
      CategoriaSolicitacao:
        displayName: CategoriaSolicitacao
        description: Categoria da solicitação definida pelo orquestrador.
        isRequired: true
        type: String

  botSchemaName: cr7b2_bodegaDevolucoes
  historyType:
    kind: ConversationHistory
