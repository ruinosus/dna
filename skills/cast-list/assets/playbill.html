    --platform: #6fcf9a; --platform-bg: #1c3328; --specialist: #9db0ff; --specialist-bg: #232c4a; --orchestrator: #c6a8ff; --orchestrator-bg: #2e2445; --type: #c6a8ff; --type-bg: #2e2445;
    --amber: #f2c46b; --amber-bg: #2f2716; --amber-line: #5a4a22; --focus: #8fb0ff; --active: #e8ebf0; --on-active: #14171c;

body { margin: 0; }
.cl *, .cl *::before, .cl *::after { box-sizing: border-box; }
.cl button { font: inherit; color: inherit; cursor: pointer; }
.cl :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.cl-wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.cl-title { margin: 0; font-size: 24px; line-height: 1.2; }
.cl-sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.cl-private { margin: 6px 0 0; font-size: 12px; color: var(--off); }
.cl-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.cl-card h2 { margin: 0 0 10px; font-size: 15px; }
.pb-staff { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.pb-count { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.pb-count b { display: block; font-size: 26px; line-height: 1.1; }
.pb-count span { font-size: 13px; color: var(--muted); }

.pb-missing { margin: 0; font-size: 13px; color: var(--muted); }
.pb-body { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; align-items: start; }

.pb-side { display: flex; flex-direction: column; gap: 16px; }

.pb-node { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 8px; align-items: center; width: 100%; text-align: left; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.pb-node.manager { background: var(--active); color: var(--on-active); border-color: var(--active); }
.pb-node.ghost { border-style: dashed; color: var(--muted); cursor: default; }
.pb-node[aria-pressed="true"] { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }

.pb-type { margin: 8px 0 2px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--type); }
.pb-tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }

.pb-posts button[aria-pressed="true"] { background: var(--active); color: var(--on-active); border-color: var(--active); }
.pb-req { list-style: none; margin: 0; padding: 0; }
.pb-req li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.pb-req li::before { content: "✓ "; color: var(--has); }
.pb-req li.proposal::before { content: "? "; color: var(--amber); }
.pb-note { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.pb-resume { display: flex; flex-direction: column; gap: 14px; }
.pb-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
.pb-head h2 { margin: 0; font-size: 22px; }
.pb-head p { margin: 2px 0 0; color: var(--muted); }
.pb-seal { font-weight: 800; letter-spacing: .08em; font-size: 12px; padding: 4px 10px; border: 2px solid currentColor; border-radius: 6px; transform: rotate(-3deg); white-space: nowrap; }
.pb-seal.ok { color: var(--has); } .pb-seal.pdi { color: var(--off); }
.pb-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 16px; margin: 0; font-size: 13px; }
.pb-facts div { display: flex; gap: 6px; } .pb-facts dt { color: var(--muted); } .pb-facts dd { margin: 0; font-weight: 600; }
.pb-section h3 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pb-section ul { margin: 0; padding-left: 18px; }
.pb-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pb-chip { font-size: 12px; padding: 3px 9px; border-radius: 6px; background: var(--soft); border: 1px solid var(--line); }
.pb-src { font-size: 12px; color: var(--muted); font-weight: 400; }
.pb-perf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pb-perf div { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.pb-perf b { display: block; font-size: 20px; } .pb-perf span { font-size: 12px; color: var(--muted); }
.pb-perf .bad b { color: var(--off); }
.pb-pdi { list-style: none; margin: 0; padding: 0; counter-reset: pdi; }
.pb-pdi li { counter-increment: pdi; display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.pb-pdi li::before { content: counter(pdi); width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.pb-pdi li.cleanup::before { background: var(--muted); }
.pb-pdi small { display: block; color: var(--muted); font-size: 12px; }
.pb-empty { margin: 0; color: var(--muted); font-size: 13px; }
.cl-foot { margin: 8px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
/* the two views of a résumé: as a résumé (the paper one) and as a sheet */
.pb-views { display: flex; gap: 6px; justify-content: flex-end; }
.pb-views button { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 12px; }
.pb-views button[aria-pressed="true"] { background: var(--active); color: var(--on-active); border-color: var(--active); }
.pb-cv { --paper: #fffdf8; --chip-bg: #f1ece1; background: var(--paper); border-radius: 16px; padding: 22px 22px 18px; box-shadow: 0 1px 0 var(--line); }
@media (prefers-color-scheme: dark) { .cl:not(.light) .pb-cv { --paper: var(--card); --chip-bg: var(--soft); } }
.pb-cv .pb-head { align-items: center; gap: 14px; }
.pb-cv .pb-who { flex: 1; min-width: 0; }
.pb-av { width: 64px; height: 64px; border-radius: 50%; background: var(--chip-bg); color: var(--ink); display: grid; place-items: center; flex: none; }
.pb-cv h2, .pb-cv .pb-perf b { font-family: Georgia, "Times New Roman", serif; }
.pb-cv .pb-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); font-size: 12.5px; }
.pb-cv .pb-chip { background: var(--chip-bg); border-color: transparent; border-radius: 8px; }
.pb-cv .pb-perf div { background: var(--chip-bg); }
.pb-cv .pb-seal { font-family: Georgia, "Times New Roman", serif; transform: rotate(-4deg); }
@media (max-width: 520px) { .pb-cv .pb-facts { grid-template-columns: 1fr; } .pb-av { width: 48px; height: 48px; } }
.pb-under { display: block; font-size: 11px; font-weight: 400; line-height: 1.3; }
.pb-cv .pb-facts div { align-items: baseline; }
