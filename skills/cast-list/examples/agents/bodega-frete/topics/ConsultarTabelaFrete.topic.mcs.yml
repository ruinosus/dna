mcs.metadata:
  componentName: Consultar Tabela de Frete
  description: "Responde dúvidas sobre frete e entregas com base na tabela publicada no SharePoint."
kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: PerguntaCliente
    description: "A pergunta do cliente sobre frete, prazo ou modalidade de entrega."
    shouldPromptUser: true

modelDescription: "Responde perguntas sobre modalidades de envio, prazos de entrega por região e regras de frete grátis da Bodega Azul."
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: CreateSearchQuery
      id: createSearchQuery_RpdnNx
      userInput: =Topic.PerguntaCliente
      result: Topic.SearchQuery

    - kind: SearchAndSummarizeContent
      id: searchContent_2fpaCR
      autoSend: false
      variable: Topic.SearchResult
      userInput: =Topic.SearchQuery.SearchQuery
      fileSearchDataSource:
        searchFilesMode:
          kind: DoNotSearchFiles

      knowledgeSources:
        kind: SearchSpecificKnowledgeSources
        knowledgeSources:
          - cr7b2_bodegaFrete.knowledge.TabelaFreteEntregas

      applyModelKnowledgeSetting: false
      responseCaptureType: FullResponse

    - kind: SetVariable
      id: setVariable_QoCKRT
      variable: Topic.Resposta
      value: =Topic.SearchResult.Text.Content

inputType:
  properties:
    PerguntaCliente:
      displayName: PerguntaCliente
      description: "A pergunta do cliente sobre frete, prazo ou modalidade de entrega."
      type: String

outputType:
  properties:
    Resposta:
      displayName: Resposta
      description: Resposta fundamentada na base de conhecimento do agente.
      type: String
