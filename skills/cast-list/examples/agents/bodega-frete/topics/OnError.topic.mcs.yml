mcs.metadata:
  componentName: Em caso de erro
  description: Tratamento de erros do agente.
kind: AdaptiveDialog
startBehavior: UseLatestPublishedContentAndCancelOtherTopics
beginDialog:
  kind: OnError
  id: main
  actions:
    - kind: SetVariable
      id: setVariable_cAN26v
      variable: init:Topic.CurrentTime
      value: =Text(Now(), DateTimeFormat.UTC)

    - kind: ConditionGroup
      id: conditionGroup_i5aTx4
      conditions:
        - id: conditionItem_QOqZrK
          condition: =System.Conversation.InTestMode = true
          actions:
            - kind: SendActivity
              id: sendMessage_zATTmv
              activity: |-
                Mensagem de erro: {System.Error.Message}
                Código do erro: {System.Error.Code}
                Id da conversa: {System.Conversation.Id}
                Horário (UTC): {Topic.CurrentTime}

      elseActions:
        - kind: SendActivity
          id: sendMessage_tT7GmP
          activity:
            text:
              - |-
                Ocorreu um erro.
                Código do erro: {System.Error.Code}
                Id da conversa: {System.Conversation.Id}
                Horário (UTC): {Topic.CurrentTime}.
            speak:
              - Ocorreu um erro, por favor tente novamente.

    - kind: LogCustomTelemetryEvent
      id: logTelemetry_GO3Bil
      eventName: BodegaFrete_OnError
      properties: "={Agente: \"bodega-frete\", ErrorMessage: System.Error.Message, ErrorCode: System.Error.Code, TimeUTC: Topic.CurrentTime, ConversationId: System.Conversation.Id}"

    - kind: CancelAllDialogs
      id: cancelAllDialogs_pOGTUv
