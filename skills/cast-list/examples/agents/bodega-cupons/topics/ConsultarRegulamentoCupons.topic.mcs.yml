mcs.metadata:
  componentName: Consultar Regulamento de Cupons
  description: "Responde dúvidas sobre regras de cupons com base no regulamento publicado no SharePoint."
kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: PerguntaCliente
    description: "A pergunta do cliente sobre regras de cupom ou desconto."
    shouldPromptUser: true

modelDescription: "Responde perguntas sobre regras de uso de cupons, validade, valor mínimo de compra e acúmulo de descontos na Bodega Azul."
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: CreateSearchQuery
      id: createSearchQuery_T4bsno
      userInput: =Topic.PerguntaCliente
      result: Topic.SearchQuery

    - kind: SearchAndSummarizeContent
      id: searchContent_0f3HpC
      autoSend: false
      variable: Topic.SearchResult
      userInput: =Topic.SearchQuery.SearchQuery
      fileSearchDataSource:
        searchFilesMode:
          kind: DoNotSearchFiles

      knowledgeSources:
        kind: SearchSpecificKnowledgeSources
        knowledgeSources:
          - cr7b2_bodegaCupons.knowledge.RegulamentoCupons

      applyModelKnowledgeSetting: false
      responseCaptureType: FullResponse

    - kind: SetVariable
      id: setVariable_7GXPBx
      variable: Topic.Resposta
      value: =Topic.SearchResult.Text.Content

inputType:
  properties:
    PerguntaCliente:
      displayName: PerguntaCliente
      description: "A pergunta do cliente sobre regras de cupom ou desconto."
      type: String

outputType:
  properties:
    Resposta:
      displayName: Resposta
      description: Resposta fundamentada na base de conhecimento do agente.
      type: String
