mcs.metadata:
  componentName: Consultar Política de Devoluções
  description: "Responde dúvidas sobre trocas e devoluções com base na política publicada no SharePoint."
kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: PerguntaCliente
    description: "A pergunta do cliente sobre troca, devolução ou reembolso."
    shouldPromptUser: true

modelDescription: "Responde perguntas sobre prazo de arrependimento, condições para troca, etiqueta de devolução e reembolso na Bodega Azul."
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: CreateSearchQuery
      id: createSearchQuery_F3Bce0
      userInput: =Topic.PerguntaCliente
      result: Topic.SearchQuery

    - kind: SearchAndSummarizeContent
      id: searchContent_aJ4s5W
      autoSend: false
      variable: Topic.SearchResult
      userInput: =Topic.SearchQuery.SearchQuery
      fileSearchDataSource:
        searchFilesMode:
          kind: DoNotSearchFiles

      knowledgeSources:
        kind: SearchSpecificKnowledgeSources
        knowledgeSources:
          - cr7b2_bodegaDevolucoes.knowledge.PoliticaTrocasDevolucoes

      applyModelKnowledgeSetting: false
      responseCaptureType: FullResponse

    - kind: SetVariable
      id: setVariable_YkGk0j
      variable: Topic.Resposta
      value: =Topic.SearchResult.Text.Content

inputType:
  properties:
    PerguntaCliente:
      displayName: PerguntaCliente
      description: "A pergunta do cliente sobre troca, devolução ou reembolso."
      type: String

outputType:
  properties:
    Resposta:
      displayName: Resposta
      description: Resposta fundamentada na base de conhecimento do agente.
      type: String
