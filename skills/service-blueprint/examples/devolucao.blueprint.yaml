apiVersion: github.com/ruinosus/dna/v1
kind: ServiceBlueprint
metadata:
  name: Devolução de uma compra online
who: Cliente da loja
about: Do pedido de devolução até o dinheiro de volta. Montado a partir de 10 entrevistas, do fluxo da logística e dos tickets do atendimento.
phases:
  - { id: pedir, name: Pedir }
  - { id: enviar, name: Enviar }
  - { id: receber, name: Receber }
actors:
  - { id: atendimento, name: Atendimento, layer: front }
  - { id: correio, name: Correio, layer: front }
  - { id: logistica, name: Logística, layer: back }
  - { id: financeiro, name: Financeiro, layer: back }
systems:
  - { id: pedidos, name: Sistema de pedidos }
  - { id: transportadora, name: Transportadora (API) }
  - { id: galpao, name: Sistema do galpão }
  - { id: pagamentos, name: Pagamentos }
moments:
  - id: pedir
    phase: pedir
    customer: Pede a devolução em «Meus pedidos»
    feels: 3
    evidence: [Tela de devolução]
    front: [Formulário guiado]
    back: [{ actor: logistica, does: Regra de prazo confere o pedido }]
    support: [pedidos]
  - id: etiqueta
    phase: pedir
    customer: Recebe a etiqueta por e-mail
    feels: 4
    evidence: [E-mail com a etiqueta]
    back: [{ actor: logistica, does: Gera a etiqueta }]
    support: [transportadora]
  - id: postar
    phase: enviar
    customer: Leva o pacote ao correio
    feels: 2
    marks: [wait]
    evidence: [Comprovante de postagem]
    front: [{ actor: correio, does: Atendente recebe o pacote }]
    support: [transportadora]
    pains:
      - { says: Fila de 40 minutos no correio, source: NPS (comentários) }
  - id: esperar
    phase: enviar
    customer: Espera notícia — 6 dias sem nada
    feels: 1
    marks: [fail]
    back: [{ actor: logistica, does: Galpão recebe e confere o pacote }]
    support: [galpao]
    promise: { says: Avisamos quando o pacote chegar }
    pains:
      - { says: Achei que tinham perdido meu pacote, source: 3 de 10 entrevistas }
  - id: reembolso
    phase: receber
    customer: Recebe o dinheiro de volta
    feels: 4
    evidence: [E-mail «seu dinheiro voltou», Extrato]
    front: [E-mail automático]
    back: [{ actor: financeiro, does: Aprova o reembolso }]
    support: [pagamentos]
    promise: { says: O dinheiro volta em até 5 dias úteis, owner: financeiro, within: 5 dias úteis }
actions:
  - { moment: postar, does: Oferecer coleta em casa, owner: logistica, due: 2026-12 }
