mcs.metadata:
  componentName: Consultar Guia de Admissão
  description: "Responde dúvidas sobre a admissão com base no guia publicado no SharePoint."
kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: PerguntaColaborador
    description: "A pergunta do colaborador sobre admissão, documentos ou primeiro dia."
    shouldPromptUser: true

modelDescription: "Responde perguntas sobre as etapas da admissão, os documentos, o exame admissional e o primeiro dia."
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: CreateSearchQuery
      id: createSearchQuery_T4bsno
      userInput: =Topic.PerguntaColaborador
      result: Topic.SearchQuery

    - kind: SearchAndSummarizeContent
      id: searchContent_0f3HpC
      autoSend: false
      variable: Topic.SearchResult
      userInput: =Topic.SearchQuery.SearchQuery
      fileSearchDataSource:
        searchFilesMode:
          kind: DoNotSearchFiles

      knowledgeSources:
        kind: SearchSpecificKnowledgeSources
        knowledgeSources:
          - cr7b2_rhAdmissao.knowledge.GuiaAdmissao

      applyModelKnowledgeSetting: false
      responseCaptureType: FullResponse

    - kind: SetVariable
      id: setVariable_7GXPBx
      variable: Topic.Resposta
      value: =Topic.SearchResult.Text.Content

inputType:
  properties:
    PerguntaColaborador:
      displayName: PerguntaColaborador
      description: "A pergunta do colaborador sobre admissão, documentos ou primeiro dia."
      type: String

outputType:
  properties:
    Resposta:
      displayName: Resposta
      description: Resposta fundamentada na base de conhecimento do agente.
      type: String
