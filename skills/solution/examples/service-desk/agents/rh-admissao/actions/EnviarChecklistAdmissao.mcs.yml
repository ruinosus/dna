mcs.metadata:
  componentName: Enviar checklist de admissão por e-mail
  description: "Envia ao colaborador um e-mail com o checklist de admissão."
kind: TaskDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: To
    description: "Endereço de e-mail do colaborador que vai receber o checklist."
    entity: EmailPrebuiltEntity
    shouldPromptUser: true

  - kind: AutomaticTaskInput
    propertyName: Subject
    description: Assunto do e-mail, curto e em português.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

  - kind: AutomaticTaskInput
    propertyName: Body
    description: Corpo do e-mail em HTML simples, em português, com o resumo do que foi tratado na conversa.
    entity: StringPrebuiltEntity
    shouldPromptUser: false

modelDisplayName: Enviar checklist de admissão por e-mail
modelDescription: "Envia ao colaborador, pelo Outlook, um e-mail com o checklist de admissão e os documentos que faltam. Use somente quando o colaborador pedir."
action:
  kind: InvokeConnectorTaskAction
  connectionReference: cr7b2_rhAdmissao.shared_office365.shared-office365-8a5ef90d-d584-47ca-b2a1-5c87d8fc6ede
  connectionProperties:
    mode: Maker

  operationId: SendEmailV2

outputMode: All
