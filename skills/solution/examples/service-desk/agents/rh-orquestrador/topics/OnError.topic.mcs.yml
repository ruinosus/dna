mcs.metadata:
  componentName: Em caso de erro
  description: Tratamento de erros do agente.
kind: AdaptiveDialog
startBehavior: UseLatestPublishedContentAndCancelOtherTopics
beginDialog:
  kind: OnError
  id: main
  actions:
    - kind: SetVariable
      id: setVariable_RIabDw
      variable: init:Topic.CurrentTime
      value: =Text(Now(), DateTimeFormat.UTC)

    - kind: ConditionGroup
      id: conditionGroup_7KIeB2
      conditions:
        - id: conditionItem_OUWMhQ
          condition: =System.Conversation.InTestMode = true
          actions:
            - kind: SendActivity
              id: sendMessage_oRG6YM
              activity: |-
                Mensagem de erro: {System.Error.Message}
                Código do erro: {System.Error.Code}
                Id da conversa: {System.Conversation.Id}
                Horário (UTC): {Topic.CurrentTime}

      elseActions:
        - kind: SendActivity
          id: sendMessage_gs4KHI
          activity:
            text:
              - |-
                Ocorreu um erro.
                Código do erro: {System.Error.Code}
                Id da conversa: {System.Conversation.Id}
                Horário (UTC): {Topic.CurrentTime}.
            speak:
              - Ocorreu um erro, por favor tente novamente.

    - kind: LogCustomTelemetryEvent
      id: logTelemetry_g4OeHX
      eventName: RhOrquestrador_OnError
      properties: "={Agente: \"rh-orquestrador\", ErrorMessage: System.Error.Message, ErrorCode: System.Error.Code, TimeUTC: Topic.CurrentTime, ConversationId: System.Conversation.Id}"

    - kind: CancelAllDialogs
      id: cancelAllDialogs_BYhsPO
