mcs.metadata:
  componentName: Consultar Política de Férias Copy
  description: "Responde dúvidas sobre férias e ausências com base na política publicada no SharePoint."
kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: PerguntaColaborador
    description: "A pergunta do colaborador sobre férias, folgas, licenças ou o saldo."
    shouldPromptUser: true

modelDescription: "Responde perguntas sobre saldo de férias, períodos aquisitivos, como pedir férias e licenças e o prazo de aprovação do gestor."
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: CreateSearchQuery
      id: createSearchQuery_LQyhy8
      userInput: =Topic.PerguntaColaborador
      result: Topic.SearchQuery

    - kind: SearchAndSummarizeContent
      id: searchContent_O7ySob
      autoSend: false
      variable: Topic.SearchResult
      userInput: =Topic.SearchQuery.SearchQuery
      fileSearchDataSource:
        searchFilesMode:
          kind: DoNotSearchFiles

      knowledgeSources:
        kind: SearchSpecificKnowledgeSources
        knowledgeSources:
          - cr7b2_rhFerias.knowledge.PoliticaFeriasAusencias

      applyModelKnowledgeSetting: false
      responseCaptureType: FullResponse

    - kind: SetVariable
      id: setVariable_f4lXT8
      variable: Topic.Resposta
      value: =Topic.SearchResult.Text.Content

inputType:
  properties:
    PerguntaColaborador:
      displayName: PerguntaColaborador
      description: "A pergunta do colaborador sobre férias, folgas, licenças ou o saldo."
      type: String

outputType:
  properties:
    Resposta:
      displayName: Resposta
      description: Resposta fundamentada na base de conhecimento do agente.
      type: String
