mcs.metadata:
  componentName: Consultar Guia de Benefícios
  description: "Responde dúvidas sobre benefícios com base no guia publicado no SharePoint."
kind: AdaptiveDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: PerguntaColaborador
    description: "A pergunta do colaborador sobre benefícios, dependentes ou reembolso."
    shouldPromptUser: true

modelDescription: "Responde perguntas sobre plano de saúde, plano odontológico, inclusão de dependentes, vale-refeição e reembolso."
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: CreateSearchQuery
      id: createSearchQuery_I91Nu9
      userInput: =Topic.PerguntaColaborador
      result: Topic.SearchQuery

    - kind: SearchAndSummarizeContent
      id: searchContent_9xWTCj
      autoSend: false
      variable: Topic.SearchResult
      userInput: =Topic.SearchQuery.SearchQuery
      fileSearchDataSource:
        searchFilesMode:
          kind: DoNotSearchFiles

      knowledgeSources:
        kind: SearchSpecificKnowledgeSources
        knowledgeSources:
          - cr7b2_rhBeneficios.knowledge.GuiaBeneficios

      applyModelKnowledgeSetting: false
      responseCaptureType: FullResponse

    - kind: SetVariable
      id: setVariable_w9sFTC
      variable: Topic.Resposta
      value: =Topic.SearchResult.Text.Content

inputType:
  properties:
    PerguntaColaborador:
      displayName: PerguntaColaborador
      description: "A pergunta do colaborador sobre benefícios, dependentes ou reembolso."
      type: String

outputType:
  properties:
    Resposta:
      displayName: Resposta
      description: Resposta fundamentada na base de conhecimento do agente.
      type: String
