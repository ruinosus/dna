# from: service-desk.way.yaml@52832ab3
# Derivado de service-desk.way.yaml pelo way-of-working --lens.
# bet: as cenas são um rascunho: reescreva com o que acontece de fato quando este gate diz não.
apiVersion: github.com/ruinosus/dna/v1
kind: IncidentDrill
metadata:
  name: "«Resolvido no primeiro nível?» diz não"
about: "Na véspera da entrega, «Resolvido no primeiro nível?» do fluxo «Central de atendimento» diz não."
clock: "09:00"
impact: "dias de atraso"
call_minutes: 30
roles:
  - { id: cli, name: "Cliente" }
  - { id: at, name: "Atendente", you: true }
  - { id: sup, name: "Supervisor de atendimento", can: [decide-escalar] }
  - { id: esp, name: "Especialista", can: [rework-investigar] }
start: reproved
scenes:
  - id: reproved
    says: "«Resolvido no primeiro nível?» volta «Escalar» para o trabalho que entrega amanhã."
    choices:
      - { label: "Voltar para «Investigar» e refazer", go: redone, minutes: 240, lost: 1, needs: rework-investigar }
      - { label: "Chamar Supervisor de atendimento para entender o que faltou", go: criteria, minutes: 30, calls: sup }
      - { label: "Seguir mesmo assim", go: worse, minutes: 10, lost: 3 }
      - { label: "Avisar quem espera que vai atrasar", go: told, minutes: 15, notifies: true }
  - id: told
    says: "Quem espera já sabe do atraso. O gate continua dizendo não."
    choices:
      - { label: "Voltar para «Investigar» e refazer", go: redone, minutes: 240, lost: 1, needs: rework-investigar }
      - { label: "Seguir mesmo assim", go: worse, minutes: 10, lost: 3 }
  - id: criteria
    says: "Supervisor de atendimento explica o que «Resolvido no primeiro nível?» precisa: nada está escrito; era impressão."
    choices:
      - { label: "Voltar para «Investigar» e refazer", go: redone, minutes: 240, lost: 1, needs: rework-investigar }
      - { label: "Seguir mesmo assim", go: worse, minutes: 10, lost: 3 }
  - id: redone
    says: "«Investigar» é refeito e volta a «Resolvido no primeiro nível?», que diz sim. Um dia de atraso."
    end: resolved
  - id: worse
    says: "Seguiu sem «Resolvido no primeiro nível?»: o problema aparece em «Investigar»."
    end: worse
