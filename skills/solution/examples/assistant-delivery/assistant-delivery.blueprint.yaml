# from: assistant-delivery.way.yaml@98b12ee8
# Derivado de assistant-delivery.way.yaml pelo way-of-working --lens.
# bet: «customer» é o que faz quem recebe o trabalho em cada etapa; o way diz o que o time faz.
# feels e pains ficam de fora: vêm de entrevistas, nunca do way.
format: front-of-house/v1
name: "Entrega de um assistente"
who: "Quem recebe o trabalho"
about: "O fluxo «Entrega de um assistente», visto do lado de quem recebe o trabalho."
phases: ["Descoberta", "Entrega"]
actors:
  - { id: po, name: "Product Owner", layer: front }
  - { id: dev, name: "Desenvolvimento", layer: front }
  - { id: qa, name: "Qualidade", layer: front }
moments:
  - id: triagem
    phase: "Descoberta"
    customer: "Espera «Triagem»: O pedido é para um assistente?"   # bet
    evidence: ["Casos de uso e perguntas de teste"]
    front: [{ actor: po, does: "Triagem" }]
    way: assistant-delivery#triagem
  - id: construcao
    phase: "Entrega"
    customer: "Espera «Construção»: O assistente responde aos casos?"   # bet
    evidence: ["Assistente no ambiente de teste"]
    front: [{ actor: dev, does: "Construção" }]
    way: assistant-delivery#construcao
  - id: avaliacao
    phase: "Entrega"
    customer: "Espera «Avaliação»: Quanto ele acerta?"   # bet
    evidence: ["Acerto nas perguntas de teste"]
    front: [{ actor: qa, does: "Avaliação" }]
    way: assistant-delivery#avaliacao
  - id: publicacao
    phase: "Entrega"
    customer: "Espera «Publicação»: Está no ar para quem pediu?"   # bet
    marks: [wait]
    evidence: ["Assistente liberado para publicar"]
    front: [{ actor: dev, does: "Publicação" }]
    way: assistant-delivery#publicacao
