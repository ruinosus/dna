body { margin: 0; }
.sd *, .sd *::before, .sd *::after { box-sizing: border-box; }

body { margin: 0; }
.sd *, .sd *::before, .sd *::after { box-sizing: border-box; }
.sd button { font: inherit; color: inherit; cursor: pointer; }
.sd :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sd-wrap { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.sd-title { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
.sd-sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

.sd-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sd-tab { padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 13px; }
.sd-tab[aria-selected="true"] { background: var(--active); color: var(--on-active); border-color: var(--active); }
.sd-space { flex: 1; }
.sd-get { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 13px; }
.sd-get:hover, .sd-tab:hover { border-color: var(--muted); }

.sd-look { background: var(--look-bg); border-radius: 10px; padding: 10px 14px; }
.sd-look summary { cursor: pointer; color: var(--look); }
.sd-look h2 { display: inline; margin: 0; font-size: 13px; color: var(--look); letter-spacing: .04em; text-transform: uppercase; }
.sd-look[open] ul { margin-top: 4px; }
.sd-look ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.sd-look button { background: none; border: 0; padding: 2px 0; text-align: left; }
.sd-look button:hover { text-decoration: underline; }

.sd-wrap > * { min-width: 0; }
.sd-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 1600px) { .sd-body { grid-template-columns: minmax(0, 1fr) 300px; } }
.sd-main { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.sd-boardwrap { position: relative; min-width: 0; }
.sd-board { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow-x: auto;
  scrollbar-width: thin; scrollbar-color: var(--muted) transparent; }
/* a scrollbar that stays visible where the system hides it until you scroll (macOS) */
.sd-board::-webkit-scrollbar { height: 10px; }
.sd-board::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; border: 2px solid var(--card); }
.sd-board::-webkit-scrollbar-thumb:hover { background: var(--muted); }
/* more to the right: the edge fades and a line says so */
.sd-boardwrap::after { content: ""; position: absolute; top: 1px; right: 1px; bottom: 1px; width: 56px; border-radius: 0 12px 12px 0;
  background: linear-gradient(to right, transparent, var(--card)); pointer-events: none; opacity: 0; transition: opacity .15s; }
.sd-more { display: none; position: absolute; right: 14px; bottom: 8px; margin: 0; padding: 2px 10px; border-radius: 999px;
  background: var(--active); color: var(--on-active); font-size: 12px; pointer-events: none; z-index: 2; }
.sd-overflow::after { opacity: 1; }
.sd-overflow .sd-more { display: block; }
.sd-grid { position: relative; display: grid; gap: 8px 16px; align-items: start; background: var(--card); }
/* the arrows between the stages, under the cards */
.sd-wires { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; color: var(--muted); z-index: 0; }
.sd-wires path { fill: none; stroke: currentColor; stroke-width: 1.6; opacity: .8; }
.sd-wires path.on { color: var(--focus); stroke: var(--focus); opacity: 1; stroke-width: 2; }
.sd-grid > :not(.sd-wires) { position: relative; z-index: 1; }
.sd-legend { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12px; }
.sd-legend span { display: inline-flex; align-items: center; gap: 6px; }
.sd-legend svg { color: var(--muted); }
.sd-lg-gate { width: 10px; height: 10px; transform: rotate(45deg); border: 2px solid var(--gate); background: var(--gate-bg); }
.sd-lg-look { width: 9px; height: 9px; border-radius: 50%; background: var(--look); }
.sd-lg-opt { width: 18px; height: 10px; border: 1.5px dashed var(--muted); border-radius: 3px; }
.sd-phase { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.sd-lane { font-size: 13px; font-weight: 700; padding-top: 8px; }
.sd-lane small { display: block; font-weight: 400; color: var(--muted); }
.sd-cell { display: flex; flex-direction: column; gap: 6px; min-height: 64px; border-top: 1px dashed var(--line); padding-top: 6px; }
.sd-stage { position: relative; text-align: left; background: var(--card); border: 1.5px solid var(--lane); border-radius: 8px; padding: 8px 10px; box-shadow: 0 1px 0 rgba(0, 0, 0, .05); }
.sd-stage b { display: block; font-size: 13px; line-height: 1.3; }
.sd-stage span { display: block; color: var(--muted); font-size: 12px; }
.sd-stage .sd-where { color: var(--look); font-size: 11px; }
.sd-stage.optional { border-style: dashed; }
.sd-stage.flag::after { content: ""; position: absolute; top: -4px; right: -4px; width: 9px; height: 9px; border-radius: 50%; background: var(--look); }
.sd-gate { display: flex; align-items: flex-start; gap: 7px; background: none; border: 0; padding: 0 2px; text-align: left; font-size: 12px; color: var(--gate); }
.sd-gate i { flex: none; margin-top: 3px; width: 12px; height: 12px; transform: rotate(45deg); border: 2px solid var(--gate); background: var(--gate-bg); }
.sd-gate.flag i { border-style: dashed; }
.sd-gate em { display: block; font-style: normal; color: var(--muted); }
.sd-gate span { min-width: 0; }
/* the gate again in the lane of whoever approves it */
.sd-approve { opacity: .9; }
.sd-approve i { background: var(--card); border-style: solid; }
.sd-gate .sd-also { display: block; color: var(--muted); font-size: 11px; }
.sd-gate .sd-where, .sd-approval .sd-where { color: var(--look); }
.sd-approval { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; padding: 3px 0; border-top: 1px solid var(--line); }
.sd-approval:first-child { border-top: 0; }
/* the condition on its own line under the role, so a narrow card never squeezes it into a column of single words */
.sd-approval .sd-where, .sd-approval .sd-muted { flex-basis: 100%; font-size: 12px; }
.sd-muted { color: var(--muted); }
.sd-picked { outline: 2.5px solid var(--focus); outline-offset: 2px; }
.sd-linked { box-shadow: 0 0 0 3px var(--link-bg); }
.sd-chip { display: inline-block; margin: 1px 4px 1px 0; padding: 1px 8px; border-radius: 999px; background: var(--link-bg); color: var(--link); font-size: 12px; line-height: 1.6; }
.sd-chip.out { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.sd-chip.miss { background: var(--look-bg); color: var(--look); }
.sd-outs { margin: 0; padding: 0; list-style: none; }
.sd-outs li { color: var(--out); }
.sd-list { margin: 0; padding: 0; list-style: none; }
.sd-to { color: var(--muted); font-size: 12px; }
.sd-to.miss { color: var(--look); }
.sd-link { background: none; border: 0; padding: 0; font-weight: 700; text-align: left; }
.sd-link:hover { text-decoration: underline; }
.sd-stages tr.gate td { background: var(--gate-bg); }
.sd-stages tr.gate .sd-link { color: var(--gate); }
.sd-stages td { white-space: normal; }

.sd-detail { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.sd-kicker { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sd-detail h3 { margin: 0; font-size: 18px; line-height: 1.3; }
.sd-detail { min-width: 0; }
.sd-detail dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 10px; font-size: 13px; }
.sd-detail dt { font-weight: 700; }
.sd-detail dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.sd-detail p { margin: 0; color: var(--muted); font-size: 13px; }
.sd-detail .sd-gate-name { color: var(--gate); }

.sd-table { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.sd-table table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.sd-table th, .sd-table td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; white-space: pre-line; }
.sd-table th { position: sticky; top: 0; background: var(--soft); font-weight: 700; }
.sd-table td.c { text-align: center; }
.sd-table td.b { font-weight: 700; }
.sd-table .lane { color: #1d2330; }

@media (max-width: 720px) {
  .sd { padding: 14px 16px 32px; }
}
