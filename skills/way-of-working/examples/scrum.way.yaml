apiVersion: github.com/ruinosus/dna/v1
kind: WayOfWorking
metadata:
  name: Scrum team
lanes:
  - id: product
    name: Product
    color: prod
  - id: team
    name: Development team
    color: tech
roles:
  - id: po
    acronym: PO
    name: Product Owner
    lane: product
  - id: sm
    acronym: SM
    name: Scrum Master
    lane: team
  - id: dev
    acronym: DEV
    name: Developers
    lane: team
phases:
  - id: backlog
    name: Backlog
  - id: sprint
    name: Sprint
  - id: after
    name: After the sprint
stages:
  - id: capture
    name: Capture
    phase: backlog
    lane: product
    roles:
      - po
    question: Who asked for it, and why?
    outputs:
      - id: item
        name: Backlog item with its why
    inputs:
      - name: Requests from users and stakeholders
    metrics:
      - Items captured per sprint
  - id: refine
    name: Refine
    phase: backlog
    lane: team
    roles:
      - dev
      - po
    question: Do we understand it well enough to size it?
    outputs:
      - id: criteria
        name: Acceptance criteria
      - id: estimate
        name: Estimate
    inputs:
      - from: item
    metrics:
      - "% of items ready before planning"
  - id: build
    name: Build
    phase: sprint
    lane: team
    roles:
      - dev
      - sm
    question: Does it meet the acceptance criteria?
    outputs:
      - id: increment
        name: Increment that works
    activities:
      - id: pairing
        name: Code review by a second developer
        required: true
    wip: 3
    inputs:
      - from: ready-item
    metrics:
      - Cycle time
  - id: accept
    name: Accept
    phase: sprint
    lane: product
    roles:
      - po
    question: Is it what was asked?
    outputs:
      - id: accepted
        name: Item accepted
    inputs:
      - from: increment
      - from: criteria
    metrics:
      - "% accepted at first review"
  - id: release
    name: Release
    phase: after
    lane: team
    roles:
      - dev
    question: Is it in the hands of users?
    outputs:
      - id: notes
        name: Release notes
    inputs:
      - from: done-item
    metrics:
      - Release frequency
  - id: measure
    name: Measure the outcome
    phase: after
    lane: product
    roles:
      - po
    question: Did it change what we hoped?
    outputs:
      - id: outcome
        name: The number two weeks later
        kpi: true
    inputs:
      - from: notes
    metrics:
      - Outcome against target
gates:
  - id: ready
    after: refine
    name: Ready for a sprint?
    approver: dev
    results:
      - id: ok
        label: Ready
        ok: true
      - id: no
        label: Not yet
    criteria:
      - kind: outputs
        outputs:
          - criteria
          - estimate
    on_fail: refine
    metrics:
      - "% ready at first review"
    outputs:
      - id: ready-item
        name: Item ready for a sprint
  - id: done
    after: accept
    name: Done?
    approver: po
    results:
      - id: ok
        label: Done
        ok: true
      - id: no
        label: Back to build
    criteria:
      - kind: outputs
        outputs:
          - increment
          - accepted
      - kind: activities
        stage: build
    on_fail: build
    metrics:
      - Items done per sprint
    outputs:
      - id: done-item
        name: Done item
rituals:
  - id: planning
    name: Sprint planning
    cadence: every sprint
    who: [po, sm, dev]
    question: What do we take into this sprint, and how?
    inputs: [Items ready for a sprint]
    outputs: [Sprint goal, Sprint backlog]
    stage: build
  - id: daily
    name: Daily scrum
    cadence: daily, 15 min
    who: [dev]
    question: What blocks the sprint goal today?
    outputs: [Today's plan]
    stage: build
  - id: review
    name: Sprint review
    cadence: every sprint
    who: [po, dev]
    question: What did we build, and what comes next?
    outputs: [Accepted items, Backlog adjusted]
    gate: done
  - id: retro
    name: Retrospective
    cadence: every sprint
    who: [po, sm, dev]
    question: What do we change in how we work?
    outputs: [One or two improvements]
agreements:
  - id: dod
    text: An item is done only when it meets the Definition of Done
    who: all
    why: so "done" means the same to everyone
    check: the Done? gate's criteria
  - id: wip
    text: Finish before starting something new
    who: [dev]
    why: work in progress hides problems
    check: the build stage's limit
  - id: po-decides
    text: Only the Product Owner orders the backlog
    who: [po]
    why: one voice for what comes first
