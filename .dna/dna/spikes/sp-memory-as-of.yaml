  body: |
    # Tempo de transação + leitura as-of

    **Origem:** `Research/rsh-semantica-agi-avaliacao` (scope `dna-cloud`), finding
    `f-lacuna-tempo-de-transacao-e-as-of` — a lacuna nº 1 das sete, e a única que
    fecha sem dependência nova. Referência de desenho lida e **descartada**:
    `semantica/kg/temporal_query.py` (`query_at_time` / `reconstruct_at_time`).
    Pegamos a forma da API, não o pacote.

    ## Critério de sucesso (do fundador)

    > Escrever uma memória, supersedê-la, e recuperar o estado de crença anterior.

    **PASSOU.** `packages/sdk-py/tests/test_memory_as_of.py::test_the_founders_criterion`
    — e a asserção é sobre a crença ANTIGA (`"we run postgres 14"` reaparece sob
    `as_of=T-1` e some sob o recall de hoje), não sobre a forma da resposta.

    ## O que a investigação achou ANTES de codar

    1. **Não precisa de coluna nova.** `dna_versions.created_at` é o tempo de
       transação desde a revisão 0001, e `content` guarda o **envelope inteiro** por
       escrita — não um diff, não um ponteiro. O estado de crença já estava em disco;
       ninguém lia. Custo real: um método de leitura, um parâmetro e duas recusas.
       **Zero migrations.**
    2. **`now=` NUNCA foi a resposta.** O `recall` já aceitava `now`, e é fácil
       confundir com o que se pediu. `now` desloca o filtro de `valid_to` (tempo de
       MUNDO) e continua devolvendo o spec de HOJE para cada hit. Uma nota escrita
       hoje sobre o ano passado é válida no ano passado e acreditada hoje: os dois
       eixos discordam por construção. `test_now_is_not_as_of` é o teste que teria
       pego a gente entregando o primeiro dizendo ser o segundo.
    3. **Dois lugares onde a resposta fácil seria uma invenção.** O adapter de
       filesystem declara `versions=True` e **não guarda histórico nenhum**
       (`list_versions` → `[]`); e o `VERSION_CHURN_RETENTION` corta o Engram em 3
       versões (o hook engrafia reescreveu o MESMO Engram 6.613×). Nos dois casos,
       devolver o estado atual sob um timestamp passado seria um passado fabricado
       com cara de resposta real.

    ## O que foi entregue

    | camada | o quê |
    |---|---|
    | store | `SqlAlchemySource.load_one_as_of` — a versão mais nova com `created_at <= as_of`, precedência overlay→base igual à do `load_one` |
    | capability | `SourceCapabilities.as_of_reads` — separada de `versions` de propósito: a face precisa poder RECUSAR antes de ler |
    | core | `dna/memory/as_of.py` — `AsOfResolution` / `AsOfUnsupported` / `normalize_as_of` / `resolve_as_of` |
    | verbo | `recall(..., as_of=)` e `list_memories_impl(..., as_of=)` |
    | faces | REST `GET /v1/memories/search?as_of=` e `GET /v1/memories?as_of=` (501 sem histórico, 422 em timestamp inválido); MCP `recall(as_of=)` |
    | doc | `docs/concepts/search-and-memory.md` — a promessa de "reconstrução point-in-time" era aspiracional; agora os dois eixos estão nomeados e ela é verdadeira |

    ## As três invariantes de honestidade

    1. **Store sem histórico RECUSA** (`AsOfUnsupported` -> 501). Não aproxima.
    2. **"Sem registro" não é "sem memória".** Histórico podado além do `as_of` volta
       NOMEADO em `as_of_truncated` — nunca sumido em silêncio, nunca preenchido com
       o spec de hoje.
    3. **Leitura histórica não escreve.** `reconsolidate` é forçado a `False` sob
       `as_of` — e não é só filosofia: reconsolidar podaria a própria história que a
       leitura está lendo.

    ## Retrocompat

    Sem `as_of`, comportamento idêntico ao de hoje — asserido, não presumido
    (`test_without_as_of_nothing_changes`: mesmos hits, nenhuma chave `as_of` no
    envelope, reconsolidação ainda ligada).

    ## Testes

    14 novos, todos verdes. Sobre `SqlAlchemySource`/sqlite — o MESMO adapter que
    roda em postgres, sem precisar de postgres. A suíte completa do `sdk-py` fica em
    4.959 passando, com as mesmas 36 falhas pré-existentes da baseline (extra
    `langchain` ausente no ambiente, sem relação).

    ## O que fica em aberto, de propósito

    - **O teto de 3 versões do Engram** continua de pé. Ele existe por um motivo real
      e puxá-lo é decisão de produto com preço de armazenamento — o spike o EXPÕE
      (`as_of_truncated`) em vez de decidir sozinho.
    - **Recall as-of parte dos documentos que existem HOJE.** Uma memória
      hard-deletada desde então não ressuscita. O `forget` é demoção bi-temporal e
      nunca hard-deleta, então o ciclo de vida da memória está coberto; um
      `delete_document` manual não está.
    - **O índice de busca não tem eixo temporal.** Os candidatos vêm do índice atual
      e só depois são resolvidos as-of.
