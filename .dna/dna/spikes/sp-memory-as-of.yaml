  findings: 'CRITERIO DO FUNDADOR: PASSOU. test_memory_as_of.py::test_the_founders_criterion escreve um Engram, supersede-o (forget -> valid_to + superseded_by_memory), e recupera o estado de crenca anterior via recall(as_of=T-1); a assercao e sobre a CRENCA ANTIGA (''we run postgres 14'' reaparece sob as_of e some no recall de hoje), nao sobre a forma da resposta. (1) NAO precisou de coluna nova nem de migration: dna_versions.created_at ja e o tempo de transacao desde a revisao 0001, e a coluna content guarda o ENVELOPE INTEIRO por escrita (nao um diff, nao um ponteiro), entao o estado de crenca ja estava em disco e ninguem lia. O custo foi um metodo de leitura no adapter, um parametro no recall e duas recusas. (2) O parametro now= que ja existia NUNCA respondeu a pergunta, e essa e a armadilha: now desloca o filtro de valid_to (tempo de MUNDO) e continua devolvendo o spec de HOJE para cada hit. Uma nota escrita hoje sobre o ano passado e valida no ano passado e acreditada hoje - os dois eixos discordam por construcao. test_now_is_not_as_of e o teste que teria pego a entrega do primeiro dizendo ser o segundo. (3) Havia DOIS lugares onde a resposta facil seria uma invencao. O FilesystemWritableSource declara versions=True e nao guarda historico nenhum (list_versions retorna []); e o VERSION_CHURN_RETENTION corta o Engram em 3 versoes (o hook engrafia reescreveu o MESMO Engram 6.613 vezes). Nos dois casos, devolver o estado atual sob um timestamp passado seria um passado fabricado com cara de resposta real - por isso o store sem historico RECUSA (AsOfUnsupported -> HTTP 501) e o historico podado volta NOMEADO em as_of_truncated. (4) Leitura historica nao escreve: reconsolidate e forcado a False sob as_of, e nao e so filosofia - reconsolidar podaria a propria historia que a leitura esta lendo. ENTREGUE: SqlAlchemySource.load_one_as_of; SourceCapabilities.as_of_reads (separada de versions de proposito, para a face poder recusar ANTES de ler); dna/memory/as_of.py (AsOfResolution / AsOfUnsupported / normalize_as_of / resolve_as_of); recall(as_of=) e list_memories_impl(as_of=); REST GET /v1/memories/search?as_of= e GET /v1/memories?as_of= (501 sem historico, 422 em timestamp invalido); MCP recall(as_of=); e docs/concepts/search-and-memory.md, onde a promessa de ''reconstrucao point-in-time'' era aspiracional e agora e verdadeira com os dois eixos nomeados. TESTES: 14 novos, todos verdes, sobre SqlAlchemySource/sqlite - o MESMO adapter que roda em postgres, sem precisar de postgres. Suite completa do sdk-py: 4.959 passando, com as mesmas 36 falhas pre-existentes da baseline (extra langchain ausente no ambiente, sem relacao). RETROCOMPAT asserida, nao presumida: test_without_as_of_nothing_changes prova mesmos hits, nenhuma chave as_of no envelope e reconsolidacao ainda ligada quando as_of e omitido.'
  recommendation: 'Merjar. A lacuna n.1 das sete da Research/rsh-semantica-agi-avaliacao fecha por conta propria e sem dependencia nova, entao o argumento para adotar o semantica-agi cai de oito lacunas para sete - e as sete restantes sao INGESTAO e GRAFO, que e decisao de produto (''queremos ser um KG?''), nao de biblioteca. TRES PONTAS DEIXADAS ABERTAS DE PROPOSITO, cada uma com dono: (a) o teto de 3 versoes do Engram (VERSION_CHURN_RETENTION) continua de pe - ele existe por um motivo real (175k snapshots de um hook so) e puxa-lo e decisao de produto com preco de armazenamento; o spike o EXPOE via as_of_truncated em vez de decidir sozinho. Se o as-of virar superficie de produto, essa e a primeira conversa. (b) o recall as-of parte dos documentos que existem HOJE: uma memoria hard-deletada desde entao nao ressuscita. O forget e democao bi-temporal e nunca hard-deleta, entao o ciclo de vida da memoria esta coberto - um delete_document manual nao esta. (c) o indice de busca nao tem eixo temporal: os candidatos vem do indice atual e so depois sao resolvidos as-of, entao uma memoria cujo texto mudou muito pode nao entrar na lista de candidatos. PROXIMO ROUBO da mesma pesquisa, se houver apetite: rec-conflict-detector-como-conceito - o DNA registra supersessao mas nunca DETECTA contradicao, e a fronteira de escrita (onde os hooks de veto ja moram) e o lugar certo para isso.'
