spec:
  title: Reorg das faces DNA (CLI/MCP/REST catchall → hexagonal)
  question_to_answer: Como reorganizar as faces do DNA (CLI + MCP + REST) que hoje estão todas empacotadas em packages/cli, extraindo a camada de aplicação _impl e deixando cada face um adapter fino?
  status: in-progress
