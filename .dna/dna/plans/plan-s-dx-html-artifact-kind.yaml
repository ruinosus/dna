  body: |
    # Plan — s-dx-html-artifact-kind

    ## Goal
    Add a first-class **HtmlArtifact** bundle Kind that stores an HTML page as a
    work-item output, linkable via `produces[]`. Dogfood by storing the epic
    `e-dna-dx` design doc as `ha-e-dna-dx-design`.

    ## Design — bundle format
    Mirror the Soul bundle mechanic (SOUL.md + soul.json), byte-faithful on the
    primary marker:
    - `<name>/ARTIFACT.html` — the raw HTML, written **verbatim** (round-trip
      byte-identical; no frontmatter injection).
    - `<name>/artifact.json` — structured metadata companion:
      `{title, description, source, created_at}` (canonical JSON, like soul.json).

    Spec model: `HtmlArtifactSpec{ html: str, artifact_json: dict|None }`.
    `metadata.description` promoted from `artifact_json.description` on read for
    search/listing; elided on write when derivable (F3 market-fidelity pattern).

    Record plane (an artifact produced by a work item, not composition):
    `plane="record"`, `is_prompt_target=False`, permissive tenancy (no `scope`),
    `scope_inheritable=True` (like Research). Alias GENERATED = `sdlc-html-artifact`
    (owner sdlc + kebab(HtmlArtifact)); never typed by hand.

    ## Steps
    1. **Model** — `HtmlArtifactSpec`/`TypedHtmlArtifact` in `models.py`; Zod
       `HtmlArtifactSpecSchema`/`HtmlArtifactSchema` in `models.ts`.
    2. **Kind + reader/writer** — register in the sdlc extension (Py `__init__.py`
       + TS `sdlc.ts`), custom `HtmlArtifactReader`/`HtmlArtifactWriter` mirroring
       Soul's reader/writer (detect ARTIFACT.html; verbatim html; artifact.json
       companion). `kernel.kind/reader/writer`.
    3. **Parity registry** — add `sdlc-html-artifact` to
       `sdk-ts/kind-registry-parity.json` `ts_aliases`.
    4. **Round-trip tests** — `test_html_artifact_roundtrip.py` (py) +
       `html-artifact-roundtrip.test.ts` proving byte-faithful HTML round-trip and
       metadata preservation; plus registry-parity stays green.
    5. **CLI** — friendly `dna sdlc artifact create <name> --from <file.html>
       [--title --description --source]` that reads the file and writes the doc via
       `kernel.write_document`; `artifact show/list` for symmetry.
    6. **Docs** — prose for the Kind in `docs/reference/kinds/` + `docs/reference/cli/sdlc.md`;
       CHANGELOG `[Unreleased]`. `mkdocs build --strict` green.
    7. **Dogfood** — create `ha-e-dna-dx-design` from the design HTML;
       `produces add Epic/e-dna-dx HtmlArtifact/ha-e-dna-dx-design`; prove
       `produces list` resolves it.
    8. **Gates** — sdk-py, sdk-ts + typecheck, cli suites; brand/docs-coverage/drift
       guards; mkdocs strict. TestGuide(--product) + TestRun before done. PR via
       `story pr --base main`. Do NOT merge.
