  body: |
    # Plan — s-memory-conformance-kit

    ## Problema
    Follow-up nomeado do PR #38: existem kits públicos de conformance pra SourcePort
    (`source_conformance_suite`), Reader/Writer (`reader_writer_conformance_suite`) e
    RecordSearchProvider (`record_search_conformance_suite` / `recordSearchConformanceSuite`),
    mas NÃO pra memória. Quem implementa um RecordSearchProvider/EmbeddingPort custom não
    consegue provar que os verbos de memória funcionam sobre ele; quem evolui o scoring
    não tem bateria pública de regressão semântica.

    ## Invariantes pinados (derivados do código real em dna/memory/*)

    ### Kit kernel-bound (Py-only — os verbos são Py-only por fronteira declarada)
    1. **remember→recall roundtrip + enrichment**: memory_type classificado, encoding_context
       estampado (idempotente, nunca sobrescreve), valid_from semeado; recall acha o doc.
    2. **recall determinístico**: mesmo `now` + `reconsolidate=False` + embedder determinístico
       → duas chamadas retornam hits idênticos (nomes + scores).
    3. **ranking relativo**: doc que compartilha o vocabulário do cue > doc sem overlap
       (asserção RELATIVA, vale pra fake e embedder real — mesma filosofia do search kit).
    4. **semantic on/off**: `semantic=False` → shape base intacto (sem rank_recall/semantic/
       score_recall); com provider registrado, modo auto → `semantic=True` + anotações RRF.
       Capability-aware: sem provider, o caso valida o ramo degraded/lexical.
    5. **forget bi-temporal**: seta valid_to, NUNCA hard-delete (get_document ainda acha),
       recall nunca ressuscita, idempotente (valid_to original preservado), superseded_by gravado.
    6. **reconsolidação**: recall(reconsolidate=True) → cues_history append (actor+cue),
       surface_count+1, confidence bump ≤ 10.
    7. **consolidate idempotente**: report-only não arquiva; apply=True soft-forgets;
       segundo pass não re-avalia os já invalidados (evaluated cai, archived=0).
    8. **decay monotônico em tempo simulado**: recall a now1 (reconsolida → last_surfaced=now1),
       depois recalls a now2<now3 com reconsolidate=False → retention(now3) < retention(now2) < 1.
    9. **backfill lazy idempotente** (requires provider): remember(index=False) → backfill_index
       > 0 → segunda chamada == 0 (hash-skip) → recall híbrido acha.

    ### Kit pure-scoring (Py + TS twin 1:1 — mesmo estilo do parity core)
    10. **cosine_tracks_similarity** (embedder do autor): cos(paráfrase) > cos(não-relacionado).
    11. **ecphory_weights_and_threshold** (scores injetados, exato): area exata = content_weight;
        Path 3 = cosine_weight×cos; primary = MAX dos paths; abaixo de direct_threshold é excluído.
    12. **ecphory_deterministic_ordering**: score desc, name asc; rerun idêntico.
    13. **semantic_hook_lifts_paraphrase**: sem semantic_scores o cue-match não acha a paráfrase;
        com scores do embedder o alvo surge (e acima do decoy se ambos presentes).
    14. **fusion_preserves_and_annotates** (RRF exato): nenhum candidato some; anotações
        rank_recall/rank_ecphory/score_recall/semantic; score fundido = Σ 1/(k+rank).
    15. **decay_retention_monotonic**: R(0)=1, estritamente decrescente, recall_bump capado
        em max_stability_days.
    16. **bitemporal_fail_open**: currently_valid — unset/futuro/lixo → True; passado → False.

    ## Superfície pública (copy canonical pattern — mesmo estilo dos kits atuais)
    Py `dna.testing.memory_conformance` (re-exportado em `dna.testing`):
    - `MEMORY_FIXTURE_SCOPE`, `fixture_memories()`
    - `MemoryCaseNotApplicable` (SkipTest — pytest reporta skip)
    - `memory_conformance_suite(kernel_factory)` → `list[MemoryConformanceCase]`;
      factory async → `(kernel, cleanup)`; kernel com source GRAVÁVEL (+ provider opcional).
      Caso fresh por execução, cleanup sempre awaited.
    - `run_memory_conformance(kernel_factory)` → `MemoryConformanceReport` (runner programático)
    - `memory_scoring_conformance_suite(embedder_factory=None)` + `run_memory_scoring_conformance`
      (puro; default = fake floor determinístico)

    TS `dna-sdk/testing`:
    - `memoryScoringConformanceSuite(embedderFactory?)` — espelho SÓ do core puro (casos 10–16,
      nomes idênticos aos do Py). Verbos NÃO existem no TS; fronteira documentada.

    ## Consumo interno (kit × builtins)
    - `tests/test_memory_conformance_kit.py`: (a) kernel FS sem provider; (b) FS + sqlite-vec
      (importorskip search-sqlite); scoring kit com fake default + embedder custom trivial.
    - `tests/test_pgvector_memory_conformance.py`: requires_postgres + schema descartável
      `dna_search_ci_<uuid>` — mesma integração do job `postgres` do CI (pgvector/pgvector:pg16).
    - TS `tests/memory-scoring-conformance.test.ts`.

    ## Docs
    Seção "The memory conformance kit" em `docs/getting-started/conformance-kit.md` (a casa
    dos kits) + ponteiro em `docs/guides/semantic-recall.md`. Sem novo CLI group/Kind → sem
    mudança no docs_coverage_guard. Referências geradas: re-gerar se drift.

    ## Smoke de produto (consumidor externo)
    Projeto scratch FORA do repo: venv própria + `pip install -e packages/sdk-py`; implementa
    um RecordSearchProvider fake in-memory de fora e roda `run_memory_conformance` +
    `run_memory_scoring_conformance` — prova a API pública de fora. TestGuide `--product` + TestRun.

    ## Gates
    sdk-py full + sdk-ts (bun test + typecheck) + cli + brand_guard + docs_coverage_guard +
    mkdocs --strict verdes; PR via `dna sdlc story pr`, CI 11/11; NÃO mergear.
