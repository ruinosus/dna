  body: |-
    ## dna sdlc gallery — painel board-native dos HtmlArtifacts

    ### Tese
    Mata o gap de UX 'publico artifacts soltos no chat e o dono tem que caçar'. O digest mostra EVENTOS (o que aconteceu); o gallery mostra os ARTEFATOS VISUAIS pra revisar (HtmlArtifacts), agrupados pelo status do work item que os produziu — board-native, sempre atual.

    ### Arquitetura (espelha o digest)
    - Módulo PURO `dna_cli/_gallery.py` (build_gallery) — testável sem kernel. Reverse-index: p/ cada work item resolve_work_item_outputs → mapa HtmlArtifact→work item + status. Agrupa em buckets: needs_review (Story review/draft PR), decisions (ADR), shipped (terminal), in_progress, unlinked.
    - Comando impuro `dna sdlc gallery [--html <out>] [--open] [--scope] [--json]` em sdlc_cmd.py: sessão kernel, gh PRs, render texto + gerador HTML self-contained (estilo retrospectivo do digest).
    - published_url: campo em artifact_json (additionalProperties), exposto no summary do HtmlArtifact (Py+TS parity) + opção --published-url no artifact create.

    ### Fases
    1. published_url no HtmlArtifact.summary (Py+TS) + --published-url no create
    2. _gallery.py puro + test_gallery.py
    3. comando gallery (texto + --html + --open) + help distinguindo do digest
    4. registrar os 5 protótipos como HtmlArtifacts + produces/cite
    5. marketplace.json + RECOMMENDED-SKILLS.md
    6. docs (guia gallery + distinção) + CHANGELOG + gates verdes + TestGuide/TestRun + PR
