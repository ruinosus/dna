  body: 'Evoluir o copiloto de batch (só no encerramento) pra revisão contínua. BACKEND (session.js): loop de live-review com setInterval configurável enquanto phase=capturando, chamando o módulo de conduta sobre a transcrição INTEIRA + prontuário; novas msgs WS (coverage update, config interval/auto, review-now). Categorizar sugestões em coberto vs pendente. FRONTEND (src/web): painel de cobertura do protótipo aprovado (anel N/M, grupos a-revisar/conduzido, controles auto+intervalo+revisar-agora, countdown, nota contexto-inteiro). Manter atrás de CONDUCT_MODULE_ENABLED. TDD por peça. Branch feat/live-review off feat/regulated-split, commit por fase.'
