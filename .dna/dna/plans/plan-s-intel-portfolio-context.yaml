  body: 'Fundação da extension ''intel'' no SDK (Py↔TS parity), copiando o padrão da extension ''cloud''. Cria dna/extensions/intel (Py: __init__.py IntelExtension + kinds/*.kind.yaml) + src/extensions/intel (TS twin byte-idêntico) com 2 descriptors: (1) IntelSource (alias intel-source) — a watchlist/portfolio, TENANTED, plane record, container intel-sources: {name,type[repo|scope|external],uri,cadence,threshold,pirs[],muted}; (2) Insight (alias intel-insight) — a unidade de disseminação que ranker/digest/dedup TODOS referenciam, TENANTED, record, container insights: {title,fact,why,action,score,source_ref,pirs[],citations[],state[new|actioned|dismissed|snoozed],evidence_rating,created_at}. TENANTED (não-inheritable) pela máxima herdável⇒nunca-TENANTED. Registra via entry-point pyproject + registry TS. Guards: descriptor-hash-parity, ratchet (atualiza contagem), strict-schema-lint (additionalProperties:false), docs-coverage (prosa em builtin-kinds). Insight co-construído aqui = decisão narrada (é a fundação compartilhada).'
