  body: |
    # Plan — s-memory-semantic-recall

    ## Estado verificado no código (não de cor)
    - `recall` (dna/memory/verbs.py) já retrieva via `kernel.search` → provider híbrido (dense sqlite-vec + FTS5 + RRF) quando registrado, e re-pontua LessonLearned por retention (Ebbinghaus) × affect. `remember` já indexa no write (`_index_doc` → provider.index → kernel.embed).
    - PORÉM o ranking ecphory (`run_ecphory`/`score_engram`) — o scoring cue-based de memória com o Path 3 semântico (`semantic_scores`, `cosine_weight=0.61`, `direct_threshold=0.30`) — é código morto no fluxo de recall: nada o chama, nada alimenta `semantic_scores`. policy.py admite: "inert unless a caller feeds semantic_scores".
    - TS não tem verbs (fronteira documentada em src/memory/index.ts: verbs são kernel-bound, Py-only); o core puro é twin 1:1 com fixture memory-scoring-parity.json gerada por packages/sdk-py/scripts/gen_memory_parity.py.

    ## Design (mínimo, usa o que o código já pratica)
    1. **Core puro novo** `dna/memory/semantic.py` + `src/memory/semantic.ts` (paridade 1:1):
       - `cosine_similarity(a,b)` / `cosineSimilarity` — determinístico, ordem de ops fixa.
       - `semantic_scores_from_vectors(names, vectors, query_vector)` → {name: max(0, cos)}.
       - `fuse_semantic_recall(hits, engrams, query, semantic_scores, policy, now)` — roda o `run_ecphory` EXISTENTE com `semantic_scores` alimentado (ativa o score-blend Path 3 que o código já tem) e funde o ranking de recall existente com o ranking direct do ecphory via `reciprocal_rank_fusion` EXISTENTE (o mesmo RRF do search). Hits anotados: `score` = RRF fundido, `score_recall` (anterior), `semantic` (cosine), `rank_recall`, `rank_ecphory`.
    2. **Verbo** `recall(..., semantic: bool | None = None)` (Py): auto (None) = ativo sse provider registrado; True força (embed tem floor fake); False desliga. Ativo → 1 batch `kernel.embed([query] + textos-candidatos via document_text)` → semantic_scores → fuse. Inativo → caminho de hoje byte-idêntico (golden). Resultado ganha chave top-level `semantic: bool`.
    3. **Backfill lazy (migração)**: promover `_index_memory_kinds` do CLI pra `dna.memory.verbs.backfill_index()`; CLI delega. Escolha documentada: memórias antigas (pré-provider, ou .db local ausente) são (re)indexadas idempotentemente por text-hash a cada recall do CLI; embed-no-write cobre as novas. Sem migração de schema.
    4. **CLI**: `dna memory recall --semantic/--no-semantic` (default auto), header mostra o modo, JSON propaga `semantic`.
    5. **Testes**: (a) paráfrase — pure-core: run_ecphory sem semantic_scores → partial (nada ≥ threshold); com → direct hit; verb-level com provider fake: alvo promovido pro top-k. (b) golden sem provider: literais pinados (now fixo). (c) paridade: gerador + fixture + executores Py/TS pro ranking fundido com fake embeddings. TS: memory-semantic.test.ts.
    6. **Docs**: prosa em guides/semantic-recall.md + concepts/search-and-memory.md; `scripts/gen_cli_docs.py` regenera reference/cli/memory.md (drift guard); mkdocs --strict.
    7. **Smoke produto**: scope temp, remember N fatos reais, recall por paráfrase com sqlite-vec, hit semântico demonstrado; TestGuide --product + TestRun.

    ## Gates
    sdk-py pytest, sdk-ts bun test + typecheck, cli pytest, brand_guard, docs_coverage_guard, drift da referência, mkdocs --strict; PR via `dna sdlc story pr` (11 checks); NÃO mergear.
