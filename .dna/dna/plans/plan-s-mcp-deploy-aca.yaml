  body: |
    # Plan — Deploy DNA MCP on Azure Container Apps + Entra ID (Phase A of DNA-hosted)

    ## Goal
    Turn `dna mcp serve --transport http --auth jwt` into a hosted, Entra-authenticated
    Container App the owner brings up with one `azd up`. The self-host recipe that becomes
    the base of the multi-tenant DNA Cloud offering.

    ## Anchors (prior art, no invention)
    - The sibling Foundry app already runs on Azure Container Apps + Entra ID; its `infra/`
      (main.bicep subscription-scoped -> resources.bicep: Log Analytics + ACA managed env +
      ACR + user-assigned Managed Identity + AcrPull role + Container App with external
      ingress; azure.yaml service->Dockerfile->remoteBuild) is the template I mirror, trimmed
      to the MCP server's needs (no Foundry account / search / RAG storage).
    - The MS official tutorial "Host a remote MCP server on Azure Container Apps with
      OAuth 2.1 + Microsoft Entra" is the auth anchor: an Entra app registration exposes an
      API scope; the Container App validates bearer JWTs against Entra's JWKS.
    - The DNA auth<->tenancy bridge already exists (`dna_cli._mcp_auth`): `--auth jwt` reads
      DNA_MCP_JWKS_URI/ISSUER/AUDIENCE/RESOURCE_URL/AUTH_SERVERS and maps the token's tenant
      claim (DNA_MCP_TENANT_CLAIM, default `tenant`) -> a DNA tenant. Entra is just a JWKS IdP
      to it; I wire the env, I do NOT touch auth code (parallel agent owns it).

    ## Deliverables (all under `deploy/azure/` + docs)
    1. Dockerfile (+ entrypoint.sh, .dockerignore): python:3.12-slim, install dna-cli[mcp]
       from the repo source, non-root, EXPOSE 8080, entrypoint runs
       `dna mcp serve --transport http --host 0.0.0.0 --port 8080 --auth ${DNA_MCP_AUTH:-jwt}`.
    2. azure.yaml + main.bicep + main.parameters.json + resources.bicep: Container App
       (ingress 8080 external, HTTPS) + user-assigned MI (AcrPull) + Log Analytics + ACA env +
       ACR + Azure Files share mounted read-only at /mnt/dna (the DNA source) + the Entra-JWT
       env vars as params. No secrets (MI + JWKS public-key validation).
    3. Entra: document the app registration (audience/scope) + the JWKS/issuer/audience the
       Container App validates against; a sample `dna.config.yaml` auth.providers: [entra].
    4. README.md runbook: azd up step-by-step, what the owner configures (Entra tenant, app id,
       scope), and the post-deploy smoke (an MCP client connects over HTTPS with an Entra token).
    5. docs: a new guide page wired into mkdocs nav + CHANGELOG [Unreleased] + guide cross-link.

    ## Proof (no Azure creds)
    - `az bicep build` clean on every .bicep (the honest local gate).
    - `docker build` of the Dockerfile OK (or validate by inspection if the daemon/disk fails).
    - `dna mcp serve --transport http` boots and answers MCP `initialize` locally (already done).
    - `mkdocs build --strict` green; brand_guard + gitleaks green.
    - TestGuide (integration) + TestRun. The real `azd up` is the owner's checklist.

    ## Guardrails
    - Territory = `deploy/` + docs ONLY. Do NOT touch `_mcp_auth.py` / auth config (parallel agent).
    - Brand guard forbids the internal tokens; describe the sibling app generically, never by brand.
    - Open the PR and STOP; CI is frozen, the owner merges when it returns. NOT merged here.
