  body: |
    # Plan — s-install-scan-fixes

    ## Context
    Both items were born from the PR #41 smoke:
    - i-016: `install_cmd._scan_tree` stops recursing when ANY reader claims a directory. A single-file claim (AGENTS.md at the tree root) therefore hides `skills/` and every other doc below — `dna install github:ruinosus/dna/examples/onboarding-pack` installed only the AgentDefinition.
    - i-017: post-merge task — a `requires_network` test for `dna init --from github:ruinosus/dna/examples/onboarding-pack` (no ref → default branch), skipped under DNA_OFFLINE=1 (CI).

    ## i-016 — structural fix: consumed-set scan
    A claim must consume exactly the files that make up the claimed bundle, not the whole subtree. The kernel already has the authoritative answer: every registered WriterPort implements `serialize(raw)` returning the exact entry list the bundle comprises (write ≡ serialize is enforced by the round-trip conformance suite).

    Change `_scan_tree(root, readers)` → `_scan_tree(root, readers, writers=None)`:
    1. When a reader claims a directory, find the matching writer (`can_write(raw)`) and compute `consumed = {relativePath for serialize(raw)}`.
    2. Continue the standalone-YAML collection at that level, excluding consumed paths.
    3. Recurse into subdirs NOT touched by any consumed path prefix (a Skill bundle's `scripts/`, `references/`, `extras` dirs are consumed → one doc, no duplicates; an AGENTS.md claim consumes only `AGENTS.md` → siblings keep scanning).
    4. No matching writer / serialize failure → conservative fallback = old behavior (whole subtree is the bundle).
    5. First claiming reader still wins per directory (no multi-claim).

    `install` passes `kernel.active_writers`. `dna init --from` then DELEGATES to the fixed scan (`[SkillReader(), AgentDefinitionReader()]` + writers) and drops the PR #41 workaround (explicit root probe): the root AgentDefinition arrives as the scanned doc with rel_path ".".

    Lockfile: entries are (kind, name, api_version, origin, path, sha256) — more docs = more entries, same shape; root claim records path ".". No schema change.

    ## i-017 — network test
    `test_init_cmd.py` (or the github_real twin): `@pytest.mark.requires_network` test running `dna init --from github:ruinosus/dna/examples/onboarding-pack` (NO ref) into a tmp dir; assert the acme-conventions skill projection + the pack AGENTS.md landed. The existing conftest marker gate (DNA_OFFLINE=1 → skip) does the CI skip.

    ## Tests (prove-it list)
    - mixed tree (AGENTS.md root + skills/) installs ALL docs
    - skills-only tree: golden before/after (installed set + lock identical)
    - skill bundle with subdirs/companion yaml → exactly one doc (no duplicates)
    - no-writer fallback keeps old semantics
    - init --from tests stay green after delegation
    - i-017 requires_network test (local run evidence; CI skips)

    ## Gates
    cli + sdk-py + sdk-ts suites, typecheck, guards, mkdocs --strict (install docs page gets a line on mixed trees), TestGuide --product + TestRun, PR 11/11 checks, no merge.
