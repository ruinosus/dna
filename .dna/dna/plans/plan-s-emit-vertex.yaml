  journey_phase: plan
  body: |-
    Add the THIRD runtime emitter (Google ADK Agent Config) plugged into the SAME EmitterPort registry as agent-framework + bedrock — the CLI core does not change.

    ## Target choice (Step 0 — investigated, not assumed)
    Google ships two ADK authoring surfaces: (a) the code-first LlmAgent Python/Java object, and (b) **Agent Config** — a published, DECLARATIVE YAML schema (AgentConfig.json: agent_class/name/model/instruction/tools/…) loaded via config_agent_utils.from_config(). Vertex AI Agent Engine is a deployment HOST, not a declarative definition. → the only honest de-para target is the ADK **Agent Config LlmAgent** YAML. Grounded in the real published schema (raw.githubusercontent.com/google/adk-python/.../AgentConfig.json).

    ## De-para (Py + TS parity)
    - agent_class: LlmAgent (fixed); metadata.name → name (snake_cased — ADK requires a valid Python identifier); metadata.description → description; spec.model/Genome default → model (Gemini id, DNA provider token stripped); build_prompt → instruction (flat, BYTE-EQUAL); spec.tools[] → tools[].name (ADK binds tools by CODE reference, no inline schema).
    - Artifact leads with a '# yaml-language-server' header binding it to the real schema → structural validation with no GCP credential.

    ## Losses (honest, not hidden)
    composition structure / tenant overlay / eval-as-contract (the DNA-only axes) + ADK-specific: tool binding is a code ref (Tool description+params JSON-Schema have no declarative slot) / output_schema is a Pydantic-class CodeConfig / non-Gemini model coordinate needs model_code (LiteLlm).

    ## Proof
    - byte-equal gate + one-source→three-runtimes identity test (af == bd == vx == build_prompt).
    - credential-free structural conformance test + optional live-load gate (importorskip google.adk).
    - CLI smoke; extend examples/emitting-to-a-runtime to show all 3.

    ## Gates
    Py↔TS parity; Py+TS+CLI emit suites; mkdocs build --strict; brand + docs-coverage + parity guards; CHANGELOG [Unreleased]. Base main, do NOT merge.
