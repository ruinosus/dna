  body: |
    # s-emit-port-contract — plan

    Formalize the EmitterPort as a first-class, documented DNA port (alongside the 5
    kernel ports) AND lay the scaffold mechanism for the 4 code-first targets next.

    ## 1. Formalize EmitterPort (Py + TS)
    - Turn `EmitterPort` into an explicit, richly-documented Protocol contract with
      the two contract surfaces made explicit: `build_emit_context(mi, agent) ->
      EmitContext` (neutral composed view) and `emit(ctx) -> EmitResult` (artifact),
      plus `target` / `file_extension`.
    - Add the byte-equal invariant to the contract as a first-class method:
      `extract_instructions(artifact) -> str` — every emitter can recover the
      composed instruction it embedded. This makes the invariant *inheritable*: a
      generic test loops all registered targets and asserts
      `extract_instructions(emit(ctx).artifact) == ctx.instructions`.
    - Implement `extract_instructions` on the 3 existing config emitters (parse
      YAML/JSON) — minimal refactor, no behavior change.

    ## 2. Generic invariant test over ALL targets (Py + TS)
    - `test_emit_contract.py` / `emit-contract.test.ts`: for every target in
      `available_targets()`, emit the concierge agent and assert the byte-equal
      invariant + basic contract shape (target/filename/losses list). New emitters
      inherit the check for free.

    ## 3. ScaffoldEmitter mechanism (Py + TS) — code-first targets
    - `ScaffoldEmitter` base over EmitterPort: `emit(ctx)` is generic — loads a
      curated Mustache template (package-data) for the target, fills placeholders
      (name, INSTRUCTIONS=build_prompt byte-equal, model, tools, imports), returns
      EmitResult. Subclasses stay thin: template name + `render_context` mapping +
      losses/mapping. `extract_instructions` provided by the base (AST-reads the
      `INSTRUCTIONS` constant) so scaffolds inherit the invariant check.
    - Templates as package-data: `dna/emit/scaffolds/<target>.py.mustache` (Py) and
      a byte-identical copy under `sdk-ts/src/emit/scaffolds/` (TS). Mustache = the
      renderer the SDK already ships (chevron / mustache).
    - Prove with ONE example: `openai` target (OpenAI Agents SDK idiom —
      `Agent(name=, instructions=, model=, tools=[])`). Test: byte-equal instruction
      + `py_compile` (syntactically valid) + registered.
    - Future note in contract/docs: promoting Scaffold to a Kind (declarative,
      versioned, tenant-overridable) is future work; MVP is package-data.

    ## 4. Docs
    - New guide `docs/guides/writing-an-emitter.md` — the step-by-step for both
      flavors (config-declarative vs scaffold-code), the Passo 0 recipe, the 3+1
      targets as worked examples, the byte-equal invariant.
    - `docs/concepts/microkernel-ports.md`: document EmitterPort as the emit-layer
      port (distinct from the 5 kernel ports, but a first-class documented port).
    - Update `emitting-to-a-runtime.md` list-targets output to include openai.
    - mkdocs nav entry for the new guide.

    ## 5. Release hygiene
    - CHANGELOG `[Unreleased]` entry (do NOT cut a release).
    - Gates: Py + TS suites, guards, `mkdocs build --strict`, py↔ts parity.
