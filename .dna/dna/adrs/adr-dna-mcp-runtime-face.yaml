kind: ADR
metadata:
  name: adr-dna-mcp-runtime-face
spec:
  title: DNA's MCP runtime face — expose the live layer (definitions + SDLC + memory) over a neutral protocol
  status: accepted
  context: DNA stores neutral definitions + a self-describing SDLC + declarative memory and has no runtime. The emit face (e-dna-portability) is STATIC and drops composition structure, per-tenant overlay and no-deploy. MCP is the vendor-neutral protocol every client speaks (Claude/Cursor/Copilot/agent-framework/Bedrock), now with a tools+resources layer. DNA already CONSUMES MCP (MCPFederation Kind); exposing itself over MCP is the missing dynamic face that recovers what emit loses (live, tenant-aware composition, zero deploy).
  decision: 'Build ONE thin MCP server that exposes the DNA configured live (same source as the CLI) over MCP. Server UNICO expoe TUDO: definitions (compose_prompt tenant-aware, list_agents, list_tools, get_tool), SDLC (sdlc_digest, list_stories, get_adr) and memory (recall, remember, consolidate) + 1-2 MCP resources. Reuse the existing pure cores (build_prompt, ToolLibrary, _digest.build_digest, dna.memory verbs) — no new business logic. Faseamento: MVP = stdio/local/all-tools; Phase 2 = Streamable HTTP remote + OAuth 2.1 with scopes bound to DNA tenancy. Base runtime = FastMCP (the standalone framework): it provides native transports (stdio+HTTP) and built-in OAuth 2.1 auth, so Phase 2 (remote + authenticated) is enablement + a tenancy bridge, not construction.'
  consequences: DNA gains a LIVE runtime face any MCP client consumes, completing the vendor-neutral-no-runtime thesis (emit=static, MCP=dynamic). One server; tools are thin adapters over tested cores. The [mcp] dep is optional + lazily imported (base install unaffected). Phase 2 (remote HTTP + OAuth-with-tenant-scoping) is the productionization path, tracked as todo stories.
  body: |
    # ADR — DNA's MCP runtime face (expose the live layer over a neutral protocol)

    ## Status
    Accepted (2026-07-11). Ratified by the owner as the complement to the emit face
    of `e-dna-portability`.

    ## Context

    DNA stores the neutral **definitions** (Agent / Soul / Guardrail / Tool Kinds)
    plus its **self-describing SDLC** and its **declarative memory**, and has no
    runtime of its own. `e-dna-portability` already gave DNA one face that serves
    runtimes: **EMIT** — a build-time materialization of one neutral definition into
    each runtime's native artifact (agent-framework, Bedrock, Vertex). Emit is
    *static*: it is computed once, written to a file, and by construction it DROPS
    the axes that make DNA earn its keep — composition **structure** (Soul reuse +
    wired Guardrails collapse to a flat string), **per-tenant overlay** (a persona
    without a fork), and **no-deploy** change (the artifact is frozen at emit time).

    The 2026 interop landscape (Research `rsh-agent-config-landscape-2026`) converged
    on **MCP** (Model Context Protocol, now under the Linux Foundation with A2A) as
    the vendor-neutral protocol every client speaks — Claude Code/Desktop, Cursor,
    GitHub Copilot, agent-framework, Bedrock AgentCore. MCP grew a **tools + resources**
    layer, so a server can expose arbitrary capability to any client. DNA already
    *consumes* MCP (the `MCPFederation` Kind pulls external MCP tools into a scope);
    the inverse — DNA *exposing itself* over MCP — is the missing runtime face.

    ## Decision

    Build **one thin MCP server** that exposes the DNA that is **configured live**
    (from the same source the CLI reads — `dna.config.yaml` / `DNA_SOURCE_URL` /
    `base_dir`) over the neutral MCP protocol. It is the *dynamic* face that
    **recovers what emit loses**: a client asks "compose the ACME concierge **now**"
    and the server composes it live, tenant-aware, with zero deploy.

    **Server ÚNICO expõe TUDO.** A single server surfaces all three faces of what
    DNA stores, because the thesis is "everything DNA stores is reachable over one
    neutral protocol":

    - **Definitions** (recovers the emit loss): `compose_prompt(scope, agent, tenant?)`
      returns the live-composed Soul+Guardrail+instruction prompt, **tenant-aware**
      (the killer feature emit cannot express); `list_agents`, `list_tools`,
      `get_tool`.
    - **SDLC** (the self-describing board): `sdlc_digest`, `list_stories`, `get_adr`.
    - **Memory** (the declarative recall): `recall`, `remember`, `consolidate`.
    - Plus MCP **resources** (the scope manifest / agent roster) to prove resources
      beyond tools.

    The server reuses the existing pure cores — the kernel composition
    (`build_prompt`), the emit tool projection (`ToolLibrary`), the digest aggregator
    (`dna_cli._digest.build_digest`), and the memory verbs (`dna.memory`) — it adds
    NO new business logic, only an MCP adapter over them.

    ## Phasing (faseamento)

    - **MVP — stdio, local, all tools.** Transport is **stdio** (the local clients:
      Claude Code, Cursor, Copilot). One server, all tools (definitions + SDLC +
      memory) + 1–2 resources. Proven by an in-process test that a single MCP client
      reaches definitions AND SDLC AND memory from the same server, and that
      `compose_prompt(tenant=…)` returns the overlay. Optional `[mcp]` extra on
      `dna-cli`; import is lazy so the base install never breaks.

    - **Phase 2 — remote + OAuth + tenant scoping** (design/owner-approval, NOT in
      the MVP):
      - `s-mcp-remote-transport` — **Streamable HTTP** transport (alongside stdio),
        which unblocks WEB clients (Claude web, ChatGPT) that cannot spawn a local
        stdio process. Makes the server hostable/remote.
      - `s-mcp-oauth-auth` — **OAuth 2.1** per the current MCP Authorization spec
        (server as OAuth Resource Server; PKCE; dynamic client registration; scoped
        tokens). Key point: bind the OAuth scopes to **DNA tenancy** (the `Tenant`
        Kind + inheritance that already exist) — a client/tenant's token composes
        and reads only what is theirs. Auth + multi-tenant in one mechanism.

    ## Consequences

    - DNA gains a **live** runtime face that any MCP client can consume, completing
      the "vendor-neutral intelligence layer, no runtime" thesis (emit = static
      de-para; MCP = dynamic, composition/tenant/no-deploy preserved).
    - One server to maintain; the tools are thin adapters over already-tested pure
      cores, so surface growth is cheap (more tools = more adapters, no new engine).
    - The `[mcp]` dependency is optional and lazily imported — the base CLI/SDK
      install carries no `mcp` requirement.
    - Phase 2 (remote HTTP + OAuth-with-tenant-scoping) is the productionization
      path; the MVP deliberately stays local/stdio to prove the thesis first.

    ## Base: FastMCP (why the runtime + auth are "enable + bridge", not "build")

    The server is built on **FastMCP** (the standalone `fastmcp` framework, 2.x+ —
    the leading MCP framework, from which the official MCP Python SDK's FastMCP 1.0
    was derived). This is a deliberate cost decision about the phasing, verified
    against the current FastMCP docs:

    - **Transport is native.** The SAME FastMCP server serves **stdio** (local
      clients — the MVP) AND **Streamable HTTP** (remote/web clients) — `run(transport=…)`
      with `stdio` | `http` | `sse`. So Phase 2's remote story is *flip a flag +
      deploy*, not *implement a transport*.
    - **Auth is built-in.** FastMCP ships OAuth 2.1 with Dynamic Client Registration,
      an **OAuth proxy** that bridges providers *without* DCR (WorkOS, Auth0, …) to
      MCP's DCR-compliant protocol, and JWT **token verification with scope
      enforcement** (`auth=` on the server, `require_scopes` / per-tool `auth=`).
      So Phase 2's auth story is *enable FastMCP auth + **bridge its token
      scopes/claims to DNA tenancy** (the `Tenant` Kind)* — the REAL work is the
      auth↔tenancy bridge, not building OAuth.

    Consequence: choosing FastMCP **drastically lowers the risk/cost of the
    remote + authenticated phase**. The MVP stays stdio-only; Phase 2 becomes
    enablement + a tenancy bridge. (FastMCP auth is HTTP-only, which is exactly why
    it pairs with the remote-transport story.)


    ## Phase 2 realized — remote transport + auth↔tenancy bridge (2026-07-11)

    Both Phase-2 stories are built (branch `feat/mcp-phase2`), so this ADR records the
    decisions made during implementation, verified against the CURRENT specs at build
    time:

    - **MCP Authorization spec** — revision **2025-11-25** (modelcontextprotocol.io):
      server = OAuth 2.1 Resource Server; mandatory PKCE; Protected Resource Metadata
      (RFC 9728); Resource Indicators (RFC 8707); Authorization Server Metadata (RFC
      8414); Dynamic Client Registration (RFC 7591).
    - **FastMCP** — 3.4.x (gofastmcp.com/servers/auth): `JWTVerifier` /
      `StaticTokenVerifier` token verifiers; `RemoteAuthProvider` (advertises PRM);
      `OAuthProxy` for providers without DCR (WorkOS/Auth0); `get_access_token()`
      exposes the verified token (`.claims` / `.scopes`) inside a tool.

    ### Transport (s-mcp-remote-transport)
    `dna mcp serve --transport {stdio|http|sse}` + `--host/--port/--path`. The SAME
    FastMCP server serves stdio (local) and Streamable HTTP (remote/web). No transport
    code — a flag. Proven over a real socket by a FastMCP `Client` on an `http://` URL.

    ### Provider chosen for the auth MVP
    **A JWT bearer Resource Server** (`JWTVerifier`), configured from env
    (`DNA_MCP_JWT_PUBLIC_KEY` | `DNA_MCP_JWKS_URI` + issuer/audience). Rationale: it is
    the smallest complete OAuth-2.1-conformant Resource Server (verifies signed bearer
    JWTs, no IdP round-trip needed for the MVP), and it is provider-agnostic — a
    WorkOS/Auth0 `OAuthProxy` slots into the SAME `dna_cli._mcp_auth.resource_server()`
    seam later without touching the bridge. Wrapping the verifier in `RemoteAuthProvider`
    (env `DNA_MCP_RESOURCE_URL` + `DNA_MCP_AUTH_SERVERS`) advertises PRM (RFC 9728).
    Auth is HTTP-only (no bearer token over stdio) — so it pairs with the transport story.

    ### The bridge — claim → DNA tenant (the DNA-specific value)
    FastMCP verifies the token; it does not know DNA tenancy. `dna_cli._mcp_auth` maps
    the verified token's **claim/scope → a DNA tenant** and enforces it, so every tool
    (`compose_prompt` / `recall` / `list_stories` / …) is **tenant-scoped by the token**:

    - mapping: claim `tenant` (key configurable via `DNA_MCP_TENANT_CLAIM`) OR scope
      `tenant:<x>` (prefix `DNA_MCP_TENANT_SCOPE_PREFIX`); a claim wins over a scope.
    - enforcement (fail closed): the token's tenant is injected into every data access
      (the `mi(scope, tenant)` / `with_tenant` / `kernel.query(tenant=…)` the MVP already
      uses); a caller passing a DIFFERENT `tenant` is DENIED (cross-tenant); a token with
      NO tenant claim/scope is DENIED (never falls back to "all tenants").
    - no-auth (stdio/local): the bridge is an IDENTITY over the caller's `tenant` — the
      base/stdio path is untouched, so auth/HTTP stay optional extras.

    Proven end-to-end: two RSA-signed JWTs (tenant `acme` vs `globex`) → the same
    `compose_prompt` returns composition scoped by the token's tenant (acme sees its
    overlay, globex does not); an acme token asking for `globex` is denied; a
    tenant-less token is denied; PRM is discoverable (RFC 9728). Test provider is
    in-process (`RSAKeyPair`) — no external IdP.

    ## Phase 3 — auth is a pluggable N-provider layer, config-driven (2026-07-11)

    Story `s-mcp-idp-pluggable` generalizes the single-env-provider Resource Server into an N-provider, CONFIG-DRIVEN IdP layer — a provider is a BLOCK OF CONFIG, not code (every serious IdP exposes JWKS + OIDC discovery). Decisions:

    - Provider registry in `dna.config.yaml` (`auth.providers[]`): each entry is `{type, issuer, audience, jwks_uri?, public_key?, tenant_claim?, scope_prefix?}`. The SDK config (`dna/config.py` + `config.ts`) carries `auth` as an OPAQUE passthrough (parity Py/TS); the CLI owns the schema (`dna_cli._mcp_auth.parse_auth_providers`), applying per-type defaults (entra=`tid`, clerk/workos/auth0=`org_id`, generic `oidc` must name its claim) and deriving the JWKS from the issuer when omitted.
    - Multi-issuer routing = a composite `TokenVerifier`: one `JWTVerifier` per provider; a token is verified by the ONE whose issuer+audience+signature match (routed by `iss` for free). The composite STAMPS the matching provider's `tenant_claim`/`scope_prefix` onto the verified token, so the bridge reads the RIGHT claim per provider with no global state — and it survives Entra `common` (token `iss` != the literal configured issuer).
    - claim→tenant is PER PROVIDER; the fail-closed policy (cross-tenant denied, tenant-less denied, no-auth identity) is unchanged. PRM (RFC 9728) advertises every configured provider's issuer.
    - `dna mcp serve --auth config` enables the layer; `--auth jwt` (single env IdP) stays for back-compat. Auth remains an optional, HTTP-only extra.
    - Entra is the 1st concrete provider: `type: entra`, `tid`→DNA tenant; a per-tenant issuer is validated strictly, multi-tenant `common`/`organizations` relaxed to audience+signature (the app-id audience is the boundary). The REAL login→token→server e2e is DEFERRED to the owner's `azd up` (a `requires_azure` skip + the documented step); locally proven with two emulated OIDC issuers (distinct tenant-claim keys) each resolving to the right tenant, an unconfigured issuer denied, cross-tenant denied, and PRM listing both.
