  body: |-
    # ADR — DNA pivot: from prompt-manager to vendor-neutral portability layer

    ## Status
    Accepted (2026-07-11). Ratified by the owner after a spike proved DNA→agent-framework
    emit with a live round-trip.

    ## Context

    DNA began as a declarative prompt/agent-configuration layer. As a **prompt-manager**
    it loses: Langfuse (tracing + prompt management + evals) and Agenta (Git-like prompt
    versioning) are more mature at that narrow job, and Microsoft **agent-framework**
    already ships a *native* declarative `PromptAgent` loader (`AgentFactory`) — and is
    already a dependency of the consumer (`foundry`). The 2026 macro-trend is to
    **decouple the agent definition from the runtime** so teams can swap runtimes freely
    ("Terraform for agents"): AWS Bedrock AgentCore runs *any* framework; Oracle Agent
    Spec transpiles one definition to LangGraph/AutoGen/CrewAI/WayFlow; MCP + A2A
    consolidate interop under the Linux Foundation. (Full landscape + sources:
    Research `rsh-agent-config-landscape-2026`.)

    The spike (`ref-dna-portability-spike`) proved the alternative concretely: the DNA
    Kernel composes Soul + Guardrail + delta, an emitter materializes the exact
    `PromptAgent` YAML `AgentFactory` loads, and the emitted `instructions` are
    **byte-equal** to the DNA-composed prompt — both the AF-native and DNA→AF paths
    produce a live agent-framework `Agent`.

    ## Decision

    Pivot DNA into a **vendor-neutral de-para (from-to) layer**: author an agent **once**
    in DNA (the `Agent` / `Soul` / `Guardrail` / `Tool` Kinds are the neutral source) and
    **emit the native artifact each runtime consumes**. The first proven emitter is
    `--target agent-framework`; more targets (bedrock / vertex / openai) plug in behind a
    pluggable `EmitterPort` registry. **Align DNA's schema to the Oracle Agent Spec (OAS)
    where it fits; do NOT reinvent a neutral schema.**

    ### Alternatives rejected
    - **(a) Stay a prompt-manager.** Loses to Langfuse/Agenta; and agent-framework's
      native loader removes the need for a DNA-shaped prompt store. Rejected.
    - **(b) Retire DNA.** Defensible only for a single-runtime world. The thesis is
      explicitly multi-runtime + anti-lock-in, so a portability layer has durable value.
      Rejected.
    - **(c) Reinvent a neutral schema from scratch.** Redundant with the Oracle Agent
      Spec, which already does author-once→transpile. Rejected in favor of alignment.

    ## The emit-through-OAS vs emit-direct verdict

    **Two ways DNA could reach N runtimes:**

    - **Emit-THROUGH-OAS** — DNA → OAS → runtimes via OAS's own adapters. Upside: the
      four OAS adapters (LangGraph, AutoGen, CrewAI, WayFlow) come "for free" from one
      DNA→OAS emitter. Downside: DNA inherits OAS's schema and its runtime coverage —
      and OAS ships **no adapter for agent-framework, OpenAI Agents SDK, AWS Bedrock, or
      Google Vertex/ADK today**, which is exactly the target the owner ratified and the
      consumer already depends on. Going through OAS would *not* reach agent-framework.
    - **Emit-DIRECT** — DNA → each runtime's native artifact via a per-target emitter.
      Upside: full control of the mapping and coverage; reaches agent-framework now
      (proven). Downside: DNA reimplements per-runtime rendering that, for OAS's four
      runtimes, OAS already has.

    **Verdict — a hybrid, direct-first:**

    1. **Emit DIRECT for the runtimes OAS does not cover** — starting with
       **agent-framework** (done, proven), then OpenAI Agents SDK / Bedrock / Vertex as
       demand appears. This is where DNA adds net-new portability the market lacks.
    2. **Add a DNA→OAS emitter as ANOTHER target** (not a mandatory hop) so DNA reaches
       OAS's four adapter runtimes "for free" *without* routing the whole pivot through
       OAS. OAS becomes one destination among many behind the same `EmitterPort`, not the
       spine.
    3. **Align DNA's schema to OAS vocabulary where it maps cleanly**, so the DNA→OAS
       emitter is thin and DNA stays legible to the OAS ecosystem.

    Rationale: making OAS the mandatory spine would forfeit the very target that
    justified the pivot (agent-framework). Direct-first keeps DNA's coverage independent
    of OAS's roadmap while still harvesting OAS's adapters as a bonus target.

    ### DNA ↔ OAS alignment points (where to align, not reinvent)
    | DNA | OAS | Note |
    |---|---|---|
    | composed prompt (`build_prompt`) | `Agent.system_prompt` | both are the flat system instruction (OAS uses Mustache `{{var}}`) |
    | `spec.model` / Genome `default_llm` | `llm_config` (`OpenAiConfig`/`OciGenAiConfig`/`OllamaConfig`) | map provider→config class |
    | `Tool` Kind (`type` builtin/http/mcp/python/shell) | typed tools `ServerTool`/`ClientTool`/`RemoteTool`/`MCPTool` | DNA's `type` maps onto OAS's tool taxonomy; `input_schema`→tool params |
    | `Agent.spec` inputs / `output_schema` | `inputs` (Property list) / outputs | JSON-Schema on both sides |

    Where OAS has no peer (tenant overlay, composition structure, eval-as-contract), DNA
    keeps those as authoring-time-only value — the same axes the agent-framework emit
    drops (recorded in `EmitResult.losses`).

    ## Consequences
    - Build and maintain **emitters** (agent-framework proven; bedrock/vertex/openai/OAS
      next) behind a pluggable `EmitterPort` registry.
    - The DNA **Kinds become the neutral SOURCE of truth**; per-runtime artifacts are
      regenerable outputs, never hand-edited.
    - DNA's value proposition shifts to **portability / anti-lock-in**, complementary to
      (not competing with) prompt-managers and runtimes.
    - A DNA→OAS emitter is a follow-up target that requires the schema-alignment work
      above; tracked under feature `f-oracle-agent-spec`.

    ## Evidence
    - Spike: `ref-dna-portability-spike` (round-trip byte-equal; live `AgentFactory` load).
    - Landscape + sources: Research `rsh-agent-config-landscape-2026`.
    - OAS: `ref-oracle-agent-spec`, `ref-oas-technical-report`.
    - agent-framework schema: `ref-ms-agent-framework-declarative`, `ref-ms-agentschema-promptagent`.
