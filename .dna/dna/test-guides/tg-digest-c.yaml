    expected: <o que você VÊ quando está certo (marque ✗ SÓ se estiver quebrado)>
  - action: 'No Studio, valide: Seção ''PRECISA DA SUA ATENÇÃO'' lista blocked (com motivo), stories em review com PR aberto, decisões-do-dono pendentes e perguntas em aberto — primeiro e destacado'
    where: <rota/tela — ex. /scopes/:scope/...>
    expected: <o que você VÊ quando está certo (marque ✗ SÓ se estiver quebrado)>
  - action: 'No Studio, valide: Saída de UMA tela agrupada (Concluído/Decidido/Achado/Precisa de você); --json estruturado; --save persiste StatusReport ''digest-<data>'' queryável via cognitive search/recall'
    where: <rota/tela — ex. /scopes/:scope/...>
    expected: <o que você VÊ quando está certo (marque ✗ SÓ se estiver quebrado)>
  - action: 'No Studio, valide: Help/docs distinguem digest (o que já aconteceu, pra trás) de brief (próximos passos, pra frente)'
    where: <rota/tela — ex. /scopes/:scope/...>
    expected: <o que você VÊ quando está certo (marque ✗ SÓ se estiver quebrado)>
  verifies:
