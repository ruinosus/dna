  name: tg-digest-c
spec:
  description: Roteiro de teste de s-sdlc-delegator-digest (derivado das acceptance_criteria).
  kind_of_test: smoke
  status: active
  steps:
  - action: 'No Studio, valide: dna sdlc digest agrega eventos de timeline (status→done/review/blocked, decisões/ADRs, features/épicos que avançaram, issues/kaizen, artefatos, releases) numa janela --since que aceita ISO | Nh/Nd/Nw | last-digest, default 24h'
