apiVersion: github.com/ruinosus/dna/testkit/v1
kind: TestGuide
metadata:
  name: tg-s-sdlc-delegator-digest
spec:
  description: Product smoke do 'dna sdlc digest' — o delegador roda o comando e vê, numa tela, o que aconteceu enquanto estava fora.
  kind_of_test: smoke
  status: active
  steps:
  - action: 'No terminal do repo, rode: dna sdlc digest --since 24h --scope dna-development'
    expected: Sai um digest de uma tela com cabeçalho '🗞️ Digest — dna-development (last 24h)' e um verdict-resumo (N concluído · M decisão · K achado · releases).
  - action: Confira que a PRIMEIRA seção é '🔔 PRECISA DE VOCÊ'
    expected: A seção de atenção aparece no topo (blocked/review/decidir/responder), antes de Concluído — é o que o delegador vê primeiro.
  - action: Confira os grupos retrospectivos
    expected: Aparecem '✅ Concluído', '🧠 Decidido', '🔍 Achado', '🚀 Releases' e '📎 Artefatos' com os itens reais do dia (stories done, o ADR do pivô em Decidido, kz-001/kz-002 em Achado, v0.x releases).
  - action: 'Rode com --save: dna sdlc digest --since 24h --scope dna-development --save'
    expected: Imprime '💾 salvo como StatusReport/digest-<data>' e o arquivo aparece em .dna/dna-development/status-reports/ — digest durável e queryável.
  - action: Rode 'dna sdlc digest --help' e compare com 'dna sdlc brief --help'
    expected: O help do digest diz explicitamente que ele olha PRA TRÁS (o que já aconteceu), distinto do brief que olha pra frente (próximos passos).
  verifies:
  - Story/s-sdlc-delegator-digest
  created_at: '2026-07-11T13:49:57+00:00'
  updated_at: '2026-07-11T13:49:57+00:00'
  owner: claude-code
