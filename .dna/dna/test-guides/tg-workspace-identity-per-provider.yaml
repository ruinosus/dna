apiVersion: github.com/ruinosus/dna/testkit/v1
kind: TestGuide
metadata:
  name: tg-workspace-identity-per-provider
spec:
  description: Prove the consumer lane can resolve AND create a workspace, and that the Entra lane is byte-identical.
  kind_of_test: manual
  status: active
  steps:
  - action: cd packages/sdk-py && pytest tests/test_workspace_resolution.py tests/test_workspace_consumer_lane.py -q
    expected: 36 passed — the consumer-lane claim set distills to Identity(oid=sub), resolves a grant bound to it, creation binds that same key, and the Entra/unstamped paths are unchanged
  - action: cd packages/cli && pytest tests/test_workspace_glue.py -q
    expected: 9 passed — identity_from_context reads the WorkOS sub off a real access token and enforce_workspace_from_context resolves the workspace end to end
  - action: cd packages/sdk-py && DNA_OFFLINE=1 pytest tests -q --timeout=120
    expected: 3512 passed, 221 skipped, 4 xfailed
  - action: cd packages/cli && DNA_OFFLINE=1 pytest tests -q
    expected: 1090 passed; 1 pre-existing env failure (test_mcp_quota needs dna-cli[quota]'s sync Postgres driver — fails identically on main)
  - action: python3 scripts/brand_guard.py --self-test && python3 scripts/brand_guard.py
    expected: clean
  - action: python scripts/dump_openapi.py --check; python scripts/gen_cli_docs.py; python scripts/gen_kinds_docs.py; git diff --exit-code -- docs/reference/cli docs/reference/kinds; python scripts/data_model_guard.py; python scripts/docs_coverage_guard.py
    expected: all in sync / clean
  verifies:
  - Story/s-workspace-identity-per-provider
  created_at: '2026-07-25T14:55:59+00:00'
  updated_at: '2026-07-25T14:55:59+00:00'
