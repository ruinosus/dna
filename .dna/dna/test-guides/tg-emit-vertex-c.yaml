metadata:
  name: tg-emit-vertex-c
spec:
  description: Roteiro de teste de s-emit-vertex (derivado das acceptance_criteria).
  kind_of_test: smoke
  status: active
  steps:
  - action: 'No Studio, valide: Given the concierge example scope, when I run ''dna emit concierge --target vertex'', then a valid ADK Agent Config YAML is produced with agent_class LlmAgent, name, model, instruction, tools.'
    where: <rota/tela — ex. /scopes/:scope/...>
    expected: <o que você VÊ quando está certo (marque ✗ SÓ se estiver quebrado)>
  - action: 'No Studio, valide: Given the emitted config, when I compare its ''instruction'' to build_prompt(agent), then they are byte-equal — AND identical to the agent-framework ''instructions'' and the Bedrock ''Instruction'' (one source → three runtimes).'
    where: <rota/tela — ex. /scopes/:scope/...>
    expected: <o que você VÊ quando está certo (marque ✗ SÓ se estiver quebrado)>
  - action: 'No Studio, valide: Given no GCP credential, when the artifact is validated, then it conforms structurally to the documented ADK LlmAgentConfig schema and carries the yaml-language-server schema header.'
    where: <rota/tela — ex. /scopes/:scope/...>
    expected: <o que você VÊ quando está certo (marque ✗ SÓ se estiver quebrado)>
  - action: 'No Studio, valide: Given DNA axes ADK has no slot for (composition, tenant, eval, tool-schema depth, output_schema, non-Gemini model), when emitting, then each is reported in EmitResult.losses, not hidden.'
    where: <rota/tela — ex. /scopes/:scope/...>
    expected: <o que você VÊ quando está certo (marque ✗ SÓ se estiver quebrado)>
  verifies:
  - Story/s-emit-vertex
