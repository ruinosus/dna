apiVersion: github.com/ruinosus/dna/testkit/v1
kind: TestGuide
metadata:
  name: tg-onboarding-genome-install
spec:
  description: 'Smoke de produto do dna init --from: consumir o onboarding pack de exemplo do próprio repo via distribuição github: num projeto scratch'
  kind_of_test: smoke
  status: active
  steps:
  - action: 'num dir scratch com git init, rodar: dna init --from github:ruinosus/dna/examples/onboarding-pack@<ref> --tools all'
    expected: 7 created (board + 4 projeções acme-conventions + AGENTS.md + hooks), header mostra o pack com commit pinado, aviso 'review the projected files before committing' presente
  - action: 'comparar bytes: .claude/skills/acme-conventions/SKILL.md e AGENTS.md vs examples/onboarding-pack/ do repo'
    expected: byte-idênticos (writers byte-fiéis, SKILL.md writer-canônico)
  - action: re-rodar o mesmo comando
    expected: 0 created · 7 skipped (idempotência preservada com --from)
  - action: rodar dna install do MESMO ref num scope
    expected: docs do pack entram no source com installed.lock (canal de board composto com o canal de projeção)
  verifies:
  - Story/s-onboarding-genome-install
  created_at: '2026-07-10T20:22:27+00:00'
  updated_at: '2026-07-10T20:22:27+00:00'
