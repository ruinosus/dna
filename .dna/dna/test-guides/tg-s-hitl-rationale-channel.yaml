    expected: 26 passed — rationale verbatim no interrupt, paridade byte-identica com o default canonico, strip antes da execucao (mutation-killer), wiring confirm_tools->rationale_tools
  - action: cd packages/sdk-py && uv run --no-project python -m pytest tests -q --timeout=120
    expected: suite inteira verde (4998 passed, 256 skipped, 4 xfailed)
  verifies:
  - Story/s-hitl-rationale-channel
