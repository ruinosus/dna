  - 'Tests: o MUTANTE — fazer o custo somar parcialmente quando falta um preco tem de ficar VERMELHO'
  - 'Docs: reading-the-yield.md dizendo de onde o preco vem e o que fazer quando falta'
  - 'CI: verdes'
