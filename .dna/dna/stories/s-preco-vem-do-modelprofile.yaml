  name: s-preco-vem-do-modelprofile
spec:
  title: O preço do modelo vem do ModelProfile — não do código de ninguém
  description: 'read_yield resolve ModelPrice a partir de ModelProfile.cost_per_1m_*, pelo model que dna_turn ja carimba. Sem preco declarado: NAO CALCULAVEL com o nome do modelo que falta.'
  status: in-progress
  feature: f-conta-do-copiloto
  priority: highest
  acceptance_criteria:
  - Dado um turno com model carimbado e um ModelProfile com cost_per_1m_input_usd e output, quando eu peco a leitura, entao o custo sai em dinheiro com basis e source apontando para o ModelProfile
  - ⚠️ Dado um modelo da amostra SEM preco declarado, quando eu peco a leitura, entao o custo INTEIRO e NAO CALCULAVEL nomeando quais modelos faltam — NUNCA soma parcial, porque parcial e menor que o real
  - Dado que nao existe ModelProfile nenhum (o estado de hoje), quando eu peco a leitura, entao ela diz QUAL modelo declarar — 'nao sei' vira 'declare isto'
  - Dado um ModelProfile com preco null, quando a leitura roda, entao null e AUSENTE, jamais zero
  acceptance_criteria_source: cli-create
  definition_of_done:
