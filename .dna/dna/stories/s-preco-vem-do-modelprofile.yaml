    commit_ref: 74ae74eac150c3e76d1bdc704dfd18f7212ebd79
    summary: 'Entregue e merjado (PR #361). O preço vem do ModelProfile, e a i-101 do founder entrou junto: cost_quoted_at + cost_source no Kind, e Number.is_suspect no molde do is_floor, impresso na MESMA linha ([MEASURED ⚠ SUSPEITO]). QUINZE mutantes, todos vermelhos. ⭐ E dois achados que mudam o desenho: (1) o dna_turn carimba ''gpt-5.4'' E ''gpt-5.4-2026-03-05'' — o model carimbado NEM SEMPRE é model_id, às vezes é alias; sem a segunda passada aquele único turno mataria a conta inteira pela regra do não-parcial, com a regra CERTA e a resposta ERRADA. (2) o is_floor do CUSTO não é seguro com cache de prompt: há APIs que reportam cache FORA de input_tokens (subestima, piso vale) e DENTRO (SUPERESTIMA — o piso está errado). ⚠️ Cache ficou NOMEADO e não acrescentado, com razão medida: não há contador de cache em dna_turn nem em telemetry.py, então um preço de cache seria preço de uma quantidade que ninguém conta — decorativo, pior que ausente porque ausente se vê. E a janela do dna_turn JÁ FECHOU (85 linhas), diferente da do ModelProfile. Guarda deixada que fica VERMELHA no dia em que o contador nascer.'
