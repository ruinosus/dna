apiVersion: github.com/ruinosus/dna/sdlc/v1
kind: Story
metadata:
  name: s-definitions-read-record-plane
spec:
  title: Definitions read works for record-plane Kinds
  description: Make read_definition_impl resolve a document for record-plane Kinds via a targeted kernel read, so the generic definitions API works for all registered Kinds — not just the composition-plane subset.
  status: in-progress
  feature: f-dna-hosting
  priority: high
  acceptance_criteria:
  - Given a record-plane Kind (Tool/Copilot) with a base document in a scope, When read_definition_impl is called for it, Then it returns the document's spec plus the Kind's ui_schema instead of raising ValueError.
  - Given a tenant writes an override for a record-plane Kind via apply_definition_impl, When read_definition_impl is called for the same (kind, name) with that tenant, Then it returns overridden=true, the tenant's effective spec and the untouched base spec.
  - Given a composition-plane Kind, When read_definition_impl is called, Then behaviour and cost are unchanged (no extra kernel roundtrip on the hit path).
  acceptance_criteria_source: claude-code
  definition_of_done:
  - 'Code: targeted per-(kind,name) read on the definitions path; the instance builder''s record-plane exclusion stays intact.'
  - 'Tests: RED-then-GREEN unit tests for record-plane read and write-then-read round trip; existing definition/compose/REST suites green.'
  - 'Docs: no public-API surface change; PR states the latency characteristics.'
  definition_of_done_source: claude-code
