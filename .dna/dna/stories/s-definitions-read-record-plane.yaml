  - at: '2026-07-26T05:43:54+00:00'
    actor: claude-code
    type: comment
    source: cli
    summary: 'Diagnosis confirmed, and WIDER than filed: kernel.kind_plane reports 49 of 76 registered Kinds as plane=record (Tool, Copilot, and the whole SDLC surface — Story/Issue/Feature/Epic/Plan/ADR/Spec/Task/Memory/PromptTemplate/...), not 35. Every one of them 404''d on read while PUT succeeded. Fix: _doc_spec_for keeps the in-memory mi.documents walk for composition Kinds (byte-identical, no extra roundtrip on hit OR miss) and, only on a miss for a plane=record Kind, does a targeted kernel.get_document(scope, kind, name, tenant) — the indexed, L2-cached single-row read. instance_builder''s record exclusion is untouched. Read the raw dict rather than mi.one_async on purpose: one_async parses a validated Document per read (measured ~1.5ms) and the caller only wants a spec dict. Second bug found by the fix: read_definition_impl''s bundle_entries listing went through the SYNC kernel.list_bundle_entries, whose _run_sync_helper raises against a loop-bound SQL source; the advisory except swallowed it, so EVERY bundle Kind reported [] in production (plus a stray ''coroutine was never awaited'' RuntimeWarning). Latent while only composition Kinds reached the block; 18 record Kinds are bundle-pattern, so the fix dragged it into the light. Switched to list_bundle_entries_async, matching list_bundle_entries_impl/reconcile_forks_impl.'
    commit_ref: 13ccf1ebddaa979d897f1740b56774b4531c37db
