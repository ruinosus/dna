  acceptance_criteria:
  - text: Given a scope with a Genome default Agent, when a consumer resolves it through DnaClient, then the composed prompt, complete Tool contracts, MCP servers, and confirmation policy are returned without starting a runtime.
    done: true
    done_at: '2026-08-10T11:45:08+00:00'
    done_by: github-copilot
    evidence: 'Focused SDK suites: 8 passed; public imports and lock check passed; README and CHANGELOG updated; credentials remain env references; consumer owns lifecycle.'
  - text: Given a ResolvedAgent, when the GitHub Copilot binding projects it, then model, HTTP or stdio MCP configuration, authentication environment references, local tools, and confirmation hooks reach GitHubCopilotAgent while lifecycle remains consumer-owned.
    done: true
    done_at: '2026-08-10T11:45:08+00:00'
    done_by: github-copilot
    evidence: 'Focused SDK suites: 8 passed; public imports and lock check passed; README and CHANGELOG updated; credentials remain env references; consumer owns lifecycle.'
  - text: Given multiple Agents, when no explicit name is passed, then Genome.spec.default_agent selects deterministically; an explicit name overrides it and a missing default fails closed.
