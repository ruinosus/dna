  name: s-indice-por-dimensao
spec:
  title: Uma tabela por dimensão — o índice deixa de fixar o embedder
  description: dna_search_docs ja e dinamica em scope/kind/tenant; so a dimensao e fixa, porque vector(N) e tipo da coluna. Cinco tabelas por migration, collection vira coluna, e o roteamento le dims da EmbeddingPort.
  status: in-progress
  feature: f-a-fabrica
  priority: high
  acceptance_criteria:
  - Dada uma migration, quando ela roda, entao existem tabelas por DIMENSAO (384/768/1024/1536/3072) e nenhuma DDL acontece em runtime
  - Dado um provider registrado, quando a busca roda, entao ela le dims da EmbeddingPort e escolhe a tabela — sem configuracao nova e sem heuristica
  - Dada uma collection nova, quando ela nasce, entao e um INSERT — jamais um CREATE TABLE
  - ⚠️ Dados dois model_id diferentes com a MESMA dimensao, quando a busca roda, entao ela NAO os mistura — o contrato diz que nao sao comparaveis
  - Dada uma dimensao INEDITA, quando alguem a declara, entao a falha e ALTA e aponta a migration que falta — nunca cria tabela sozinha
  acceptance_criteria_source: cli-create
  definition_of_done:
  - 'Code: a migration e o roteamento por dims; ZERO DDL fora de migration'
  - 'Tests: o mutante — fazer o roteamento ignorar dims e misturar espacos tem de ficar VERMELHO'
  - 'Docs: a razao da recusa da tabela dinamica, com a regra do CLAUDE.md citada'
  - 'CI: postgres verde'
  definition_of_done_source: cli-create
