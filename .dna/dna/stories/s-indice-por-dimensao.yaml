    summary: 'Entregue e merjado (PR #367). Cinco tabelas na migration 0013, roteamento lendo dims da EmbeddingPort, model_id como FILTRO nos dois planos. ⭐ E ele APAGOU o pgvector_migrations.py: era uma escada numerada que o PRÓPRIO PROVIDER rodava na primeira busca — DDL em runtime, dentro do adapter, no repo que escreveu a regra. 10 mutantes, e a contagem engana: o que importa é o de model_id no plano DENSO (2 vermelhos), porque é o ÚNICO que não quebraria nada visível em produção — falha como VAZAMENTO (''alpha viu outro espaço''), não crash. Os 170 documentos NÃO se movem: ALTER TABLE RENAME, O(1), com os índices seguindo (INSERT..SELECT reconstruiria o IVFFlat e deixaria produção sem acelerador no meio). ⚠️ Três correções à minha story: (1) ''collection vira coluna'' — não existe collection, é o SCOPE, coluna desde sempre; (2) ''índice HNSW caro'' — pgvector 0.8.2 RECUSA índice acima de 2000 dims, então para 3072 ele nem é possível; (3) a que mais importa: o _migrations.py ARGUMENTAVA no docstring que a loja não podia ir para o Alembic porque ''uma revisão não pode saber a largura'' — a premissa estava errada: a revisão não precisa SABER, ela cria uma para cada e o store ROTEIA. O que se lia como parâmetro aberto era uma enumeração de cinco elementos.'
