    summary: 'Part B shipped: build_prompt(explain=True) via mi.explain_prompt (Py) / mi.explainPrompt (TS) → PromptExplanation{prompt, sections[]}. Cada secao (instruction/soul/skill:X/guardrail:Y) reconstruida dos blocos declarados do kernel (layout template + dep_filters + flatten_in_context) — NAO reimplementa composicao. Provenance por secao: source file (do StorageDescriptor), sha256 do doc resolvido, version, origin (effective_layer via kernel.resolve_document), is_inherited, overridden_by_tenant. Gate byte-equal: explain delega a string 100% pro build() — nunca re-renderiza (teste assere prompt==build_prompt). Marca de overlay robusta: compara hash tenant-resolved vs base-resolved (o fallback tenant->base do FS source torna o flag ''found'' por-layer NAO confiavel; a comparacao de conteudo e correta em FS e PG). CLI ''dna explain <agent> [--scope][--tenant][--json][--show-prompt]'' imprime tabela section|source|hash|version|origin + linha ''OVERRIDDEN by tenant overlay''. Hardening lateral: resolve_document agora fail-soft em scope de parent/catalog ausente (FileNotFoundError -> layer sem contribuicao, igual ao instance builder) — Py+TS. Tests: Py test_explain_provenance (5, inclui overlay FS end-to-end) + CLI test_explain_cmd (3, byte-equal vs emit) + TS explain-provenance (4). Docs regen + cli-tour prose + guards limpos.'
