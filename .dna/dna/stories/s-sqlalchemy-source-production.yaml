    summary: 'Kickoff no worktree dna-wt-sqla (branch feat/s-sqlalchemy-source-production). Baseline verde: sdk-py 2693 passed; matriz spike+kit com DATABASE_URL (db descartável dna_ci_test no PG dev :5434) = 142 passed / 2 xfail. Investiguei o mecanismo do eventbus cru: PostgresSource._emit_outbox = INSERT dna_outbox RETURNING id + UPSERT dna_versions_seq + pg_notify(''kernel_writes'', payload) na MESMA transação do write; payload construído por _build_notify_payload (puro). Decisão: o SqlAlchemySource vai IMPORTAR _build_notify_payload/KERNEL_EVENTBUS_CHANNEL do adapter cru — parity byte-a-byte por construção, não por cópia.'
    commit_ref: ee2d2a320be157bd5445ebfd81a8f1b6cb579c34
