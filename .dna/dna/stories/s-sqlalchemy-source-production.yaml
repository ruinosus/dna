    source: cli
    summary: 'Core implementado (adapters/sqlalchemy_/source.py ~935→~1300 loc): (1) eventbus pg como strategy de dialeto (_PgOutboxEmitter/_NullEventEmitter) — outbox+versions_seq+pg_notify na MESMA tx do write, payload importado do adapter cru (parity byte-a-byte por construção, provada por teste LISTEN ao vivo); (2) memo-cache _load_view dialeto-agnóstico com single-flight + deep-copy + invalidação SUPERSET do cru (writes locais invalidam direto + on_write via attach_kernel); (3) cortes fechados: FrontmatterParseWarning net, source_files net, preserve-binary pg, catálogo Genome (list/get/deprecate_module_versions), save/delete_layer_document, list_layers, list_tenants, slow-path bundle-override no query; (4) DECISÃO: save_document agora AUTO-PUBLICA (upsert documents na mesma tx) — kernel.write_document nunca chama publish(); o cru pg já fazia isso, o spike (fluxo draft-only estilo sqlite) deixaria writes do kernel invisíveis. Matriz canônica: SA promovido pro test_source_conformance_kit (9 adapters), spike mirror deletado — 142 passed/2 xfail (só tenant-PK sqlite). Packaging: extra sql = sqlalchemy[asyncio]>=2 + drivers via extras sqlite/postgres; guard test de import default. +14 testes novos (test_sqlalchemy_source.py) incluindo atomicidade do outbox (write vetado não emite evento).'
    commit_ref: ee2d2a320be157bd5445ebfd81a8f1b6cb579c34
