kind: Story
metadata:
  name: s-graph-kinds-route
spec:
  title: GET /v1/graph/kinds — o grafo de SCHEMA numa chamada
  description: 'Fatia 1 de spec-grafo-1-arestas-e-travessia (dna-cloud): servir o grafo de referencias entre Kinds derivado do registry, matando o N+1 de N readRegisteredKind do portal. Sem tabela, sem migracao, sem produtor.'
  status: in-progress
  feature: f-console-backend
  priority: high
  labels:
  - graph
  - rest
  - portal
  reporter: claude-code
  acceptance_criteria:
  - Given o registry vivo, When GET /v1/graph/kinds, Then a resposta traz nodes + edges com tier (declared/composition/inferred) numa unica chamada
  - 'Given a resposta, When a tela a le, Then ela NAO pode afirmar ''todas as relacoes'': o envelope carrega coverage (contagens por tier) e limits explicitos (top-level properties only, chaveadas indeclaraveis, schema-nao-dado)'
  - Given a extracao de x-dna-ref, When o grafo e projetado, Then ele reusa declared_references/references_from_schema do kernel e a MESMA projecao que gera docs/reference/data-model.md — uma computacao, dois consumidores
  acceptance_criteria_source: cli-create
  definition_of_done:
  - 'Code: dna/kernel/query/kind_graph.py (projecao no SDK), kind_graph_impl, rota + modelo Pydantic'
  - 'Tests: unitarios da projecao no sdk-py + rota no cli, incluindo a asserção de honestidade da cobertura'
  - 'Docs: docs/openapi.json e os clientes py/ts REGENERADOS pelos scripts; data_model_guard e brand_guard limpos'
  - 'CI: pytest sdk-py + cli verdes; sem mexer em versao/release'
  definition_of_done_source: cli-create
