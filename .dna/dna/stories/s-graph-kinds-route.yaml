    source: cli
    summary: 'A decisao que moldou a fatia: NAO reimplementar a projecao. O grafo de schema ja existia computado — dentro de scripts/gen_data_model_docs.py, para gerar docs/reference/data-model.md. Escrever uma segunda leitura de x-dna-ref para a rota seria o defeito que references.py existe para acabar (duas leituras que podem divergir), so que agora entre a PAGINA e a PORTA. Entao a projecao mudou de casa: dna/kernel/query/kind_graph.py, e o gerador virou consumidor. Prova: data_model_guard limpo e determinista — a pagina saiu byte-identica (31350 bytes) depois da mudanca.'
    commit_ref: 2a6acb920d4fd0dc8ab7b7efb207166605ee893a
  - at: '2026-08-06T08:01:35+00:00'
    actor: claude-code
    type: comment
    source: cli
    summary: 'Honestidade: a medicao da spec (109 arestas de schema, 16 declaradas) e reproduzida pela rota ao vivo — coverage devolveu edges=109, declared=16, composition=66, inferred=27, unresolved=25, undeclarable=6, suppressed=8. Por isso o envelope carrega coverage.enforced_tiers=[''declared''] e coverage.limits: os quatro tiers nao valem o mesmo, e a tela precisa do qualificador NO FIO, nao numa pagina de doc que o chamador pode nunca ler. O limit mais importante e o primeiro (schema_not_data): estas arestas dizem quais Kinds PODEM apontar para quais — nunca quais documentos apontam. Esse e o grafo da fatia 3.'
    commit_ref: 2a6acb920d4fd0dc8ab7b7efb207166605ee893a
