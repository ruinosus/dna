    summary: 'Deferred (flagged): the resolve_role helper (highest-role-wins + org-owner superuser) is NOT in this PR — the Kinds are the priority and the ladder ranks already encode the ordering (test asserts strict order). resolve_role is Python-first with a TS twin as a follow-up. Enterprise SSO/SCIM (rsh-portfolio-enterprise-auth) is explicitly out of scope per the task. All guards green: py 20/20 (hash-parity, ratchet, strict-schema-lint, inheritable-tenancy, portfolio_kinds), ts 13/13 (portfolio + descriptor-hash-parity), typecheck clean, brand-guard clean, docs-coverage clean, docs/reference regenerated. Ref: adr-portfolio-project-model, rsh-portfolio-project-model.'
