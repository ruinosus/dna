    summary: 'Mirrored the intel extension EXACTLY (v0.11.0 canonical F3 pattern): 5 kinds/*.kind.yaml descriptors written once in Py and cp''d byte-identical to TS, PortfolioExtension (Py __init__ + TS class) loading via load_descriptors, registered in pyproject entry-point + bootstrap loadBuiltins. Model = adr-portfolio-project-model (Azure DevOps container). Kinds register: Organization(portfolio-org) Project(portfolio-project) Repo(portfolio-repo) Membership(portfolio-membership) Role(portfolio-role) — all record-plane, TENANTED, declarative, closed schemas. Kernel.auto() 75→80.'
    commit_ref: b5e9eb96274a99dc89683e4d98c414eb09e1031c
  - at: '2026-07-12T23:15:25+00:00'
    actor: claude-code
    type: comment
    source: cli
    summary: 'Modeling decisions flagged: (1) N—N Repo↔Project — the edge lives ONLY on Project.repo_refs (a list of Repo names); Repo carries NO project back-ref, so a shared repo is never duplicated and there''s a single source of truth. A join Kind was considered and rejected as premature. (2) Role ladder AS DATA — each rung a Role doc with rank+capabilities so the ladder is extensible (custom roles) instead of a hardcoded enum; 4 standard rungs (owner/admin/member/guest, ranks 40/30/20/10) ship as per-tenant seed docs under examples/dna-cloud/.dna/tenants/acme/scopes/acme-development/roles/. (3) Overlap flagged: Organization vs the platform-level Tenant Kind, Membership vs TenantMembership — kept distinct names (no i-195 bare-name clash) since these are the tenant''s OWN editable portfolio profile/grants, not the GLOBAL provisioning identity.'
    commit_ref: b5e9eb96274a99dc89683e4d98c414eb09e1031c
  - at: '2026-07-12T23:15:29+00:00'
    actor: claude-code
