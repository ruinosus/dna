metadata:
  name: s-intel-insight-ranker
spec:
  title: 'O núcleo anti-ruído: pontuar cada insight candidato por ACIONABILIDADE (faz o us'
  description: 'O núcleo anti-ruído: pontuar cada insight candidato por ACIONABILIDADE (faz o usuário agir?), não só relevância — abaixo do threshold é SUPRIMIDO, não entregue.'
  status: in-progress
  feature: f-dna-cloud-intelligence
  priority: highest
  labels:
  - intelligence
  - anti-noise
  reporter: claude-code
  business_value: 900
  acceptance_criteria:
  - Todo insight candidato recebe um score de acionabilidade (0-1) + rationale inspecionável (por que agiria).
  - Existe um threshold configurável abaixo do qual o insight é SUPRIMIDO (nunca entregue) — o default erra pro lado de suprimir.
  - 'O ranker é auditável: dá pra ver o que foi suprimido e por quê (não some silenciosamente sem trilha).'
  - Ranking usa o contexto DNA do app (não genérico) — o mesmo fato pontua diferente por produto.
  acceptance_criteria_source: cli-create
  definition_of_done:
  - Função de score + supressão testada com golden path + casos de ruído conhecido (fato genérico → suprimido; fato específico-acionável → passa).
  - 'Métrica exposta: taxa de supressão + distribuição de scores por pass.'
  - Doc do contrato de score (o que conta como 'acionável') no repo.
  definition_of_done_source: cli-create
