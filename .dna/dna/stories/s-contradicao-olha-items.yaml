    summary: 'Entregue e merjado (PR #358). A armadilha está fechada: uma relação resolved sobre array-de-objeto sem tipo que sustente a string agora é ACUSADA. As 10 honestas (to:''*'' + by:{kind,name}, resolved=False) continuam passando — a checagem é gateada em Relation.resolved, que é exatamente a linha entre ''o kernel diz que segue'' e ''diz que não segue''. Dois cuidados medidos: só tipo POSITIVAMENTE declarado acusa (items ausente ou via ref/oneOf = ''não consegui ler'', não ''está errado''), e o helper lê união, senão type:[string,null] acusaria 4 referências nuláveis vivas. ⭐ E ele achou um buraco no teste que JÁ existia: test_every_relation_agrees_with_its_own_schema passaria verde contra um registro SEM NENHUMA relação array-de-objeto — não distingue ''nada errado'' de ''não há o que errar''. Acrescentou um que mede a população real e exige que não seja vazia. Varreduras exaustivas: 24 declarações no dna e 12 no dna-cloud, ZERO acusadas.'
