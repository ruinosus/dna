  title: 'O flywheel anti-ruído: usuário marca cada insight como útil/agido/ruído → ajusta'
  description: 'O flywheel anti-ruído: usuário marca cada insight como útil/agido/ruído → ajusta o threshold do ranker + alimenta a memória de dedup. A relevância melhora sozinha.'
  status: review
  feature: f-dna-cloud-intelligence
  priority: medium
  labels:
  - intelligence
  - anti-noise
  - memory
  reporter: claude-code
  business_value: 500
  acceptance_criteria:
  - 'Todo insight entregue tem feedback: útil | agido | ruído.'
  - Feedback 'ruído' sobe o threshold efetivo pra aquele tipo/fonte; 'agido' reforça o padrão.
  - Métrica de 'taxa de ruído' (ruído / entregues) exposta e caindo ao longo do tempo é o KPI do produto.
  acceptance_criteria_source: cli-create
  definition_of_done:
  - 'Loop testado: marcar um tipo como ruído → próximo pass suprime candidatos similares.'
  - Feedback grava na memória (fecha com s-intel-dedup-memory).
