    summary: 'Entregue no PR dna#315. Desenho que coube: (1) NENHUM fork — o HumanInTheLoopMiddleware canônico JÁ suporta description dinâmica por chamada (InterruptOnConfig.description: str | _DescriptionFactory, chamada com (tool_call, state, runtime) em _create_action_and_config — fonte instalado human_in_the_loop.py:136-190/274-281); a factory lê args[''rationale'']. (2) Shape final da description: a rationale do modelo VERBATIM (trimmed) quando presente — o portal (rationaleOf) a renderiza como o Por quê; sem rationale, a string default byte-idêntica (''Tool execution requires approval\n\nTool: X\nArgs: {...}''), que o portal degrada para ausência. Paridade testada CONTRA o canônico via after_model com interrupt capturado, não contra literal. (3) O arg rationale existe só entre modelo e middleware: injetado por model_copy no schema model-facing das tools em rationale_tools (= confirm_tools no build; run_local de delegação não passa nada) e stripado em (a)wrap_tool_call antes do MCP real; tool que já declara rationale nunca é sombreada nem stripada; ToolCall checkpointado nunca mutado. Mutation-killer do strip em test_mcp_tools_mw.py. Suite: 4998 passed.'
