    summary: 'Decidi NÃO wirar o @ag-ui/mcp-apps-middleware e parar para reporte (regra do design: não mergeia metade), porque a premissa ''CopilotKit ^1.63 já compatível'' vale no nível do pacote mas a integração é inerte por construção nesta arquitetura — 3 bloqueios verificados no código real: (1) o middleware latest (0.0.3, o MESMO bundlado no @copilotkit/runtime 1.63.1, que é o latest) implementa o DRAFT da SEP-1865 — descoberta filtra _meta[''ui/resourceUri''] plano e advertisa text/html+mcp — enquanto FastMCP 3 no SDK 0.24.0 emite o shape FINAL (_meta.ui.resourceUri aninhado, text/html;profile=mcp-app): a descoberta encontra zero UI tools; (2) v0.0.3 constrói os transports com new URL(url) só — o campo headers do config NUNCA chega ao transport — logo não autentica no MCP metered do DNA (tools/list, tools/call e o resources/read proxiado do renderer levam 401); (3) o gatilho de render do middleware é ''pending tool call executado PELO middleware'', mas no console o backend LangGraph executa list_memories/recall ele mesmo (bearer por usuário + quota) e o scaffold emitido faz bind só de _allowed_tools_only(mcp_client.get_tools()) — nunca sobra pending call, o ACTIVITY_SNAPSHOT mcp-apps nunca dispara. Não existe bump de CopilotKit que resolva (1.63.1 É o latest). Caminho apontado sem contorno: lado host precisa alcançar a SEP-1865 final (middleware novo upstream OU scaffold do SDK emitir ACTIVITY_SNAPSHOT — ag-ui-protocol 0.1.19 do copilot já tem o evento — mais um proxy resources/read autenticado). Feature fica in-progress no lado console; o trem de pin (t019) andou separado.'
    commit_ref: 08ae8a0320b89195967dd1beb5bb817de33ced01
