    summary: 'Entregue e merjado (PR #355). O ''não se aplica'' genérico foi MEDIDO e recusado: com python_module descendo para answers sobrou UM caso em nove, e um mecanismo com um usuário não se paga. Entrou App.ingress enum [external,internal,none] — a granularidade vira ESTRUTURAL: ingress só responde a pergunta da porta e não tem como calar o can_sleep, nem por engano. ingress:none COM port é recusado na gravação. Duas correções minhas: service_name nunca foi obrigatório (apertar invalidaria as 2 instâncias vivas) e python_module/port já eram opcionais desde o #351. Busca registrada inclusive onde não achou: kernel não tem mecanismo; dataAbsentReason do FHIR fica como forma se aparecer caso para can_sleep/service_name.'
