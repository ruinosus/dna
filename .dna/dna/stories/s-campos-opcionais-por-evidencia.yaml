    summary: |-
      CORREÇÃO DE RUMO (07/08/2026) — o teste mecânico que muda o escopo desta story.

      Perguntei a cada campo do copier.yml: você aparece em algum dos TRÊS fragmentos de fiação
      (wiring/compose.fragment.yml, wiring/azure.service.yaml, wiring/containerapp.bicep)?

        campo             fiação  código   veredito
        service_name           3       3   fato de deployment
        container_port         2       3   fato de deployment
        can_sleep              1       0   fato de deployment
        max_replicas           1       0   fato de deployment
        env_prefix             2       2   fato de deployment
        identity               2       3   fato de deployment
        ingress                1       0   fato de deployment
        python_module          0       2   ← SÓ RESPOSTA DE RENDER
        description            0       3   ← só resposta de render

      A RÉGUA QUE SAI DISSO, e vale além deste campo:
        O App carrega o que a FIAÇÃO precisa. O `answers` carrega o que o TEMPLATE precisa.

      CONSEQUÊNCIA: `python_module` NÃO vira opcional no App — ele SAI do App e desce para
      services[].answers, onde já mora o vocabulário do template (additionalProperties: true,
      nenhuma chave obrigatória, exatamente para isto).

      Com isso o `portal` cabe SEM EXCEÇÃO NENHUMA: Next.js não responde uma pergunta que o Kind
      deixou de fazer. Uma das três lacunas do dogfood SOME em vez de ser tolerada. E cada stack
      traz o seu vocabulário (um template Node perguntaria package_name; um Go, module_path) sem
      inchar o App.

      O QUE NÃO MUDA: App.port fica no App (3 usos na fiação) e continua opcional pelo `worker`.
      Solution.services continua opcional pelo dna-cloud. App.service_name continua OBRIGATÓRIO.

      CONTEXTO DE STACK, que motivou a medição: o template é 11 arquivos — 5 de código, todos
      Python (FROM python:3.12-slim, pyproject, server.py), e 3 de FIAÇÃO que não têm uma linha
      sobre linguagem. Um contêiner é um contêiner. Um template Node/Go/Java reusaria os três
      fragmentos COMO ESTÃO — não é refatoração futura, é o estado atual. E o caso owns_code:false
      (App novo sobre imagem existente) já gera SÓ a fiação, portanto já é stack-agnóstico.

      PONTA ABERTA, deixada para medição: com python_module fora, sobra UM caso de "a pergunta não
      se aplica" — o `worker` sem port. Um caso talvez não justifique um mecanismo genérico. A
      hipótese alternativa é que o `worker` não é "um App cuja porta não se aplica" e sim UM APP QUE
      NÃO ATENDE — e aí o fato real é `ingress: false`, do qual "sem porta" é consequência.
