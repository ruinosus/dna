spec:
  title: 'A promessa ''um microkernel que nao conhece Kind nenhum'' e falsa em seis lugares '
  description: A promessa 'um microkernel que nao conhece Kind nenhum' e falsa em seis lugares medidos. Reescrever a promessa para o que e verdade e acrescentar uma guarda DERIVADA que falhe quando um literal de Kind NOVO aparecer no caminho central do kernel.
  status: in-progress
  feature: f-dna-1.0-readiness
  acceptance_criteria:
  - Dado que o kernel cita nomes de Kind literais em resolver/accessor/evidence/events/invalidation, quando a promessa e reescrita, entao AGENTS.md, docs/index.md, docs/concepts/thesis.md e microkernel-ports.md dizem o que o codigo faz
  - Dada uma guarda derivada (o conjunto de Kinds vem do registro, nao de uma lista escrita a mao), quando um literal de Kind NOVO aparece no caminho central, entao a guarda falha; e quando um literal ja conhecido e removido, a guarda tambem falha (a baseline aperta, nunca afrouxa sozinha)
  acceptance_criteria_source: cli-create
  definition_of_done:
  - guarda com teste + baseline commitada + docs corrigidos + o caminho para (a) fichado como issue
