    summary: |-
      CORRECAO do comentario anterior: escrevi-o com crases e o shell comeu os nomes tecnicos (scope_inheritable, os dois traits, post_save_event sairam vazios). Versao integra abaixo; a anterior fica no historico como o registro do erro.

      MUDANCA DE ESCOPO pelo founder no meio da historia: fazer (a) — o trait — e NAO mexer no README. A reescrita dos docs que eu tinha commitado (915c72d1) foi REVERTIDA; a promessa "knows no Kinds" segue intacta em AGENTS.md, docs/index.md, docs/concepts/index.md e thesis.md. O codigo e que andou na direcao dela.

      O founder tinha razao, e minha medicao inicial errou em algo especifico: eu tratei a lista literal como "mecanismo faltando". Nao era. O mecanismo ja existia — em um dos tres casos, tres vezes.

      TRES TRADUCOES. 49 -> 34 literais (15 removidos, 0 adicionados).

      (1) HERANCA DE ESCOPO — achei um BUG VIVO, e a RECUSA de criar trait e a parte importante.
          "scope_inheritable" JA era atributo de KindPort E campo de descritor
          (kind-definition.schema.json), e "Kernel._NON_INHERITABLE_KINDS" JA derivava
          dele. A lista DEFAULT_NON_INHERITABLE_KINDS_V1 em query/resolver.py era uma
          QUARTA COPIA. Um trait "scope.non-inheritable" seria a TERCEIRA GRAFIA do
          mesmo fato — exatamente o "overdo" que vocabulary.py existe para recusar
          ("a trait that merely restates a fact already declared twice"). Entao apaguei
          a copia em vez de criar vocabulario.
          A copia ja tinha derivado DE NOVO: KindNamespace, Memory, Sprint e
          WorkspaceScopeGrant declaram "scope_inheritable: false" nos proprios
          descritores e NAO estavam na lista, entao get_composition_rule devolvia
          "enabled" — herdavam entre escopos contra a propria declaracao. TERCEIRA
          ocorrencia do padrao Milestone->Epic, achada por tentar apagar a lista, nao
          por alguem notar.

      (2) CAPTURA DE EVIDENCIA — dois traits novos: "record.produces-evidence" e
          "record.is-evidence". Estes CARREGAM comportamento, entao NAO entraram em
          PROPOSED_TRAITS, cuja promessa escrita e "rejeitar custa uma descricao, nunca
          um boot". Criei um terceiro dict, BEHAVIOURAL_TRAITS, com a diferenca escrita
          no lugar: rejeitar um destes e mudanca de CODIGO. A separacao segue a mesma
          razao que separa CORE de PROPOSED — dizer o custo sem precisar diffar commit.
          "Finding" estava no set literal e NAO e Kind registrado (kind_port_for
          devolve None). Um set literal pode nomear Kind que nao existe e nada reclama;
          uma declaracao nao pode, porque nao ha onde pendura-la. O teste antigo
          test_extract_suite_from_finding_source passava sobre um Kind inexistente.

      (3) NOME DE EVENTO post_save — virou "post_save_event", ATRIBUTO e nao trait:
          e um VALOR ("eval_run_completed"), e trait no DNA nao carrega valor por
          decisao escrita em vocabulary.py. Fiado ate o fim: KindBase +
          KindDefinitionSpec.from_raw + DeclarativeKindPort + as DUAS copias de
          kind-definition.schema.json (o gate do schema recusou a primeira tentativa,
          corretamente — additionalProperties: false).

      O GANHO, TESTADO EXPLICITAMENTE NOS TRES: um Kind que o kernel nunca ouviu falar,
      registrado em runtime, DECLARA e recebe o MESMO comportamento do embutido.
        test_a_kind_the_kernel_has_never_heard_of_can_declare_it
        test_a_kind_the_kernel_never_heard_of_can_produce_evidence
        test_a_tenant_kind_can_finally_name_its_own_event
      Antes, nos tres casos, era impossivel — nao "nao estava configurado", mas nao
      havia como dizer.

      FICHADOS, NAO CONSERTADOS (a pedido, com o argumento):
        i-108 accessor.py — 394 linhas, 11 metodos, logica COMERCIAL no core aberto
              (PricingPlan, PlanBinding, Workspace...). Trait nao resolve: mesmo
              derivado, o kernel continuaria com metodos que so servem a quem cobra.
              A saida e MOVER, e e decisao do founder (mexe na fronteira open-core).
        i-109 models.py Typed* — 17 classes, 1.817 linhas, 11 arquivos de extensao
              importando de volta. Inversao de dependencia, nao trait.

      O ERRO QUE EU COMETI, registrado porque e o mais util daqui:
      Escrevi uma guarda derivada nova (test_kernel_kind_literals_guard.py + baseline
      JSON) e o repo JA TINHA UMA MELHOR: test_kind_name_literal_ratchet.py, sobre
      dna.testing.kind_literal_scan.scan_tree, com uma ALLOWLIST que exige um MOTIVO
      ESCRITO por site e que SO ENCOLHE. Apaguei a minha. E foi a dela, nao a minha,
      que pegou a entrada obsoleta de _FIXED_EVENTS depois da traducao. Reinventei roda
      tendo "procurar antes de construir" no indice de memoria.
      Bonus: o motivo que a ALLOWLIST dava para _FIXED_EVENTS ("e uma afirmacao sobre o
      boot, nao sobre o Kind") estava ERRADO, e o proprio arquivo convida a discordar
      ("read them as claims to be argued with, not as permanent grants"). Refutacao
      deixada no lugar da entrada: EvidencePolicy seleciona POR event_type, entao um
      Kind que nao sabe nomear o proprio evento nao pode ser capturado por politica
      nenhuma.

      GOLDENS: os 27 casos de composicao passam com as expectativas CONGELADAS
      INALTERADAS — prova de que a traducao e semanticamente fiel. O caso 07 agora
      DECLARA o Kind de que precisa (bloco "kinds:" no YAML do caso) em vez de depender
      da lista do kernel, entao o golden prova que a DECLARACAO dirige o resolver.
