    summary: |-
      ⚠️ MUDANCA DE ESCOPO pelo founder no meio da historia: fazer (a) — o trait — e NAO mexer no README. A reescrita dos docs que eu tinha commitado (915c72d1) foi REVERTIDA; a promessa 'knows no Kinds' segue intacta em AGENTS.md, docs/index.md, docs/concepts/{index,thesis}.md. O codigo e que andou na direcao dela.

      O founder tinha razao e minha medicao inicial estava errada em algo especifico: eu tratei a lista literal como 'mecanismo faltando'. Nao era. O mecanismo ja existia TRES vezes.

      TRES traducoes feitas, 49 -> 34 literais (15 removidos, 0 adicionados):

      1. HERANCA DE ESCOPO — e aqui achei um BUG VIVO. Nao virou trait, e a recusa e a parte importante:  JA era atributo de KindPort E campo de descritor, e  JA derivava dele. A lista em query/resolver.py era uma QUARTA COPIA. Um trait  seria a terceira grafia do mesmo fato — exatamente o 'overdo' que vocabulary.py existe para recusar. Entao apaguei a copia em vez de criar vocabulario.
         ⚠️ E a copia ja tinha derivado DE NOVO: KindNamespace, Memory, Sprint e WorkspaceScopeGrant declaram scope_inheritable: false nos proprios descritores e NAO estavam na lista, entao get_composition_rule devolvia 'enabled' — herdavam entre escopos contra a propria declaracao. Terceira ocorrencia do padrao Milestone->Epic, achada por tentar apagar a lista, nao por alguem notar.

      2. CAPTURA DE EVIDENCIA — dois traits novos:  e . Estes CARREGAM comportamento, entao NAO entraram em PROPOSED_TRAITS (cuja promessa e 'rejeitar custa uma descricao, nunca um boot'). Criei um terceiro dict, BEHAVIOURAL_TRAITS, com a diferenca escrita: rejeitar um destes e mudanca de codigo. A separacao e pela mesma razao que CORE/PROPOSED sao separados — dizer o custo sem precisar diffar commit.
         ⚠️  estava no literal e NAO e Kind registrado (kind_port_for devolve None). Um set literal pode nomear Kind que nao existe e nada reclama; uma declaracao nao pode, porque nao ha onde pendura-la. O teste antigo test_extract_suite_from_finding_source passava sobre um Kind inexistente.

      3. NOME DE EVENTO post_save — virou , ATRIBUTO e nao trait: e um VALOR ('eval_run_completed'), e trait no DNA nao carrega valor por decisao escrita. Fiado ate o fim: KindBase + KindDefinitionSpec + DeclarativeKindPort + as DUAS copias do kind-definition.schema.json (o gate do schema pegou a primeira tentativa, corretamente).

      ⭐ O GANHO TESTADO EXPLICITAMENTE, nos tres: um Kind que o kernel nunca ouviu falar, registrado em runtime, declara e recebe o MESMO comportamento do embutido (test_a_kind_the_kernel_has_never_heard_of_can_declare_it, test_a_kind_the_kernel_never_heard_of_can_produce_evidence, test_a_tenant_kind_can_finally_name_its_own_event).

      ⛔ Fichados, nao consertados: i-108 (accessor.py, logica comercial no core — mover, decisao do founder) e i-109 (models.py Typed*, inversao de dependencia com 11 arquivos de extensao importando de volta).

      ⚠️ E O ERRO QUE EU COMETI: escrevi uma guarda derivada nova (test_kernel_kind_literals_guard.py + baseline JSON) e o repo JA TINHA UMA MELHOR — test_kind_name_literal_ratchet.py, sobre dna.testing.kind_literal_scan, com ALLOWLIST que exige um MOTIVO ESCRITO por site e que so encolhe. Apaguei a minha. Foi ela, e nao a minha, que pegou a entrada obsoleta de _FIXED_EVENTS. Reinventei roda tendo a licao 'procurar antes de construir' no indice.
         Bonus: o motivo que a ALLOWLIST dava para _FIXED_EVENTS ('e uma afirmacao sobre o boot, nao sobre o Kind') estava ERRADO, e o proprio arquivo convida a discordar ('claims to be argued with'). Refutacao registrada no lugar da entrada: EvidencePolicy seleciona POR event_type, entao Kind que nao sabe nomear o proprio evento nao pode ser capturado.

      Goldens de composicao: 27 passam com as expectativas CONGELADAS INALTERADAS — a traducao e semanticamente fiel. O caso 07 agora DECLARA o Kind que precisa (bloco kinds: no YAML) em vez de depender da lista do kernel.
