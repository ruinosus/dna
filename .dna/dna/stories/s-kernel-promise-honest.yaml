    summary: |-
      Guarda entregue e provada nos tres sentidos.

      DERIVADA, nao enumerada — a exigencia explicita:
      - vocabulario de 'o que e nome de Kind' vem de Kernel.auto(), o registro vivo: 89 Kinds no momento da medicao, ZERO escritos no arquivo da guarda (verificado por regex sobre o proprio fonte: os unicos nomes literais sao Genome/KindDefinition/LayerPolicy, e estao la de proposito, como o trio de bootstrap que o teste fixa — e esse teste FALHA pedindo atualizacao dos docs se algum dia sairem).
      - superficie varrida = a arvore dna/kernel inteira via rglob, nao lista de arquivos. Modulo novo entra coberto no dia em que nasce.
      - docstrings excluidas do scan por AST: prosa que NOMEIA um Kind e documentacao, nao acoplamento.

      RATCHET nos dois sentidos, que e o que separa teto de orcamento:
      - par (kind, arquivo) novo -> falha ('the kernel just learned about Kind(s) it did not know')
      - par removido -> tambem falha, ate o baseline registrar o ganho. Espaco nao gasto tem de voltar, ou a proxima ampliacao o gasta sem ninguem decidir.

      Anti-cegueira: test_the_derived_vocabulary_is_actually_populated exige >=40 Kinds e o trio estrutural. Sem ele, um registro que nao sobe daria vocabulario vazio, scan vazio, guarda VERDE medindo nada — o modo de falha que esta casa ja teve.

      Provas executadas:
      1. injetei 'Postmortem' em manifest.py -> FALHOU nomeando arquivo e Kind
      2. renomeei 'SafetyPolicy' -> FALHOU pedindo o aperto do baseline
      3. 'Sprocket' (nao registrado) nao entra no vocabulario -> guarda nao inventa Kind

      Baseline congelado: 49 pares / 30 Kinds / 16 arquivos.

      Docs corrigidos em 6 lugares: AGENTS.md, docs/index.md, docs/concepts/{index,thesis,microkernel-ports}.md e scripts/ports_prose.py — este ultimo era a fonte da frase em DUAS paginas de referencia geradas, entao corrigir so o .md teria voltado no proximo gen. Zero ocorrencias residuais de 'knows no Kinds' fora do CHANGELOG (historico, nao se reescreve). mkdocs --strict tem 1 warning PRE-EXISTENTE (analysis/dna-market-critique.md fora do nav) — confirmado identico em main.

      Caminho para (a) fichado em i-107 com os tres blocos medidos e o que NAO sai.
