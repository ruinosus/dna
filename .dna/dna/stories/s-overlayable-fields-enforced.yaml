apiVersion: github.com/ruinosus/dna/sdlc/v1
kind: Story
metadata:
  name: s-overlayable-fields-enforced
spec:
  title: OVERLAYABLE_FIELDS becomes a real, enforced, declarable allowlist
  description: 'The per-Kind allowlist of tenant-overridable fields is declared by one Kind, enforced by nothing, and promised by a comment that names a function which does not exist. Make it real: kernel-enforced on BOTH policy ports (write + merge), declarable from a .kind.yaml descriptor next to ui_schema, default = unrestricted.'
  status: in-progress
  feature: f-dna-hosting
  acceptance_criteria:
  - Given a Kind declaring overlayable_fields, When a layer write CHANGES a top-level spec key outside the allowlist, Then LayerPolicyViolationError is raised; And the merge port drops that key with a warning; And a Kind declaring nothing stays unrestricted
  acceptance_criteria_source: cli-create
  definition_of_done:
  - failing test first; enforcement on write+merge ports; descriptor field + both JSON schema copies; regenerated kinds reference; full sdk-py + cli suites green; PR opened
  definition_of_done_source: cli-create
