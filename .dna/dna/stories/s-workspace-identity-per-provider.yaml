apiVersion: github.com/ruinosus/dna/sdlc/v1
kind: Story
metadata:
  name: s-workspace-identity-per-provider
spec:
  title: Durable workspace identity per provider — the consumer lane can resolve a workspace
  description: Derive the durable identity claim from the token's provider stamp on the workspace axis, so a consumer-lane (WorkOS/Google/Clerk/Auth0) identity resolves and binds the same key on every face. Fixes i-072.
  status: in-progress
  feature: f-dna-hosting
  acceptance_criteria:
  - Given a verified token stamped with a provider whose durable subject is 'sub' (WorkOS/Google/Clerk/Auth0), When the workspace axis distills its identity, Then Identity.oid is the token's 'sub' and an active WorkspaceMembership bound to that value resolves the workspace.
  - Given an Entra token (or claims with no provider stamp), When the workspace axis distills its identity, Then Identity.oid is still read from the 'oid' claim — byte-identical behaviour to before.
  - Given a consumer-lane identity creating its first workspace (POST /v1/workspaces) or reconciling ownership (provision-owner), When the claims carry the provider stamp and its durable subject, Then the call succeeds and the grant binds the SAME durable key the MCP door derives — no ValueError('must carry an oid claim').
  - Given the MCP tool-call seam, the REST verified-identity bind and the creation impls, When each resolves an identity, Then all three use ONE core derivation so a grant bound by one is matched by the others.
  acceptance_criteria_source: cli-create
  definition_of_done:
  - 'Code: one provider-aware derivation in dna.tenancy (core), consumed by dna_cli._mcp_auth.identity_from_context, dna_cli._rest_api''s config-auth bind and dna.application.runtime; no vendor branch outside the existing provider table.'
  - 'Tests: RED-first coverage for the consumer lane in packages/sdk-py/tests (pure) and packages/cli/tests (glue) — the blind spot that let this ship; sdk-py tests must not import dna_cli.'
  - 'CI: sdk-py + cli suites green, brand guard green, golden fixtures unchanged.'
  - 'Docs: the tenancy docstrings state that the durable key is per provider, and that DNA_MCP_OID_CLAIM stays a personal-axis knob.'
  definition_of_done_source: cli-create
