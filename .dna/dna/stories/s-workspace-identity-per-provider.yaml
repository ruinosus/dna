    summary: 'Desvio deliberado da recomendacao original (que dizia: so mexer no glue do CLI, dna/tenancy/resolution.py nao precisa mudar). Verifiquei a recomendacao e ela conserta so metade: sdk-py NAO pode importar dna_cli, entao um seam vivendo em _mcp_auth nunca alcanca create_workspace_impl / provision_workspace_owner_impl — o consumidor continuaria sem conseguir CRIAR workspace nenhum, e pior, o par ''chave escrita na criacao'' vs ''chave derivada na porta'' poderia divergir. Alem disso ha um terceiro call site vivo que a recomendacao nao cita: o bind de identidade verificada do REST (_rest_api.py, middleware --auth config). Coloquei UMA derivacao no core (dna.tenancy.identity_claim_key), lida do carimbo de provider que o verificador ja escreve, contra a tabela PROVIDER_ACCOUNT_NAMESPACES que dna.tenancy.accounts JA declara (subject_claim) — nenhum conhecimento de vendor novo entrou no repo, e identity_from_token passou a consultar isso por padrao, o que conserta os tres caminhos sem tocar em nenhum call site. Nao liguei DNA_MCP_OID_CLAIM no eixo de workspace de proposito: e um knob por processo do eixo PESSOAL, e sdk-py nao o enxerga — honra-lo so na face MCP re-quebraria a chave em duas.'
