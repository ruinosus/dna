    summary: 'Entregue e merjado (PR #352). dna_turn.outcome com vazio = DESCONHECIDO imposto em QUATRO lugares (sem backfill, sem inferência, porta de validação única, e consumo ao fechar — o quarto quase escapou: a ContextVar é por-task e uma task serve vários turnos). ⭐ E ele DERRUBOU a premissa da spec: os 8 de 9 turnos com erro sem tokens não eram escrita perdida — 7 morreram em 7-32ms antes de qualquer chamada (zero é a medição CERTA), 1 somou 5.662 e morreu de DiskFull (provando que o caminho de erro já acumulava), e só 1 era perda real e irrecuperável. O defeito era de LEITURA (o zero ambíguo), e o conserto virou tokens_partial.'
