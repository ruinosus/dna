  title: Trazer o Research Kind (síntese curada de N References com findings evidence-rat
  description: 'Trazer o Research Kind (síntese curada de N References com findings evidence-rated + recommendations + citation graph) do SDK upstream pro DNA — infraestrutura de conhecimento agent-facing, a resposta declarativa/curada do DNA ao problema OpenWiki/DeepWiki. Porta a extension research (Py 762loc + twin research.ts) + CLI ''dna research list/show/create'', kernel-bound. Decisões ratificadas (Barna): (1) namespace github.com/ruinosus/dna/research/v1; (2) tenancy PERMISSIVA (research é conhecimento autorado do repo, não dado per-cliente — dna research create sem tenant obrigatório); (3) recall semântico DEGRADA pra query lexical/estruturada (kernel.query) — servidor de embeddings não viajou; recall via pgvector é futuro documentado. Reference companion já existe via extension sdlc. Engenharia: verificar ratchet F3 descriptor-vs-classe (provável classe com exceção registrada — tem lógica computável). Payoff imediato: capturar as 3 pesquisas de hoje (doc-frameworks, exemplar-repos, openwiki-analysis) como Research docs.'
