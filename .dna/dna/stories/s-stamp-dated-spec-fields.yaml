    summary: 'Auditoria empirica, nao por leitura: o guard parametrizado sobre TODOS os create verbs do ''dna sdlc'' rodou vermelho so no Issue (12 casos, 11 verdes de primeira). Unico builder com o buraco = Issue, nas DUAS faces (build_issue_spec no core e cmd_issue_file no CLI, que montava um dict identico a mao). Spike/Bug/Task/ADR/Spec ja passam por _stamp_create; Story/Feature/Epic/Initiative/Plan carimbam inline; Kaizen carimba created_at. Engram (memory.verbs), StatusReport (generated_at) e AgentSession (started_at, adapter fora desta distribuicao) auditados e limpos.'
    commit_ref: e2bc0e365cc8704f504e7a9267d2a1af4817d6a0
