    source: cli
    summary: 'Decidi datar o backfill pela primeira entrada da timeline, com fallback no commit que ADICIONOU o arquivo, e deixar sem data (reportando) quando nao ha nenhum dos dois. Carimbar ''now'' faria 51 Issues do dna-cloud parecerem abertas hoje: entrariam todas na janela atual do digest e sumiriam das janelas a que pertencem — uma versao mais barulhenta do proprio i-078. Verificado: created_at/updated_at estao em KindBase.VOLATILE_SPEC_FIELDS, entao canonical_digest (a identidade que o source-sync compara) NAO muda com o backfill — teste em test_dated_spec_fields.py prova.'
    commit_ref: e2bc0e365cc8704f504e7a9267d2a1af4817d6a0
