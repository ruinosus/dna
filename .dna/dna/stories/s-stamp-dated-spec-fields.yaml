spec:
  title: Every work-item write path stamps the spec fields a read surface dates by — Issu
  description: Every work-item write path stamps the spec fields a read surface dates by — Issue was invisible in the digest's 'found' bucket because build_issue_spec and cmd_issue_file never wrote created_at (i-078). Fix at the source, backfill the existing boards, and add a guard so the class cannot recur.
  status: done
  feature: f-sdlc-digest
  acceptance_criteria:
  - text: Given an Issue filed via the MCP create_issue tool or the dna sdlc issue file CLI, When it is written, Then spec.created_at and spec.updated_at are stamped and a title may be supplied
    done: true
    done_at: '2026-08-13T15:07:40+00:00'
    done_by: story-done-auto
  - text: Given a board whose Issues predate the fix, When the backfill runs, Then each Issue's created_at is derived from an honest historical signal (first timeline event, else git first-commit date of the file), never from 'now'
    done: true
    done_at: '2026-08-13T15:07:40+00:00'
    done_by: story-done-auto
  - text: Given a work-item builder that omits a spec field a read surface dates/sorts/filters by, When the test suite runs, Then a guard fails naming the Kind and the field
    done: true
    done_at: '2026-08-13T15:07:40+00:00'
    done_by: story-done-auto
  acceptance_criteria_source: cli-create
  definition_of_done:
  - text: code+tests (RED then GREEN)+guard proven to bite+docs regenerated+both boards backfilled+PRs opened in dna and dna-cloud
