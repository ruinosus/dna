  - at: '2026-08-12T14:20:38+00:00'
    actor: claude-code
    type: decision
    source: cli
    summary: |-
      PR #385 merjada no verde (14 checks, sdk-py 3.12 e 3.13 inclusos).

      O QUE FICA, em uma frase: a suite testa o CONTRATO porque foi escrita a partir da spec sem olhar servidor nenhum, e ela propria e testada por MUTACAO — 45 defeitos que a spec nomeia, cada um tendo de fazer o SEU caso falhar por nome. Uma regra que a suite nao PEGA e uma regra que a suite nao tem, por melhor que ela leia.

      A decisao de desenho que mais rendeu: QUATRO resultados em vez de dois. 'Nao rodou' e 'nao da para ver de fora' sao coisas diferentes de 'passou', e um relatorio que as juntasse reproduziria, no proprio resumo, a confusao que a secao 7 proibe o servidor de fazer entre resposta vazia e pergunta sem resposta. Por isso DnapCaseNotApplicable nao COMPILA sem dizer o que ficou sem checagem, e DnapRuleUnverified nao e skip: e AssertionError, e report.ok e False enquanto existir.

      O caso que mais custou pensamento foi o mais importante e o mais facil de escrever inutil: 'falha nunca vira colecao vazia'. Perguntar a um servidor saudavel e ver que ele nao mentiu nao prova nada. Ficou em quatro camadas, e a primeira e um CONTROLE POSITIVO em toda sonda negativa — sem ele, um servidor que erra em TUDO passa em todas elas. Isso tem teste proprio.

      A revisao de sala limpa (479 -> 676 linhas) chegou no meio e deixou a entrega MAIOR: quase toda lacuna que ela fechou virou regra cobravel. 50 casos -> 66, 27 mutantes -> 45. E o encontro dos dois metodos vale registrar: dos nove buracos que esta suite reportou contra o rascunho, a sala limpa achou SEIS sozinha. Dois leitores sem contato convergindo e evidencia de que os buracos eram reais.
    commit_ref: 1e423d44524042447cbbf3478430f01d18e754fe
  - at: '2026-08-12T14:20:42+00:00'
    actor: claude-code
    type: comment
    source: cli
    summary: 'Sem smoke de PRODUTO porque nao ha produto para fumegar: a entrega e biblioteca (dna.testing.dnap_conformance) e cliente (dna.dnap), sem superficie de UI. A metade automatizada esta provada pelo CI da #385, e a metade que um humano validaria — ''a suite realmente pega o defeito?'' — esta provada por 45 mutantes, que e uma evidencia mais forte do que uma passada manual.'
