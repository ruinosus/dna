  name: s-dnap-conformance-suite
spec:
  title: A suite de conformidade DNAP 1.0 + o DnapClient, escritos a partir da SPEC e NAO
  description: 'A suite de conformidade DNAP 1.0 + o DnapClient, escritos a partir da SPEC e NAO do servidor — que outro agente implementa em paralelo. A ordem E o valor: uma suite derivada da implementacao passa por construcao e nao prova nada.'
  status: in-progress
  feature: f-dnap-protocol
  acceptance_criteria:
  - Given um servidor DNAP atras de um endpoint JSON-RPC, When a suite roda, Then cada obrigacao da secao 8 vira um caso nomeado que passa, falha ou PULA COM MOTIVO EXPLICITO — nunca um silencio que se leia como aprovacao
  - Given um servidor que responde colecao vazia quando nao conseguiu ler, When a suite roda, Then ela FALHA — e cada caso e provado por MUTANTE, nao por leitura
  - Given o DnapClient, When alguem escrever um nome de Kind literal no seu codigo, Then um teste falha (varredura AST contra o registro vivo), e o proprio teste e provado por mutante
  acceptance_criteria_source: cli-create
  definition_of_done:
  - codigo + testes com mutantes + prosa em docs/concepts; pytest verde; guardas verdes
  definition_of_done_source: cli-create
