  acceptance_criteria:
  - Given memórias com retenções acima e abaixo do piso, When consolidate(dry_run=True), Then o relatório traz uma ação por memória (retain/expire/already_expired) com razão determinística e NADA é escrito; Given a mesma chamada sem dry_run, Then o shape e o comportamento são byte-idênticos ao de hoje; Given duas memórias com forte sobreposição lexical, When dry_run, Then merge_candidates traz o grupo com canônico determinístico, evidência de sobreposição e proposed_spec sem LLM; Given a face MCP, When a tool consolidate recebe dry_run=true, Then o relatório estruturado atravessa a porta
  acceptance_criteria_source: cli-create
