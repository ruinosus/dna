  title: 'consolidate dry-run: relatório estruturado + candidatos de fusão'
  description: 'Desbloqueio do i-050 do dna-cloud (consolidação com diff): consolidate ganha dry_run com relatório por memória (retain/expire/already_expired + razão determinística) e candidatos de fusão determinísticos (grupos por sobreposição lexical, canônico + supersede) — a proposta separada da aplicação. A síntese de texto fundido fica no seam MergeScribe (externo, opcional): o kernel não acopla modelo.'
  status: in-progress
