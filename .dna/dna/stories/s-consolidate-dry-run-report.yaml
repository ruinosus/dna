    summary: 'Decisões de desenho: (1) dry_run vence apply — preview nunca escreve, e sem dry_run o shape do relatório é byte-idêntico ao legado (guardado por teste de chaves exatas). (2) Ações são três e determinísticas: retain/expire/already_expired — ''expire'' É a demoção bi-temporal do forget, prevista; não inventei um 4º estado ''rebaixar'' porque no passe determinístico demoção e expiração são a mesma operação (valid_to). (3) Candidatos de fusão sem LLM: Jaccard sobre engram_text (mesmos planos que o recall embeda) + stopwords mínimas fixas, union-find p/ grupos transitivos, canônico por confiança>recência>nome (ordem total). Proposta default ''supersede'' (manter canônico, forget(superseded_by=canônico) nos demais — maquinário que já existe). (4) A síntese de texto fundido NÃO entrou no kernel: o contrato exato é o Protocol MergeScribe (specs do grupo, canônico primeiro → spec fundido com summary; fail-soft p/ supersede + scribe_error). (5) REST: não existe rota consolidate hoje — fora do escopo, sem rota nova. (6) Gating MCP inalterado: consolidate segue memory_op=write mesmo em dry_run — afrouxar preview p/ tier read é decisão de produto, não desta story.'
