    commit_ref: 4b6d19a89c746ebc86924ebdb3d6775575031502
    summary: 'Entregue e merjado (PR #356). A BUSCA PAGOU-SE NA PRIMEIRA HORA: kernel.search() já existia e é público (kernel/query/search.py), com o envelope {hits,degraded} e o fallback lexical escritos — os únicos chamadores eram de MEMÓRIA. Então a lacuna era ALCANCE, não motor, e a tool virou COLA e não um segundo caminho. Zero reimplementação: um teste lê a AST do módulo e falha se ele importar dna.adapters.search.*, e outro falha se a porta reordenar o ranking do motor. A degradação ficou melhor que o pedido: o kernel colapsava duas situações num booleano; a porta separa em quatro estados com motivo e um aviso em PROSA (porque o leitor é um modelo), e o teste prova que os dois vazios são respostas diferentes com hits==[] nos dois. Tenant provado contra o provider REAL com dois tenants. E um achado que ninguém tinha: sem backfill_index, uma busca sobre um Kind devolvia VAZIO com degraded:false contra um provider saudável — a resposta errada vestida de certa.'
