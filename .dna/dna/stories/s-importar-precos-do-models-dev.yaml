  - ⚠️ Dado que a importacao e um ATO DATADO, quando a leitura de ROI calcula, entao ela NAO faz chamada de rede — o preco e dado nosso, versionado
  - Dado um modelo cujo last_updated e antigo, quando a leitura roda, entao o preco sai marcado como suspeito pelo teto de idade — mesmo tendo vindo de um servico vivo
