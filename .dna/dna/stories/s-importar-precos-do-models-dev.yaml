  title: O preço vem do models.dev — importado e datado, nunca consultado ao vivo
  description: models.dev (MIT) publica cost.input/output por milhao em USD, com last_updated. Encaixa 1:1 no ModelProfile e da origem real ao cost_quoted_at que a i-101 decidiu.
