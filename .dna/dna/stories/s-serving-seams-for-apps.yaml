spec:
  title: 'Seams públicos pra apps out-of-tree comporem serving sem arquivo: build_rest_app'
  description: 'Seams públicos pra apps out-of-tree comporem serving sem arquivo: build_rest_app(auth_providers) + dna.migrations; + fixes de runtime que o dna-cloud precisa'
  status: done
  feature: f-copilot-mcp-apps
  priority: high
  labels:
  - serving
  - migrations
  - runtime
  reporter: claude-code
  acceptance_criteria:
  - text: Dado que build_rest_app(auth=config) só montava o verifier lendo dna.config.yaml de disco (file I/O no core) e escondia _multi_provider_verifier no privado, quando esta story fecha, então build_rest_app aceita auth_providers (mappings ou ProviderConfig) e constrói o verifier internamente SEM I/O de arquivo, e a CLI (api_cmd) lê o arquivo e passa auth_providers — a CLI é UM consumidor, não o caminho
    done: true
    done_at: '2026-08-13T15:13:06+00:00'
    done_by: story-done-auto
  - text: Dado que run_migrations vivia escondido em dna.adapters._migrations, quando esta story fecha, então dna.migrations expõe o motor como seam público NEUTRO (zero menção a consumidor), consumível por dna-cloud e futuros DNA Live/Marketplace, cada um com sua própria control table
    done: true
    done_at: '2026-08-13T15:13:06+00:00'
    done_by: story-done-auto
  - text: Dado o copiloto do dna-cloud, quando ele roda contra o runtime, então mcp_tools resolve multi-workspace pelo PATH da URL e langchain_rt/maf_rt honram DNA_MCP_URL do ambiente (endpoint é config de deploy, não declarativo)
    done: true
    done_at: '2026-08-13T15:13:06+00:00'
    done_by: story-done-auto
  acceptance_criteria_source: cli-create
  definition_of_done:
