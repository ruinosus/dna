    summary: 'Decidi derivar o conjunto de refuse do generic write de KindPort.is_overlayable=False em vez de digitar {Genome, LayerPolicy, KindDefinition}, porque uma lista digitada seria exatamente a doenca que esta feature cura — e porque o kernel ja declara esse marcador (''nenhuma layer forka este Kind''). Medido: a derivacao da hoje precisamente os tres Kinds de bootstrap; o teste trava isso como ratchet, entao um Kind novo que declare is_overlayable: false no descriptor aparece coberto e visivel.'
    commit_ref: 13ccf1ebddaa979d897f1740b56774b4531c37db
  - at: '2026-07-26T07:17:59+00:00'
    actor: claude-code
    type: decision
    source: cli
    summary: 'Decidi que a familia de quota vem do KIND ALVO (family_for_kind sobre o namespace do apiVersion + MEMORY_KINDS do SDK), nunca da escolha de ferramenta: o MESMO port resolvido fornece o apiVersion escrito e a familia medida, entao medidor e escrita nao podem divergir. E nome de Kind ambiguo e RECUSADO sem api_version — adivinhar deixaria o registry escolher a familia de cobranca do chamador. Regra uniforme no write: exige <family>_mode == write (sdlc_mode/memory_mode ja existiam; adicionei definitions_mode/emit_mode ao descriptor PricingPlan para que a permissao seja declaravel em vez de beco sem saida). Plano que nao declarou o modo concede none — fail closed.'
    commit_ref: 13ccf1ebddaa979d897f1740b56774b4531c37db
  - at: '2026-07-26T07:18:04+00:00'
    actor: claude-code
    type: decision
    source: cli
    summary: 'Decidi que list_kinds reporta APENAS os Kinds cuja familia o plano do chamador desbloqueia (filtered_by_plan: true), nao o registry inteiro: um catalogo de 76 Kinds dos quais 60 respondem 403 na chamada seguinte custa ao agente 60 round-trips e ao operador 60 unidades medidas. Catalogo honesto e curto ganha de catalogo inflado. Sem token (stdio/self-host) nada e medido, logo tudo e acionavel e tudo aparece.'
    commit_ref: 13ccf1ebddaa979d897f1740b56774b4531c37db
