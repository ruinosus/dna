apiVersion: github.com/ruinosus/dna/sdlc/v1
kind: Story
metadata:
  name: s-mcp-generic-document-tools
spec:
  title: 'The MCP face has 21 hand-written tools and no loop over the Kind registry: 76 re'
  description: 'The MCP face has 21 hand-written tools and no loop over the Kind registry: 76 registered Kinds (49 record-plane, 35 declared purely by a .kind.yaml descriptor) are invisible to any agent over MCP unless someone hand-writes tools for them. The CLI already solved this generically in-process (_ctx._LocalDocs, ~1310 generic lines of ''dna doc'' serving every Kind) but never served it. Add four registry-driven, generic-over-Kind tools on the MCP face — list_kinds / list_documents / get_document / write_document — routed through the existing _guard tenancy+quota seam, scope binding and kernel.write_document, with the generic write failing CLOSED on the bootstrap Kinds (KindDefinition / LayerPolicy / Genome) and metered by the family DERIVED from the target Kind so an sdlc write can never be reached on a tier granting sdlc_mode: read.'
  status: in-progress
  feature: f-dna-mcp-server
  acceptance_criteria:
  - Given a Kind with no hand-written MCP tool (e.g. ModelProfile), When an agent calls list_kinds/list_documents/get_document against a real scope, Then it discovers, lists and reads that Kind's documents
  - 'Given a caller whose tier grants sdlc_mode: read, When it calls write_document for an SDLC Kind, Then the write is DENIED by the sdlc_mode gate (the generic tool opens no path the hand-written SDLC write tools do not honor)'
  - Given any caller, When it calls write_document for a bootstrap Kind (KindDefinition / LayerPolicy / Genome — the Kinds the kernel marks is_overlayable=False), Then the write is refused fail-closed with a message naming the Kind and the reason
  - Given an authenticated caller bound to a workspace, When it names another workspace's scope on any generic tool, Then the existing scope-binding denies it (no new bypass)
  acceptance_criteria_source: cli-create
  definition_of_done:
  - code+tests (RED then GREEN, plus deliberate-break evidence for every refusal) + docs (mcp-server guide) + generated Kinds reference regenerated + full CLI and SDK suites green
  definition_of_done_source: cli-create
