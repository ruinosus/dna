    summary: 'Entregue e merjado (PR #362). ⚠️ E ele DERRUBOU o número da própria story: não são ''5 de 7 sem runs_in'' — são 9 de 9, 100%. O cinco vinha da frase ''cinco copilotos não estão em App nenhum'', que é App.copilots (COMPOSIÇÃO), não runs_in (EXECUÇÃO) — e o cabeçalho do copilot.kind.yaml gasta TRINTA LINHAS medindo esse 1:N justamente para recusar inverse_of entre os dois. A descrição da story reuniu os dois lados que o Kind separou de propósito. A guarda os conta em linhas separadas e NUNCA SOMA. ⭐ E um achado que decidiu onde ela lê: dna_edges está atrasado NOS DOIS SENTIDOS — carrega 1 aresta de um App que não existe mais e não tem nenhuma das 2 de um App que existe. Uma guarda sobre o grafo derivado contaria a de um morto e perderia as de um vivo; por isso ela lê DECLARAÇÃO. Virou comando irmão (dna copilot orphans) e não seção do provenance, porque os contratos de saída se CONTRADIZEM: provenance sai 0 num scope vazio (não ter passado é legítimo) e este tem de sair 1 (um portão que se abre sozinho anuncia o dia errado) — e as duas estão certas.'
