    summary: 'Onda 1 pronta. Registro de metodos com capacidades DERIVADAS da tabela: a onda 2 registra resolve/* e search/* e o dispatch nao muda uma linha. stdio NDJSON (o mesmo framing do stdio do MCP; RFC 8259 escapa control chars, entao a linha e segura por construcao). JSON-RPC escrito a mao — busca registrada em i-113, a decisao de peso e do fundador. 19 mutantes mortos, um por regra normativa. Quatro achados abertos: i-109 (a projecao aceita ''spec'' e devolve so o nome), i-110 (nenhuma porta expoe marca d''agua de canal), i-111 (secao 6.1 vs. o portao de aprovacao de Kind), i-112 (lacunas da tabela de erros). A spec mudou no meio (sala limpa, 12 buracos): rebase feito, os cinco itens novos da minha fatia implementados e testados.'
