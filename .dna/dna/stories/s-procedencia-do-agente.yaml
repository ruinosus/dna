      PR https://github.com/ruinosus/dna/pull/357, e um achado do fechamento que vale registrar.

      A primeira rodada da suíte deixou 5 vermelhos (1 em test_campos_opcionais_por_evidencia.py, 4 em test_solution_kind.py). Confirmados PRE-EXISTENTES com `git stash` sobre o main daquele instante — e o histórico confirma pelo outro lado: o workflow `python` em 4a32b7b5 (o commit em que este branch nasceu) está `failure`. O PR #354 entrou no main durante esta story; depois do rebase os cinco SUMIRAM sem que uma linha deste PR mudasse.

      ⚠️ A lição é sobre o método, não sobre os testes: "vermelho pré-existente" foi a conclusão CERTA e teria sido fácil demais aceitar como estado permanente. O que a fechou foi ter ido conferir o histórico de CI do main em vez de só comparar com o commit-base local — o commit-base era vermelho, o main não era mais.

      VERIFICAÇÃO FINAL, sobre o main rebaseado: sdk-py 5843 passed / 0 failed, cli 2033 passed / 0 failed (invocações separadas, PYTHONPATH fixado neste checkout). `regen-derived.sh` inteiro rodado DE NOVO depois do rebase — nada mudou, os derivados já estavam em sincronia.

      E a porta foi passada à mão contra instâncias reais, não só em teste: `dna copilot provenance --scope concierge` sobre as 4 do examples/emitting-to-a-runtime devolve "0/4 com procedência declarada · 4 não-respondido(s) · 0 pendurado(s)" — que é exatamente o que a story pediu que fosse dito, e não "escrito à mão".
    commit_ref: 9dba5930ee702be500c3c5c1df6f7409507bcfe3
