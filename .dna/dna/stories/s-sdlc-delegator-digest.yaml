    summary: 'Implementado: dna_cli/_digest.py (agregador PURO build_digest + resolve_since, kernel-free) + comando ''digest'' isolado no fim de sdlc_cmd.py (não toca cite/epic show). Janela --since aceita ISO|Nh/Nd/Nw|last-digest|default-24h. Agrega Story/Feature/Epic/Issue/ADR/Kaizen/Spike/Bug/Task/Initiative → Concluído/Decidido/Achado/Precisa-de-você + Avançou/Releases/Artefatos. Decidi (1) ADR aceito conta como DECISÃO, não Concluído (evita double-count); (2) ''Precisa de você'' é current-state (não-windowed) — um blocked de 3 dias atrás ainda precisa de atenção; (3) dedupe kaizen-event vs Kaizen-doc preferindo o doc canônico. --save persiste StatusReport digest-<data> (insight=''sdlc-digest'', verdict+heuristic embedded p/ recall). 23 unit tests verdes.'
