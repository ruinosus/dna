  title: 'Tier A (ratificado Barna): trazer o ModelProfile do SDK upstream como evolução —'
  description: 'Tier A (ratificado Barna): trazer o ModelProfile do SDK upstream como evolução — Kind GLOBAL com limites por modelo (instruction_token_cap, context_window, modalidades) + enforcement de prompt-budget no write path (write de Agent cujo instruction excede o cap do modelo declarado → veto hook com erro didático; modelos chat = warn). Lição de outage real do projeto-mãe: nunca hardcodar token caps — sempre ler do ModelProfile. Extension modelreg (84loc upstream) + descriptor/classe conforme ratchet + paridade TS + PROSA (o coverage guard vai exigir: concept ou seção + menção do grupo CLI se houver).'
