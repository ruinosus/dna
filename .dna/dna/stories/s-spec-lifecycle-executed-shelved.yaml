apiVersion: github.com/ruinosus/dna/sdlc/v1
kind: Story
metadata:
  name: s-spec-lifecycle-executed-shelved
spec:
  title: 'O ciclo de vida da Spec ganha os dois estados terminais que faltavam: ''executed'''
  description: 'O ciclo de vida da Spec ganha os dois estados terminais que faltavam: ''executed'' (o desenho virou código — terminal positivo) e ''shelved'' (direção decidida como ''não agora''; o desenho continua válido — terminal neutro). Verbos com evidência obrigatória (spec executed --summary / spec shelve --reason) e --reason no deprecate, que não tinha. Aditivo e retrocompatível: os cinco estados ARTIFACT_STATUSES mantêm significado byte-a-byte e Plan/ADR não herdam nada.'
  status: review
  feature: f-dna-sdlc-expressiveness
  acceptance_criteria:
  - 'Given uma Spec accepted que já shipou, When ''dna sdlc spec executed <n> --summary "PR #X"'', Then status=executed + executed_at + execution_summary no doc e o summary na timeline'
  - Given uma Spec cuja direção foi decidida como 'não agora', When 'dna sdlc spec shelve <n> --reason "..."', Then status=shelved + shelve_reason, e 'accept' a desengaveta
  - Given uma Spec deprecated ou superseded, When 'spec executed', Then a transição é RECUSADA antes da escrita, nomeando o status atual e os que serviriam
  - Given um doc Spec escrito antes desta mudança, When validado, Then continua válido e projeta como sempre projetou (accepted = trabalho pendente)
  acceptance_criteria_source: cli-create
  definition_of_done:
  - 'código + testes (SDK: arco/transições/projeção/retrocompat; CLI: os três verbos e a evidência obrigatória) + docs regeneradas (kinds/CLI/data-model) + guards verdes'
  definition_of_done_source: cli-create
  created_at: '2026-08-05T23:01:42+00:00'
