    summary: 'MEDIDO contra a face REST real antes de desenhar. (1) fields nao devolve o spec: ?fields=spec e ?fields=* respondem [{name}] e ecoam projected:[spec] — aceita e ignora. Logo load_all e 1+N+M, nao 1+N. (2) Custo real do scope dna-cloud (433 instancias, 88 Kinds no registry): 522 chamadas, 1,13s de parede com 8 vias, 2,4 MiB. (3) A face NAO publica header ETag (o corpo carrega um campo etag) — revalidacao condicional nao esta disponivel, entao offline foi DECIDIDO: falha alta por padrao, stale opt-in duplo e sempre anunciado. (4) As rotas de instancia ignoram ?scope= e respondem o scope DERIVADO da credencial — uma porta serve UM scope, e o adaptador recusa (RemoteScopeMismatch) em vez de entregar conteudo de um scope sob o nome de outro. Escolha: (a) sobre as rotas que existem, com o custo dito. O endpoint em lote (GET /v1/scopes/{scope}/instances?full=1) fica NOMEADO e nao construido — e mudanca na porta REST publica, decisao do fundador.'
    commit_ref: 66917c59ebc8f3e3bff94214e4e1784d883f9bd2
