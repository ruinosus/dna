  title: Um SourcePort sobre https:// que resolve definicoes de um DNA hospedado por TOKE
  description: Um SourcePort sobre https:// que resolve definicoes de um DNA hospedado por TOKEN, nunca pela DSN do Postgres. Fecha i-106.
  status: in-progress
  feature: f-dna-dx-consume
  acceptance_criteria:
  - Given DNA_SOURCE_URL=https://host/v1 e um bearer, When DnaClient.from_env(scope=X).resolve_copilot(nome), Then o copiloto resolve pela rede sem mudar a forma de from_env/resolve_*
  - Given a rede cai ou o token e invalido, When qualquer leitura, Then ResolveNetworkError/ResolveAuthError sobem — nunca lista vazia
  acceptance_criteria_source: cli-create
