    actor: claude-code
    type: comment
    source: cli
    summary: 'Duas descobertas durante a implementacao que mudam o que da para prometer. (1) O registry tem UMA porta por chave (apiVersion, kind): dois scopes que declaram descritores DIVERGENTES sob a mesma chave ja sao recusa de i-080 (''one apiVersion namespace has one owner''), o que e anterior a i-096. Entao ''local vence pai'' aqui significa a coisa mais estreita e real: a passada do ancestral nunca desregistra e substitui uma porta que o filho ja tem. (2) O mutante da guarda so morre no ramo LAZY — no eager, build() re-registra o descritor local depois, entao local venceria mesmo sem a guarda. O teste esta parametrizado por modo de boot exatamente por isso, e o lazy e o ramo que ensure_kinds (e portanto toda rota REST/MCP de documento) realmente toma.'
