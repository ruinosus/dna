kind: Story
metadata:
  name: s-kind-inheritance-declared-chain
spec:
  title: Kinds da base descem a cadeia declarada (i-096)
  description: 'i-096: um KindDefinition declarado no scope base nao era herdado pelo scope do tenant — os DOCUMENTOS desciam a cadeia (compute_resolution_chain) mas os KINDS nao, porque KindDefinition e Kind de BOOTSTRAP. O instance_builder passa a re-rodar o funil de registro com os bootstrap docs de cada ancestral declarado, ligados ao scope descendente.'
  status: review
  feature: f-dna-hosting
  priority: high
  labels:
  - kernel
  - kinds
  - tenancy
  acceptance_criteria:
  - text: Given um KindDefinition aprovado declarado SO no scope base, When um scope filho que declara parent_scope=base e composto (lazy OU eager), Then o Kind e resolvivel, enumerado por list_kinds, e ESCRIVEL a partir do filho — validado pelo schema da base e roteado para o container da base, dentro do diretorio do filho.
    done: true
    done_at: '2026-08-06T10:07:07+00:00'
    done_by: claude-code
    evidence: 'PR #326 — CI inteira verde (sdk-py 3.12/3.13, cli 3.12/3.13, postgres, client-py/ts, brand-guard, docs). tests/test_kind_inheritance_declared_chain.py: 12 casos, 7 falham sem o conserto, os dois mutantes morrem.'
  - text: 'Given um scope IRMAO que declara um Kind proprio, When o scope filho e composto no mesmo processo, Then o Kind do irmao continua invisivel: nao resolve, nao enumera, nao valida e nao roteia — i-081 intacto. Idem para cima: o Kind do filho nunca alcanca a base.'
    done: true
    done_at: '2026-08-06T10:07:07+00:00'
    done_by: claude-code
    evidence: 'PR #326 — CI inteira verde (sdk-py 3.12/3.13, cli 3.12/3.13, postgres, client-py/ts, brand-guard, docs). tests/test_kind_inheritance_declared_chain.py: 12 casos, 7 falham sem o conserto, os dois mutantes morrem.'
  - text: Given base e filho declarando descritores divergentes para a mesma chave, When o filho e composto, Then o descritor LOCAL governa (a passada do ancestral nunca substitui uma porta ja registrada).
    done: true
