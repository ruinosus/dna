spec:
  title: 'Revisão ao vivo do copiloto: painel de cobertura da consulta que se preenche (a '
  description: 'Revisão ao vivo do copiloto: painel de cobertura da consulta que se preenche (a revisar → conduzido) periodicamente + botão + config, sobre a transcrição INTEIRA. Protótipo aprovado pelo Barna.'
  status: review
  feature: f-dna-cloud-intelligence
  priority: high
  labels:
  - frontend
  reporter: claude-code
  business_value: 650
  acceptance_criteria:
  - 'Review periódico enquanto ''capturando'': timer configurável (30s/60s/2min) via UI + toggle auto-review + botão ''Revisar agora'' — sem esperar o encerramento.'
  - 'Painel de cobertura: coluna ''A revisar'' (pendentes, com justificativa+baseadoEm) e ''Conduzido'' (cobertos); anel de cobertura N/M; item migra pendente→conduzido ao registrar.'
  - A extração roda sobre a transcrição INTEIRA + prontuário (contexto completo), NÃO os últimos 12 turnos — distinto do tip-suggester.
  - Painel passivo que se preenche (não pop-ups que interrompem); 'a revisar' = 'pode ter passado', nunca 'faça X'. Atrás da flag CONDUCT_MODULE_ENABLED + marcador SaMD.
  acceptance_criteria_source: cli-create
  definition_of_done:
  - 'npm test verde (novos testes: categorização coberto/pendente + full-context + loop); loop de encerramento continua funcionando.'
  - COACH_LLM=mock npm start roda o novo painel ponta-a-ponta; branch feat/live-review off feat/regulated-split, sem push.
  - Design fiel ao protótipo aprovado (anel, grupos, controles, countdown, contexto-inteiro explícito).
  definition_of_done_source: cli-create
