    actor: claude-code
    type: decision
    source: cli
    summary: 'A casa e packages/cli/dna_cli/_mcp_egress.py — IRMAO de _mcp_quota, nao dentro dele. Tres razoes: (1) a direcao da dependencia so pode ser egresso -> resolucao de tier, e um modulo irmao torna isso estrutural; (2) _mcp_quota e o MEDIDOR (contadores, stores, caps) e egresso e politica de DESTINO, que nao conta nada; (3) NAO pode ir para dna-sdk: o resolvedor de tier que a politica consulta mora no pacote CLI, e o sdk esta ABAIXO dele no grafo de dependencia — poria metade de uma politica em cada pacote e inverteria o import.'
    commit_ref: 546083daed8b1ada0db9939bfa1d6738bb0ce6da
  - at: '2026-08-06T06:02:41+00:00'
    actor: claude-code
    type: decision
    source: cli
    summary: 'O gate de tier virou parametro (unrestricted_tiers) com default que reproduz a decisao vigente, e NAO um cap lido do registro — apesar do contrato do proprio Kind PricingPlan dizer que cap literal em codigo e bug. Motivo: virar cap exige campo no schema mais edicao coordenada dos documentos de plano ja implantados, e um plano sem o campo novo passaria de irrestrito para so-allowlist em silencio. O fallback que esconderia isso e o padrao errado. Registrado como Issue/i-098 em vez de contrabandeado.'
    commit_ref: 546083daed8b1ada0db9939bfa1d6738bb0ce6da
  - at: '2026-08-06T06:02:43+00:00'
    actor: claude-code
    type: comment
    source: cli
    summary: 'Endurecimento de graca no caminho: no original, um resolvedor que estoura assumia ''free'' e a decisao seguia por NOME. Agora a falha devolve (tier_para_log, irrestrito=False) — restrito estruturalmente, de modo que nenhuma configuracao de unrestricted_tiers transforme queda de kernel em egresso aberto. Um teste fixa isso passando o proprio FAILSAFE_TIER como irrestrito.'
    commit_ref: 546083daed8b1ada0db9939bfa1d6738bb0ce6da
  - at: '2026-08-06T06:02:45+00:00'
    actor: claude-code
