    summary: 'Verificacao de que adotar e troca de import: rodei a tabela de casos inteira do teste de paridade do consumidor (dentro/fora, os dois planos, lista vazia, prefixo sosia, entrada malformada, resolvedor que cai) contra a implementacao ANTIGA e a nova, mais 5 casos de objeto com duas URLs. Zero divergencias. Suite do pacote: 1500 passed, 21 skipped; brand_guard limpo.'
    commit_ref: 546083daed8b1ada0db9939bfa1d6738bb0ce6da
