metadata:
  name: s-mcp-egress-policy-shared
spec:
  title: A politica de egresso de MCP externo por plano vira UMA, no pacote CLI ao lado d
  description: A politica de egresso de MCP externo por plano vira UMA, no pacote CLI ao lado do resolvedor de tier, para as duas apps do dna-cloud importarem em vez de copiarem.
  status: in-progress
  feature: f-dna-hosting
  priority: high
  labels:
  - cli
  - quota
  - mcp
  - egress
  reporter: claude-code
  acceptance_criteria:
  - Given as duas apps consumidoras hoje carregam a MESMA politica copiada, When a politica passa a morar em dna_cli, Then ambas conseguem importa-la (allowlist, predicado de URL, filtro por plano, particao all-or-nothing) e o nome da env vem do modulo, nao de um literal repetido
  - Given a assinatura tem de servir os DOIS chamadores, When um chama com uma lista de dicts {url} e o outro com objetos de 1..N URLs, Then os dois casos sao cobertos sem que o consumidor reimplemente o laco de decisao
  - Given retrocompat e requisito, When a mudanca entra, Then nada que ja existia no SDK/CLI muda de comportamento — e adicao pura, e o default do gate de tier reproduz exatamente a decisao vigente
  acceptance_criteria_source: cli-create
  definition_of_done:
  - modulo novo em packages/cli/dna_cli + testes no padrao do pacote (uv run pytest) verdes + brand_guard limpo + PR aberto sem merge; SEM bump de versao (o lote da release e do fundador)
  definition_of_done_source: cli-create
