    actor: claude-code
    type: comment
    source: cli
    summary: |-
      Fatias 2, 3 e 4 implementadas e verdes nos DOIS dialetos (SQLite sempre; Postgres via DATABASE_URL, rodado contra o pg local do compose do dna-cloud).

      DECISOES que fecharam duvidas do desenho:

      1) to_scope so e preenchido quando a resolucao foi LOCAL. get_document faz fallback para escopos pais (heranca e o DEFAULT hoje, _DenylistInheritable), e ele nao diz de onde veio o doc. Adicionei Kernel.get_document_local (a MESMA leitura que get_document faz primeiro, logo um hit de cache) so para atribuir. Resolveu num pai => to_scope NULL, nunca o scope de quem escreve — afirmar relacao intra-escopo que nao existe e a mentira que a coluna existe para evitar.

      2) A aresta que FECHA um ciclo e reportada (flag closes_cycle) e apenas nao e expandida. Anti-ciclo por containment exato via replace(), NAO por LIKE: '_' e curinga em LIKE e nome de doc e cheio de underscore — um teste LIKE pararia travessias que nunca deveria parar.

      3) edges=None vs edges=[]: None = 'o kernel nao tem nada confiavel a dizer' (produtor off, ou leitura falhou no meio) => NAO substitui. [] = 'este doc nao declara/nao aponta nada' => APAGA as linhas. Sem isso, tirar a ultima referencia de um doc deixaria a relacao no grafo.

      4) FS declara SAVE_OPTIONAL_KWARGS - {edges} e edge_graph=False. Isso poe DUAS guardas do repo em conflito: test_record_store_port exigia paridade ESTRITA de assinatura, e derive_capabilities le a assinatura. Refinei a guarda: a divergencia permitida e exatamente vocabulario_da_porta - capabilities().write_kwargs do proprio adapter — some sem declarar, continua vermelho.

      5) GraphUnsupported ficou em _NOT_REFUSALS, com motivo: e afirmacao de CAPACIDADE do deployment (501), nao veredito sobre o pedido. [] nunca e resposta: le-se 'nada aponta para este doc'.

      BUG que so o segundo dialeto achou: _replace_edges passava sa.func.now() como bind param no executemany; asyncpg recusa ('expected a datetime, got now'). SQLite nunca reclamaria. Virou datetime.now(utc) em Python nos dois.

      Migracao legada v9: provada, nao presumida. upgrade_sync roda a ponte ANTES do alembic (teste estrutural sempre) + caminhada v9 -> ponte -> baseline -> 0006 num Postgres real, com fixture v9 construida aplicando a revisao baseline e desfazendo so o v10 (dropar dna_edges), porque uma fixture de duas tabelas falharia no backfill da 0003 e nao provaria nada sobre arestas.

      Fora do escopo, com dono: tool MCP graph_refs (fatia 6, superficie METRADA — familia de quota e decisao de produto) e a fatia 5 (portal, dna-cloud). Rota /v1/graph/kinds (fatia 1) e do outro agent.
    commit_ref: 2a6acb920d4fd0dc8ab7b7efb207166605ee893a
