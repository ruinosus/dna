  name: s-graph-edge-producer
spec:
  title: Produtor de arestas, travessia e backfill
  description: 'Fatias 2, 3 e 4 da spec-grafo-1-arestas-e-travessia: resolve_declared_edges extraida de _validate_references (uma passada, dois consumidores, terceiro retorno ''completo''); revisao Alembic 0006 criando dna_edges nos dois dialetos; escrita atomica no mesmo conn do save via kwarg com sonda de capability; delete das arestas de SAIDA junto com o doc; travessia por CTE recursiva com profundidade limitada, anti-ciclo e scope+tenant no passo recursivo; GET /v1/kinds/{kind}/documents/{name}/refs; dna graph backfill pelos pares (Kind, campo) declarados.'
  status: in-progress
  feature: f-graph-edges
  acceptance_criteria:
  - Given uma Story com spec.feature='f-y' escrita num adapter SQL, When o write conclui, Then existe UMA linha em dna_edges com source_field='feature' e to_kind='Feature'; When f-y e apagada, Then a linha CONTINUA com to_kind NULL (pendurada); When a travessia roda em dois tenants com o mesmo nome de doc, Then um nao ve o outro.
  acceptance_criteria_source: cli-create
  definition_of_done:
  - codigo + testes (vazamento cross-tenant, ciclo, profundidade, completo=False, delete, migracao v9 legada) + revisao Alembic + brand guard limpo + PR aberto sem merge
