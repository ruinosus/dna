  - at: '2026-08-05T22:52:10+00:00'
    actor: claude-code
    type: comment
    source: cli
    summary: 'Desenho que coube na fatia 1, e o porque de cada corte. (1) TRES Protocols em camada, nao um: ThreadTranscriptPort (ler), ThreadIndexPort (posse/listar), ThreadStorePort (a uniao + import_transcript). A razao e honestidade de tipo — o adapter LangGraph le o checkpoint e o checkpoint NAO sabe de quem e a conversa; com um Protocol unico ele stubaria metade dos metodos, e NotImplementedError atras de um tipo que promete e pior que um tipo menor que cumpre. O teste afirma a camada: isinstance(leitor, ThreadIndexPort) e False de proposito. (2) Transcript AG-UI pelo conversor OFICIAL (langchain_messages_to_agui do bridge), dumpado para dict na fronteira — nada de formato proprio; o grafo duble registra chamadas e o teste afirma que so houve aget_state (zero escrita, a promessa central da opcao b). (3) InMemoryThreadStore como implementacao de referencia da porta INTEIRA: prova que o contrato e implementavel e serve de par no kit de conformidade — duas implementacoes divergem em silencio, e foi assim que cada face acabou com a sua propria leitura de transcript. (4) Slot persistence.conversation {backend, ref, retention.max_age_days} no Kind Copilot, com resolve_conversation/retention_cutoff como LEITOR (regra F4 renderer-first satisfeita: o slot entra porque a porta o le, nao porque um job futuro vai ler). Retencao mora NESTE slot e nao nos irmaos porque transcript e dado de usuario (volume, PII, vida curta) enquanto checkpoint e o motor do framework e memory e o genoma curado. (5) Reachability (licao capacidade-existe-porta-nao): _LangGraphAGUIApp ganhou a property thread_store, e _MafAGUIApp declara thread_store = None — o gap do MAF fica dito no handle, verificavel, em vez de so numa issue. O Protocol AGUIApp NAO ganhou o membro (isso viraria isinstance False para adapter de terceiro; membro OPCIONAL, documentado, lido com getattr). (6) Aditivo de ponta a ponta: _project_persistence passa a emitir a chave conversation (None para quem nao declara — o unico teste existente alterado, e de proposito), e _slot_iter do infra a inclui, onde o dedup por ref garante que compartilhar o Postgres do checkpoint nao provisiona recurso nenhum. Busca antes de construir: ja registrada na spec ACEITA (agent-protocol, BaseCheckpointSaver, AG-UI, MCP, A2A, MAF, OpenAI Conversations) — ninguem empacotou transcript portavel entre frameworks; o que se adota e o FORMATO (AG-UI, oficial) e o SHAPE de thread REST.'
    commit_ref: d117843f48861afdebb8b41b3423abd5af4fa9eb
