    source: cli
    summary: 'PR dna#317 aberto, CI verde (sdk-py 3.12/3.13, cli 3.12/3.13, postgres, brand-guard, docs — tudo pass). O QUE FICOU FORA desta fatia, com nome e dono: (1) a implementacao de ESCRITA do indice em Postgres — e do HOST (copilot_thread + gate ASGI ja existem no dna-cloud); a fatia 2 e promove-los a consumidores da porta, e o SDK nao deve carregar psycopg para isso. (2) O job de expurgo da retencao — o slot e a conta (retention_cutoff) existem; quem apaga e quem tem a conexao. (3) O adapter de thread do backend MAF — o gap agora esta DECLARADO no handle (thread_store = None) em vez de so numa issue; fechar exige o ChatMessageStoreProtocol daquele framework. (4) Kind Conversation como projecao futura sobre a porta — adiado pela propria spec. (5) Nenhum consumidor no SDK chama fetch_threads ainda: a metade de indice so tem a implementacao de referencia em memoria, por construcao — o contrato existe para o host cumprir.'
    commit_ref: 02ae626ca6e59da935df08ef2d6ea7c3c35dd316
