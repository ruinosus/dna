kind: Story
metadata:
  name: s-thread-store-port
spec:
  title: 'Fatia 1 de spec-conversa-como-dado-do-dna (i-084 do dna-cloud): o ThreadStorePor'
  description: 'Fatia 1 de spec-conversa-como-dado-do-dna (i-084 do dna-cloud): o ThreadStorePort em dna.runtime — contrato neutro de conversa (indice/posse + transcript AG-UI + export/import), adapter LangGraph como PROJECAO DE LEITURA do checkpoint (sem dupla escrita), e o slot persistence.conversation no Kind Copilot.'
  status: in-progress
  feature: f-copilot-langgraph-target
  acceptance_criteria:
  - Given um host que hoje le transcript direto do checkpoint, When ele passa a consumir o ThreadStorePort, Then recebe as MESMAS mensagens AG-UI (conversor oficial langchain_messages_to_agui), sem escrita nova em nenhum turno
  - Given um Copilot que declara persistence.conversation {backend, ref, retention}, When o ctx e composto, Then o slot viaja no ctx.persistence e a porta le a retencao declarada; um Copilot que NAO o declara mantem comportamento byte-identico
  - Given um export de transcript de um thread com run pendente (interrupt), When export_transcript roda, Then o envelope diz em voz alta que o state pendente NAO atravessa (so o transcript)
  acceptance_criteria_source: cli-create
  definition_of_done:
  - porta + adapter + slot com testes pytest (kit de conformidade rodando contra o duble em memoria E contra o adapter LangGraph); suite de runtime inteira verde; docs de Kind regenerados; zero mudanca de comportamento existente
  definition_of_done_source: cli-create
