apiVersion: github.com/ruinosus/dna/sdlc/v1
kind: Story
metadata:
  id: rt47o5say2i6
  name: s-runtime-binding-schema
spec:
  title: RuntimeBinding schema and resolved contract
  description: Add the first protocol-neutral RuntimeBinding Kind and Python SDK resolution contract.
  status: in-progress
  feature: f-runtime-bindings
  priority: high
  labels:
  - sdk-py
  - runtime-binding
  acceptance_criteria:
  - Given a RuntimeBinding instance, when DNA parses it, then agent, protocol, provider, host reference, and supported policies are typed and validated.
  - Given a named RuntimeBinding, when a consumer resolves it, then the SDK returns immutable runtime-neutral data without importing AHP or resolving endpoints and credentials.
  - Given a missing or malformed binding, when a consumer parses or resolves it, then DNA fails with an actionable error and does not silently invent deployment configuration.
  acceptance_criteria_source: cli-create
  definition_of_done:
  - 'Code: builtin Kind, typed model, public resolved projection, and resolver are implemented.'
  - 'Tests: schema, parsing, successful resolution, missing binding, and forbidden deployment fields are covered.'
  - 'Docs: public API ownership boundary is documented in code and fixtures.'
  definition_of_done_source: cli-create
