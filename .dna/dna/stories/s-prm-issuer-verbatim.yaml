apiVersion: github.com/ruinosus/dna/sdlc/v1
kind: Story
metadata:
  name: s-prm-issuer-verbatim
spec:
  title: PRM advertises authorization_servers verbatim
  description: 'i-073: the PRM (RFC 9728) must advertise each authorization-server identifier exactly as configured — pydantic AnyHttpUrl adds a trailing slash to a bare host, breaking RFC 8414 3.3 exact-string comparison in strict MCP clients'
  status: in-progress
  feature: f-dna-mcp-server
  acceptance_criteria:
  - Given DNA_MCP_AUTH_SERVERS=https://as.example (no trailing slash), When a client GETs /.well-known/oauth-protected-resource/mcp, Then the serialized JSON authorization_servers is exactly ['https://as.example']
  - Given a configured authorization server WITH a path or trailing slash, When the PRM is served, Then that value round-trips byte-identical (verbatim, never stripped)
  - Given the rest of the PRM document, When the fix is applied, Then resource / scopes_supported / bearer_methods_supported are unchanged
  acceptance_criteria_source: cli-create
  definition_of_done:
  - 'Code: a thin RemoteAuthProvider subclass in dna_cli/_mcp_auth.py, no FastMCP fork/vendoring'
  - 'Tests: a failing-first test asserting on the serialized JSON body of the real route; CLI auth + serving suites green'
  - 'CI: brand guard clean; no generated-surface drift'
  definition_of_done_source: cli-create
