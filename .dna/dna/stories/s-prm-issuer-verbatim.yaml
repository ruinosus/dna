  - at: '2026-07-25T19:22:19+00:00'
    actor: claude-code
    type: comment
    source: cli
    summary: |-
      Analise confirmada contra o FastMCP 3.4.4 instalado (nao de memoria): RemoteAuthProvider.get_routes -> mcp.server.auth.routes.create_protected_resource_routes -> ProtectedResourceMetadata, cujo campo authorization_servers e list[AnyHttpUrl]. A coercao acontece na SERIALIZACAO (PydanticJSONResponse), nao no __init__ — por isso o teste tinha de assertar sobre o corpo JSON servido, nao sobre o objeto Python. Medido: 'https://host' -> 'https://host/'; ':443' e removido; host e minusculado; caminho e barra final ja existentes passam intactos.

      Fix: subclasse fina de RemoteAuthProvider dentro de resource_server() — o FastMCP monta as rotas como hoje e a rota do PRM tem seu app ASGI envolvido por _VerbatimAuthorizationServers, que reescreve APENAS o array authorization_servers com as strings configuradas (e corrige o Content-Length). Sem fork/vendor do FastMCP e sem reescrever o schema. Verbatim e verbatim: nao ha strip de barra.

      Auditoria dos outros identificadores anunciados:
       - resource: derivado como base_url.rstrip('/') + '/' + mcp_path, entao com um mount path nao-vazio nunca ganha barra final. Sao.
       - jwks_uri: create_protected_resource_routes nunca o passa — o documento PRM do DNA nao carrega esse campo. Nada a quebrar.
       - metadata do authorization server (Lane A / AzureProvider OAuthProxy): a porta E o proprio AS, e PRM.authorization_servers e AS.issuer recebem a MESMA coercao ('https://door/'), entao concordam por igualdade exata de string. Sao — nao mexi.
       - resource_name / resource_documentation: o DNA nunca os passa (ausentes do documento).
    commit_ref: f266aa8dbe020d6312c4b21903b7ef0c6a5ff036
