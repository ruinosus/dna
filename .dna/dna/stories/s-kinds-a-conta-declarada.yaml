  acceptance_criteria:
  - Dado o Kind App, quando eu leio o descritor, então ele declara service_name, python_module, port e can_sleep, com can_sleep documentando o custo de ~US$90/mes de quem nao dorme
  - Dado o Kind Solution, quando eu leio o descritor, entao services[] nao existe mais como campo e apps[] e a unica lista
  - Dado o Kind Copilot, quando eu leio o descritor, entao runs_in aponta para App como relacao OPCIONAL e value_per_outcome declara human_minutes + hourly_cost + currency
  - Dado um Copilot sem runs_in, quando a guarda de orfaos roda, entao ela REPORTA a contagem sem falhar o build
