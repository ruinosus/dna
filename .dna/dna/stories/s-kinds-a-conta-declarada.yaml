    summary: |-
      CORREÇÃO MEDIDA (07/08/2026) — a spec estava errada em dois pontos, e o achado que apareceu no lugar é melhor.

      ERRADO 1: "services[] é uma lista de strings que vira código". Não é. É {name, answers_file, template{src,ref}, answers, pode_dormir} — o registro que SOBREVIVE ao answers file do Copier. As "strings que viram código" são o TEMPLATE (templates/app-container), não o descritor.

      ERRADO 2, e é o pior: "hoje nada na declaração responde se ele dorme". FALSO. services[].pode_dormir existe, é o ÚNICO fato promovido para fora de answers, e está documentado com os ~US$90/mês e com a regra de que ausente significa NUNCA RESPONDEU, nunca um false presumido.

      O ACHADO QUE APARECEU NO LUGAR, e ele é melhor que a spec original: services[] é uma entrada POR DEPLOYMENT (o descritor diz "nove serviços sobre quatro imagens são nove entradas aqui"). Então services[] e apps[] não são dois eixos paralelos — são DUAS LISTAS DAS MESMAS NOVE COISAS, sem chave declarada entre elas. E a chave já existe: services[].name é "o que o azd chama de serviço", a mesma string que o metadata.name do App.

      DECISÃO DO FOUNDER (07/08/2026, com os números na tela): o App é o dono do fato de custo.
        - pode_dormir SAI de services[]; fica só App.can_sleep. A fatura é por deployment, e o App É o deployment.
        - services[].name vira relação declarada para App (mecanismo by:, PR #334).
        - services[] NÃO é removido — fica com name, answers_file, template, answers. required:[title,services] continua e dna solution não quebra (medido: 771 linhas de teste, 2 goldens, upsert_solution escreve em todo caminho).
        - o consumidor unanswered_cost_question passa a ler App.can_sleep, preservando "ausente ≠ false".
        - migração: ZERO. Solution tem 0 instâncias, e é só por isso que dá para fazer agora.

      O AC 2 original ("services[] deixa de existir") está CANCELADO e substituído pelo acima.
    commit_ref: 89ba92c49d068f0258c9dc171d5183b796c37b82
