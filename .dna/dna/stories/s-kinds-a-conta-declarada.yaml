  title: 'Os três descritores: App é o serviço, Copilot declara rendimento'
  description: App absorve o serviço (service_name, python_module, port, can_sleep); Solution perde services[] (derivado de apps[]); Copilot ganha runs_in (opcional) e value_per_outcome.
