    source: cli
    from: in-progress
    to: done
    commit_ref: 1cd4bef5d96a4f6cbd923db2b92eccdda2b0d82c
    summary: 'Entregue e merjado (PR #353). O comando escreve AS DUAS METADES numa escrita só: o ledger em services[] (procedência do render) e o App com os quatro campos de identidade, ligados por services[].name == metadata.name. can_sleep chega ao bicep como minReplicas, provado nos DOIS sentidos (com só o caso false congelado, um template que fixasse minReplicas:1 ficaria verde e poria a frota em réplica permanente). owns_code separa ''gera tudo'' de ''só a fiação'' — 8 dos nossos 9 serviços são o segundo caso. As três decisões estruturais verificadas por MUTANTE: apps[] não populado → 2 vermelhos; guarda de junção não rodada → 1; App escrito depois do Solution → 4.'
