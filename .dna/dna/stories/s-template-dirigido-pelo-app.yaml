    summary: |-
      AC 2 REESCRITO (07/08/2026), depois da decisão do founder sobre quem é dono do custo.

      O AC dizia: "o comando de solução, quando grava, cria/atualiza instâncias de App e NUNCA
      escreve Solution.services[]". Está CANCELADO — nasceu da premissa errada de que services[]
      era uma lista de strings descartável.

      Passa a ser: o comando escreve AS DUAS METADES —
        - o ledger em Solution.services[] (name, answers_file, template{src,ref}, answers),
          exatamente como hoje, porque ele é o único lugar onde uma resposta apagada por `when:`
          sobrevive (a correção medida da fatia 3, ~770 linhas de teste atrás dela);
        - a instância de App com os quatro campos de identidade (service_name, python_module,
          port, can_sleep);
        - e services[].name casa com o metadata.name do App — a chave que já existia.

      `pode_dormir` deixa de ser gravado em services[] e passa a ser gravado como App.can_sleep.

      ACHADO QUE ENTRA NA STORY IRMÃ (s-kinds-a-conta-declarada): App hoje exige `copilots` com
      minItems: 1, e um serviço gerado não tem copiloto nenhum. Enquanto isso valer, App = serviço
      NÃO FECHA. `copilots` vira opcional, pela mesma razão que runs_in nasceu opcional: lista
      vazia é estado legítimo. O `worker` do dna-cloud escala por KEDA e não serve copiloto nenhum
      — é a prova viva.
