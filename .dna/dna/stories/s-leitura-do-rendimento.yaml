    summary: 'Entregue e merjado (PR #359). runtime/roi.py — leitura pura, mais uma porta de banco. As três regras viraram MECANISMO: Number NÃO SE CONSTRÓI sem basis e sem source (o construtor levanta); render() imprime [PROXY] e ≥PISO na MESMA LINHA do número; e vazio tem DOIS nomes (nothing_to_look_at = 0 turnos; no_outcome_declared = turnos sem desfecho), ambos ACHADO, nunca 0%. SETE mutantes, todos vermelhos (20/3/5/2/2/3/1/1). ⭐ E ele corrigiu a spec num ponto que eu tinha como certo: ''o custo já é exato'' — exata é a contagem de TOKENS; NÃO EXISTE tabela de preço de modelo em lugar nenhum do repo. Então dinheiro depende de um ModelPrice DECLARADO pelo chamador, e sem ele cost volta NÃO CALCULÁVEL enquanto tokens sai normal — uma tabela embutida envelheceria em silêncio e produziria dinheiro errado com cara de medição. E can_sleep NÃO cabe na mesma conta: os US são MENSAIS e o resto é POR TURNO — virou standing_cost separado, basis=CONSTANT, fora da razão.'
