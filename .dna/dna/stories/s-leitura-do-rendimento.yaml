spec:
  title: A leitura que junta custo e rendimento — e diz quando nao da para calcular
  description: A consulta/porta que cruza dna_turn (custo em tokens) com o desfecho e o value_per_outcome do Copilot. Sem valor declarado o resultado e NAO CALCULAVEL, nunca zero.
  status: review
  feature: f-conta-do-copiloto
  priority: high
  acceptance_criteria:
  - Dado um Copilot com value_per_outcome declarado e turnos com desfecho, quando eu peco a leitura, entao ela devolve custo, rendimento e a razao entre os dois
  - Dado um Copilot SEM value_per_outcome, quando eu peco a leitura, entao ela devolve nao-calculavel com o motivo, e nunca zero nem estimativa inventada
  - Dada a taxa de aceitacao do HITL, quando ela e reportada, entao ela vem rotulada como PROXY, com a contagem de approve/edit/reject que a origina
  acceptance_criteria_source: cli-create
  definition_of_done:
  - 'Code: a leitura no SDK, com a origem de cada numero explicita'
  - 'Tests: o caso sem valor declarado provando que nada e fabricado'
  - 'Docs: os nomes de mercado (contencao, AHT, holdout) e qual deles esta sendo respondido'
  - 'CI: sdk-py + postgres verdes'
