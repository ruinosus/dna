apiVersion: github.com/ruinosus/dna/sdlc/v1
kind: Story
metadata:
  name: s-workspace-enforcement-opt-out
spec:
  title: Explicit, configurable opt-out of workspace-membership enforcement (default ENFO
  description: Explicit, configurable opt-out of workspace-membership enforcement (default ENFORCE) so a single-operator deployment can serve the whole MCP/REST surface while every call is still metered per identity
  status: in-progress
  feature: f-dna-hosting
  acceptance_criteria:
  - Given DNA_WORKSPACE_ENFORCEMENT is unset/empty/misspelt/falsey, When an authenticated identity with no active membership calls a tool, Then it is denied exactly as today (fail-closed)
  - Given DNA_WORKSPACE_ENFORCEMENT=open, When an authenticated identity with no active membership calls a tool, Then the call is served against the unverified selector AND metered under a stable, identity-derived key that can never collide with another identity
  - Given DNA_WORKSPACE_ENFORCEMENT=open, When a door boots, Then it announces the open boundary at WARNING in the same register as the other startup lines
  acceptance_criteria_source: cli-create
  definition_of_done:
  - code+tests (default-is-enforce test + deliberate-break evidence) + docs (tenancy concepts guide) + brand guard + cli/sdk suites green
  definition_of_done_source: cli-create
