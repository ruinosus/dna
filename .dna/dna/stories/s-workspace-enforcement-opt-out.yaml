  - at: '2026-07-25T21:34:40+00:00'
    actor: claude-code
    type: comment
    source: cli
    summary: 'Decisao 1 — o knob NAO e booleano. DNA_WORKSPACE_ENFORCEMENT tem uma allowlist de um literal so (''open''); unset/vazio/erro de digitacao/0/false/off/1/true/on TODOS enforcam. Motivo: ''=0'' le como ''enforcement off'' pra um operador e ''not open'' pra outro, e so uma dessas leituras erradas e segura. Um valor nao reconhecido enforca E loga que foi ignorado (nao e silencioso).'
    commit_ref: 501aca931a959ed7d338539babb2837a54d051eb
  - at: '2026-07-25T21:34:54+00:00'
    actor: claude-code
    type: comment
    source: cli
    summary: 'Decisao 2 — resolve_workspace/workspace_for_identity NAO foram tocados (estao golden-locked com gemeo TS em tests/golden-fixtures/workspace-resolution). O switch fica FORA do resolver puro, nas duas faces: elas capturam CrossWorkspaceError e, so com o knob aberto, caem para o seletor NAO verificado. A resolucao continua rodando — so a negacao e desarmada — entao uma identidade que pertence inequivocamente a um workspace continua resolvendo pra ele (e pro plano da conta dele), sem precisar destravar nada quando memberships aparecerem.'
    commit_ref: 501aca931a959ed7d338539babb2837a54d051eb
  - at: '2026-07-25T21:35:09+00:00'
    actor: claude-code
    type: comment
    source: cli
    summary: 'Decisao 3 — a chave de medicao quando nenhum workspace resolve e personal_tenant(subject_duravel, family=provider_type): personal:<oid> (Entra) / personal:workos:<sub> etc. Reusa a UNICA derivacao per-provider (identity_claim_key, licao do i-072) e o esquema RESERVADO ''personal:'' — logo nao colide com nenhum workspace id, nao colide entre providers com o mesmo literal, e e estavel. Um token sem subject duravel levanta UnmeterableIdentityError e continua NEGADO mesmo com a fronteira aberta: a alternativa era quota_key(None, tier) = ''-::free'', um balde unico compartilhado por toda identidade sem membership — medir a usage de um contra o outro e pior que negar.'
    commit_ref: 501aca931a959ed7d338539babb2837a54d051eb
  - at: '2026-07-25T21:35:25+00:00'
    actor: claude-code
    type: comment
    source: cli
    summary: Decisao 4 — a face REST compartilha o seam (_rest_api._config_auth chama o mesmo resolve_workspace e responde 403), entao o opt-out cobre ela tambem. Deixar o REST enforcado significaria o mesmo operador com MCP funcionando e read-API 403ando — um opt-out em que o operador nao pode confiar e pior que nenhum; e o portal le pelo REST. As lanes --auth token e --auth none nao sao tocadas (nunca chegaram nesse seam).
    commit_ref: 501aca931a959ed7d338539babb2837a54d051eb
