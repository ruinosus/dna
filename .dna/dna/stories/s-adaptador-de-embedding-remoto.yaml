spec:
  title: O adaptador de embedding remoto — a porta existe, falta quem fale /v1/embeddings
  description: adapters/embedding/ so tem onnx.py. A EmbeddingPort ja define model_id, dims e embed(). Falta um provider OpenAI-compativel.
  status: todo
  feature: f-a-fabrica
  priority: medium
  acceptance_criteria:
  - Dado OPENAI_BASE_URL e uma chave, quando o provider e registrado, entao kernel.embed usa o remoto e reporta model_id e dims corretos
  - Dado que o remoto falha, quando a busca roda, entao ela DEGRADA honestamente dizendo o que perdeu — nunca devolve vazio como se nao houvesse resultado
  - ⚠️ Dado que o embedder remoto e chamada PAGA, quando ele e usado, entao o custo esta documentado e o ONNX local continua sendo o default
  acceptance_criteria_source: cli-create
  definition_of_done:
