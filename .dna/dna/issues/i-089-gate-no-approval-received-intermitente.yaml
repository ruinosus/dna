    to: open
  - at: '2026-07-28T21:07:22+00:00'
    actor: claude-code
    type: comment
    source: cli
    summary: |-
      RESOLVIDO, e nunca foi gate de aprovacao. A bateria 3 do Claude Desktop (28/07, pos-update) confirmou a hipotese (c) do relatorio original: era MethodologyRefusal MASCARADO pelo handler de mutacao.

      Medido na re-bateria: create_story sem ac/dod devolve MethodologyRefusal limpo listando os exit criteria faltantes — era exatamente isto que a test-gate-probe batia como 'No approval received', porque ela nao tinha ac/dod. E set_status para done sem evidencia devolve MethodologyRefusal explicando o test-gate (sdlc.test-gated exige TestRun product-lane com outcome=pass), com comandos e escapes listados. Os escapes funcionam: no_code=true + gate_reason efetiva o close, grava gate_exception na timeline e devolve warnings nao-bloqueantes.

      Isso explica a nao-uniformidade que parecia impossivel: comment passava porque comment nao tem exit criteria; set_status FORWARD passava porque as transicoes iniciais nao batiam no test-gate; create_story e set_status backward/invalido falhavam porque cada um batia numa regra de metodologia DIFERENTE. Nunca houve gate de HITL — havia tres recusas distintas com a mesma mensagem errada.

      Segundo membro da familia 'o sistema sabia a verdade e reportava outra coisa', junto com i-088, i-090 e i-092.
