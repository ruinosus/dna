spec:
  description: |-
    DECISÃO 4/6 · DNA Cloud (ref: adr-dna-cloud-saas). Fronteira open-core: o que é OSS (grátis) vs pago?
    PROPOSTA:
    - OSS (repo público, nunca capado): SDK/CLI/kernel/emit/MCP self-host — tudo que já é público hoje.
    - PAGO (DNA Cloud): hospedagem multi-tenant gerenciada, portal, billing, quota, SSO enterprise, overlays-as-a-service, SLA/support.
    - Regra: o core nunca perde feature; o pago é conveniência + escala gerenciada.
    Confirma essa linha (SIM), ou quer mover algo pra um lado?:
