    summary: 'Fechada no PR #358. A checagem é gateada em Relation.resolved — a linha exata entre ''o kernel diz que segue'' e ''diz que não segue'' — então as 10 relações honestas continuam passando. Varreduras exaustivas: 24 declarações no dna e 12 no dna-cloud, ZERO acusadas; o bump da versão lá não acorda nada. E o achado extra: o teste que JÁ existia (test_every_relation_agrees_with_its_own_schema) passaria verde contra um registro sem NENHUMA relação array-de-objeto — não distinguia ''nada errado'' de ''não há o que errar''. Ganhou irmão que mede a população real e exige que não seja vazia.'
