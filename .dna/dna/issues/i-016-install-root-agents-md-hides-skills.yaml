apiVersion: github.com/ruinosus/dna/sdlc/v1
kind: Issue
metadata:
  name: i-016-install-root-agents-md-hides-skills
spec:
  description: 'dna install de uma árvore com AGENTS.md na RAIZ instala só o AgentDefinition: _scan_tree para de recursar quando um reader clama um dir (''claimed by a reader — its subtree is the bundle''), então o agentsmd reader clamando a raiz esconde skills/ e todo o resto. Reproduzido no smoke de i-015: dna install github:ruinosus/dna/examples/onboarding-pack → installed 1 (AgentDefinition), Skill acme-conventions ausente. dna init --from contorna (scan com SkillReader only + probe explícito da raiz AGENTS.md); o install precisa de fix próprio — ex.: claim de doc single-file (AGENTS.md) não deveria bloquear a recursão nos subdirs, só claim de bundle-dir (Skill).'
  type: bug
  severity: medium
  status: resolved
  owner: claude-code
  related_feature: f-dna-ecosystem
