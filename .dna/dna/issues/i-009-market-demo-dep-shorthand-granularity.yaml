apiVersion: github.com/ruinosus/dna/sdlc/v1
kind: Issue
metadata:
  name: i-009-market-demo-dep-shorthand-granularity
spec:
  description: 'Genome dep ''github:anthropics/skills/skills@main'' do market-demo usa o shorthand legado ''skills: [...]'' que LocalResolver._collect_requested não lê (só v3 ''items:''), caindo em _resolve_all — que assume layout <categoria>/<item> 2-níveis e, apontado direto pra skills/, retorna os SUBDIRETÓRIOS dos bundles (references/, scripts/) em vez dos bundles. O demo não quebra porque os skills estão vendorizados no disco do scope; o dep é decorativo. Fix: aceitar o shorthand em _collect_requested ou migrar o fixture pro formato items: — e decidir a semântica de _resolve_all para árvores rasas (bundle no primeiro nível). Encontrado durante s-dna-install (o fetch do install contorna isso escaneando a árvore com readers).'
  type: bug
  severity: low
  status: resolved
  timeline:
  - at: '2026-07-10T04:56:32+00:00'
    actor: claude-code
    type: status_change
    source: cli
    to: open
  - at: '2026-07-10T11:08:39+00:00'
    actor: claude-code
    type: comment
    source: cli
    summary: 'Fix em f988fbc (branch feat/s-small-bug-fixes). Decisão de contrato: o shorthand ''skills: [...]'' é formato MORTO (zero docs, zero schema, zero resolvers) → REJEITADO com ResolveError didático via reject_legacy_shorthand() em local._collect_requested (compartilhado por github+http; github agora chama _collect_requested incondicionalmente — antes era gated em dep.get(''items''), pulando o check exatamente no caso do bug). Pelo kernel a rejeição cai em mi.resolve_errors (relato alto, sem crash) e o fallback de granularidade errada NÃO acontece. Fixture market-demo migrado pro v3 items: (nomes acham os bundles via fallback source/name p/ árvore rasa). TDD: TestLegacyDepShorthandRejected em test_dependency_resolution.py (3 red + 1 controle). Semântica geral de _resolve_all p/ árvores rasas fica como possível follow-up — o caminho silencioso foi eliminado.'
  - at: '2026-07-10T11:08:40+00:00'
