spec:
  title: Multi-workspace ligado esconde Kind aprovado de outro escopo
  description: 'GATILHO: ligar multi-workspace. Hoje inofensivo porque todos compartilham base_scope. `_ctx.py` monta UMA manifest instance, a do escopo do boot; um Kind aprovado no escopo do workspace B fica invisivel (UnknownKindError na escrita, ausente do list_kinds) ate algo construir a MI de B. Nao e regressao — o caminho eager tem o mesmo limite. Fechar ANTES de habilitar multi-workspace, senao a autoria de Kind por tenant quebra em silencio para todo mundo menos o workspace do boot.'
