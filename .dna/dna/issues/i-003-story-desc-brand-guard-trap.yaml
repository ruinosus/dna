metadata:
  name: i-003-story-desc-brand-guard-trap
spec:
  description: 'Trap de processo recorrente (achado no PR #8): ao portar coisas do repo upstream, eu descrevo a story citando o nome do repo-mãe (ex.: ''trazer X do <upstream>''), e esse texto vira YAML tracked em .dna/ — que o brand_guard varre. Resultado: a própria story de um port quebra o CI. Mitigação de processo (não de código): ao filar stories de port, referir ''upstream SDK'' / ''the source project'', nunca o nome proibido. Opção técnica futura: brand_guard poderia ter allowlist de contexto pra descrições de story, MAS isso enfraquece o guard — prefiro a disciplina de escrita. Registrar aqui pra não recorrer.'
  type: task
  severity: low
  status: resolved
  owner: claude-code
  related_feature: f-dna-1.0-readiness
