    source: cli
    summary: |-
      DECISÃO DO FOUNDER (08/08/2026): **UMA TABELA POR DIMENSÃO, criada por migration.**
      Não tabela dinâmica, não coluna única.

      === A MEDIÇÃO QUE DECIDIU ===

      `dna_search_docs` JÁ É dinâmica em tudo, menos numa coisa:

        scope · kind · name · tenant   ← namespace e tenant já são COLUNA
        embedding vector(384)          ← a ÚNICA coisa fixa, porque vector(N) é TIPO da coluna

      ⛔ TABELA DINÂMICA foi recusada por duas razões, e a primeira é regra dura:

        1. O CLAUDE.md: "Data-access code never runs DDL." Não é preferência — é o que faz o schema
           ser propriedade de MIGRATION, revisável em PR. Criar tabela em runtime faria o schema
           depender do que os usuários fizeram, e ninguém mais responderia "qual é o schema?"
           olhando o repo.
        2. Volume: uma tabela por coleção × tenant vira CENTENAS, cada uma com índice HNSW próprio
           — que é caro em memória.

      === ⭐ A SAÍDA: o espaço de dimensões é PEQUENO E QUASE FECHADO ===

        384   MiniLM (o nosso hoje)
        768   base
        1024  large
        1536  openai-3-small / ada
        3072  openai-3-large

      CINCO tabelas, criadas por migration. E `collection` vira COLUNA, como `kind` e `tenant`
      já são.

        coleção nova   → INSERT       (era DDL)
        tenant novo    → INSERT       (era DDL)
        model_id novo com dimensão já conhecida → NADA, só escreve
        dimensão INÉDITA → migration, em PR revisado — que é o certo

      === O ROTEAMENTO É TRIVIAL, E A PORTA JÁ DÁ O DADO ===

      `EmbeddingPort` já expõe `dims` no contrato (kernel/protocols.py:909). A busca lê `dims` do
      provider registrado e sabe em qual tabela procurar. Não é heurística nem configuração nova.

      === ⭐ O QUE ISSO RESPONDE DE QUEBRA ===

      "Um tenant pode escolher o próprio embedder?" → SIM, e barato. Com tabela por dimensão isso
      deixa de ser decisão de arquitetura.

      ⚠️ MAS o contrato da porta continua valendo e a TELA TEM DE DIZER: "vetores de providers com
      model_id diferente NÃO SÃO COMPARÁVEIS". Dois copilotos com embedders diferentes NÃO
      COMPARTILHAM BUSCA, mesmo com a MESMA dimensão. Isso é do modelo, não do armazenamento — e
      uma tela que mostrasse os dois juntos estaria mentindo.
