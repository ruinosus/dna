  name: i-104-embedding-tem-porta-mas-a-dimensao-e-fixa
spec:
  title: A porta de embedding existe e o Kind já declara dims — quem fixou 384 foi a coluna do pgvector
  description: |-
    ⭐ A PORTA JÁ EXISTE e está bem desenhada — `EmbeddingPort` (kernel/protocols.py:909):

      model_id: str
      dims: int
      async def embed(texts) -> list[list[float]]

    E o contrato JÁ ANTECIPA o problema: "model_id identifica o ESPAÇO de embedding; vetores de
    providers com model_id diferente NÃO SÃO COMPARÁVEIS."

    E o Kind `Copilot` JÁ DECLARA tudo (copilot.kind.yaml:342+):
      knowledge.store.backend  → conjunto ABERTO (pgvector | mongo-atlas | azure-ai-search |
                                 qdrant | pinecone | null)
      knowledge.store.embed.model  → "text-embedding-3-small"
      knowledge.store.embed.dims   → a dimensionalidade

    ⛔ O DESENHO NUNCA FOI FIXO. Quem fixou foi a IMPLEMENTAÇÃO:
      adapters/embedding/  →  só `onnx.py`. Não há adaptador remoto.
      dna_search_docs.embedding  →  vector(384), a dimensão TIPADA NA COLUNA

    === AS DUAS METADES, e a segunda é a cara ===

    1. O ADAPTADOR REMOTO — barato. A porta existe; falta um provider que fale /v1/embeddings.
       Há credencial disponível: o AZURE_EMBEDDER_* do aap-kb (1536d) e o próprio OPENAI_BASE_URL.

    2. ⚠️ A DIMENSÃO DEIXAR DE SER FIXA NA COLUNA — aqui mora o trabalho. `vector(384)` é tipo
       da coluna do pgvector; trocar para 1536 é MIGRAÇÃO DE TABELA + REINDEXAÇÃO. E, pelo próprio
       contrato da porta, os vetores antigos NÃO SÃO COMPARÁVEIS com os novos — não convivem.
       Ou a coluna vira por-model_id, ou o índice é VERSIONADO POR ESPAÇO.

    === ⭐ A PERGUNTA DE PRODUTO QUE DECIDE A SEGUNDA METADE ===

    UM TENANT PODE ESCOLHER O PRÓPRIO EMBEDDER?

      não  → uma coluna basta; trocar é migração única, feita uma vez
      sim  → o índice tem de ser POR ESPAÇO, e isso muda a TABELA, não o adaptador

    ⚠️ E o `knowledge.store.embed` do Kind sugere que a resposta pretendida é SIM — ele é
    declarado POR COPILOTO. Se um copiloto declara o embedder, dois copilotos do mesmo tenant
    podem declarar embedders diferentes. Isso não cabe numa coluna de dimensão fixa.

    === O QUE NÃO ESTÁ QUEBRADO ===

    O ONNX local funciona, mede `degraded: False`, custa ZERO (sem chamada paga) e achou
    `i-056-portal-never-accepts-invites` a partir de "convite por e-mail nunca chega ao
    destinatario", SEM UM ÚNICO TOKEN EM COMUM. Trocar não é urgência de qualidade — é de
    FLEXIBILIDADE, e a diferença importa para priorizar.
