spec:
  title: A secao 6.2 nao determina a forma do resultado de instances/get
  description: 'ACHADO PELA SUITE DE CONFORMIDADE como SPEC GAP (caso instances_get_result_shape_is_determined). instances/get e especificado como ''the document verbatim'', enquanto instances/write devolve {''instance'': ..., ''created'': bool} e um get condicional devolve {''notModified'': true}. Um get bem-sucedido e o documento ELE MESMO ou {''instance'': <documento>}? As duas leituras se sustentam no texto, elas discordam em TODA leitura, e um cliente nao consegue sondar qual e sem ja ter um documento para reconhecer — que e exatamente o que ele foi buscar. Este servidor devolve {''instance'': ..., ''revision'': ...} pela simetria com o write e porque o envelope tem onde pendurar o notModified; a implementacao de sala limpa pode ter escolhido a outra. Precisa de uma frase na secao 6.2.'
