metadata:
  name: i-079-source-to-source-sync
spec:
  description: Sincronizacao generica source->source sobre o SourcePort — nao um export Postgres->FS pontual, mas qualquer adaptador para qualquer adaptador
  type: task
  severity: high
  status: open
  timeline:
  - at: '2026-07-26T11:48:24+00:00'
    actor: claude-code
