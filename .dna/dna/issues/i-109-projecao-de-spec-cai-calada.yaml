  title: A projecao aceita 'spec' e devolve so o nome, ecoando o pedido
  description: 'MEDIDO em 12/08/2026. _project_doc(doc, [''spec'']) devolve {''name'': ...}. _resolve_field_path (dna/kernel/protocols.py:84) exige o ponto para reconhecer o prefixo ''spec.'', entao um ''spec'' pelado cai no ramo generico, vira doc[''spec''][''spec''] -> None, e o ''if val is None: continue'' o descarta em silencio. O mesmo vale para ''metadata'' pelado. E list_instances_impl ainda devolve projected=[''spec''] ao lado das linhas sem spec — literalmente ''uma forma mais estreita ecoando o pedido'', a regra 1 da secao 6.2 do DNAP. Nenhum teste do repo cobria projection=[''spec'']. O servidor DNAP RECUSA esses caminhos (dna/protocol/select.py) porque nao consegue honra-los; as faces REST e MCP continuam aceitando e mentindo. Consertar na projecao: resolver ''spec'' como o objeto inteiro, ou levantar QueryError nomeando as formas suportadas.'
  type: bug
  severity: high
  status: open
