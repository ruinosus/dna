  description: '`dna.runtime.roi` (2.348 linhas) calculava custo, preco, ROI e aceitacao dentro deste repositorio ABERTO, e nao tinha nenhum chamador aqui: as tres referencias sao COMENTARIOS (telemetry.py, mcp_tools_mw.py, alembic 0014). Preco de token, valor por desfecho e taxa de aceitacao sao fatos do CONTRATO de quem opera, nao de um SDK de agentes. O modulo, os quatro arquivos de teste e o guia `docs/guides/reading-the-yield.md` saem. NAO sai: `runtime/telemetry.py` (quem ESCREVE `dna_turn`, ligado no ponto unico por onde todo runtime passa) nem as revisoes alembic 0012/0014 — sao schema de uma tabela que este SDK escreve, e um LEITOR nao e dono de schema. Quem ja aplicou nao precisa fazer nada.'
