spec:
  description: 'Follow-up de s-dna-init-agent-ready: oferecer o Genome de onboarding também via canal dna install github: (ex.: dna init --from github:owner/repo/path, ou publicar o onboarding-scope como scope instalável). Hoje o Genome viaja como package-data do dna-cli e o init projeta as Kinds nos diretórios de tools; um canal install permitiria versões atualizadas do onboarding sem re-release do dna-cli e onboarding customizado por organização. Semântica distinta do install atual (que escreve no source .dna/, não em projeções .claude/.github/...) — precisa de design próprio.'
