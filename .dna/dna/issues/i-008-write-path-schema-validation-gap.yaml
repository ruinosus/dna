apiVersion: github.com/ruinosus/dna/sdlc/v1
kind: Issue
metadata:
  name: i-008-write-path-schema-validation-gap
spec:
  description: 'Descoberto no smoke de s-tier-a-automation: kernel.write_document NÃO valida o spec contra o schema do Kind — a validação (DeclarativeKindPort.parse / validate_on_parse) só roda no SCAN/read (canal parse_error). Um doc shape-quebrado persiste e explode depois, longe do autor. O Automation resolveu localmente (o guard pre_save roda port.parse no write), mas o gap é SISTÊMICO: vale pra todo Kind descriptor (Doc, ModelProfile, Kaizen, ...). Avaliar um passo genérico de schema-validate no write_pipeline (opt-in por Kind ou padrão com escape hatch), com atenção a docs legados que hoje só passam por serem lidos fail-soft.'
  type: enhancement
  severity: medium
  status: resolved
  timeline:
  - at: '2026-07-09T23:54:47+00:00'
    actor: claude-code
    type: status_change
    source: cli
    to: open
  - at: '2026-07-10T11:14:35+00:00'
    actor: claude-code
    type: comment
    source: cli
    summary: 'Generalizado em s-write-path-validation: WritePipeline.write (Py) / WritePipeline.write (TS) agora validam raw.spec contra o schema() do Kind ANTES de persistir — depois dos veto hooks pre_save (curas Kind-owned, ex. heal YAML-1.1 do Automation, aplicam primeiro). Kinds sem schema seguem permissivos (opt-in por dado); spec_defaults (D5) preenchem antes de validar; erro didático no padrão do install #26 (campo + violação + dna kind show <Kind>); SpecValidationError subclasse de ValueError. Política de backcompat decidida por evidência: suite completa com ENFORCE ligado = 2 falhas em 2925 testes, ambas fixtures legitimamente shape-quebradas (LessonLearned com confidence_score string / sem required area) — corrigidas, então o default é ENFORCE, com DNA_WRITE_VALIDATION=warn|off como escape hatch. O guard do Automation foi dedupado (port.parse removido; heal + cron/hook semantics mantidos). Red→green nos shapes reais (Automation sem cron, EvalCase com checks objeto/vazio) em test_write_path_validation.py + write-path-validation.test.ts. Smoke real: dna doc apply de EvalCase inválido → exit 1 + veto didático; válido → grava; o SDLC deste repo continuou escrevendo o tempo todo.'
  - at: '2026-07-10T11:14:36+00:00'
    actor: claude-code
    type: status_change
    source: cli
    from: open
    to: resolved
  closed_at: '2026-07-10T11:14:36+00:00'
  created_at: '2026-07-09T23:54:47+00:00'
  updated_at: '2026-07-10T11:14:36+00:00'
