metadata:
  name: i-081-tenant-kind-registry-has-no-scope
spec:
  description: 'Um KindDefinition de tenant registra no processo inteiro: outro tenant ve, usa, e e validado contra o schema alheio — a chave do registro nao tem escopo'
  type: bug
  severity: high
  status: resolved
  created_at: '2026-07-27T01:15:20+00:00'
  updated_at: '2026-07-27T01:15:20+00:00'
  timeline:
