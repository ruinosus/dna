  body: |-
    # Plan — s-cli-localresolver-consistency (kz-001)

    ## Root cause (mechanics of the gap)
    Three boot recipes, three resolver-wiring behaviors:
    - `Kernel.quick` / `build_quick_manifest` — registers the FULL resolver set (local+github+http+https+registry+helix). `local:` deps resolve.
    - `Kernel.auto(source=<fs>)` / `build_auto_kernel` — registers ONLY LocalResolver on the fs branch. `Kernel.from_config` inherits this → `local:` resolves.
    - CLI `_ctx._build_holder_async` — calls `Kernel.auto()` with NO source, then `kernel.source(source)` SEPARATELY. The resolver-wiring branch (guarded by `source is not None`) never runs → NO resolvers at all. `dna eval run` cannot resolve a `local:<scope>` dep. THIS is the bug.

    ## Fix
    1. Extract a shared `wire_filesystem_resolvers(kernel, base_dir)` helper in `kernel_bootstrap.py` registering the quick resolver set.
    2. `build_quick_manifest` + `build_auto_kernel` (fs branch) use the helper → one recipe, no drift.
    3. CLI `_build_holder_async`: after `kernel.source(source)`, wire the resolvers when the source is filesystem (has base_dir / supports_readers); documented no-op for non-fs (SQL) sources — LocalResolver is meaningless without a fs scope-root.
    4. Verify `from_config` (build_from_config → build_auto_kernel) is aligned by construction.

    ## Non-fs (SQL) honest behavior
    LocalResolver is relative to a filesystem scopes dir. When the source has no resolvable base_dir (sqlite/postgres), skip LocalResolver (no-op) rather than wiring a broken relative resolver. Matches build_auto_kernel's non-fs branch (NoopCache, no resolvers).

    ## Parity
    CLI is Python-only (no TS CLI). TS `fromConfig`/`quickInstance` already wire resolvers for fs sources — no TS gap. Document the asymmetry.

    ## Proof
    TDD: a test mounting a scope with a `local:<lib-scope>` dep, proving the CLI/auto boot resolves it (red→green) and that Kernel.quick keeps resolving. Same scenario via both paths → same result.

    ## Gates
    Full Py+TS suites + guards + `mkdocs build --strict`; CHANGELOG [Unreleased]; 11/11 on PR. Do NOT merge / cut release.
