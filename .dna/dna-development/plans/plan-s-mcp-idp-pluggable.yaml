    # Plan — `s-mcp-idp-pluggable`: pluggable N-provider IdP layer for the DNA MCP server

    ## Thesis
    A serious IdP always exposes JWKS + OIDC discovery, so **a provider is a block of
    config, not code**. Generalize the single-env-provider RS into an
    **N-provider, config-driven** layer, with **Azure Entra ID** as the first concrete
    provider. Adding an IdP = one `auth.providers[]` block in `dna.config.yaml`.

    ## Design

    ### 1. Config schema (`auth.providers[]`)
    ```yaml
    auth:
      providers:
        - type: entra
          issuer: https://login.microsoftonline.com/<tid|common>/v2.0
          audience: <app-id>
          tenant_claim: tid          # Entra: Azure tenant → DNA tenant (clean)
        - type: oidc
          issuer: https://...
          jwks_uri: https://.../jwks
          audience: ...
          tenant_claim: ...
        - type: clerk                # tenant_claim default org_id
        - type: workos               # org-based
    ```
    - SDK `config.py` / `config.ts`: add `auth` to KNOWN_KEYS as an **opaque
      passthrough** field (additive, back-compat, parity Py↔TS). The SDK does not
      interpret it — the CLI owns the detailed schema.
    - CLI `_mcp_auth.parse_auth_providers(cfg)`: validates each block, applies
      per-type defaults (entra→`tid`, clerk→`org_id`, workos→`org_id`, oidc→required).

    ### 2. Multi-issuer routing (composite verifier)
    - Build one FastMCP `JWTVerifier` per provider (each aimed at its own JWKS /
      issuer / audience).
    - `_CompositeVerifier(TokenVerifier)` tries each in order; the **only** verifier
      that matches the token's issuer+audience+signature succeeds → routes by `iss`
      for free. On success it **stamps** `_dna_tenant_claim` / `_dna_scope_prefix`
      from the matching provider's config onto `token.claims`, so the bridge picks
      the right per-provider claim without global state (concurrency-safe, and it
      survives Entra `common` where the token `iss` ≠ the literal configured issuer).
    - Wrap the composite in `RemoteAuthProvider` to advertise PRM (RFC 9728) listing
      **all** providers' issuers as `authorization_servers`. `OAuthProxy` is the seam
      for providers without DCR (WorkOS/Auth0).

    ### 3. claim→tenant per provider
    - `enforce_tenant_from_context` reads the stamped `_dna_tenant_claim` /
      `_dna_scope_prefix` and calls the existing pure `tenant_from_token` with the
      provider's claim key. The fail-closed policy (`resolve_tenant`) is unchanged:
      cross-tenant denied, tenant-less denied, no-auth = identity.

    ### 4. CLI surface
    - `dna mcp serve --auth config` — build the multi-provider layer from
      `dna.config.yaml`. `--auth jwt` (env single-provider) stays for back-compat.

    ### 5. Entra reference
    - `type: entra` defaults `tenant_claim: tid`; document per-tenant issuer (clean
      exact match) vs multi-tenant `common`/`organizations` (accepted-issuers caveat)
      and audience validation.

    ## Proof
    - Unit: `parse_auth_providers` (defaults, validation, per-type tenant_claim).
    - Multi-provider e2e with **two emulated OIDC issuers** (RSAKeyPair, distinct
      issuers/audiences configured as 2 providers): token A (claim X) → tenant A;
      token B (claim Y=different key) → tenant B; unconfigured issuer → denied;
      cross-tenant denied. **Same config serves N providers.**
    - Entra real login→token→server e2e: **deferred to the owner's `azd up`** —
      a `requires_azure` skip test + a documented validation step (no Azure creds here).

    ## Gates
    - Auth stays an optional extra (stdio/base untouched). Full CLI suite + SDK
      parity suites + guards + `mkdocs build --strict` green.
    - Docs: new "Multi-provider auth" guide section (provider table, per-provider
      config, claim→tenant map, Entra + azd-up step).
    - ADR `adr-dna-mcp-runtime-face`: append "auth = pluggable N-provider,
      config-driven; Entra 1st; real e2e at azd up".
    - CHANGELOG `[Unreleased]` (no release cut).
    - PR via `story pr --base main`, CI 11/11. **NÃO mergear.**

    ## Territory guard
    Only touch the MCP auth: `_mcp_auth.py`, `mcp_cmd.py`, config (Py+TS opaque
    passthrough), tests, docs, ADR, CHANGELOG. The `dna/emit/` area is another
    agent's — untouched.
