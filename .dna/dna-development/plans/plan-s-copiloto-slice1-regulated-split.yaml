  story_ref: s-copiloto-slice1-regulated-split
  journey_phase: plan
  body: |-
    Re-arquiteturar o slice-1 existente do copiloto-medico (Node puro) embutindo o veredito do rsh-copiloto-medico-fusion-insights, sem quebrar o loop atual (COACH_LLM=mock npm start roda ponta-a-ponta).

    FASE 1 — Split de módulos: mover review.js (a superfície que 'indica tratamento' = SaMD Classe II) de src/core/ para src/conduct/, atrás de uma flag CONDUCT_MODULE_ENABLED (default OFF em prod-like), com um marcador explícito 'SaMD Classe II — a regularizar'. src/core/ fica só com o caminho ISENTO (prontuario + session-state + captura).

    FASE 2 — Safety-net: reforçar que o módulo de conduta só dispara no encerramento sobre gaps DETECTADOS (não sugeridor sempre-ligado); config de threshold.

    FASE 3 — Explicabilidade: a UI (web/app.js) mostra justificativa + baseadoEm de cada sugestão (não só o veredito); aceite exige a razão visível.

    FASE 4 — Telemetria: instrumentar RESOLVE (concordar/discordar) → módulo de telemetria loga taxa de aceite/override.

    FASE 5 — Invariante: teste que garante que nenhuma saída vai ao paciente direto (só ao médico).

    FASE 6 — STT PT-BR: camada de normalização (siglas FC/bpm, unidades, falado→documentado) entre o STT e o review.

    TDD: cada fase começa por um teste em test/ (o repo roda 'node test/*.js'). Todos os testes atuais seguem verdes + novos por fase. Branch feat/regulated-split, commit por fase, sem push (Barna revisa o diff).
