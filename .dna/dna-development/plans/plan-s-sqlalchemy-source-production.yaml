  body: |
    # Plan — s-sqlalchemy-source-production

    Promote `adapters/sqlalchemy_` (spike i-216 upstream) to production, closing every deliberate spike cut that applies in the DNA repo.

    ## 1. PG eventbus as a dialect strategy (H2 accepted, not a reason for 2 adapters)
    - `_PgOutboxEmitter` / `_NullEmitter` strategy picked at `__init__` by dialect.
    - Emits INSERT `dna_outbox` RETURNING id + UPSERT `dna_versions_seq` + `pg_notify('kernel_writes', payload)` **inside the same `engine.begin()` transaction** as the data write — exactly what `PostgresSource._emit_outbox` does.
    - Payload byte-parity guaranteed by construction: import `_build_notify_payload` + `KERNEL_EVENTBUS_CHANNEL` from `adapters/postgres/source.py` (single source of truth).
    - `supports_cross_process_invalidation` becomes instance-level: True on pg, False on sqlite.
    - Wire into save_document (actor=author, write_class), publish, delete_document (doc_version=0).

    ## 2. Memo-cache `_load_view` parity (dialect-agnostic)
    - Same design as PG raw: `_view_cache[(scope, tenant)]` + single-flight lock + deep-copy returns + `invalidate_view(scope)` wired to `kernel.on_write` in `attach_kernel`.

    ## 3. Spike cuts closed
    - FrontmatterParseWarning fallback in `_load_view` + `load_one` (canonical JSON row wins over anemic marker parse).
    - `spec.source_files` net in save_document (`pop_source_files_as_entries`, text+binary).
    - Preserve-binary bundle semantics on pg (DELETE only text rows), full-replace on sqlite (schema has no content_binary) — mirrors each raw adapter.
    - Genome catalog surface: list_module_versions / get_module_version / deprecate_module_version (dialect-agnostic Core).
    - Layer surface: save_layer_document / delete_layer_document / list_layers / list_tenants.
    - Bundle-override slow-path in `query` (`_reader_can_produce` → `_load_view` route) — count inherits via count_via_query.

    ## 4. Packaging
    - Extra `sqlalchemy-spike` → `sql = ["sqlalchemy[asyncio]>=2", "dna-sdk[sqlite,postgres]"]` (drivers ride the existing extras); added to `all`.
    - Guard test: fresh-interpreter import of dna + Kernel.auto never pulls sqlalchemy.

    ## 5. Matrix + bench + docs
    - SA×2 dialects promoted into the canonical `test_source_conformance_kit.py` matrix (spike mirror file absorbed); only xfail = sqlite tenant-PK (i-092 schema debt).
    - New `tests/test_sqlalchemy_source.py` covering the production additions (eventbus tx parity, memo-cache, frontmatter fallback, source_files net, catalog).
    - Port bench → `packages/sdk-py/scripts/bench_sources.py`; publish numbers in the PR.
    - PORT-CONTRACT.md gains "Using the SQLAlchemy adapter" (same tables ⇒ switch = instantiation flag, zero migration).

    ## Gates
    sdk-py full 0 failed (with and without `sql` extra) · SA matrix 2 dialects zero fail (pg via disposable `dna_ci_test` DB) · sdk-ts untouched green · cli tests green.
