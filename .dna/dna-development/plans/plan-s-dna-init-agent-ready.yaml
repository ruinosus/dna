  body: |
    # Plan — `dna init`: agent-ready onboarding for consumer projects

    ## Problem
    `pip install dna-sdk dna-cli` delivers a working kernel + CLI, but the consumer's
    AI agent arrives blind: the `dna-sdlc-cli` skill, the AGENTS.md conventions and the
    git hooks exist only in the dna repo. The foundry-assured pilot bootstrapped all of
    this by hand. For vibe coding, agent onboarding IS the product.

    ## Design (ratified)
    Assets travel as **Kinds inside an embedded onboarding Genome** (package-data in
    `dna_cli/data/onboarding-scope/`), materialized by the SDK's market writers —
    the writers are the product (dogfood), not loose text templates.

    ### Embedded onboarding scope (`packages/cli/dna_cli/data/onboarding-scope/`)
    - `skills/dna-sdlc-cli/SKILL.md` — Kind `agentskills-skill`; content ported from
      the repo's `.claude/skills/dna-sdlc-cli/SKILL.md`, GENERALIZED: no dna-repo paths,
      no `.dna/dna-development` references, scope-agnostic wording.
    - `AGENTS.md` — Kind `agentsmd-agent` (agents.md/v1): the story-first conventions
      (AC/DoD at create, plan gate, narration, test gate, Work-Item trailers,
      gapless DoD, review = open PR, done on merge), written for ANY consumer repo.

    ### `dna init [--scope <name>] [--dir <path>] [--force]` (new top-level group, `init_cmd.py`)
    1. **Board bootstrap** — reuse the canonical pattern from `install_cmd.py`
       (`dna_session` + `kernel.write_document(scope, "Genome", scope, {...})`);
       default scope = `<dirname>-dev` slugified (pilot precedent: `foundry-dev`).
    2. **Skill materialization** — read the embedded bundle with the kernel-registered
       `SkillReader` over a `FilesystemBundleHandle`, write to
       `.claude/skills/dna-sdlc-cli/` with `SkillWriter` (byte-faithful reader→writer
       round-trip — the market-fidelity machinery on its own onboarding).
    3. **AGENTS.md** — same pattern with `AgentDefinitionReader`/`Writer` to the target
       root; parseability re-proved by test with the SDK reader.
    4. **Git hooks** — reuse `hooks_cmd` internals (`_ensure_hook_file` + `core.hooksPath`
       via `_git_symbiosis`) with explicit `cwd=<dir>`; non-git dir → skip with note.
    5. **Idempotence** — never overwrite an existing file without `--force`; each step
       reports created/skipped; final summary + suggested next step
       (`dna sdlc story create …`).

    ### Scope decisions
    - Py-only: the `dna` CLI is Python; sdk-ts has no CLI — asymmetry documented in the
      getting-started page. Zero sdk-ts changes.
    - Surgical edit in `dna_cli/__init__.py` (register `init`); `memory_cmd.py` and
      `dna/memory/` untouched (parallel agent owns those).

    ## Tests
    - `packages/cli/tests/test_init_cmd.py` — clean-dir init creates full tree;
      re-run idempotent (no clobber, reports skips); `--force` overwrites;
      AGENTS.md parses via `AgentDefinitionReader`; materialized skill round-trips via
      `SkillReader` (name + instruction fidelity); non-git dir skips hooks gracefully;
      board usable (`Genome.yaml` written through the kernel).
    - Product smoke: scratch project + fresh venv + editable `dna-cli` → `dna init` →
      tree; `dna sdlc story create` on the new board; hook stamps a commit.
      TestGuide `--product` + TestRun with evidence.

    ## Docs (gates)
    - `docs/getting-started/agent-onboarding.md` (prose with `dna init` invocation —
      docs_coverage_guard) + mkdocs nav entry.
    - Regenerate `docs/reference/cli/` (`scripts/gen_cli_docs.py` — drift guard).
    - `mkdocs build --strict` green.

    ## Delivery
    Branch `feat/s-dna-init-agent-ready` → PR via `dna sdlc story pr` (no merge).
    Follow-up candidate (filed as Issue if out of budget): publish the onboarding
    Genome also via `dna install github:` as an alternative delivery channel.
