  body: |
    # Plan — MCP server MVP (`s-dna-mcp-server-mvp`)

    ## Goal
    One thin MCP server that exposes the **live, configured DNA** — definitions + SDLC
    + memory — over stdio, reusing the existing pure cores (no new business logic).

    ## Where it lives
    - `packages/cli/dna_cli/_mcp_server.py` — `build_server(scope=None, base_dir=None) -> FastMCP`
      plus pure async impl helpers. The CLI package is the right home: it already
      boots the kernel session and owns `_digest.build_digest`; the impl imports the
      SDK cores (`dna.emit.build_emit_context`/`ToolLibrary`, `dna.memory` verbs,
      `mi.build_prompt_async`).
    - `packages/cli/dna_cli/mcp_cmd.py` — `dna mcp serve` Click command (lazy-imports mcp;
      clean error if the `[mcp]` extra is absent).
    - Register `main.add_command(mcp_cmd.mcp)` in `dna_cli/__init__.py`.
    - `packages/cli/pyproject.toml` — add optional `[project.optional-dependencies] mcp = ["mcp>=1.2"]`.

    ## Kernel lifecycle
    FastMCP owns its event loop (`mcp.run()` / test loop). Build ONE persistent kernel
    holder lazily on the running loop (cached per server) via the existing
    `_build_holder_async`; register the sqlite-vec search provider (reuse
    `recall_cmd._register_provider` pattern) so `recall`/`remember` are semantic when
    the extra is present, lexical otherwise. All tools are async → call the kernel's
    async surface directly.

    ## Tools (server ÚNICO expõe TUDO)
    Definitions (recover emit's loss):
    - `compose_prompt(scope?, agent, tenant?)` → live-composed prompt via
      `kernel.instance_async(scope, layers={"tenant":…})` + `build_prompt_async`.
      Tenant param is the killer feature.
    - `list_agents(scope?)`, `list_tools(scope?)`, `get_tool(scope?, name)` (Tool Kind
      surfaces via `ToolLibrary`).
    SDLC (self-describing board):
    - `sdlc_digest(since?, scope?)` → reuse `_digest.build_digest`.
    - `list_stories(status?, scope?)`, `get_adr(name, scope?)`.
    Memory (declarative recall):
    - `recall(query, scope?, k?)`, `remember(summary, …)`, `consolidate(apply?)` →
      `dna.memory` verbs.

    ## Resources
    - `dna://{scope}/manifest` — scope manifest (roster of agents/tools/kinds).
    - `dna://{scope}/agents` — the agent roster. Proves resources beyond tools.

    ## Tests (`packages/cli/tests/test_mcp_server.py`)
    - Build the server against `examples/emitting-to-a-runtime/.dna` (concierge scope).
    - Call impls directly + go through `server.call_tool(...)`:
      - `compose_prompt` returns the composed prompt (Soul persona line present).
      - tenant overlay fixture (tmp scope copy + `tenants/acme/scopes/…` override) →
        `compose_prompt(tenant="acme")` differs from base.
      - `sdlc_digest` returns a digest dict; `list_agents` lists concierge.
      - `recall` returns memory (write one via `remember` first) — SAME server.
    - One smoke asserting definitions + SDLC + memory all answered by ONE server.
    - Lazy-import guard: base import of `dna_cli` never imports `mcp`.

    ## Docs
    - `docs/guide/mcp-server.md` — "The MCP server — DNA as a live layer": the two
      faces (emit static vs MCP dynamic) + static/dynamic table + how a client
      (`dna mcp serve` + client config JSON) connects. Add to mkdocs nav.
    - CHANGELOG `[Unreleased]`.

    ## Gates
    suites + guards + `mkdocs build --strict` green; `[mcp]` lazy so base install
    unaffected. NOT merged (PR via `story pr --base main`).
