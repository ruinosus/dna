  body: |
    # Plan — s-onboarding-genome-install (resolve i-015-onboarding-genome-via-install)

    ## Problema
    `dna init` projeta apenas o Genome de onboarding EMBARCADO no dna-cli. Um time que
    queira distribuir seu próprio pack (skill de convenções + AGENTS.md da casa) não tem
    canal: `dna install` escreve no source `.dna/`, não nas projeções de ferramenta
    (.claude/.github/...). Semânticas distintas → design próprio (i-015).

    ## Design

    ### Semântica: `dna init --from <uri>` = projeção, `dna install` = board
    - `--from` aceita `github:owner/repo[/subdir][@ref]`, `local:<path>` e (açúcar) um
      path local existente. Fetch/parse é o MESMO código do install (`install_cmd._fetch`
      → `GitHubResolver.fetch_tree`) — zero duplicação.
    - O pack substitui os assets embarcados: toda Skill válida encontrada na árvore é
      projetada por `--tools` (uma Kind, N projeções, writers byte-fiéis — idêntico ao
      caminho embarcado, mesma idempotência/`--force`). AGENTS.md do pack quando existir;
      senão **fallback pro embarcado com nota explícita** (o projeto continua agent-ready
      completo; o time que só distribui skill herda a superfície canônica padrão).
    - `--from` NÃO grava conteúdo do pack no source. Board bootstrap continua local
      (Genome derivado do dirname); Genome no pack é ignorado (nunca redefine identidade
      de scope — mesma regra do install). Quem quiser o pack TAMBÉM no board roda a
      combinação documentada: `dna install <uri>` + `dna init --from <uri>` (mesmo ref).
      Dupla-escrita automática = acoplamento sem caso de uso claro → não implementar.

    ### Modelo de ameaça (3 linhas)
    1. Conteúdo do pack é DADO NÃO-CONFIÁVEL → reuso verbatim da 1ª defesa do install
       (`_scan_tree` + `_validate_doc`): só Kinds registrados, schema JSON validado,
       nomes slug-only (path traversal nunca alcança o filesystem), root-Kind rejeitado.
    2. Destinos de projeção são `<tool-dir>/<slug>` + `AGENTS.md` fixo → sem escrita
       fora do projeto por construção.
    3. Risco residual inerente: uma skill É instrução de agente (vetor de prompt
       injection) — não é mitigável por código; o output com `--from` imprime aviso
       "review before committing — treat a third-party pack like a dependency".

    ### Passos de output
    Embarcado: byte-compatível com hoje (`skill[claude]`...). Com `--from`:
    `skill[<tool>:<skill-name>]` (packs multi-skill precisam de ids únicos no `--json`).

    ## Implementação
    1. `init_cmd.py`: extrair `_load_embedded_pack()` / `_load_remote_pack(uri)`
       (dataclass `OnboardingPack{skills, agents_raw, source_label, notes}`);
       generalizar `_materialize_skills`/`_materialize_agents_md` pra receber raws;
       opção `--from`; aviso de segurança; docstrings/help.
    2. Pack exemplo `examples/onboarding-pack/` (skill genérica `acme-conventions` +
       AGENTS.md + README) — o dogfood público.
    3. Testes offline em `test_init_cmd.py` (pack local: happy, sem-skill falha,
       fallback AGENTS, idempotência/--force, traversal/schema rejeitados, bare path,
       Genome do pack ignorado, --json). Smoke real `github:` fica no TestRun
       (CI é DNA_OFFLINE=1; teste de rede pinado em branch ficaria stale pós-merge —
       follow-up: apontar um requires_network pra @main depois do merge).
    4. Docs: `agent-onboarding.md` § "Distribute your team's onboarding pack";
       `scripts/gen_cli_docs.py` regenerado; coverage guard + mkdocs --strict.
    5. Smoke: push da branch → `dna init --from github:ruinosus/dna/examples/onboarding-pack@feat/s-onboarding-genome-install`
       em projeto scratch; TestGuide `--product` + TestRun pass.
    6. `story pr` (11 checks), issue i-015 in-progress + nota resolve done-on-merge.
