  body: |
    # Plan — `dna emit --target agent-framework` (productize the spike)

    ## Goal
    Turn the proven spike emitter (`foundry-wt-spike/spike/emitter/dna_to_af.py`, round-trip
    byte-equal) into a first-class DNA capability: a pluggable emitter port + registry, a real
    structural field de-para, and a `dna emit` CLI command.

    ## Architecture (SDK-first, CLI-thin)
    1. **`packages/sdk-py/dna/emit/__init__.py`** — the neutral emit layer:
       - `EmitContext` — the composed, runtime-agnostic view of a DNA agent
         (name, description, instructions=build_prompt, model string, tools[], output_schema, losses sink).
       - `EmitResult` — `{artifact: str, filename, target, losses[], mapping{}}`.
       - `EmitterPort` (Protocol/ABC) — `target`, `file_extension`, `emit(EmitContext) -> EmitResult`.
       - `register_emitter` / `get_emitter` / `available_targets` — the registry (NOT hardcoded).
       - `emit_agent(scope, agent, target, *, base_dir, model, provider, ...)` — high-level: boots a
         filesystem kernel, composes the agent (build_prompt + Tool resolution), builds EmitContext,
         dispatches to the registered emitter.
    2. **`packages/sdk-py/dna/emit/agent_framework.py`** — first target:
       - `AgentFrameworkEmitter(EmitterPort)`, `target="agent-framework"`.
       - Pure mapping `to_prompt_agent(ctx) -> dict`:
         - `kind: Prompt`
         - `name`: CamelCase(agent name)
         - `description`: metadata.description
         - `model: {id, provider}` — from DNA model string (`prov:model` / `prov/model` / bare) via a
           provider map (openai→OpenAI, azure→AzureOpenAI, …); CLI `--model/--provider` override.
         - `instructions`: the DNA-composed prompt (byte-equal gate).
         - `tools`: `[{type: function, name, description, parameters}]` per Tool (input_schema→parameters).
         - `outputSchema`: only when the agent/tool declares one.
       - Records losses: tenant overlay, composition structure, eval-as-contract → no AF slot.
    3. **`packages/cli/dna_cli/emit_cmd.py`** — `dna emit <agent> --target <t> [--scope] [--out] [--model] [--provider] [--json]`.
       Registered in `dna_cli/__init__.py`. Lists targets via the registry; `--list-targets`.

    ## Parity (Py↔TS)
    The pure de-para (`to_prompt_agent`) is small and pure. Decision: implement the emit layer in the
    **Python SDK + CLI** (the `dna emit` surface + the only proven native loader, AgentFactory, are
    Python/.NET). Mirror the pure mapping + registry in the **TS SDK** (`packages/sdk-ts/src/emit/`) so
    Studio/TS consumers can emit too, with a byte-parity fixture test. Document the split in the guide.

    ## Proof / tests
    - `packages/sdk-py/tests/test_emit_agent_framework.py`:
      - **Always**: emit for a fixture scope → parse YAML → `instructions` == `mi.build_prompt(agent)`; tools mapped.
      - **Gated**: `pytest.importorskip("agent_framework_declarative")` → AgentFactory loads the emitted YAML.
    - TS: `packages/sdk-ts/tests/emit-agent-framework.test.ts` — same byte-equal mapping over a fixture.

    ## Docs
    - `docs/guides/emitting-to-a-runtime.md` — the de-para table (what maps / what is lost) + how to plug a new target.
    - Wire into `mkdocs.yml` nav; `mkdocs build --strict` green.

    ## SDLC/board
    Epic `e-dna-portability`; ADR `adr-dna-pivot-portability` (produces of epic); Research
    `rsh-agent-config-landscape-2026` bridged via a Reference + `cite` from the ADR.
    CHANGELOG [Unreleased] only (no release). PR via `story pr`, base main. NOT merged.
