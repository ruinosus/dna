  body: |
    # Plan — s-emit-bedrock (DNA → Amazon Bedrock Agent emitter)

    ## Target choice
    Emit **AWS::Bedrock::Agent** as a CloudFormation template (JSON). Rationale: of the
    three AWS options — Bedrock Agents (managed, declarative), Strands (code-first),
    AgentCore (a hosting runtime) — only Bedrock Agents has a clean, published
    declarative schema (Instruction / FoundationModel / ActionGroups+FunctionSchema)
    that maps field-for-field from a DNA agent. Strands is code, AgentCore hosts a
    framework — neither is a declarative de-para target. CloudFormation gives a
    lintable, credential-free artifact.

    ## The de-para (structural, parity Py<->TS on the emitted object)
    - metadata.name            -> Resources.<CamelId>Agent.Properties.AgentName
    - metadata.description      -> Properties.Description (when present)
    - build_prompt (Soul+guardrails+instruction) -> Properties.Instruction (BYTE-EQUAL gate)
    - spec.model / Genome default_llm -> Properties.FoundationModel (provider token stripped)
    - spec.tools[] (Tool Kind)  -> Properties.ActionGroups[0].FunctionSchema.Functions[]
        - Tool.name/description  -> Function.Name/Description
        - input_schema.properties-> Function.Parameters{ name: {Type,Description,Required} }
        - ActionGroupExecutor    -> {CustomControl: RETURN_CONTROL} (client-side tools, no Lambda)

    ## Losses (reported, not hidden)
    composition structure; tenant overlay; eval-as-contract; tool param schema DEPTH
    (Bedrock ParameterDetail is flat Type in {string,number,integer,boolean,array}; default/
    enum/nested/items dropped); output_schema (no Bedrock response-schema slot); model
    coordinate (azure/openai coord is not a Bedrock model id — deploy needs a Bedrock
    foundation-model / inference-profile ARN + AgentResourceRoleArn).

    ## Proof
    - Py + TS emit-bedrock tests: byte-equal Instruction, structural de-para, honest
      losses, registry additivity, and a credential-free structural validator against
      the documented AWS::Bedrock::Agent schema (required keys, name patterns, enum
      param Types). Py<->TS parity on the emitted template object.
    - Example extended: same concierge -> agent-framework AND bedrock (2 runtimes,
      1 source — the portability proof).
    - Docs guide + CHANGELOG. TestGuide --product + TestRun. PR base main, 11/11 CI.
