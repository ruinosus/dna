  completed_at: '2026-07-12T13:10:09+00:00'
  findings: 'FUSÃO VALIDADA nos DOIS braços. (1) DNA: research→insight→ação já provado (lançou este experimento). (2) copiloto-medico (domínio NOVO, sem baseline): o research personalizado produziu insights ALTAMENTE acionáveis — o maior: ''sugerir conduta'' = SaMD Classe II regulado pela ANVISA RDC 657/2022 (HITL NÃO isenta; só documentação pura é isenta), então a arquitetura tem que SEPARAR um core-scribe isento de um módulo-de-sugestão regulado. Plus: ''sugerir conduta em tempo real'' é white-space real (Corti FactsR para exatamente nessa linha); Voa Health já domina scribe PT-BR (60k+ médicos); o design vencedor é ''safety-net que dispara em erro detectado'' (estudo OpenAI-Penda: -16% erro diagnóstico, -40k visitas), não escuta passiva pura. Critério ''1 insight que faz agir'' → SUPERADO (múltiplos).'
  recommendation: 'A fusão (contexto do usuário → inteligência pessoal e acionável) FUNCIONA e GENERALIZA (dev + médico). Prosseguir com a camada de inteligência do adr-dna-cloud-intelligence-layer, com o anti-ruído/relevância como O foco de engenharia. Precificar como intel (time/enterprise). Para o copiloto: agir no split regulatório.'
