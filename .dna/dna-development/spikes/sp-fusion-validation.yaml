  name: sp-fusion-validation
spec:
  title: 'Validar a fusão: inteligência-de-contexto vs ruído, no portfólio real do Barna'
  question_to_answer: 'A camada de inteligência do DNA, usando o contexto REAL do Barna (seus apps: definitions + memória + trabalho), produz insights que ele julga VALIOSOS e acionáveis — não ruído?'
  status: answered
  feature: f-dna-cloud-intelligence
  time_box_hours: 8
  research_refs:
  - rsh-dna-cloud-positioning
  - rsh-dna-cloud-intelligence
  - rsh-copiloto-medico-fusion-insights
  labels:
  - dogfood
  - research
  body: |-
    ## Hipótese
    A FUSÃO (contexto DNA do usuário → insight pessoal + acionável) é o ÚNICO diferenciável (as 2 pesquisas), mas é NÃO-PROVADA + o anti-ruído é o maior risco. Este spike testa se ela funciona no portfólio REAL do Barna antes de escalar.

    ## Experimento (o esqueleto — a moldar com o Barna)
    1. Escolher 1-2 apps REAIS do Barna.
    2. Definir o CONTEXTO de cada (o que é, o espaço, os objetivos) — o input de personalização.
    3. Rodar research automático (o deep-research harness que já existe) por app, sobre o mundo relevante (concorrentes, aporte, GitHub, releases, HN).
    4. Produzir INSIGHTS ranqueados pela relevância ao contexto do app (não feed genérico).
    5. Barna JULGA cada insight: valioso (vale saber/agir) vs ruído.

    ## Critério de sucesso (o teste anti-ruído)
    - Signal ratio: de N insights, % que o Barna marca valioso (threshold a definir).
    - Acionabilidade: >=1 insight virou ação real (mudança/card/decisão)? Mesmo 1 = sinal forte.
    - KILL: se for majoritariamente ruído → a fusão falha → pivota.

    ## Perguntas de desenho (a moldar juntos)
    1. Quais 1-2 apps? 2. Qual contexto define cada? 3. O que é 'valioso' pro Barna? 4. Threshold de sucesso? 5. Quais fontes? 6. Quantos insights por run?
