kind: Story
metadata:
  name: s-dna-init-agent-ready
spec:
  title: dna init — multi-tool agent-ready onboarding para projetos consumidores
  description: 'dna init — onboarding agent-ready para projetos consumidores: pip install dna-cli entrega kernel+CLI mas o agente chega cego (skill/AGENTS.md/hooks só existem no repo dna; piloto foundry bootstrapou à mão). Um comando materializa o Genome de onboarding embarcado via os writers de mercado do SDK.'
  status: done
  feature: f-dna-ecosystem
  priority: high
  labels:
  - cli
  - docs
  - meta
  reporter: claude-code
  acceptance_criteria:
  - text: Given um diretório de projeto limpo, When roda dna init, Then cria o board .dna/<scope>/ com Genome (bootstrap canônico via kernel) + containers SDLC, projeta a Skill dna-sdlc-cli via SkillWriter byte-fiel no diretório de skills de CADA tool selecionada (--tools claude,copilot,cursor,opencode; default claude,copilot; aceita all), escreve AGENTS.md agents.md/v1 como superfície canônica de instruções na raiz e instala os git hooks
    done: true
    done_at: '2026-07-10T19:41:10+00:00'
    done_by: claude-code
    evidence: test_init_cmd.py::test_init_creates_full_onboarding_tree + ::test_init_tools_all_projects_every_tool_dir + smoke tr-tg-s-dna-init-agent-ready-20260710-193815 (init --tools all = 7 created)
  - text: 'Given um projeto já inicializado, When re-roda dna init, Then é idempotente: nenhum arquivo existente é sobrescrito sem --force e o resumo diz o que foi pulado; --force nunca reescreve o board'
    done: true
    done_at: '2026-07-10T19:41:12+00:00'
    done_by: claude-code
    evidence: test_init_rerun_is_idempotent_and_reports_skips + test_init_force_overwrites_files_but_never_the_board; smoke re-run 0 created/7 skipped
  - text: AGENTS.md gerado é parseável pelo reader agentsmd do SDK; a skill materializada round-tripa pelo reader agentskills e as N projeções são byte-idênticas entre si (um Kind, N projeções — provado por teste)
    done: true
    done_at: '2026-07-10T19:41:13+00:00'
    done_by: claude-code
    evidence: test_generated_agents_md_parses_via_agentsmd_reader + test_materialized_skill_roundtrips_via_agentskills_reader (byte-identical) + test_init_tools_all (projeções byte-idênticas)
  - text: Conteúdo tool-agnostic (sem frontmatter proprietário nem persona de uma tool); skill embarcada generalizada (zero caminhos/venvs internos do repo dna); brand-guard e gitleaks limpos; decisão multi-tool ancorada em Research/rsh-cross-tool-agent-standards linkada na story
    done: true
    done_at: '2026-07-10T19:41:15+00:00'
    done_by: claude-code
    evidence: 'test_embedded_onboarding_assets_carry_no_repo_internals; brand-guard + gitleaks verdes no PR #39; Research/rsh-cross-tool-agent-standards linkada via produces'
