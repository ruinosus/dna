    type: decision
    source: cli
    summary: 'Exploração concluída. Decisões de design: (1) Genome de onboarding embarcado como package-data em dna_cli/data/onboarding-scope/ com skills/dna-sdlc-cli/SKILL.md + AGENTS.md generalizados; (2) dna init lê os assets com SkillReader/AgentDefinitionReader e materializa com SkillWriter/AgentDefinitionWriter (round-trip de mercado é o produto); (3) board bootstrap reusa o padrão canônico do install_cmd (kernel.write_document Genome); (4) hooks reusam _ensure_hook_file/_git_symbiosis com cwd explícito; (5) scope default <dirname>-dev seguindo o precedente foundry-dev do piloto.'
    commit_ref: 13c17b20635eea7b62f1268bfc32b1389408ef08
  - at: '2026-07-10T19:17:37+00:00'
    actor: claude-code
    type: decision
    source: cli
    summary: 'Implementação core pronta: init_cmd.py (board via kernel.write_document + skill via SkillReader→SkillWriter + AGENTS.md via AgentDefinitionReader→Writer + hooks via _git_symbiosis com cwd explícito). Decisão: o board recém-criado ganha containers stories/features/issues com .gitkeep — sem eles o autodetect de scope do sdlc (que sonda containers SDLC, i-012) não enxerga o board novo e story create cairia no fallback dna-development. Validado manualmente: init limpo + re-run idempotente + feature/story create no board novo com autodetecção. Decisão adicional: next-steps e AGENTS.md embarcado incluem feature create antes de story create (--feature é required).'
    commit_ref: 13c17b20635eea7b62f1268bfc32b1389408ef08
  - at: '2026-07-10T19:26:04+00:00'
    actor: claude-code
    type: decision
    source: cli
    summary: 'AMPLIAÇÃO DE ESCOPO ratificada: dna init vira MULTI-FERRAMENTA. Evidência capturada em Research/rsh-cross-tool-agent-standards: AGENTS.md é O padrão de instruções (LF/Agentic AI Foundation, 28+ tools incl. Claude Code que também o lê) e SKILL.md/agentskills.io é O padrão de skills (~40 tools; formato idêntico, só muda o diretório: .claude/.github/.cursor/.opencode). Refatorando: --tools claude,copilot,cursor,opencode (default claude,copilot; aceita all) — a MESMA Skill Kind projetada 1x por diretório-alvo; AGENTS.md vira superfície canônica; conteúdo tool-agnostic; sem GEMINI.md por default (documentado o ponteiro).'
    commit_ref: 13c17b20635eea7b62f1268bfc32b1389408ef08
