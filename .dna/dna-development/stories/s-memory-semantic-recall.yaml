metadata:
  name: s-memory-semantic-recall
spec:
  title: 'Semantic recall na memória: quando um RecordSearchProvider + EmbeddingPort estão'
  description: 'Semantic recall na memória: quando um RecordSearchProvider + EmbeddingPort estão configurados, recall(cue) combina o ranking de recall existente com o ranking ecphory alimentado por similaridade de embedding (ativa o hook semantic_scores do score_engram, hoje código morto) e funde via RRF — o mesmo RRF do search. Sem provider → comportamento atual intacto (offline-first, zero breaking change). Sem LLM/scribes.'
  status: done
  feature: f-dna-search-memory
  reporter: claude-code
  acceptance_criteria:
  - text: Given um scope com provider sqlite-vec + embedder registrados, When recall(cue) roda com uma paráfrase que o cue-match do ecphory não alcança, Then a memória-alvo surge no top-k via plano semântico (cosine no Path 3 do score_engram) e o hit é anotado (semantic/rank_ecphory/rank_recall)
    done: true
    done_at: '2026-07-10T19:52:09+00:00'
    done_by: story-done-auto
  - text: Given nenhum provider registrado, When recall(cue) roda em modo auto, Then hits idênticos (golden) ao comportamento pré-story
    done: true
    done_at: '2026-07-10T19:52:09+00:00'
    done_by: story-done-auto
  - text: Given o mesmo conjunto de engrams + cue + fake embeddings, When o ranking semântico roda em Py e TS, Then ordem e scores são idênticos (fixture de paridade compartilhada)
    done: true
    done_at: '2026-07-10T19:52:09+00:00'
    done_by: story-done-auto
  - text: Given dna memory recall --semantic/--no-semantic, When o flag é omitido, Then modo auto (usa semântico se provider disponível)
    done: true
    done_at: '2026-07-10T19:52:09+00:00'
    done_by: story-done-auto
  acceptance_criteria_source: cli-create
  definition_of_done:
  - text: código Py+TS em paridade 1:1 (core puro twin; verbs Py-only como já é a fronteira do repo); remember segue indexando no write; backfill lazy promovido pra SDK e documentado; testes unit Py+TS com FakeEmbedding (paráfrase, golden sem provider, paridade de ranking); fixture memory-scoring-parity estendida via gerador; docs prosa (guides/semantic-recall.md + concepts/search-and-memory.md) + referência CLI regenerada; suites completas + guards + mkdocs --strict verdes; smoke real sqlite-vec com TestGuide --product + TestRun; PR via story pr, sem merge
    done: true
