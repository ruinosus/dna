spec:
  title: 'Copiloto Médico slice-1 com a arquitetura rachada: core-scribe ISENTO + módulo d'
  description: 'Copiloto Médico slice-1 com a arquitetura rachada: core-scribe ISENTO + módulo de sugestão-de-conduta SEPARADO (safety-net, regulado). Output acionável do experimento sp-fusion-validation.'
  status: review
  feature: f-dna-cloud-intelligence
  priority: high
  labels:
  - feature
  - intelligence
  reporter: claude-code
  business_value: 700
  acceptance_criteria:
  - 'Duas superfícies de código separadas: (1) core de documentação (captura→transcrição→nota) que NÃO indica tratamento — caminho isento ANVISA; (2) módulo de sugestão-de-conduta isolado, com sua própria governança/flag.'
  - O módulo de conduta segue o padrão safety-net (dispara só em risco/erro detectado + contexto do paciente), NÃO sugeridor sempre-ligado.
  - 'Sugestões são explicáveis: mostram raciocínio/evidência, não só veredito; aceite de alto risco exige justificativa ativa.'
  - Telemetria de aceite/override instrumentada desde o slice-1 (deskilling como métrica, não slogan).
  - A ferramenta NUNCA aconselha o paciente direto — só o médico no loop (preserva o escudo learned-intermediary).
  acceptance_criteria_source: cli-create
  definition_of_done:
  - Core-scribe roda no slice-1 (mesmo com prontuário mockado) e é claramente marcado como caminho isento.
  - Módulo de conduta existe como superfície separada e desligável, com nota explícita de que é SaMD Classe II a regularizar.
  - STT com camada de LM PT-BR + normalização (não Whisper puro) no pipeline de captura.
  - Consulta regulatória BR agendada/registrada antes de habilitar o módulo de conduta em produção.
  - 'Rationale rastreável: linka rsh-copiloto-medico-fusion-insights + sp-fusion-validation.'
  definition_of_done_source: cli-create
