apiVersion: github.com/ruinosus/dna/sdlc/v1
kind: Story
metadata:
  name: s-serving-seams-for-apps
spec:
  title: 'Seams públicos pra apps out-of-tree comporem serving sem arquivo: build_rest_app'
  description: 'Seams públicos pra apps out-of-tree comporem serving sem arquivo: build_rest_app(auth_providers) + dna.migrations; + fixes de runtime que o dna-cloud precisa'
  status: review
  feature: f-copilot-mcp-apps
  priority: high
  labels:
  - serving
  - migrations
  - runtime
  reporter: claude-code
  acceptance_criteria:
  - Dado que build_rest_app(auth=config) só montava o verifier lendo dna.config.yaml de disco (file I/O no core) e escondia _multi_provider_verifier no privado, quando esta story fecha, então build_rest_app aceita auth_providers (mappings ou ProviderConfig) e constrói o verifier internamente SEM I/O de arquivo, e a CLI (api_cmd) lê o arquivo e passa auth_providers — a CLI é UM consumidor, não o caminho
  - Dado que run_migrations vivia escondido em dna.adapters._migrations, quando esta story fecha, então dna.migrations expõe o motor como seam público NEUTRO (zero menção a consumidor), consumível por dna-cloud e futuros DNA Live/Marketplace, cada um com sua própria control table
  - Dado o copiloto do dna-cloud, quando ele roda contra o runtime, então mcp_tools resolve multi-workspace pelo PATH da URL e langchain_rt/maf_rt honram DNA_MCP_URL do ambiente (endpoint é config de deploy, não declarativo)
  acceptance_criteria_source: cli-create
  definition_of_done:
  - testes do SDK verdes (serving public api + schema migrations contract), o seam público re-exporta o runner real, e o dna-cloud consome sem arquivo
  definition_of_done_source: cli-create
