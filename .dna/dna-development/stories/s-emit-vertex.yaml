metadata:
  name: s-emit-vertex
spec:
  title: 'Third runtime emitter: DNA → Google ADK Agent Config'
  description: Emit a DNA agent as a Google ADK Agent Config (LlmAgent) YAML — the third proven runtime (agent-framework + bedrock + vertex), same composed prompt byte-equal across all three.
  status: done
  feature: f-dna-emitters
  owner: claude-code
  labels:
  - emitter
  - portability
  - adk
  - vertex
  reporter: claude-code
  acceptance_criteria:
  - text: Given the concierge example scope, when I run 'dna emit concierge --target vertex', then a valid ADK Agent Config YAML is produced with agent_class LlmAgent, name, model, instruction, tools.
    done: true
    done_at: '2026-07-11T14:42:10+00:00'
    done_by: story-done-auto
  - text: Given the emitted config, when I compare its 'instruction' to build_prompt(agent), then they are byte-equal — AND identical to the agent-framework 'instructions' and the Bedrock 'Instruction' (one source → three runtimes).
    done: true
    done_at: '2026-07-11T14:42:10+00:00'
    done_by: story-done-auto
  - text: Given no GCP credential, when the artifact is validated, then it conforms structurally to the documented ADK LlmAgentConfig schema and carries the yaml-language-server schema header.
    done: true
    done_at: '2026-07-11T14:42:10+00:00'
    done_by: story-done-auto
  - text: Given DNA axes ADK has no slot for (composition, tenant, eval, tool-schema depth, output_schema, non-Gemini model), when emitting, then each is reported in EmitResult.losses, not hidden.
    done: true
    done_at: '2026-07-11T14:42:10+00:00'
    done_by: story-done-auto
