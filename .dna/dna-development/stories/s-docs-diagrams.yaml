  description: 'Diagramas Mermaid nas páginas EXISTENTES da doc (pedido Barna 2026-07-09 — ''senti falta de algo VISUAL para ports, kinds etc''): (1) concepts/microkernel-ports.md — o diagrama-assinatura do projeto: kernel mediador no centro, 5 ports (Source/Cache/Resolver/Reader-Writer/Kind) + EmbeddingPort/RecordSearchProvider, adapters plugados, extensions registrando Kinds; (2) concepts/kinds.md — anatomia de um Kind (apiVersion/kind/metadata/spec) + fluxo de composição (Agent + Soul + Skills + Guardrails → prompt composto); (3) concepts/thesis.md — o paralelo CRD↔Kind lado a lado (2 colunas visuais); (4) concepts/market-fidelity.md — round-trip bundle nativo→reader→typed doc→writer→byte-idêntico; (5) concepts/tenancy-layers.md — base ∪ overlay com shadow; (6) guides/sdlc.md — o ciclo story→plan→build(commits carimbados)→test-gate→done + a symbiosis git↔SDLC; (7) README — 1 diagrama hero compacto da arquitetura (GitHub renderiza mermaid nativo). Config superfences/mermaid no mkdocs.yml vem da story irmã s-docs-search-memory-prose (que está adicionando) — se ela não tiver mergeado ainda, incluir aqui com merge cuidadoso. Diagramas simples (~10 nós), sem cores custom, legíveis no tema claro/escuro.'
