apiVersion: github.com/ruinosus/dna/sdlc/v1
kind: Story
metadata:
  name: s-memory-conformance-kit
spec:
  title: Kit público de conformance de memória em dna.testing
  description: 'Follow-up nomeado do PR #38: dna.testing tem kits públicos pra SourcePort, Reader/Writer e RecordSearchProvider mas não pra memória. Criar memory_conformance_suite (verbos kernel-bound, capability-aware) + memory_scoring_conformance_suite (core puro, twin TS memoryScoringConformanceSuite) pinando os invariantes comportamentais: roundtrip remember→recall, determinismo, semantic on/off, forget bi-temporal, consolidate idempotente, decay monotônico, backfill lazy idempotente, pesos/threshold do ecphory e fusão RRF.'
  status: done
  feature: f-dna-search-memory
  reporter: claude-code
  acceptance_criteria:
  - text: Given um autor de adapter com um kernel factory (source gravável + provider opcional), When ele roda memory_conformance_suite(factory) via pytest parametrize, Then os 9 casos kernel-bound passam contra sqlite-vec e pgvector builtin e casos que exigem provider skipam limpo sem provider
    done: true
    done_at: '2026-07-10T20:57:32+00:00'
    done_by: story-done-auto
  - text: Given um embedder custom (EmbeddingPort), When memory_scoring_conformance_suite/memoryScoringConformanceSuite rodam com o factory dele, Then os casos puros (pesos/threshold ecphory, fusão RRF, decay monotônico, bi-temporal fail-open, cosine relativo) passam em Py e TS com nomes de caso idênticos
    done: true
    done_at: '2026-07-10T20:57:32+00:00'
    done_by: story-done-auto
  - text: Given recall com semantic=False, When o kit valida o shape, Then hits sem anotações de fusão (byte-shape base); com provider em modo auto, semantic=True + rank_recall/rank_ecphory/score_recall anotados
    done: true
    done_at: '2026-07-10T20:57:32+00:00'
    done_by: story-done-auto
  - text: Given um consumidor externo simulado (projeto scratch com sdk editable + provider fake trivial implementado de fora), When ele roda run_memory_conformance + run_memory_scoring_conformance, Then a suite passa provando a API pública de fora
    done: true
    done_at: '2026-07-10T20:57:32+00:00'
    done_by: story-done-auto
  acceptance_criteria_source: cli-create
  definition_of_done:
  - text: kit Py dna.testing.memory_conformance + espelho TS dna-sdk/testing pro core puro (verbs Py-only documentado); kit rodando contra sqlite-vec + pgvector (requires_postgres, mesmo padrão do job postgres); docs na casa dos kits (getting-started/conformance-kit.md) + ponteiro no guia de semantic recall; referências re-geradas se drift; suites completas sdk-py/sdk-ts+typecheck/cli + guards + mkdocs --strict verdes; smoke de produto com TestGuide --product + TestRun; PR via story pr com CI 11/11, sem merge
    done: true
    done_at: '2026-07-10T20:57:32+00:00'
    done_by: story-done-auto
  definition_of_done_source: cli-create
