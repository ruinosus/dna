    source: cli
    summary: 'Kit implementado seguindo o padrão canônico do record_search_conformance (factory async → (objeto, cleanup), caso fresh por execução, skip via SkipTest, runner programático + report). Decisões: (1) DOIS suites — memory_conformance_suite (kernel-bound, 10 casos sobre os verbos, capability-aware via superfície PÚBLICA: remember reporta indexed / backfill_index retorna 0 → MemoryCaseNotApplicable, sem tocar atributo privado) e memory_scoring_conformance_suite (7 casos puros, twin TS memoryScoringConformanceSuite com nomes idênticos — o próprio kit é artefato de paridade). (2) Tempo 100% simulado (now= dos verbos): staleness pro consolidate é produzida SURFACEANDO a memória em data antiga via recall (superfície pública), não escrevendo last_surfaced na mão. (3) Casos com embedder assertam similaridade RELATIVA (filosofia do search kit) — vale pra fake floor e modelo real; o caso da paráfrase documenta o gate honesto cos ≥ (threshold−novelty)/cosine_weight ≈ 0.41. (4) Verbos ficam Py-only (fronteira já declarada no repo); TS espelha só o core puro. Verificado: Py 26 pass + 3 skips simétricos esperados (lexical skipa fusão/backfill; sqlite-vec skipa fallback lexical; união dos passed == todos os 10 casos), TS 15 pass + typecheck OK. Leg pgvector escrito no mesmo padrão requires_postgres/schema descartável do search kit — validação local impossível (containerd com I/O error, sem PG local), o job postgres do CI é o gate.'
    commit_ref: 95232da0c9429b4e65644b1ba856af248763352c
