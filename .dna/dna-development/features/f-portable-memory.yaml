apiVersion: github.com/ruinosus/dna/sdlc/v1
kind: Feature
metadata:
  name: f-portable-memory
spec:
  title: Memória portável (Engram ⇄ MIF)
  description: |-
    Dar ao DNA a membrana de intercâmbio que falta: exportar/importar memória sem perda, adotando o MIF como fio neutro. O motor nativo é mantido e renomeado LessonLearned -> Engram; o MIF é carregado byte-fiel via a regra normativa #3 (o dono nomeia o schema). Design: docs/design/2026-07-18-portable-memory-design.md.

    DECISOES CONFIRMADAS (founder, 2026-07-19):
    (a) Identidade do Kind nativo = github.com/ruinosus/dna/v1 . Engram (sai de /sdlc/v1). O namespace raiz hoje abriga Tool e Copilot — os pilares; memoria entra como pilar. A alternativa /cognitive/v1 foi descartada: la moram PreMortem e PatternInsight, que sao artefatos de analise, nao substrato.
    (b) Politica de tier: export no Free (levar a sua memoria embora e um direito, e cai do modelo atual Free=read-only), import no Pro (escrita, consome quota) — COM import limitado no Free como isca de conversao, porque o Circulo B (memoria do Claude recuperavel no DNA) e a demo que vende e nao pode ficar inteira atras do paywall.
    (c) Dados antigos resolvem via alias read-time — zero migracao obrigatoria. Rewrite unico fica como faxina opcional posterior, nunca bloqueante.

    FORA DE ESCOPO (MVP): byte-fidelidade literal; --format omp|pam; Circulo C (triangulo 3-fornecedores); superficie dna-cloud (Story 5, vai para o scope dna-cloud-dev depois).
