apiVersion: github.com/ruinosus/dna/testkit/v1
kind: TestGuide
metadata:
  name: tg-speckit-mcp-apps-sdk
spec:
  description: 'Test-gate do lado SDK do card de memória MCP Apps (spec 001-mcp-apps-memory-card): golden byte-stable do template + declaração com resourceUri + resources/read com mimeType da spec + template sem dados/sem URL externa + grep-guard §3 + degradação byte-idêntica + smoke de render real no basic-host do ext-apps'
  kind_of_test: regression
  status: active
  steps:
  - action: python -m pytest packages/sdk-py/tests/test_emit_mcp_ui.py packages/cli/tests/test_mcp_apps.py -v
    expected: 17 testes verdes cobrindo as mutações do design (pointer removido, registro removido, dados assados, CDN plantado, TODO plantado — cada uma morre)
  - action: python -m pytest packages/sdk-py/tests packages/cli/tests
    expected: suítes completas verdes contra a baseline (nenhuma falha nova)
  - action: 'dna mcp serve --transport http + basic-host do ext-apps + chrome headless: list_memories, recall e empty state'
    expected: card renderiza dados reais, hits e o empty state honesto; zero elementos interativos (só leitura)
