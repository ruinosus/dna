apiVersion: github.com/ruinosus/dna/testkit/v1
kind: TestGuide
metadata:
  name: tg-dna-install
spec:
  description: 'Product smoke: dna install end-to-end contra repo GitHub REAL público (anthropics/skills) + validação/degradação'
  kind_of_test: smoke
  status: active
  steps:
  - action: 'num playground limpo (DNA_BASE_DIR novo com _lib/Genome.yaml), rode: dna install github:anthropics/skills/skills/pdf --scope market --dry-run'
    expected: plano mostra '+ install Skill/pdf', linha de cabeçalho traz o commit resolvido, exit 0, NADA escrito no disco
  - action: rode sem --dry-run
    expected: '''installed 1 · skipped 0 · rejected 0''; .dna/market/skills/pdf/SKILL.md existe; .dna/market/manifest.yaml é um Genome próprio do scope'
  - action: cat .dna/market/installed.lock
    expected: lockVersion 3, entry Skill/pdf com origin github:anthropics/skills/skills/pdf@<sha-completo> (pinado no commit, não em @main) e sha256 de 64 hex
  - action: repita o install
    expected: '''= skip Skill/pdf — already exists locally (use --force to overwrite)'', exit 0 (idempotente)'
  - action: dna doc show Skill pdf --scope market
    expected: spec.instruction contém o guia real de PDF e spec.scripts contém os sidecars (round-trip fiel)
  - action: dna install github:usuario-inexistente-xyz/nope --scope market
    expected: erro didático 'Could not fetch the repository' com as 3 dicas (URI/repo/offline→local:), exit 1, SEM traceback
  - action: 'aponte pra uma árvore local com doc de schema inválido (spec.instruction: 42), Kind desconhecido, Genome remoto e name ''../../escape'''
    expected: cada um rejeitado com razão didática específica; válidos instalam mesmo assim
  verifies:
  - Story/s-dna-install
  created_at: '2026-07-10T04:57:39+00:00'
  updated_at: '2026-07-10T04:57:39+00:00'
