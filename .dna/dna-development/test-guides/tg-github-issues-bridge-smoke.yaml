apiVersion: github.com/ruinosus/dna/testkit/v1
kind: TestGuide
metadata:
  name: tg-github-issues-bridge-smoke
spec:
  description: 'Round-trip REAL contra ruinosus/dna: publish i-005 → verificar no GitHub → import de volta num scope temporário → comparar campos → idempotência (re-publish + re-import) → sync.'
  kind_of_test: smoke
  status: active
  steps:
  - action: dna sdlc issue publish i-005-docstring-coverage-gaps
    expected: issue criada no GitHub, URL impressa, doc ganha github_number/url/state=open
  - action: gh issue view <N> --repo ruinosus/dna
    expected: 'título ''<desc truncada> (i-005-docstring-coverage-gaps)'', body com Type/Severity + link pro doc + footer 🧬 Work-Item: Issue/i-005-…'
  - action: dna sdlc issue import <#N> num scope temporário (DNA_BASE_DIR scratch)
    expected: doc i-001-gh<N>-… criado com github_number=<N>, reporter=ruinosus, type/severity mapeados
  - action: comparar doc importado vs i-005
    expected: proveniência idêntica (number/url), title=título GH, status=open
  - action: re-publish i-005
    expected: '''já publicada'' + mesma URL, sem duplicar'
  - action: re-import <#N> no scope do board
    expected: '''já importada como Issue/i-005-…'', sem doc novo'
  - action: dna sdlc issue sync i-005-…
    expected: github_state refrescado (open), synced_at atualizado
  verifies:
  - Story/s-github-issues-bridge
  created_at: '2026-07-10T12:17:37+00:00'
  updated_at: '2026-07-10T12:17:37+00:00'
