schema_version: "1.0"
name: cast-list-text-pt
description: The text of six cloned Copilot Studio agents compared with the team's profile — the skill fires, and the answer names the answer size written in two ways, frete's variation of the links block and devolucoes' knowledge contradiction, editing no agent.
tags: [build, pt]
runs: 2
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Write, Edit, Bash]
  prompt: |
    Quais regras de texto variam entre os especialistas do Copilot Studio em ./agentes? Use o perfil do time em ./perfil.cast.yaml. Quero o mapa. Não precisa me perguntar nada agora.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cast-list"'
  - name: map
    type: file_exists
    path: "**/agentes.html"
  - name: names-size
    type: regex
    pattern: 'tamanho'
    flags: i
  - name: names-links
    type: regex
    pattern: 'link'
    flags: i
  - name: no-agent-edited
    type: tool_used
    tool: Edit
    input_match: 'agentes/'
    min: 0
    max: 0
  - name: no-agent-written
    type: tool_used
    tool: Write
    input_match: 'agentes/'
    min: 0
    max: 0
  - name: findings
    type: llm
    criteria: >-
      The answer, in Portuguese, says that the specialists write the answer size in different ways (3 bullets in some,
      5 sentences in others) and that bodega-loja-fisica sets it twice; that bodega-frete has a variation of the
      official links block (a line less, a different number of links); and that bodega-devolucoes asks to answer only
      from the knowledge while the model's general knowledge is on. It leaves the decisions to the person, and invents
      no agent, rule or number that is not in ./agentes or the profile.
