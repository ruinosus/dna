schema_version: "1.0"
name: agent-review-contract-pt
description: What the orchestrator passes each specialist, and what is left over, in six cloned Copilot Studio agents — the skill fires, and the answer names folha called with no history, the agent called that is not in the folder, the flow that returns nothing and the topic nobody calls, editing no agent.
tags: [build, pt]
runs: 2
context:
  scaffold_script: setup.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Write, Edit, Bash]
  prompt: |
    O que o orquestrador passa a cada especialista do Copilot Studio em ./agentes, e o que está sobrando? Use o perfil do time em ./perfil.cast.yaml. Não precisa me perguntar nada agora.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-review"'
  - name: names-history
    type: regex
    pattern: 'hist[óo]rico'
    flags: i
  - name: names-mobilidade
    type: regex
    pattern: 'mobilidade'
    flags: i
  - name: names-unused-topic
    type: regex
    pattern: 'AvisoAntigo|Aviso antigo'
    flags: i
  - name: no-agent-edited
    type: tool_used
    tool: Edit
    input_match: 'agentes/'
    min: 0
    max: 0
  - name: no-agent-written
    type: tool_used
    tool: Write
    input_match: 'agentes/'
    min: 0
    max: 0
  - name: findings
    type: llm
    criteria: >-
      The answer, in Portuguese, says that the orchestrator passes the conversation history and the category
      (CategoriaSolicitacao) to four specialists but neither to rh-folha; that it calls a Mobilidade agent that is not
      in the folder; that the flow «Abrir caso no Workday» of rh-admissao returns nothing to the agent; and that
      something is left over — at least the topic AvisoAntigo nobody calls (the unused flow ListarUnidades, the variable
      PreferenciaAntiga and the switched-off node in ferias may also be named). It leaves the decisions to the person,
      and invents no agent, flow or number that is not in ./agentes or the profile.
