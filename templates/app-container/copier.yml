# `app-container` — the REFERENCE Copier template of this house: ONE python
# container app of the "DNA runtime face behind a container app" shape.
#
# It is the template `dna solution new` / `dna solution update` were built
# against, and the one the golden test freezes
# (`packages/cli/tests/goldens/solution/app-container/`).
#
# ⚠️ Read `docs/guides/solution-scaffolding.md` before changing anything here.
# Changing this file changes generated code for everyone who already ran
# `dna solution new`, and the golden exists so that has to be deliberate.
#
# Design rules, each traceable to `Spec/spec-solucao-como-template` §4.4:
#
#   • regra 2 — generate the maximum of what the consumer will NOT edit
#     (the wiring), the minimum of what they WILL (`server.py` is a skeleton
#     that stops where the reasoning starts). A template that generated the
#     whole server would be programming a conflict for the first update.
#   • regra 3 — ONE template per app TYPE, overlaid N times. Hence the answers
#     file is PER INSTANCE (`.copier-answers.<service_name>.yml`), the
#     `datarobot-community/af-component-*` pattern. Three MCP doors over one
#     image = three answers files, three independent updates, one template.
#   • regra 4 — NO `_tasks`, NO `_migrations`, NO `_jinja_extensions`, ever.
#     Measured: tasks run 3× per `copier update`, 2 of them in temp dirs with
#     no git repo, and they are what forces `--trust`. `dna solution` has no
#     `--trust` flag and refuses such a template outright.
#
# ⛔ TWO of the seven wiring places a new app needs are NOT here, and no
# template can reach them: `azure.yaml` (the azd JSON Schema has fixed
# top-level keys — no include) and the ROOT bicep that invokes the module
# below (Bicep has `module`, but the invocation is a line in the root file).
# `dna solution new` says so on every run. They are covered from the other
# side, by a wiring guard in the consuming repo.
#
# ⭐ The question names are the `App` Kind's FIELD names, deliberately
# (`Spec/spec-app-e-o-servico`, `Story/s-template-dirigido-pelo-app`): an `App`
# IS the service — the unit that has a Dockerfile, a port, wiring and a bill at
# the end of the month. `service_name`, `python_module`, `port` and `can_sleep`
# are spelled here exactly as the descriptor spells them, so a declared App and
# a rendered tree are two views of one fact rather than two vocabularies that
# have to be translated by whoever remembers both.
#
# ⚠️ `container_port` was renamed to `port` on 07/08/2026 for that alignment.
# An already-generated tree updates through the loss report, not through
# magic: `dna solution update` will name `container_port` as an answer that
# changed unasked, and the new `port` takes the template default until somebody
# passes `--data port=<the old value>`. There is no automatic carry-over, and a
# template that pretended otherwise would be the quiet kind of wrong.

_answers_file: ".copier-answers.{{ service_name }}.yml"
_templates_suffix: ".jinja"
_min_copier_version: "9.7"

_exclude:
  # Copier's stock defaults, re-listed: declaring `_exclude` REPLACES them.
  - "copier.yml"
  - "copier.yaml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  # This template's own prose — never rendered into a generated project.
  - "README.md"

_message_after_copy: |
  Generated {{ service_name }} (image {{ image_name }}).

# ── The declaration: TOPOLOGY, never behaviour ───────────────────────────────
# Every question below is a fact about WHERE the app runs, never a fact about
# WHAT it does. Behaviour lives in `src/`, which the human owns.

service_name:
  type: str
  help: "the running instance — the azd service name (a repo has N of these)"
  default: "api"
  validator: >-
    {% if not service_name %}service_name cannot be empty
    {% elif not (service_name | regex_search('^[a-z][a-z0-9-]*$')) %}lowercase letters, digits and dashes only, starting with a letter
    {% endif %}

image_name:
  type: str
  help: "the IMAGE this service runs — N services can share one image"
  default: "{{ service_name }}"

# ⭐ 1 code directory : N services. Measured in dna-cloud on 07/08/2026 — NINE
# deployable services over FOUR `apps/` directories:
#
#     apps/web/      → web                          (1)
#     apps/mcp/      → mcp, mcp-entra, mcp-ws        (3 — one identity authority
#                                                        per door, ONE image)
#     apps/api/      → rest, rest-user              (2 — two auth lanes)
#     apps/copilot/  → copilot, worker, a2a         (3)
#
# So EIGHT of the nine are "another deployment of an image that already
# exists", and for those, generating `Dockerfile`/`pyproject`/`src`/`tests`
# would OVERWRITE production code because somebody declared a new door. This
# answer is the difference, and it is asked rather than derived: guessing it
# from `service_name != image_name` would be a structural decision taken from a
# naming coincidence, and `apps/api/` already breaks that coincidence (neither
# `rest` nor `rest-user` is called `api`).
owns_code:
  type: bool
  help: "does this service OWN the code, or is it another deployment of an existing image? (no = wiring only)"
  default: true
  validator: >-
    {% if not owns_code and image_name == service_name %}owns_code=false means this service redeploys ANOTHER service's image, so image_name must name that one — it cannot be '{{ service_name }}' itself{% endif %}

python_module:
  type: str
  help: "the python package under src/"
  default: "{{ image_name | replace('-', '_') }}"
  validator: >-
    {% if not (python_module | regex_search('^[a-z_][a-z0-9_]*$')) %}a python identifier: lowercase, digits and underscores{% endif %}

description:
  type: str
  help: "one line, for pyproject and the container label"
  default: "{{ service_name }} — a DNA runtime face"

dna_floor:
  type: str
  help: "dna-sdk / dna-cli version FLOOR — the declared floor IS the contract"
  default: "0.74"

dna_ceiling:
  type: str
  help: "version CEILING — a stale one makes the resolver ignore a new release in silence"
  default: "0.75"

env_prefix:
  type: str
  help: "the env-var prefix this app reads its knobs from"
  default: "DNA_API"

identity:
  type: str
  help: "the NAME of the identity authority, never its configuration"
  choices: ["none", "entra", "workos"]
  default: "workos"

# ⚠️ A `when:`-gated answer is ERASED when its condition stops holding, and
# comes back as the DEFAULT — not as what the human answered — if the
# condition returns. Measured: true -> (absent) -> false, in one round trip.
# `dna solution update` reports every such loss by name; it cannot undo it.
graph_obo:
  type: bool
  help: "carry the Microsoft Graph on-behalf-of pack (only meaningful on an Entra door)"
  default: false
  when: "{{ identity == 'entra' }}"

# ⭐ `none` is the answer that says this app DOES NOT SERVE — dna-cloud's
# `worker` scales on KEDA over a queue and answers nobody. Added on 08/08/2026
# (i-099) to close the expensive kind of asymmetry: the `App` Kind has accepted
# `ingress: none` since PR #355 and this template could not produce it, so
# there was an App anyone could DECLARE and nobody could GENERATE. The Kind's
# own header carried it as a loose end ("o `worker` não é representável pelo
# template hoje"); this is that end tied, and it is the thesis of #353 — the
# question names ARE the App's field names, so the App's values have to be
# answerable here.
ingress:
  type: str
  help: "reachable from outside the environment, only from inside it, or not at all"
  choices: ["internal", "external", "none"]
  default: "internal"

# ⭐ `port` and `can_sleep` are PER SERVICE, never per directory. Two doors over
# one image legitimately disagree about both — `App.port` / `App.can_sleep` are
# fields of the App, and the answers file is per service, so the wiring each one
# renders carries its own answers even when the code is shared.
#
# ⛔ `port` is GATED on `ingress != 'none'`, and the gate is not tidiness: the
# `App` Kind REFUSES `ingress: none` together with a `port` AT WRITE TIME (the
# `allOf` at the end of `app.kind.yaml` — "does not serve" and "serves on 8080"
# cannot both be true). A template that asked anyway would write `port: 8080`
# into the answers file of an app that does not serve, and the App derived from
# those answers would be refused by the kernel. `port` IS the ingress
# `targetPort`; with no ingress there is no port, and nothing left to say it to.
#
# ⚠️ AND THIS IS WHAT THE GATE COSTS — written here so it is READ rather than
# discovered: a `when:`-gated answer is ERASED when its condition stops holding
# and comes back as the DEFAULT, not as what the human answered, if the
# condition returns. Same warning `graph_obo` carries above, same measurement
# (true -> (absent) -> false in one round trip). So flipping a generated app
# from `ingress: none` back to `internal` brings `port` back as 8080, whatever
# it had been before.
#
# It is acceptable HERE, and only because a record survives the answers file:
# `Solution.services[].answers` exists precisely to outlive it (measured in
# fatia 3 of `Spec/spec-solucao-como-template` — the Solution is the register
# that survives the answers file). Keep the real port there, or pass
# `--data port=<the old value>` on the update. `dna solution update` names
# every such loss by name; it cannot undo one.
port:
  type: int
  help: "the port the app listens on inside the container"
  default: 8080
  when: "{{ ingress != 'none' }}"

can_sleep:
  type: bool
  help: "can this app scale to zero? a `no` costs a fixed replica, every month, forever"
  default: true

max_replicas:
  type: int
  help: "upper bound of the autoscaler"
  default: 2
