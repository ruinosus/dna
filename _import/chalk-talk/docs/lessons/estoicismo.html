<style id="chalk-css">/* The page around the lesson (the HTML file, player.js on a CDN): not used inside an Obsidian note. */
body { margin: 0; background: #f3f1ec; color: #242424; font: 15px/1.5 'Shantell Sans', system-ui, sans-serif; }
#stage { max-width: 1280px; margin: 0 auto; padding: 24px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
.broken { background: #fff6e5; color: #8a4b00; border: 1px solid #f1c27b; border-radius: 10px; padding: 14px; }
body.still { background: #fbf7ee; }
body.still #stage { padding: 0; max-width: none; }

/* onda 4: a course */
.course { display: flex; flex-direction: column; gap: 6px; background: #fff; border: 1px solid #e0d8c6; border-radius: 10px; padding: 10px 14px; }
.course[hidden] { display: none; }
.course b { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #6b665c; }
.course ol { margin: 0; padding-left: 20px; display: flex; flex-wrap: wrap; gap: 4px 22px; }
.course a { color: #242424; }
.course a[aria-current="page"] { font-weight: 700; }

/* One lesson (lesson.ts), wherever it is mounted: everything under .chalk-talk, so a page or a note keeps its own look.
   The colours are variables a host can set (the Obsidian plugin maps them to its theme). */
.chalk-talk {
  --ink: #242424;
  --muted: #6b665c;
  --line: #e0d8c6;
  --card: #ffffff;
  --paper: #fbf7ee;
  --accent: #242424;
  --on-accent: #ffffff;
  --button-line: #cfc8b8;
  --ok: #0e5a0b;
  --ok-bg: #f1faf1;
  --warn: #8a4b00;
  --warn-bg: #fff6e5;
  color: var(--ink);
  font: 15px/1.5 'Shantell Sans', system-ui, sans-serif;
  display: flex; flex-direction: column; gap: 14px;
}
.chalk-talk * { box-sizing: border-box; }
.chalk-talk:focus-visible { outline: 2px solid #2f5bea; outline-offset: 4px; border-radius: 10px; }
.chalk-talk .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chalk-talk .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.chalk-talk h1 { margin: 0; font: 700 clamp(30px, 4vw, 44px)/1.1 'Caveat', cursive; color: var(--ink); }
.chalk-talk h2 { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.chalk-talk button { font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--button-line); border-radius: 8px; padding: 7px 14px; cursor: pointer; box-shadow: none; height: auto; }
.chalk-talk button:hover:not(:disabled) { border-color: var(--ink); }
.chalk-talk button:disabled { opacity: .4; cursor: default; }
.chalk-talk button:focus-visible, .chalk-talk summary:focus-visible, .chalk-talk input:focus-visible { outline: 2px solid #2f5bea; outline-offset: 2px; }
.chalk-talk button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.chalk-talk button.ghost { background: transparent; }
.chalk-talk button[hidden] { display: none; }
.chalk-talk .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chalk-talk button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chalk-talk .downloads { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.chalk-talk .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chalk-talk .chapters { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 auto; }
.chalk-talk .chapters button { border-radius: 999px; padding: 5px 12px; font-size: 13px; background: transparent; border: 1px dashed var(--button-line); color: var(--muted); }
.chalk-talk .chapters button.is-seen { background: var(--card); border: 1px solid var(--button-line); color: var(--ink); }
.chalk-talk .chapters button.is-on { background: var(--accent); border: 1px solid var(--accent); color: var(--on-accent); font-weight: 700; }
.chalk-talk .layout { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.chalk-talk .board { flex: 1 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.chalk-talk .paper { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.chalk-talk .paper.is-board { background: #26372e; border-color: #1c2a23; }
.chalk-talk .paper svg { width: 100%; height: auto; display: block; }
.chalk-talk .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.chalk-talk .say { flex: 1 1 240px; min-width: 0; margin: 0; font-style: italic; color: var(--ink); opacity: .85; }
.chalk-talk .count { font-size: 13px; color: var(--muted); }
.chalk-talk aside { flex: 0 1 320px; min-width: 260px; display: flex; flex-direction: column; gap: 14px; }
.chalk-talk .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.chalk-talk .value { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 14px; }
.chalk-talk .value b { font-size: 18px; }
.chalk-talk .value input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.chalk-talk .switch { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.chalk-talk .switch input { width: 18px; height: 18px; accent-color: var(--accent); }
.chalk-talk .learning p { margin: 0; font-size: 14px; }
.chalk-talk .learning summary { cursor: pointer; color: #1f4e9a; font-size: 14px; }
.chalk-talk .learning .caveat { color: var(--muted); font-size: 13px; }
.chalk-talk .check { font-size: 13px; line-height: 1.45; border-radius: 8px; padding: 10px 12px; color: var(--muted); border: 1px dashed var(--line); }
.chalk-talk .check.is-ok { color: var(--ok); background: var(--ok-bg); border: 1px solid #9fd89f; }
.chalk-talk .check.is-warn { color: var(--warn); background: var(--warn-bg); border: 1px solid #f1c27b; }
.chalk-talk .check ul { margin: 6px 0 0; padding-left: 18px; }
.chalk-talk .foot { margin: 0; font-size: 12px; color: var(--muted); }
@media (max-width: 720px) { .chalk-talk aside { flex-basis: 100%; } }
@media (prefers-reduced-motion: reduce) { .chalk-talk * { transition: none !important; } }

/* onda 3 */
.chalk-talk .ask { position: absolute; inset: auto 16px 16px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
.chalk-talk .ask[hidden] { display: none; }
.chalk-talk .ask p { margin: 0; flex: 1 1 240px; font-size: 18px; font-weight: 700; }
.chalk-talk .quiz[hidden] { display: none; }
.chalk-talk .quiz p { margin: 0; font-size: 14px; }
.chalk-talk .quiz .options { display: flex; flex-direction: column; gap: 6px; }
.chalk-talk .quiz .options button { text-align: left; }
.chalk-talk .quiz .options button.is-right { background: var(--ok-bg); border-color: #9fd89f; color: var(--ok); }
.chalk-talk .quiz .options button.is-wrong { background: var(--warn-bg); border-color: #f1c27b; color: var(--warn); }
.chalk-talk .quiz .why { color: var(--muted); }
.chalk-talk .quiz .why.is-right { color: var(--ok); }
.chalk-talk .transcript summary { cursor: pointer; font-size: 14px; font-weight: 700; }
.chalk-talk .transcript ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.chalk-talk .transcript p { margin: 2px 0 0; }

/* the whole drawing, still: a picture of it, a PDF */
.chalk-talk.is-still .paper { border: 0; border-radius: 0; padding: 0; }

/* spec 2026-10-30 (Obsidian): the lesson inside a note — chapters and the two buttons on top, the bar below, the values
   only when opened, nothing beside the paper */
.chalk-talk.is-compact { gap: 8px; font-size: 14px; }
.chalk-talk.is-compact .head { display: none; }
.chalk-talk.is-compact .layout { display: block; }
.chalk-talk.is-compact .board { gap: 8px; }
.chalk-talk.is-compact .bar { padding: 7px 9px; gap: 8px; }
.chalk-talk.is-compact .bar button, .chalk-talk.is-compact .top button { padding: 5px 11px; font-size: 13px; }
.chalk-talk.is-compact .count { display: none; }
.chalk-talk.is-compact aside { display: none; margin-top: 8px; min-width: 0; }
.chalk-talk.is-compact.show-values aside { display: flex; }
.chalk-talk.is-compact .say { flex-basis: 160px; }
</style>
</head>

<main id="stage">
  <nav id="course" class="course" aria-label="Lessons" hidden></nav>
  <div id="lesson"></div>
</main>
