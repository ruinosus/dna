  - { agent: rh-folha, key: owner, value: folha@empresa.example, source: inventario.csv › linha 5 }
  - { agent: rh-folha, key: environment, value: RH (Produção), source: inventario.csv › linha 5 }
  - { agent: rh-folha, key: created-on, value: 2026-03-09, source: inventario.csv › linha 5 }
  - { agent: rh-folha, key: last-published, value: 2026-09-30, source: inventario.csv › linha 5 }
