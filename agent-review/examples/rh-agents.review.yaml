  - { agent: rh-ferias, key: kpi, value: "saldo informado em até 2 trocas de mensagem", source: equipe.csv › linha 2 }
  - { agent: rh-orquestrador, key: owner, value: rh@empresa.example, source: inventario.csv › linha 2 }
  - { agent: rh-orquestrador, key: environment, value: RH (Produção), source: inventario.csv › linha 2 }
