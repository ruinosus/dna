decisions:
  - { key: "trigger:OnEscalate", status: accepted, scope: platform, why: "Ninguém fica sem saída para uma pessoa" }
agents:
  - { id: rh-admissao, role: specialist }
  - { id: rh-beneficios, role: specialist }
  - { id: rh-facilities, role: specialist }
  - { id: rh-ferias, role: specialist }
  - { id: rh-folha, role: specialist }
  - { id: rh-orquestrador, role: orchestrator }
blocks:
  - id: abre-um-caso-no-workday
    text: Abre um caso no Workday quando o colaborador pede uma ação que o RH precisa executar (ajuste de férias, inclusão de dependente, correção de dados).
  - id: links
    text: |-
      Links:
      - Formate links assim: [título](url), nunca a URL crua.
      - Um link de ação vai no topo; o link da base de ajuda vai no fim.
      - Nunca escreva as palavras «clique aqui».
      - No máximo 3 links por resposta.
  - id: inicializa-o-agente-quando-ele
    text: Inicializa o agente quando ele é chamado pelo orquestrador do RH e recebe a categoria da solicitação.
