  - { agent: rh-ferias, key: team, value: Squad Férias, source: equipe.csv › linha 2 }
  - { agent: rh-beneficios, key: kpi, value: inclusão aberta sem atendente em 80% dos casos, source: equipe.csv › linha 3 }
