# What people said about the agents, and what was decided. build.mjs keeps it up to date; edit it, or fill the
# workbook's «Declared» sheet and the «Decision» column and read it back with --from.
apiVersion: github.com/ruinosus/dna/v1
kind: AgentReview
metadata:
  name: RH — autoatendimento do colaborador
